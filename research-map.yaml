  explain: 长视频生成想用全部历史，可历史一长显存就爆。这篇不存历史，而是养一组定长的代理 latent，让它们学会如果真看全历史注意力会长什么样，再拿全上下文注意力去监督这组代理。滚出局部窗口的历史 latent 由代理更新模块吸收进去。等于历史不落地，只留一个随历史更新的摘要，取的时候读摘要而不是翻档案。
  detail:
    position: Attn-Forcing 针对流式生成里上下文越长画质越好、而全上下文注意力的显存和算力随历史线性增长这一对矛盾，做法是保留全上下文对当前查询的贡献，但不保留产生贡献的全部历史。
    io: 输入是已生成的历史帧与当前生成块，输出是在固定显存与算力下近似全上下文注意力得到的下一块；历史被压成定长代理，规模不随历史长度增长。
    steps:
    - 把历史压成一组可学习的视觉 latent 作为注意力代理。
    - 代理更新模块把滚出局部注意力窗口的历史 latent 吸收进代理。
    - 代理过一次 DiT，取各层 KV 状态作为后续流式生成的上下文。
    - 用全上下文注意力做监督，加注意力匹配损失约束代理诱导出的注意力响应。
