  - 记忆写入淘汰
  date: '2026-11-10'
  detail:
    concepts:
    - 记忆评测基准
    - 记忆写入淘汰
    diff: 与 WanderBench 比，WanderBench 用路线回访考一致性，它用空事件把时间索引这个默认做法证伪；与 PACE 比，PACE 量的是位置距离导致取不到，它量的是地址语义错导致取错内容。
    formulas: []
    has_abstract: true
    io: 输入是示教与在线画面，输出计数任务的停止决策；中间产物是按时间采样并打了时间戳的记忆槽。
    limits: 只有机器人计数任务与机械臂视角；事件索引要求任务能切出事件，长视频生成能否切未验；恢复量是定性说法。
    position: 我的地址是块号加时间，这条证明时间当地址会骗人：什么都没发生时时间照样走，取出来的历史于是在说干了活。它给的替代是事件索引，地址由发生了什么决定，不由过了多久决定。
    steps:
    - 取 RoboMME 的两个计数任务与已放出的记忆 VLA。
    - 在过程中插入空事件，短暂停顿或抖腕，不改变任务相关状态。
    - 对比有记忆、抽掉同样帧、以及缩放时间戳三种条件下的成功率。
    - 把记忆索引从时间换成事件，量免训恢复了多少。
    train: 不适用。以诊断与免训修法为主；对照实验里试过注入停顿重训，未能消除失效。
  explain: 记忆增强的 VLA 大多按时间填记忆，整段均匀抽帧，再给每帧打时间戳。时间在什么都没发生时也照走，于是这样的记忆分不清在等和在干。这条在 RoboMME 的计数任务里插一个空事件，停顿或者抖一下手腕，任务依赖的东西一点没变，但放出来的记忆 VLA 把这段时长算成干了活，提前停手，它管这个叫 phantom progress。两个任务的成功率从 47/50 掉到 16/50、从 44/50 掉到 10/50，把同样的帧从记忆里抽掉成功率就回来了，说明病根在记忆不在打断。它进一步证明这是时间捷径：只缩放时间戳就能让策略在时钟走快时早停、走慢时重复；把时间编码去掉也不治，因为空事件的帧仍占着按时间采样的槽位。最后一句最有用，脆弱性跟着记忆的索引方式走，改成按事件索引，免训就能恢复一半以上的损失。
  id: clock-memory
  key_numbers:
  - 两个计数任务成功率从 47/50 掉到 16/50、从 44/50 掉到 10/50
  - 按事件索引免训恢复一半以上损失
  - 只缩放时间戳即可让策略走快时早停、走慢时重复
  - 注入停顿重训不能消除失效
  lane: 评测基准
  link_strength: 与 WanderBench 都在量记忆到底有没有被用上，WanderBench 用路线回访考一致性，它用空事件把按时间填记忆这个默认做法证伪
  links:
  - https://arxiv.org/abs/2611.14488
  mechanism: 在 RoboMME 的计数任务里插入空事件，检验按时间均匀采样并打时间戳的记忆是否把时长误当进度；再通过缩放时间戳与改动索引方式定位失效来源。
  media: []
  note: 雷达自动入库 2026-11-12，字段据摘要，待人工核。38 页；只有 RoboMME 的机器人计数任务与机械臂视角；恢复量只写一半以上，未给逐项表；无视频生成侧验证。
  one_liner: 按时间填的记忆把等待当成进展
