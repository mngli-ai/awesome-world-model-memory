  detail:
    diff: 已有流式方案要么共享一个按时间切的历史窗口，要么按帧重要性打包上下文，它把历史按去噪阶段分治，粗阶段与细阶段各自延续，互不挤占，这是时间维度之外的另一种分法。
    formulas: []
    has_abstract: true
    io: 输入是文字流与已生成的音视频历史，输出是逐块延续的高分辨率视频与同步音频。
    limits: 主体是数字人音视频，音频与口型约束占了相当篇幅，纯视觉长视频侧只给时长达标；摘要没给回访一致性与记忆失效的定量结果，待核。
    position: 流式高分辨率音视频生成里，每次都要出细画面太贵，文本更新又容易让说话重复或断掉。TaoMate-HD 把每个块拆成粗到细三个阶段，并让每个阶段单独携带一条历史，从而在固定上下文体积下既省算力又保住已经说过的内容。
    steps:
    - 每块先用两步在 480p 上建立粗视频结构与音频，噪声与信号在升分到 768p 时按耦合方式搬过去。
    - 最后一步在 768p 上补空间细节，音频始终在同一条联合轨迹里同步生成。
    - 每个阶段先给出本阶段的干净音视频预测，把它传给下一块的同一阶段，历史因此按阶段分开存放。
    - 继续训练用非对称文本条件，生成与蒸馏各用一个文本窗口，让模型在文字更新时靠历史判断已经说过什么。
    train: 需训。继续训练采用非对称文本条件，生成与蒸馏分用不同文本窗口；推理每块三步去噪，前两步 480p、末步 768p，阶段并行部署可再提速。
  explain: 这条的价值不在数字，在它给历史找了个新维度。我们现在存历史基本都按时间切窗，它是按去噪阶段切。一块里先花两步在 480p 上把粗结构和音频定下来，最后一步才升到 768p 补细节，于是每个阶段都有自己的干净预测，这个预测传给下一块的同一阶段，粗阶段接粗阶段，细阶段接细阶段，两条历史各走各的，粗的不会被细的挤掉。这个安排对我的用处是，我的四步 LoRA 里其实前两步也在定结构后两步在补细节，如果按阶段分开传历史，粗阶段的
    KV 可以退得快一点，细阶段的留着眼前这一块，窗口不必再按时间等长切。它靠这个支持了一小时级别的连续生成，文字更新时还能靠历史推断已经说过什么，数上是 1.6 倍加速，配阶段并行再叠 1.9 倍，继续训练让字符错误率降了 11.18 点。要注意它是数字人音视频，音频那一路的约束我没有，能搬的是阶段分治这条结构，不是它的具体设定。
