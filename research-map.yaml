  detail:
    concepts:
    - 代码定状态
    - 物理因果评测
    - 教师强制
    diff: 与用文本或参考视频当特权的方法相比，代码可参数化、可验证；与 Video-Coder 这类把代码当验证器的做法相比，它把代码放到教师位置。
    formulas: []
    has_abstract: true
    io: 输入真实物理场景与文本提示，输出后训练过的视频生成模型；中间产物是可验证的仿真程序与受控物理变体。
    limits: 只给样本量与定性结论，提升幅度待核；需要仿真器与场景到代码的翻译，工程成本高；不涉及长程与记忆，物理之外的一致性没有验证。
    position: 视频模型能画得像但物理不成立，SFT 与真实视频之间有离线状态错配，RL 又缺稠密可验证的物理奖励，卡点落在用什么当特权信息。
    steps:
    - 用 PhysOPSD-Engine 把真实物理场景翻成可验证的仿真程序。
    - 把可执行代码当特权上下文，分两级注入并在中间加瓶颈弥合信息差。
    - 在共享 rollout 噪声下构造受控物理变体，暴露因果动态差异。
    - 用 3K 样本做在策略自蒸馏，与 SFT、RL 基线比物理合理性与通用画质。
    train: 需训，要后训练与仿真器支持；摘要只给 3K 样本量，训练步数与算力未报，待核。
  explain: 这条是训练侧，但它用代码的方式值得看。视频模型生成物理不靠谱，SFT 有离线状态错配，RL 的物理奖励又太稀。在策略自蒸馏这类方法的关键就变成设计什么当特权上下文，文本太声明式，参考视频又把物理规律和外观缠在一起没法参数化控制。作者用可执行代码当特权，把真实物理场景翻成可验证的仿真程序，代码能改参数、能验结果，于是模型能看到受控的物理变体，在共享 rollout 噪声下比较因果差异。三千个样本就超过 SFT 与 RL 基线，通用画质没掉。对我来说这是 code 当状态的反向用法，我拿代码保状态去条件渲染，它拿代码当老师去纠生成，两条路可以在同一个仿真器上会合。
  id: physopsd
  key_numbers:
  - 只用 3K 样本就超过 SFT 与 RL 基线
  lane: 训练侧
  link_strength: 与 Video-Coder 都拿可执行代码介入视频生成，Video-Coder 把代码当奖励与验证信号，PhysOPSD 把仿真程序当特权上下文做在策略自蒸馏
  links:
