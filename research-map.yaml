  detail:
    concepts:
    - 检索增强
    - 显式3D缓存
    diff: 与把情节压成语义的记忆相比，它保留原始观测的时间与实体两类地址；与只用时间窗的上下文相比，实体链能跨很远把同一对象的观测拉回来。
    formulas: []
    has_abstract: true
    io: 输入手术视频流与查询，输出回答；中间产物是带时间戳的条目与两套边构成的结构化记忆图。
    limits: 只有手术视频，跨域迁移未验；记忆图规模与检索延迟未报；三种用法的增益各自单独报，混用是否叠加未说明。
    position: 手术视频里相似的画面可能对应不同动作或阶段，只看当前帧无从区分，必须能取回早先的观测，而逐帧提示把这段历史丢掉了。
    steps:
    - 把每次观测存成带时间戳的条目，记实体类别、位置、运动线索与交互摘要。
    - 用时间链保近期上下文，用实体链把同一实体的历次观测连起来。
    - 按任务做自适应检索，把检索到的证据拼进提示。
    - 支持冻结推理与记忆条件微调两种用法，在机器人前列腺切除与两个手术基准上比。
    train: 微调，最佳设定是记忆条件监督微调；也支持冻结骨干只做推理期插件，两者分别报增益。
  explain: 这条讲的是给长视频理解配一张双索引的记忆图。手术视频里相似画面可能对应不同步骤，只看当前帧判断不了，得能回到早先的观测。MemSurg 把每次观测存成带时间戳的条目，记实体类别、位置、运动线索与交互摘要，再用两套边把它们连起来，时间链保近处上下文，实体链把同一实体在不同时刻的观测连成一条，取用时按任务自适应检索，把证据拼进提示。数字是比 SurgRAW 配 GPT-4o 高 10.43 分，配 Qwen3-VL-8B 微调时记忆条件再加 6.52 分，推理期当插件给 EndoChat 加 7.04 分。双索引这件事对我的意义是地址可以不止一种，时间是一种，实体是一种，我的代码状态里两种都有，但取用时只用了一种。
  id: memsurg
  key_numbers:
