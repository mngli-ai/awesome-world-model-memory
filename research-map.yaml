  one_liner: 索引建在三维表面上，按位姿查历史视图
  mechanism: 存 surfel（位置、法线、半径、看过它的帧号 I_k）；读时把 surfel 投影到虚拟低清屏、逐像素直方图投票取 top-K 视图。
  key_numbers:
