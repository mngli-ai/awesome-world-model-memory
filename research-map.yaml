    steps:
    - 把状态看成 d_k 个地址各存 d_v 维值的库，区分键侧读与值侧读。
    - 键侧 delta 规则用当前键纠该键上的值，压住键层面的干扰。
    - 值侧 delta 规则用当前值的若干特征做选择子，重排这条值占用的地址。
