  date: '2026-11-03'
  detail:
    diff: 与 Rolling Sink 比，它不换 sink 帧而是限制谁能看；与 Deep Forcing 比，Deep Forcing 把窗口一半给 sink 并对齐相位，它把 sink 的暴露面拆到头上。
    formulas: []
    has_abstract: true
    io: 输入是自回归视频扩散模型及其蒸馏流程，输出是改过头级上下文路由的模型。
    limits: 没有定量结果；头级观察覆盖的模型未给；依赖蒸馏流程。
    position: frame sink 被当成 LLM 式 attention sink 普遍施加到所有注意力头与所有层。
    steps:
    - 复现 frame sink 的稳定机制，逐头定位长程一致性的承载者。
    - 观察到只有稀疏一部分头承担长程一致，多数头管局部动态。
    - 指出全头暴露初始帧造成过条件，蒸馏时运动塌陷。
    - 提出解耦上下文路由与运动解耦正则，作为蒸馏期插件。
    - 在长程视频生成基准上对比 sink 类方法的稳定性与动态。
    train: 需训，蒸馏期插件；训练配置摘要未给。
  explain: 这篇是把 sink 这件事拆开看。自回归视频扩散一旦推理长度超过训练长度就靠 frame sink 稳住，也就是把最初几帧永久留在上下文里。作者去查这个机制到底是什么，结论不是 LLM 那种 attention sink，长程一致性其实锚在一小撮注意力头上，大部分头在做局部时序动态。于是现在把所有头都暴露给初始帧就成了过条件，蒸馏时运动会塌向教师的低动态模态，画质稳了但不动了。Disen-Forcing 是蒸馏期插件，用解耦上下文路由加运动解耦正则把这种头分工拆开并强化，长程一致性与运动动态同时改善。这个观察对我这条线很关键，我那六块窗口里块与块对 sink 的暴露是全头一致的，如果真是少数头在承担回访一致，窗口可以按头分配。
