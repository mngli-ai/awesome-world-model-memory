  mechanism: 从预训练视频生成器出发，先在 30,110 小时、22 个机器人平台的演示上中训练，用统一跨本体动作表示与帧对齐双路径条件加强动作帧对应，用带显式相机身份的交错注意力保多视角一致；后训练把快速因果生成、自滚动训练与分层时序记忆合起来，把双向生成器改成自回归模拟器。
