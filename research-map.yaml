  detail:
    diff: 与固定步数的自回归方法比，它在同一套权重上换步数不塌；与 sink 加滑窗的硬截断比，它先按语义相关加局部价值打分再选，选完还重写位置，缓存内相对时序不丢。
    formulas: []
    has_abstract: true
    io: 输入是历史缓存里的状态与当前去噪步，输出是保留下来的历史集合及其重写后的时间位置，以及一步或任意步条件下的下一帧。
    limits: 没有视频侧的回访一致性或长程记忆指标，长视频只报到 FPS；两项打分怎么归一、保留预算多大、重映射的映射规则摘要都没给；一步对多步的画质差距只有定性描述。
    position: 自回归视频生成靠流式预测换效率，但现有方法基本绑死在固定采样步数上，步数一少画质掉，长序列上误差累积成内容漂移甚至崩；同时 KV 缓存随时间线性增长，历史里真正对当前帧有用的只占少数，全留会稀释当下的注意力。
    steps:
    - 训练侧用一个判别器同时承担真实分布对齐、步间一致性对齐与首帧质量增强三个目标。
    - 生成器在同一套权重下支持任意步与一步采样，一步时靠判别器把质量与稳定性顶住。
    - 推理时对历史状态按全局语义相关打分，衡量它与当前要生成内容的语义距离。
    - 再按局部价值贡献打分，衡量该状态自身还带不带独立信息，两项合并决定保留集合。
    - 对保留项重映射时间位置，保持它们在缓存内的相对时序。
    - 在长视频上验证一步采样的稳定性，报 FPS 与画质。
    train: 需训，判别器与生成器联合训练；长历史的选择与位置重映射那一段是推理期免训。训练数据与步数配置摘要未给。
  explain: 这篇正好压在我这条线的痛处。自回归视频模型的历史是一段只会变长的 KV，两条路都走不通，全留会让当下帧的注意力被稀释，硬截断又会把回访要用的那几帧丢掉。它把选择做成推理期的免训步骤，给每个历史状态打两个分，全局语义相关管这段历史跟当前要生成的内容有没有关系，局部价值贡献管它本身还带不带信息，两项合起来选出保留集合，然后把这些保留项的时间位置重新映射，让它们在缓存里仍然是原来的先后顺序。这一步很关键，位置不重写的话，选出来的历史在注意力看来跨度是错的，等于地址错了。另一条线是训练侧，它用一个判别器把真实分布对齐、步间一致性、首帧质量三个目标并成一次判断，让步数可以随便换，一步采样在长序列上也不塌，单卡 H100 短片段 20.9 FPS、长视频 24.7 FPS。对我有用的地方是它证明了一件事，记忆选择和采样步数可以解耦，我的四步 LoRA 不必和六块窗口绑死，选择那一步可以单独换掉。它没做的是回访一致性，长视频只报 FPS，取到的东西对不对没测。
  id: any-forcing
