- id: moc
  title: Mixture of Contexts for Long Video Generation
  date: '2025-08-28'
  lane: 内容学习寻址
  branch: 学习路由
  training: 需训
  status: 速读
  one_liner: 长视频当内部检索，query自选chunk
  mechanism: 可学稀疏路由：每个query挑少数信息量大的历史chunk，加caption与局部窗必选锚，因果约束禁闭环。
  tags:
  - 稀疏路由
  - chunk检索
  - 近线性扩展
  key_numbers:
  - 摘要未给具体数值，称可保身份/动作/场景达分钟级
  - 效率随检索近线性
  media: []
  links:
  - https://arxiv.org/abs/2508.21058
  note: 这条泳道的理论源头之一：把「记忆」重述为 query 到 chunk 的内部检索并让它可学，与 LongLive-RAG 的外部库路线形成对照（MoC
    无外部存储、路由在注意力里）。
  arxiv: '2508.21058'
  explain: 想象模型要接着拍一段一分钟的追逐戏：主角的外套、街道布局和动作节奏都得记住，但把前面每一帧都塞回模型，既昂贵又容易被无关画面干扰。它把已经生成的长视频当作内部检索库。当前要生成的内容会形成查询，也就是向历史寻找所需信息的问题；可学习的稀疏路由会为每个查询挑出少数最有用的历史片段。描述全局语义的字幕信息和紧邻当前画面的局部窗口，则被固定为必选锚点，保证人物身份与近处动作不断裂；因果约束还禁止读取未来，避免信息泄漏和循环依赖。这样，模型只看相关记忆而非整段历史，既能维持分钟级视频中的人物、动作和场景一致性，也让计算量随检索规模近似线性增长。
  detail:
    position: 这篇工作将长视频生成中的长期记忆问题重新表述为模型内部的信息检索问题。它提出 Mixture of Contexts，旨在降低长序列 self-attention
      的计算与内存开销，同时保留跨长时间范围的身份、动作和场景一致性。
    io: 输入是生成过程中的 query、caption 和可供检索的历史视频上下文，输出是长视频内容。caption 与局部时间窗口作为必选条件信号，query
      还会因果地检索少量历史 chunk。
    steps:
    - 将长视频历史划分为 chunks，使模型能以片段为单位检索远距离上下文，而不必对全部历史执行密集 attention。
    - 根据每个 query 学习路由并选择少量有信息量的历史 chunks，把计算集中到可能影响当前生成的内容上。
    - 将 caption 和局部窗口作为必选锚点加入检索结果，以保留文本条件和邻近时间上下文。
    - 施加因果路由约束，避免检索未来内容或形成 loop closures，从而支持按时间顺序生成。
    - 随着数据扩展逐步稀疏化路由，使模型在减少计算的同时学习检索显著历史并维持长程一致性。
    formulas:
    - tex: \mathcal{I}(q_t)=\mathcal{A}_{\mathrm{cap}}\cup\mathcal{A}_{\mathrm{local}}(t)\cup\operatorname{TopK}_{\,c_i<t}\left(\frac{q_t^{\top}k_i}{\sqrt{d}}\right),\qquad
        r_{t,i}=\frac{q_t^{\top}k_i}{\sqrt{d}}
      caption: 标准写法，非原文：基于 query–chunk 相似度的稀疏历史检索，并加入 caption、局部窗口锚点及因果约束。
    - tex: o_t=\operatorname{softmax}\left(\frac{q_tK_{\mathcal{I}(q_t)}^{\top}}{\sqrt{d}}\right)V_{\mathcal{I}(q_t)}
      caption: 标准写法，非原文：仅在检索到的历史 chunks 与必选锚点上执行注意力聚合，以降低长序列 attention 的计算与内存开销。
    train: 训练时扩展数据规模并逐步稀疏化路由。推理时由 query 动态检索少量历史 chunks，并结合 caption 与局部窗口生成；具体训练目标、路由实现细节及推理设置摘要未给。
    diff: 不同于对长序列执行密集 self-attention 的做法，MoC 将上下文访问作为可学习的稀疏检索与路由问题。每个 query 动态选择历史
      chunks，同时保留 caption、局部窗口锚点并施加因果约束。
    limits: 摘要指出密集 self-attention 的二次计算成本会使长序列的内存与计算难以承受，但未见明确说明 MoC 的具体适用边界、失败模式或其他局限。
    has_abstract: true
