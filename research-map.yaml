- id: fadem
  title: 'FadeMem: Distance-Aware Memory Consolidation for Autoregressive Video Diffusion'
  date: '2026-06-09'
  lane: 位置时间寻址
  branch: 距离分层
  training: 免训
  status: 速读
  one_liner: 近密远疏，按时间距离幂律合并KV
  mechanism: 新历史细粒度插入，旧相邻条目按幂律时间分配逐步合并，单缓存内形成近密远疏层级，不改架构。
  tags:
  - 幂律时间分配
  - KV合并
  - 有界缓存
  key_numbers:
  - 同预算下支持多分钟到小时级生成
  - 匹配 KV 预算时降低峰值显存
  media: []
  links:
  - https://arxiv.org/abs/2606.10671
  note: 新建分支「距离分层」：它反对给历史各部分分配固定角色（sink/窗口），改由时间距离决定分辨率与合并度，既非锚点集合也非 RoPE 手术，但与两者同属「用时间坐标决定可读性」。若不想新建分支，最接近锚
    sink。
  arxiv: '2606.10671'
  explain: 想象摄像机一直拍下去，桌上却只有一本固定厚度的日记：新画面不断写入，旧画面若全留着，记忆很快塞满；若随手删，又会忘掉故事。视频扩散模型生成长视频时也有这个麻烦：它要缓存过去的信息，供后续画面参考，这些缓存叫键值缓存，长度会随时间增长。FadeMem像整理日记一样，新历史细致记下，旧的相邻条目则按与当前时刻的距离，依幂律逐步合并。于是同一份缓存里，近处记录密、远处记录疏，且无需改动模型架构。它管用，是因为刚发生的动作通常更需要细节，久远内容则可用更粗略的摘要维持连贯。同等缓存预算下，它支持生成数分钟到数小时的视频，并降低峰值显存。
  detail:
    position: FadeMem 解决自回归视频生成中历史 KV cache 随视频长度增长、难以在固定缓存预算下保留长程信息的问题。它按时间距离组织并合并历史
      KV，以兼顾近处细节与远处场景结构和身份信息。
    io: 输入是自回归视频生成过程中产生的历史 KV blocks，以及新生成的历史条目；输出是在固定缓存预算内更新后的分层 KV memory，供后续生成使用。摘要未说明具体条件信号。
    steps:
    - 将新产生的历史以细粒度条目插入缓存，保留近期内容的细节，因为近处信息仍有较高时序相关性。
    - 根据条目间的时间距离安排缓存层级，使近处条目更密、远处条目更疏，因为细节与场景结构的时间衰减速度不同。
    - 按幂律时间分配逐步合并较旧的相邻条目，压缩远程历史并控制缓存规模，同时尽量保留长期有用的信息。
    formulas:
    - tex: \widetilde{K}_{a:b}=\frac{\sum_{i=a}^{b}w_iK_i}{\sum_{i=a}^{b}w_i},\qquad
        \widetilde{V}_{a:b}=\frac{\sum_{i=a}^{b}w_iV_i}{\sum_{i=a}^{b}w_i}
      caption: 标准写法，非原文：将相邻的历史 KV 条目按权重合并，以压缩远程历史并保留其平均信息
    - tex: \Delta(t)=c\,(t+\epsilon)^{\alpha},\qquad \text{merge adjacent entries
        when their temporal spacing reaches }\Delta(t)
      caption: 标准写法，非原文：用幂律增长的合并间隔构造近密远疏的缓存层级
    train: 推理时在自回归生成过程中更新和合并 KV memory，不需改动模型架构。摘要提到轻量适配可进一步增强运动动态与视觉保真度，但训练流程和关键设置未给。
    diff: 不同于 local window、sink tokens 或压缩记忆状态等通常为历史不同部分分配固定角色的方法，FadeMem 在单一缓存内依据时间距离渐进合并历史条目。其时间分配遵循幂律，使缓存呈现近密远疏的层级结构。
    limits: 未见明确说明
    has_abstract: true
