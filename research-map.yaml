- id: decmem
  title: DecMem
  date: '2026-05-29'
  lane: 几何位姿寻址
  branch: 容量管理
  training: 训练
  status: 速读
  one_liner: 稀疏全局+锚定局部解耦记忆
  mechanism: 指出朴素可学习记忆的两病（算力、注意力弥散），拆成稀疏全局记忆做细粒度历史访问与锚定局部记忆稳外推，超显式 3D 与粗帧级隐式两类基线。
  tags:
  - 解耦记忆
  - 注意力弥散
  - 稀疏全局
  key_numbers:
  - 分钟级长视频
  media: []
  links:
  - https://arxiv.org/abs/2605.31336
  - https://jeffreyyzh.github.io/DecMem-Page
  note: 其"注意力弥散"分析可直接引用来论证为何纯注意力式历史路由在长程会退化。
  arxiv: '2605.31336'
  explain: 想象模型要续写一段几分钟的视频：既得翻遍漫长历史找细节，又不能让旧信息挤成一团，导致未来画面漂移。朴素的可学习记忆把两件事都压在一起，既耗算力，也容易让注意力分散。DecMem把记忆拆成两种：稀疏全局记忆像索引，按需访问细粒度历史；锚定局部记忆像眼前的参照物，稳住后续画面的外推。两者分工后，模型既能回看关键细节，又不丢当前变化的方向，因此更适合生成分钟级长视频。论文还在两类基线上验证：直接表示三维场景的显式方法，以及用粗略帧级特征记忆的隐式方法。
  detail:
    position: 本文针对长时程视频生成中细粒度时空一致性难以维持的问题，提出 DecMem，以支持分钟级、可控且一致的世界生成。
    io: 输入为用于生成的历史视频信息及控制条件，具体输入形式和条件信号类型摘要未给出；输出为具有长时程时空一致性的视频。
    steps:
    - 分析朴素可学习记忆在长时程外推中的计算低效与注意力弥散问题，为记忆结构解耦提供依据。
    - 构建 Sparse Global Memory，以稀疏方式访问全局历史，兼顾历史信息的细粒度检索与计算效率。
    - 构建 Anchored Local Memory，通过锚定局部记忆稳定外推并维持生成质量。
    - 在视频生成中结合两类记忆，以支持长时程的可控生成与时空一致性。
    formulas:
    - tex: \operatorname{SGM}(q_t)=\sum_{i\in\operatorname{TopK}(s_{t,i})}\frac{\exp(s_{t,i})}{\sum_{j\in\operatorname{TopK}(s_{t,j})}\exp(s_{t,j})}\,v_i,\qquad
        s_{t,i}=\frac{q_t^{\top}k_i}{\sqrt{d}}
      caption: 稀疏全局记忆的 Top-K 检索与注意力聚合；标准写法，非原文
    - tex: \operatorname{ALM}(q_t)=\operatorname{Attn}\!\left(q_t,\,[K_{a};K_{t-w:t-1}],\,[V_{a};V_{t-w:t-1}]\right)
      caption: 锚定局部记忆结合锚点与近期窗口进行局部注意力；标准写法，非原文
    train: 摘要未给出训练流程、推理流程及关键设置。
    diff: DecMem 将记忆解耦为 Sparse Global Memory 和 Anchored Local Memory，分别面向高效访问全局历史与稳定高质量外推。相较显式
      3D 记忆和粗帧级隐式建模，也针对朴素可学习记忆的计算低效与注意力弥散进行设计。
    limits: 摘要未见明确说明 DecMem 的代价与局限。
    has_abstract: true
