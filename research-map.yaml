  note: 与 VMem/SMART 路线对照：不重建显式几何，把位姿差异写进位置编码做 warp，属"位姿视锥"分支的轻量解。
  arxiv: '2602.22960'
  explain: 想象镜头绕屋一圈后回到门口：模型既要按要求转动镜头，又得记得门口原来的样子，常常顾此失彼。UCM把相机控制和历史记忆放进同一条条件通道：位姿，也就是相机的位置与朝向，会用时间感知的位置编码来扭曲历史画面特征，让模型按当前视角取回对应记忆。这样，转镜头和认旧景不再是两套互不相干的任务。双流扩散变换器让这套处理更省计算；点云渲染则从三维场景生成重访画面，补足训练数据。模型还利用50万多段单目视频学习，让控制更稳、重访更连贯。
  detail:
    position: UCM 解决视频生成世界模型重访场景时长期内容不一致，以及难以按用户输入精确控制相机的问题。它通过统一建模历史记忆与相机控制，面向高保真交互式视频生成。
    io: 输入包括单目视频、历史帧特征和目标相机位姿等条件信号，输出为受相机控制且保持场景一致的生成视频。摘要未给出完整输入格式及具体条件编码方式。
    steps:
    - 利用点云渲染模拟对场景的再次访问，并据此整理训练数据，以构造包含重访情况的监督样本。
    - 将历史帧特征与目标相机位姿作为生成条件，使模型能够利用已有场景内容并响应相机控制。
    - 按目标位姿对时间感知位置编码进行 warp，将重访时的历史信息与相机控制合入同一条件通道，以建立空间对应关系。
    - 通过双流 Diffusion Transformer 处理条件与生成过程，以降低计算开销并生成高保真视频。
    formulas:
    - tex: \widetilde{\mathbf F}_{\mathrm{hist}}=\mathcal W(\mathbf F_{\mathrm{hist}};\mathbf
        T_{\mathrm{hist}},\mathbf T_{\mathrm{target}}),\qquad \mathbf C=\operatorname{Concat}(\widetilde{\mathbf
        F}_{\mathrm{hist}},\mathbf E_{\mathrm{pose}}(\mathbf T_{\mathrm{target}}))
      caption: 标准写法，非原文：按目标相机位姿 warp 历史特征，并与目标位姿编码合并为生成条件。
    train: 训练数据由点云渲染模拟场景重访的策略构造，覆盖超过 500K 个单目视频。模型采用双流 Diffusion Transformer。推理时以历史帧信息和目标相机位姿为条件生成视频；优化器、损失函数、训练细节及推理参数摘要未给。
    diff: 不同于依赖显式 3D 重建、在无界场景中灵活性受限的方法，UCM 以时间感知位置编码 warp 建立历史帧与目标位姿的对应。不同于仅直接复用先前生成帧而缺少显式空间对应的方法，它将长期记忆与精确相机控制统一到同一条件通道。
    limits: 摘要指出相关既有路线存在灵活性、细粒度结构保持或可控性方面的困难，但未见对 UCM 自身代价与局限的明确说明。
    has_abstract: true
