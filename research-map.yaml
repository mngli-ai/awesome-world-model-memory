    - 训练数据分三源约一万条配对片段，一是 38 个 agent 自制游戏经 GEAR 工具导出的多流渲染数据，二是 Unreal Engine 的双流渲染数据，人群、数量变化与实体尺度可编程控制，三是真实游玩录像，配对关系用三维框检测重建。
    - 构造实体级基准，59 个留出用例共 753 个实体，对真值框评分，检查群体数量是否对、实体是否在正确帧出现与消失。
    - 推理时直接吃普通视频出写实画面，再用实体对应指标看有没有漏渲或幻觉出多余实体。
    formulas: []
    train: LoRA 微调 MiniMax-H3 ref2va 33B，约一万条配对片段，来自 38 个 GEAR 自制游戏、Unreal Engine 渲染与真实游玩录像三源。摘要未给训练卡数、步数与超参。
    diff: 与需要引擎 G-buffer、逐物体标签或低模代理的结构条件渲染不同，它把条件降级成普通视频，灰块、语义图、线框都能吃。与只追求画面好看的视频转视频方法相比，它额外把实体数量与出入帧当硬指标来测。
    limits: 摘要只报实体对应指标，未提长时序退化、KV 预算与推理成本；33B 底座加 LoRA 的部署代价未说；59 例基准是否开源待核；片长与分辨率摘要未给。
