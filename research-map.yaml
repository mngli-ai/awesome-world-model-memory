  date: '2026-11-10'
  detail:
    concepts:
    - 记忆写入淘汰
    - 长上下文扩展
    diff: 与 Context Compaction 比，那条把检索搬到 harness 层由外部规则管，这条把读写时机训进策略；与 MemLearner 比，MemLearner 学的是怎么问上下文，它学的是何时写与何时读回。
    formulas: []
    has_abstract: true
    io: 输入是任务与超过上下文的历史，输出动作与写下的文件；中间产物是随会话存活的文件工作区。
    limits: 五个环境里只有 Visual 一项沾视觉，且不是视频生成；无渲染侧；文件记忆的容量与检索延迟未报；正文 40 页，字段只据摘要。
    position: 我的状态是代码维护的，等于每块都无条件写、每次生成都无条件读最近六块。这条把读写时机交给策略学，等于承认什么时候写本身就是个要训的东西。
    steps:
    - 在五个长程环境里各给原生接口之外的 Bash 与持久工作区。
    - 让策略用建、改、搜、复用文件的方式维护跨上下文替换的记忆。
    - 用全异步 on-policy 蒸馏，从有文件操作先验的冻结教师学这套行为。
    - 在 CAMG-II 与两个外部基准上比。
    train: 需训。全异步 on-policy 蒸馏，教师冻结。
  explain: 长程 agent 的历史超过活动上下文，就得决定记什么、读回什么、什么时候做。这条的前提是这三件事不该外挂成工具协议，而该成为策略本身的习惯。它搭了 CAMG-II 五个环境，每个环境除了原生任务接口，还给普通 Bash 和一个随会话存活的目录，于是策略能自己建文件、改文件、搜文件，把文件当跨上下文替换的记忆，再用全异步 on-policy 蒸馏从冻结教师那里学这套行为。增益是最强 OPD 基线的 2.97 倍，迁到 Terminal-Bench 2.1 与 SWE-Bench Pro V2 也有提升。对我的意义是 code 当状态这件事在 agent 侧已经有训练配方：状态存在文件里，读写时机由策略学，而不是由我写死一个六块窗口。
  id: camp-ii
  key_numbers:
  - CAMG-II 五个环境：Shop、Coding、AutoResearch、General、Visual
  - 增益是最强 OPD 基线的 2.97 倍
  - 外部迁移到 Terminal-Bench 2.1 与 SWE-Bench Pro V2 均有提升
