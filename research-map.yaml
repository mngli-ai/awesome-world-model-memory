  arxiv: '2606.27537'
  explain: 想象一个球滚到沙发后：你看不见它时，它可能被踢动；再露面却仍停在原处，说明模型没记住遮挡期间发生了什么。MemoBench要解决的正是视频世界模型的这个麻烦：许多测试里，遮挡时场景静止，模型即使忘了变化也能答对。它用消失—重现测试：物体先经历物理过程，离开视野一段时间，再出现时必须呈现更新后的状态。基准包含360段带真实状态记录的片段，用四个诊断支柱检查模型是否记住变化，并结合自动指标和视觉问答（用问题检验画面理解），评估8个先进模型。让变化发生在看不见的时候，才能测出模型是在记忆世界，还是只根据眼前画面补全视频。
  detail:
    position: MemoBench 评测视频生成模型能否在目标离开视野期间记住其经历的物理变化，并在目标重现时生成正确的更新状态。它针对只在目标持续可见时评估一致性，或遮挡期间场景保持静止的基准设定。
