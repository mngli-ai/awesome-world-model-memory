  date: '2026-11-03'
  detail:
    diff: 与 FadeMem 比，FadeMem 按时间距离合并 KV，它按学出来的重要性选择与替换；与 LayerRecall 比，LayerRecall 选层，它选帧并另外维护一份长期记忆。
    formulas: []
    has_abstract: true
    io: 输入是自回归生成的历史帧与固定 KV 预算，输出是被路由器选中的保留帧集合与更新后的长期记忆。
    limits: 没有定量结果；路由器在推理时要给每个候选帧打分，延迟开销未报；只有一句对比基线的定性描述。
    position: 滑窗丢早期帧，固定 sink 永久保留初始帧，两种静态策略各自丢长程上下文或锚在过时内容上。
    steps:
    - 用重要性预测路由器估计每个历史帧与当前生成的相关性。
    - 按分数做保留与淘汰，长期记忆用 EMA 重要性分数滚动演化。
    - 加退化感知训练，让模型对噪声或损坏的历史上下文保持鲁棒。
    - 用教师学生蒸馏加稀疏正则训练，把上下文预算固定。
    - 在长程自回归视频生成上对比滑窗与固定 sink 等基线。
    train: 需训，教师学生蒸馏加稀疏正则；数据与步数摘要未给。
  explain: 这篇的出发点是滑窗和固定 sink 都不对。滑窗把早期帧丢掉，长程上下文没了，固定 sink 把最初几帧永久留着，场景演化之后这些锚点就是过时信息，画质掉、运动停滞、多样性下降。L2M 让模型自己学该留谁，一个重要性路由器对每个历史帧打相关性分，按分决定保留、淘汰与演化，长期记忆用 EMA 的重要性分数滚动更新，好帧可以顶掉旧锚。训练上加了一个退化感知项，让模型习惯被污染的历史，用教师学生蒸馏加稀疏正则把预算固定住。摘要没给任何具体数字，这是它最弱的地方，但机制上它正好补上我六块窗口缺的那一环，窗口该由什么决定。
  id: l2m
  key_numbers: []
  lane: 内容学习寻址
  link_strength: 与 FadeMem 都在固定预算下决定旧历史留多少，FadeMem 按时间距离的幂律合并 KV，它按学出来的重要性逐帧保留与替换
  links:
  - https://arxiv.org/abs/2611.01858
  mechanism: 用一个重要性预测路由器给每个历史帧打分，按分数动态保留、淘汰与演化长期记忆，配退化感知训练提升对噪声上下文的鲁棒性，并用 EMA 的重要性分数更新长期记忆，让高质量帧替换过时锚帧，在固定 KV 预算下用教师学生蒸馏加稀疏正则训练。
