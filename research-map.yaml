- id: pawbench
  title: 'PAWBench: How Far Are We from Probabilistically Aligned World Modeling?'
  date: '2026-08-27'
  lane: 评测基准
  branch: ''
  training: 不适用
  status: 速读
  one_liner: 同一观测与动作，重复采样的分布对不对
  mechanism: 提出"概率对齐"：世界模型要复现同一初始观测与动作下多种合法演化的分布，而非单条轨迹可信；PAWEval把多次rollout转成行为经验分布再与参考比对。
  tags:
  - 概率对齐
  - 分布级评测
  - 随机采样
  key_numbers:
  - 50 个场景
  - 11个系统
  - 无一稳定对齐
  media: []
  links:
  - https://arxiv.org/abs/2608.27345
  note: 测的是"同一条件下多次生成的分布形状"，与所有单视频合理性基准正交；结论是现有系统连方向都没对上，别急着谈记忆。
  arxiv: '2608.27345'
  explain: 想象桌上的球被轻轻推了一下：它可能滚向不同方向，也可能碰到杯子后弹开。世界模型若只生成一段看起来合理的视频，仍可能把这些结果的概率猜错。PAWBench关注的正是这个麻烦：同一初始画面和动作，模型多次生成的结果，是否像真实世界那样分布。论文把这种要求称为概率对齐，也就是不仅看单条轨迹像不像，还看各种可能结果出现得是否合适。评测方法PAWEval会反复运行模型，把生成结果汇成行为经验分布，再与参考分布比较。多次采样能检查模型是否漏掉可能性，或把某种结果生成得过多。测试覆盖50个场景、11个系统，却没有一个能稳定对齐。
  detail:
    position: 本文研究视频生成模型作为世界模型时，能否在相同初始观测与动作下复现多种合法物理演化及其概率分布。为此，论文提出概率对齐这一分布层面的评估目标，并构建
      PAWBench 与 PAWEval。
    io: 输入是初始观测和动作条件，模型据此生成多次视频 rollout。PAWEval 将 rollout 转为可能物理行为的经验分布，并与参考分布比较；摘要未说明具体行为表示方式。
    steps:
    - 将世界模型的评估目标从单条视频的合理性扩展到同一条件下的行为分布，以检验模型是否捕捉了多种合法演化。
    - 构建包含不同物理情景的 PAWBench，为评估视频生成模型提供测试场景和参考行为分布。
    - 在相同初始观测与动作条件下重复生成视频 rollout，以收集模型对可能演化的采样结果。
    - 使用 PAWEval 将多次 rollout 转化为行为经验分布，并与参考分布比较，从而评估概率对齐程度。
    - 在多个系统上进行评测，并进一步考察语言提示、初始噪声采样和模型训练能否改变预测分布。
    formulas:
    - tex: \hat{p}_{M}(b\mid o_0,a_{0:T-1})=\frac{1}{N}\sum_{i=1}^{N}\mathbf{1}\!\left[f(\tau_i)=b\right],\qquad
        \tau_i\sim M(\cdot\mid o_0,a_{0:T-1})
      caption: 将相同初始观测与动作下的多次视频 rollout 转换为行为经验分布；标准写法，非原文
    - tex: \mathrm{PAWEval}(M)=\mathcal{D}\!\left(\hat{p}_{M}(b\mid o_0,a_{0:T-1}),\,p_{\mathrm{ref}}(b\mid
        o_0,a_{0:T-1})\right)
      caption: 比较模型行为经验分布与参考行为分布以衡量概率对齐程度；标准写法，非原文
    train: 摘要未给出模型训练流程或具体设置。推理评估通过固定条件下的重复视频生成收集 rollout，再由 PAWEval 转为行为经验分布并与参考分布比较。
    diff: 已有评估主要关注单条视频是否合理，本文则检验重复生成能否恢复正确的行为范围及其概率分布。论文将视频生成模型视为随机采样器，并以分布层面的概率对齐作为评估目标。
    limits: 摘要指出，在 50 个情景和 11 个系统中，没有模型能持续匹配参考概率并恢复有效行为范围；摘要未见对评测代价或其他局限的明确说明。
    has_abstract: true
