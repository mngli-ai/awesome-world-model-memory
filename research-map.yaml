  explain: 它把取记忆这件事重写了一遍，值得抄的是它的形式化。以前两条路，要么每次前向都在大库上重搜一遍，算力按上下文长度线性涨，要么把历史压成循环状态，压缩的时候就得决定什么留下，之后没法反悔。它指出两者都忽略了一件事，相邻几步要取的东西大量重叠，那就没必要每步重新搜，改成在地址空间里从一个位置往邻域走。关键在于它把内容与地址彻底分开，一条记忆有多大用由取回它的内容带来多少信息决定，地址只负责算成本，于是优化目标里出现两项，一项要求局部邻域里的信息价值高，一项对每个变得便宜的记忆收费，边际形式自然给出吸引与排斥两种力，互补的该一起取，冗余的没必要一起取。这套说法对我有直接用处，我的 6 块窗口相当于把地址固定死了，位置由时间顺序决定，跟内容价值无关，所以一改相机就得重来。它的证据很薄，只在 MiniGrid Memory 上跑了固定几何的简化版，学到的几何与重复取用都没测，0.95 那个数还得配上五个 token 的上下文和 0.59M 步训练来读。
