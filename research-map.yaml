- id: minwm
  title: 'minWM: A Full-Stack Open-Source Framework for Real-Time Interactive Video
    World Models'
  date: '2026-05-28'
  lane: 框架层
  branch: ''
  training: 需训
  status: 速读
  one_liner: 开源全栈实时交互世界模型框架
  mechanism: 先微调双向视频扩散加相机控制，再套Causal Forcing流水线（AR训练、因果ODE或一致性蒸馏、非对称DMD）蒸成少步AR生成器；模块化，可换骨干、可迁移已有世界模型。
  tags:
  - 全栈开源
  - 少步自回归
  - 可换骨干
  key_numbers:
  - Wan2.1-1.3B
  - HY1.5-TI2V-8B
  - 含最小batch ablation
  media: []
  links:
  - https://arxiv.org/abs/2605.30263
  - https://github.com/shengshu-ai/minWM
  note: 少见的"工程参数都给你"的框架论文：相机轨迹质量、控制训练步数、最小batch三组ablation，复现价值高于方法新颖度。
  arxiv: '2605.30263'
  explain: 想象你按下方向键，小车应立刻转弯，街景也要连贯变化；普通视频生成往往太慢，也未必听得懂动作，难以实时互动。minWM把双向视频模型微调到能响应相机控制，再用Causal
    Forcing——把模型训练、蒸馏成按时间逐段生成的因果模型——制成少步自回归生成器。它结合自回归训练、因果常微分方程或一致性蒸馏，以及非对称分布匹配蒸馏，目标是在加快生成的同时保住画面质量与控制能力。框架模块可替换，也能迁移已有世界模型；论文用Wan2.1-1.3B和HY1.5-TI2V-8B验证，并比较了最小批量设置。这样既借用视频模型的画面能力，也让画面更快跟上动作。
  detail:
    position: 这篇工作解决如何把已有视频扩散基础模型转化为可控、因果且低延迟的实时交互视频世界模型。它提供覆盖数据构建、训练、蒸馏和流式推理的开源全栈框架。
    io: 输入包括已有的 T2V 或 TI2V 视频基础模型、训练数据，以及用于控制生成的相机信号；推理时模型根据条件逐步生成视频片段。输出是可进行低延迟自回归
      rollout 的交互视频。
    steps:
    - 构建或适配训练数据，为后续学习相机控制和视频生成提供数据基础。
    - 对双向视频扩散模型进行相机控制微调，使生成结果能够响应相机条件。
    - 进行 AR diffusion 训练，将双向生成模型转为因果自回归生成，以支持逐步 rollout。
    - 使用 causal ODE 或 causal consistency distillation，并结合 asymmetric DMD，将模型蒸馏为少步生成器，以降低推理延迟。
    - 通过流式推理生成交互视频，并可将框架用于适配已有世界模型、数据分布和延迟目标。
    formulas:
    - tex: \mathcal{L}_{\mathrm{AR}}(\theta)=-\mathbb{E}_{(x_{1:T},a_{1:T})}\left[\sum_{t=1}^{T-1}\log
        p_{\theta}\left(x_{t+1}\mid x_{\le t},a_{\le t+1}\right)\right]
      caption: 标准写法，非原文：以历史视频帧和相机动作作为因果条件，训练自回归世界模型逐步生成下一帧。
    - tex: \mathcal{L}_{\mathrm{distill}}=\mathbb{E}_{x,c}\left[\left\|f_{\mathrm{student}}(x,c)-\operatorname{stopgrad}\left(f_{\mathrm{teacher}}(x,c)\right)\right\|_{2}^{2}\right]+\lambda\,\mathcal{L}_{\mathrm{DMD}}
      caption: 标准写法，非原文：通过因果一致性/ODE教师与非对称DMD，将多步双向扩散教师蒸馏为少步因果生成器。
    train: 训练流程包括数据构建、相机控制微调、AR diffusion 训练，以及 causal ODE 或 causal consistency distillation
      和 asymmetric DMD。框架在 Wan2.1-T2V-1.3B 与 HY1.5-TI2V-8B 等骨干上实例化，覆盖 cross-attention
      条件注入和 MMDiT 架构；摘要未给出具体训练超参数。推理采用少步自回归生成和流式 rollout；摘要未给出具体步数或延迟数值。
    diff: 不同于只关注视频生成质量的双向视频扩散模型，minWM 提供从相机控制微调到因果自回归训练、蒸馏和流式推理的端到端方案。它还强调模块化扩展，可适配不同骨干及已有世界模型。
    limits: 摘要未提供具体算力、训练成本、延迟或生成质量数据；其效果与适用范围可能受训练数据、骨干架构和蒸馏配置影响，但摘要未明确说明。
    has_abstract: true
