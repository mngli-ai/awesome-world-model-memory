  detail:
    diff: 与其他物体地图存续滤波都用类别先验或固定衰减，区别是它从相似实例的观测历史里取先验并对每个物体单独学移动习性。
    formulas: []
    has_abstract: true
    io: 输入是检测流与漏检记录，输出是每个物体的存续概率与更新后的物体地图。
    limits: 只在室内物体地图上验证，仿真 120 条序列加 47 个 3RScan 环境，没有任何视频生成实验；摘要只给相对排序，未给绝对指标。
    position: 长期物体地图必须判断离开视野的物体是否还在原处，现有存续滤波靠类别先验，开放词表下不适用。
    steps:
    - 对新物体检索视觉与几何相似的训练实例。
    - 用这些实例的历史估出初始存活率。
    - 初始化共轭 Beta 信度，按检测与漏检闭式更新。
    - 物体在新位置被重新识别时把信度随物体迁移。
    train: 推理期技巧，信度为闭式更新，无梯度训练；检索库来自已观测历史。
  explain: 这篇回答的是我三个问题里最容易被跳过的那一个，什么时候该认为一条记忆已经失效。长期物体地图要判断一个物体离开视野之后还在不在原处，现有做法靠类别先验，猫比椅子更可能还在原地，开放词表下这套先验就废了。HiPer 改成从数据里取，来一个新物体先检索视觉和几何都相似的训练实例，用它们被观测到的历史算一个初始存活率，把这个数当成共轭 Beta 分布的参数，之后每来一次检测或漏检就在 Rosen 存续滤波的框架下闭式更新，不需要梯度也不需要重训。物体在新位置被重新认出来时这条信度跟着物体搬过去，地图于是能学到单个物体的移动习性。120 条仿真序列上一直最好，47 个 3RScan 环境里检索式先验也压过 CLIP 标签先验。对我的价值不在机器人地图，而在它给过期这件事一个可算的量，不是二元删掉或留着，而是一个随观测更新的概率，读的时候可以按这个概率决定要不要信。
