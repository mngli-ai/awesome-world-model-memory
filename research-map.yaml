  explain: 想象你在玩游戏探索房间，一转身刚才的桌椅全走样了，这篇论文解决的就是交互世界模型在边玩边生成时画面容易漂移变形的麻烦。团队的做法是按视角重叠挑选历史帧，用
    Plücker 编码这种把空间光线位置与方向统一打包的几何工具记录机位变化；同时把首帧 latent，也就是初始画面的特征压缩向量，固定为长期记忆锚点，并将上一轮生成的误差按比例注入下一轮修正。这套机制管用在它让模型转动视角时能严密对齐几何空间，不让预测偏差滚雪球累积，从而在低延迟下维持了画面的长程一致。
  detail:
    position: Matrix-Game 3.0 面向需要长时序一致性与实时交互的世界模型生成，目标是在高分辨率下持续生成可交互视频。它通过记忆增强和推理加速，缓解长视频生成中的记忆不足与速度受限问题。
    io: 输入为交互过程中的动作、提示及相机位姿等条件信号，模型据此生成后续视频帧。生成时可检索历史帧作为记忆，并利用相机相对几何信息维持跨时间一致性。
    steps:
    - 构建融合 Unreal Engine 合成数据、AAA 游戏自动采集数据和真实视频增强的 Video-Pose-Action-Prompt 数据，以规模化提供带动作与位姿条件的训练样本。
    - 训练模型预测生成残差，并在训练中重新注入不完美的生成帧，使模型学会修正自身误差，提升长时序生成稳定性。
    - 依据相机位姿和视野重叠检索历史帧，再用 Plücker 编码相机相对几何并注入记忆，以增强长时空一致性；首帧 latent 作为持久 sink 保留。
    - 采用基于 Distribution Matching Distillation 的多段自回归蒸馏，并结合模型量化与 VAE decoder 剪枝，以降低推理开销、支持实时生成。
    formulas:
    - tex: \mathcal{M}_t=\operatorname{TopK}_{i<t}\,s\!\left((T_t,T_i),\,\operatorname{Overlap}(V_t,V_i)\right)
      caption: 按相机位姿与视野重叠检索历史帧的标准写法，非原文
    - tex: z_{t+1}^{\mathrm{in}}=z_{t+1}+\gamma\,\delta_t
      caption: 将生成误差按系数 γ 注入下一轮状态的标准写法，非原文
    train: 训练数据为 Video-Pose-Action-Prompt 四元组；长时序训练通过预测残差和重新注入不完美生成帧实现自校正，并使用相机感知的记忆检索与注入。推理采用多段自回归蒸馏，结合模型量化和
      VAE decoder 剪枝。摘要报告 5B 模型可在 720p 下最高达到 40 FPS，扩展至 2x14B 可提升生成质量、动态表现与泛化能力。
    diff: 相较于仅依赖当前上下文生成的交互视频方法，本文结合相机感知的历史帧记忆与训练时自校正，面向分钟级长序列维持一致性。它还将多段自回归蒸馏、量化和
      VAE decoder 剪枝结合，用于高分辨率实时推理。
