  one_liner: sink+窗口的分层缓存骨架起点
  mechanism: 报告只写『sink+窗口』：保留开头若干 sink token 加最近窗口，作为后续所有流式框架的分层缓存底座。
  key_numbers:
  - '2023'
  self_measured: []
  media:
  - https://cdn.prod.website-files.com/64f4d663be17b6544a586bac/64f4d7bc66b126fda1628b30_collage-1-1-removebg-preview.png
  links:
  - https://arxiv.org/abs/2309.17453
  note: 报告只给年份 2023，无 arXiv 号；training=免训为推断，报告未述其训练需求。
  tags:
  - Sink驻留
  - 滑动窗口
  explain: 想象你跟人连聊几天几夜，脑袋记不下，聊到后面不仅忘事还会发疯胡话。2023年提出的StreamingLLM解决的就是大模型做无限流式输入时显存撑爆、输出崩溃的麻烦。它的招数是在保存历史计算记忆的缓存里，只保留最开头的几个汇元即sink
    token，再加上最近的一段窗口。这招管用是因为模型在算注意力时，总会把多余的关注度倾泻在开头的词里充当泄洪池；只要留住它们来稳定全局注意力分布，再配合近期的上下文，模型不用重新训练就能无限流畅地聊下去。
  detail:
    position: 面向流式推理中上下文持续增长的问题，StreamingLLM 使用 sink+窗口的缓存方式，保留开头若干 sink token 和最近窗口。
    io: 输入是持续到来的 token 序列，输出是供后续流式处理使用的缓存。未见明确说明其他条件信号。
    steps:
    - 从序列开头保留若干 sink token，为后续流式处理保留这部分缓存。
    - 保留最近窗口内的 token，以维持对近期内容的缓存。
    - 将 sink token 与最近窗口作为缓存骨架供后续流式处理使用，避免缓存随输入序列持续累积。
    formulas:
    - tex: \mathcal{I}_t=\{1,\ldots,n_{\mathrm{sink}}\}\cup\{\max(n_{\mathrm{sink}}+1,t-W+1),\ldots,t\},\qquad
        (K_t^{\mathrm{cache}},V_t^{\mathrm{cache}})=(K_{\mathcal{I}_t},V_{\mathcal{I}_t})
      caption: 标准写法，非原文：缓存保留序列开头的 sink token 和最近窗口 token。
    train: 摘要未给
    diff: 关键差别是缓存由开头的 sink token 与最近窗口构成，而非持续保留全部历史 token。摘要未提供与具体已有方法的进一步比较。
    limits: 未见明确说明
    has_abstract: false
  cpm: null
  repro: paper_only
  inherited: 2
