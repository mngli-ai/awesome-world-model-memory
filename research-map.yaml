    io: 输入是长程操作的观测流与动作；输出是动作序列；中间产物是两条记录流，进展记录与失败记录，以及一个由 critic 给出的成功概率改变量。
    limits: 只在十个子任务的诊断环境与真机操作上验证，环境是自建的，绝对值不能直接外推；36 步窗口基线为 0.0% 说明该环境对长期历史极敏感，可能高估方法收益；critic 本身要训，critic 估偏时写入判据跟着偏，摘要未讨论；无视觉生成，事件记忆是策略侧的结构。
    position: 把事件记忆的写入判据从感知或运动学显著性换成对任务成功概率的影响幅度，用 critic 充当写入门。
    steps:
    - 用 critic 估计每个候选事件发生前后最终成功概率的变化。
    - 只保留改变量大的事件，正向变化写进展记录，负向变化写失败记录。
    - 子任务完成后丢弃与之对应的失败记录，避免旧失败长期压住判断。
    - 策略在观测与事件记忆共同条件下出动作。
