- id: worldroambench
  title: 'WorldRoamBench: An Open-World Benchmark for Long-Horizon Stability of Interactive
    World Models'
  date: '2026-06-30'
  lane: 评测基准
  branch: ''
  training: 不适用
  status: 速读
  one_liner: 1000+例、10-60秒开放世界长程考卷
  mechanism: 四维各设新指标：逐帧动作指标绕开跨模型语义尺度差、滑窗漂移抓中途非单调坍塌、物理项先过相机与主体跟踪门控、记忆项用过渡段局部3D点云重建加追踪与VLM。
  tags:
  - 滑窗漂移
  - 点云记忆
  - 门控物理
  key_numbers:
  - 1000+ 用例
  - 10-60秒连续交互
  - 10+ 闭源开源模型
  media: []
  links:
  - https://arxiv.org/abs/2606.31672
  note: 测的信号是"持续性"：动作跟得住吗、中途会不会塌、物理过不过门控、记忆能不能用局部点云重建对上；结论是最好模型也只到中等分。
  arxiv: '2606.31672'
  explain: 想象你在生成的荒野里开车：前几秒路面逼真，几十秒后车却穿墙，转过山头又忘了刚才的营地。WorldRoamBench要解决的，正是互动世界模型短片看着不错、长时间连续游玩却容易失稳，而且不同模型的分数难直接比较的问题。它准备了1000多个、时长10到60秒的开放世界交互任务，测试10多种开源和闭源模型，并从四方面打分：逐帧动作指标看模型是否及时回应操作，避开不同模型语义评分尺度不一；滑动窗口漂移指标沿时间检查画面是否逐渐走样，也能抓住中途突然崩坏；物理评估先确认相机和主体跟踪可靠，再判断运动是否合乎物理；记忆评估则在场景转换处重建局部三维点云，结合跟踪和视觉语言模型检查模型是否记得先前见过的东西。这样既测得久，也能定位失稳发生在哪里。
  detail:
    position: 本文提出 WorldRoamBench，用于评估交互式世界模型在长时间连续交互中的稳定性。它关注短时表现无法揭示的动作跟随、视觉稳定、物理合理性与记忆问题。
    io: 输入为自然、城市和室内场景中的测试案例，包含第一人称或第三人称视角，以及持续 10 到 60 秒的 WASD 操作信号；输出为动作、视觉、物理和记忆四个维度的评估结果。物理评估受相机运动与主体跟踪检查门控，记忆评估使用轨迹信息以减轻动作跟随错误的干扰。
    steps:
    - 构建涵盖多类场景、视角和持续交互时长的测试案例，以覆盖开放世界中的长程行为。
    - 逐帧计算动作指标，绕开不同模型间语义尺度差异造成的比较困难，并暴露轨迹汇总可能掩盖的动作失败。
    - 使用滑动窗口评估视觉漂移，以捕捉序列中途出现、且可能非单调变化的视觉坍塌。
    - 先检查相机运动与主体跟踪，再评估力学、光学和三维一致性，以减少不满足基本跟踪条件时的物理评估混淆。
    - 按轨迹定位状态过渡，并结合局部三维点云重建、主体跟踪与 VLM 推理评估场景记忆和主体记忆。
    formulas: []
    train: 这是评测基准；摘要未说明模型训练流程。评估 10 多个开放或闭源模型，使用超过 1000 个测试案例，进行 10 到 60 秒连续 WASD
      交互；其余推理设置摘要未给。
    diff: 相较于依赖短时表现或起点与终点对比的评估，本文以逐帧动作指标和滑动窗口漂移度量长程变化。它还通过相机运动与主体跟踪门控物理评估，并以轨迹感知的局部三维重建和追踪加
      VLM 推理评估记忆。
    limits: 摘要未见明确说明评测成本、指标实现细节或基准覆盖范围方面的局限。
    has_abstract: true
