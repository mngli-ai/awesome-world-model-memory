    diff: 与从单图或文本出发的世界模型基准不同，它从真实视频出发并要求回访一致；与只测相机跟随的评测相比，它把主体身份与事件推进单独拆成维度。
    formulas: []
    has_abstract: true
    io: 输入单镜源视频与键盘动作序列，输出生成 rollout 与六维 24 项子指标分数。
    limits: 单镜、最长 25 秒，跨镜头与分钟级未覆盖；WanderLand 需要同刻源帧，本质是半教师强制，长程外推的能力没被真正测到；无官方演示素材。
    position: 视频条件的世界模型要能重拍、能自由视角回放、能当 real-to-sim 环境，但现有基准从单图或文本出发，只测感知质量与相机跟随，不测回访同一地点时世界还在不在。
    steps:
    - 收 745 段真实与 AI 生成的单镜视频，按时长分三档。
    - 为每段配键盘动作表示的相机路线，定义六个维度共 24 个子指标并做人工校验。
    - 在八个模型上跑，观察随片段变长各项指标怎么退化。
    - 给出 WanderLand，把每帧条件在同刻源帧上，回访时再叠自己早先的静态内容。
    - 在五个模型上复测，确认每一维都能涨。
    train: 基准本身免训；WanderLand 也免训，只改推理条件，不训权重。
  explain: 这条是评测。它收 745 段单镜源视频，配键盘动作给出的相机路线，分三档时长，用 24 个人工校验的子指标测六维，其中专门有一维测回到同一地点时画面对不对。八个模型的结论很干净，片段越长，静态场景与画质都还在，相机控制与源视频里的动态丢了，没有一个是回访一致的。作者顺手给了 WanderLand，把冻结模型每帧条件在同一时刻的源帧上，回访时再加自己早先看到的静态内容，五个模型每一维都涨，最多八点三分。这套判据补的是我缺的那一维，我现在只测可控性，回访一致性没有专门的尺子。短板是单镜、25 秒以内，WanderLand 又要同刻源帧，等于半教师强制，不是纯自回归。
