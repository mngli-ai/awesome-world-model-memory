- arxiv: '2611.10240'
  branch: 重排位置
  concepts:
  - 旋转位置编码
  - KV压缩或淘汰
  - 长上下文扩展
  date: '2026-11-06'
  detail:
    concepts:
    - 旋转位置编码
    - KV压缩或淘汰
    - 长上下文扩展
    diff: 与 H2O、SnapKV 这类按重要性淘汰的方法比，它指出淘汰对了也可能取不到，必须同时管位置距离；与 MemRoPE 这类重排相比，它把距离上限写死成常数并接上规划器的读取意图。
    formulas: []
    has_abstract: true
    io: 输入长会话的 KV 缓存与 agent 规划器给出的后续读取意图，输出被保留并重编号的缓存，供后续步解码。
    limits: 只在语言 agent 的代码会话上验，视频与连续视觉状态没测；重编号破坏绝对位置语义，对需要全局一致坐标的任务是否安全未讨论；依赖规划器质量，规划错就留错。
    position: 长会话的 KV 预算只能留一小撮 token，淘汰方法都在优化留得对不对，但留下不等于拿得到，定义与使用间的间隔一大，注意力就被位置距离挡住。
    steps:
    - 在 10 万 token 代码会话上测驻留率与准确率，暴露驻留高但取不到的现象。
    - 把失效归因到旋转位置距离，随定义与使用的间隔增长而扩大。
    - 让规划器给出未来步会读的上下文，据此决定保留哪一段。
    - 对保留的 token 重新编号，使旋转距离在任何长度下不超过 8K。
    - 预注册任务上比隐藏单测通过率，并与 H2O、SnapKV 同预算对比，做消融确认两个组件都必需。
    train: 免训，只在服务侧改保留策略与位置编号，不动模型权重。
  explain: 这条把取不到的原因说清楚了。大家做 KV 淘汰都在比谁留得准，PACE 先证明留得准没用，十万 token 的代码会话、2048 token 的预算下，需要的东西有 99.6% 都在缓存里，可定义与使用之间的间隔一拉长，从 2K 到 90K，准确率就从 93% 掉到 64%，因为旋转位置距离变远，注意力就是拿不到。它给两个组件，规划器告诉缓存未来几步会读哪一段，留下的 token 再重新编号，让旋转距离在任何长度下都不超过 8K。结果 97% 对 H2O 的 42% 与 SnapKV 的 3%，两个组件少一个就掉到 63%。这条对我的直接价值是把驻留率这个指标废掉，换成间隔与距离，我的六块窗口在距离上有天然上限，代价是超过窗口的东西无论多重要都取不到，而重编号这一步我给不了。
  id: pace
  key_numbers:
  - 2,048 token 预算下间隔 2K 到 90K，准确率 93% 到 64%，所需 token 驻留率 0.996
  - 10 万 token 会话隐藏单测通过 97%，H2O 42%，SnapKV 3%
  - 两个组件只留一个时都只有 63%
  - 重编号后旋转距离上限 8K
  lane: 位置时间寻址
