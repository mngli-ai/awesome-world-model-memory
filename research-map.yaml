  one_liner: 用自生成历史蒸馏，治 exposure bias
  mechanism: 不改记忆结构：学生自己 rollout 出带误差的历史，教师对这段自生成历史打分蒸馏，让模型习惯自己的错误。
  key_numbers: []
  self_measured: []
  media:
  - https://self-forcing.github.io/static/results.png
  - https://self-forcing.github.io/static/teaser.jpg
  - https://self-forcing.github.io/static/videos/30s/0006.mp4
  links:
  - https://arxiv.org/abs/2506.08009
  note: 报告未给日期，仅列于 §3.6 与参考文献。
  tags:
  - 学生自rollout
  - 教师蒸馏
  explain: 就像学骑车如果总有人在后面扶着，一旦松手你只要车把稍稍晃一下就会直接摔倒。模型平时训练都喂标准答案，实际生成时只能依赖上一句输出，前面一错就会步步错，这种训练和实战脱节的问题叫暴露偏差。这篇论文的招数是让学生模型自己往下写，生成一段带毛病的作答历史，再让更厉害的教师模型针对这段有错的历史教它打分，也就是用好模型带差模型的知识蒸馏。这招管用是因为它不改动模型结构，直接让模型提前习惯自己的失误并在犯错语境里学会顺势纠偏，独立推理时就不会因为微小失误而全盘崩溃了。
  detail:
    position: Self Forcing 旨在缓解自回归视频扩散模型的 exposure bias：训练时使用真实历史，推理时却必须依赖模型自己生成且可能带误差的历史。它让模型在自生成上下文中接受视频级监督，以提高整段生成序列的质量。
    io: 输入是视频生成所需的条件信号及扩散过程中的噪声，摘要未具体说明条件信号的类型。模型逐帧生成视频，并将此前自生成的帧作为后续帧的上下文。
    steps:
    - 使用 few-step diffusion 模型逐帧生成视频，以较少去噪步骤控制自回归 rollout 的计算成本。
    - 训练时通过 KV caching 保存生成历史，并将模型自己的输出作为后续帧的条件，使训练上下文贴近推理时的实际情况。
    - 对自生成历史上的整段视频进行视频级监督，并通过教师对该历史评分蒸馏，使模型学习在带误差的上下文中生成。
    - 使用 stochastic gradient truncation 限制反向传播开销，在训练效率与性能之间取得平衡。
    - 推理时通过 rolling KV cache 复用历史状态，支持高效的自回归视频外推与流式生成。
    formulas:
    - tex: \hat{x}_{1:T}=G_\theta(z_{1:T};\hat{x}_{<1:T}),\qquad \hat{x}_t=G_\theta(z_t;\hat{x}_{<t})
      caption: 标准写法，非原文；表示学生逐帧自回归 rollout，并将自己的历史输出作为后续帧条件
    - tex: \nabla_\theta L_{\mathrm{DMD}}=\mathbb{E}_{t,\epsilon}\!\left[\left(s_{\mathrm{student}}(x_t,t)-s_{\mathrm{teacher}}(x_t,t)\right)\frac{\partial
        \hat{x}_{1:T}}{\partial\theta}\right],\quad x_t=\alpha_t\hat{x}_{1:T}+\sigma_t\epsilon
      caption: 标准写法，非原文；在学生自生成视频上用教师与学生的噪声分数差进行分布匹配蒸馏
    train: 训练采用 few-step diffusion、自回归 rollout 和 KV caching，使每帧依赖此前自生成的输出；使用视频级整体损失，并采用
      stochastic gradient truncation 控制计算成本。推理使用 rolling KV cache 进行自回归视频外推。摘要报告单
      GPU 上可实现亚秒延迟的实时流式生成，但未给出具体训练超参数。
    diff: 不同于基于真实上下文帧预测未来帧的做法，Self Forcing 在训练中使用模型自己的生成历史作为条件，并以视频级整体监督评估生成序列，而非只依赖逐帧目标。
    limits: 方法引入自回归 rollout 和视频级监督，训练需兼顾计算开销；摘要称 stochastic gradient truncation 用于平衡成本与性能，但未见明确说明其他代价或局限。
    has_abstract: true
