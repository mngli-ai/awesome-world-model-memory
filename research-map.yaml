- id: physcodegym
  title: 'PhysCodeGym: Verifiable 4D Physics Reconstruction for Coding Agents'
  arxiv: '2610.17288'
  date: '2026-10-12'
  lane: 代码世界模型
  branch: 可执行评测
  one_liner: 让 agent 写代码重建 4D 物理并可验证
  mechanism: 把物理重建写成可执行程序，用工具交互与轨迹执行结果做验证，构造可自动判分的训练与评测环境
  tags:
  - 4D重建
  - 轨迹验证
  training: 需训
  status: 速读
  key_numbers: []
  links:
  - https://arxiv.org/abs/2610.17288
  note: 面向 coding agent 的物理 gym，兼训练与评测
  venue: ''
  self_measured: []
  media: []
  parent: null
  link_strength: ''
  precision: day
  explain: 想象一段视频：小球撞墙后反弹。一个 agent 不只要“看起来像”地复现画面，还要写出能让小球按正确规律运动的程序。麻烦在于，传统视频生成容易得到视觉相似却不符合物理的结果，而且很难自动判断好坏。PhysCodeGym
    把任务改写成可执行的代码：agent 观察视频，调用工具搭建四维物理重建，即在三维空间中还原物体随时间的运动，再运行程序生成轨迹。系统依据轨迹执行结果验证重建是否合理，并据此自动评分和反馈。这样做的关键是把隐含的物理理解变成能运行、能检查的程序，让训练不再只看画面像不像，而能检验运动规律是否真的成立。
  detail:
    position: 这篇工作要解决从视频重建可执行且物理可靠的4D场景模型的问题，而不仅是复现可见物体和事件。它提出 PhysCodeGym 作为可验证 benchmark，评估
      coding agents 编写程序、运行仿真并依据反馈修正模型的能力。
    io: 输入是包含 rigid-body、liquid、deformable 或 wind-driven motion 的视频任务，以及工具交互和仿真反馈等条件信号；输出是可执行的
      Blender 程序、对应的4D物理场景和修订后的重建结果。评测还提供原始条件与 counterfactual 修改条件，用于检验模型的物理一致性。
    steps:
    - Agent 检查输入视频并提取物体、运动和交互现象，以确定需要重建的场景结构与物理行为。
    - Agent 编写并运行 Blender 程序生成4D物理场景，以把视频观察转化为可执行的仿真模型。
