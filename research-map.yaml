- id: evoworld
  title: EvoWorld
  date: '2025-10-01'
  lane: 几何位姿寻址
  branch: 显式几何库
  training: 训练
  status: 速读
  one_liner: 全景生成+演进式显式3D记忆
  mechanism: 先出帧，再用前馈即插即用 transformer 增量演进 3D 重建，把重建几何重投影到目标视角作条件；建含闭环检测的长程基准。
  tags:
  - 全景生成
  - 演进重建
  - 闭环检测
  key_numbers:
  - 单张全景图输入
  - 含闭环检测的评测集
  media: []
  links:
  - https://arxiv.org/abs/2510.01183
  - https://github.com/JiahaoPlus/EvoWorld
  note: 有开源代码与闭环评测，可作几何泳道"重访一致性"实验参照。
  arxiv: '2510.01183'
  explain: 想象你站在一间屋子的中央，先拍下一张全景图，再让镜头一路转动。只靠逐帧生成，墙角和门的位置可能慢慢跑偏，走回原处时，房间也未必还像原来。EvoWorld从单张全景图出发，先生成新画面，再用前馈式即插即用变换器逐步更新三维重建，也就是场景的空间几何记忆；随后把记忆投影到下一视角，作为生成条件。这样每一帧都能借用已有的空间信息，减少长视频里的几何漂移。论文还建立了长程评测集，加入闭环检测，即判断镜头是否回到曾经到过的位置，用来检验模型能否认出并保持场景一致。
  detail:
    position: EvoWorld 解决从单张全景图出发进行长时程环境探索时，生成视频容易出现空间不一致的问题。它将全景视频生成与不断演进的显式 3D 记忆结合，以维持跨视角和长轨迹的场景一致性。
    io: 输入是一张全景图，输出是面向未来视角的全景视频帧。生成过程使用细粒度视角控制，并以演进式 3D 重建的几何重投影作为空间条件信号。
    steps:
    - 以输入全景图为起点，使用带细粒度视角控制的视频生成器生成未来帧，为后续探索提供视频内容。
    - 根据生成的帧，使用前馈 plug-and-play transformer 增量演进场景的 3D 重建，以维护随探索更新的显式空间记忆。
    - 将演进式 3D 重建的几何投影到目标视角，形成空间条件并用于合成后续未来帧，以提升视觉真实感和几何一致性。
    - 在合成新帧后继续更新 3D 记忆，使其支持长轨迹探索及闭环场景的一致性评估。
    formulas:
    - tex: \hat{V}_{t+1:t+K}=G_{\theta}\!\left(V_{0:t},\,\Pi(M_t,\,\mathcal{C}_{t+1:t+K})\right)
      caption: 利用当前显式 3D 记忆投影得到的空间条件，生成目标视角下的未来视频帧；标准写法，非原文
    - tex: M_{t+1}=\operatorname{Update}\!\left(M_t,\operatorname{Lift}\!\left(\hat{V}_{t+1:t+K},D_{t+1:t+K},\mathcal{C}_{t+1:t+K}\right)\right)
      caption: 将生成帧及其深度信息反投影到世界坐标并增量更新显式 3D 记忆；标准写法，非原文
    train: 摘要未给训练流程、损失函数或关键训练设置。推理时先生成未来帧，再演进 3D 重建，并将重建几何重投影为后续视频合成的条件信号。
    diff: 区别于仅合成视频的既有方法，EvoWorld 将演进式显式 3D 重建作为视频生成的空间引导，并通过几何重投影为目标视角提供空间线索。论文还提出覆盖合成户外环境、Habitat
      室内场景和真实场景的长程探索基准，强调闭环检测与空间连贯性。
    limits: 未见明确说明
    has_abstract: true
