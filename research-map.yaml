  explain: 想象一个小球从斜坡滚下，撞上另一个球：画面看着顺畅，不代表运动真的讲得通。视频世界模型可能生成这样的物理场景，却悄悄让动量漂移，或让物体自由落体、碰撞时违反规律。PhysCodeBench要解决的，就是这类“看起来合理、实际不合理”难以被发现和比较的问题。它让模型生成描述运动的代码，再运行代码，检查执行轨迹是否符合物理规律：动量是否守恒，物体下落和沿斜面运动是否正确，弹性与非弹性碰撞是否表现合理。这里的执行轨迹，就是物体随时间变化的位置和运动状态。运行而非只看画面，能把物理错误变成可检查的结果，也让评估不只依赖人的直觉。论文未给出具体数字，但这套方法提供了检验模型物理理解的清晰办法。
