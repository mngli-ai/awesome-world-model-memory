  explain: 就像看魔术时杯子凭空穿透了桌子，现在很多AI视频画面逼真，细看却常常违反牛顿定律。这篇论文要解决的麻烦，是以往评测只看画面好不好看，发现不了动作是否符合现实规律。作者提出的VideoPhy用了一套物理合理性评测基准，也就是专门测试物体规律的成套考卷，重点检验具身动作与指令遵循。它不做回溯一致性评测，也就是不去回头核对前后帧的历史记忆，仅作为能力评估的辅助参考。这招之所以管用，是因为它避开了画质干扰，直接考察物体受力与运动，能准确测出模型到底懂不懂真实物理。
