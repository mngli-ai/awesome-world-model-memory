    concepts:
    - 检索增强
    - 记忆写入淘汰
    - 位姿对齐检索
    diff: 已有具身 RAG 多半假设单回合知识库可靠，或者跨回合只往后追加，错的东西会一直留着；SPARK 不扩容量也不换检索器，而是加了一条发现错、专门去看、按新观测改的闭环，并且在同样观测预算下比非定向回访更强。
    formulas: []
    has_abstract: true
    io: 输入是若干回合的具身观测与 158 道具身问答，输出是修正后的知识库以及修正前后的答对情况。
    limits: 任务是具身问答与知识库维护，不含画面生成与渲染条件；四张 AirSim 户外地图、两种退化视角，室内与动态场景未测；critic 的三路信号权重摘要未给，待核。
    position: 具身检索记忆的问题不是取不到，而是取到的是旧的错信息，而且错会跨回合累积；SPARK 把记忆当成一份可读写的知识库，先用一个语义 critic 标出不可信区域，再规划一次专门的回访去看这些地方，最后按新观测决定加、删还是替换条目。
    steps:
    - 第一回合结束后建出知识库，条目含物体标签、位置与空间关系。
    - 语义 critic 从标签置信度、位置冲突与关系不一致三路信号标出可疑区域。
    - 定向规划器只对可疑区域生成回访路径，同样预算下优先看这些地方。
    - 新观测回来做选择性合并，按可见性判该加、该删还是该替换，修正可跨多个回合继续。
    train: 摘要未提训练流程，critic、规划器与合并三步都由现成模型拼起来，判为免训，待核。
  explain: 这条给我的是「什么时候会取错」之后该怎么办。它承认一个很朴素的事实，知识库里的错不会自己消失，你再用它，它就一直在，而且新观测如果只是往后追加，错的和对的会同时留着。做法是三步，先由一个语义 critic 从标签、位置、空间关系三路信号里挑出这个知识库哪些地方不可信，再让规划器专门为这些地方排一次回访，注意是定向的，不是顺着原路线再走一遍，同样的预算下定向回访平均收益更大，最后拿新观测做选择性合并，加、删、替换三种动作分开判，所以知识库反而比只追加的做法小，少存 13 到 41% 的物体。数字上单回合修正就把每张图的问答拉起来，最猛的一对地图条件组合有 2.7 倍，改到第四回合时每张图都超过了没退化的参照。对我有用的是这条闭环的形状，我现在的六块窗口只会往前滑，滑出去的东西就算错了也没人回头核，它说明回访这件事可以按可疑度排预算，而不是按时间均匀地重看。
  id: spark-embodied-memory
  key_numbers:
  - 158 道具身问答
  - 少存 13-41% 物体
  - 单图条件组合最多 2.7 倍
  - 4 张 AirSim 地图
  - 修正延续到第 4 回合
