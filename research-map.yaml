  tags:
  - G-buffer条件
  - 两段LoRA
  - 仿真转实拍
  explain: 这条路是把仿真器画出来的画面换成实拍质感，但几何一点不能动。做法是先给视频扩散模型开一个轻量入口，把 G-buffer 里的几何和材质信息灌进去，再用 LoRA 少量改参数。训练分两段，第一段拿真正准确的 G-buffer 教它认几何，第二段换成真实视频加估计出来的 G-buffer 学外观，这时候把入口和第一段 LoRA 冻住，只训新的那一段，理由是估计出来的 G-buffer 有噪声，别让它把已经学好的几何通路带偏。这个冻结条件通路的细节值得抄，因为它正好是我担心的外观适配会不会破坏结构控制。
  detail:
    position: NeuralSRender 做仿真到实拍的视频翻译，把仿真器渲出的合成视频变写实，同时保持与源场景的几何一致。对结构条件渲染这条线，它给的是 G-buffer 当条件通道加参数高效适配的完整配方。
    io: 输入是合成或真实的驾驶视频及其 G-buffer，即几何与材质先验，输出是外观写实、几何与源场景一致的视频。摘要未给分辨率与时长。
    steps:
    - 在预训练视频 DiT 上加一个轻量 projector，把 G-buffer 的几何与材质先验注入去噪网络，并用 LoRA 做参数高效适配。
    - 第一阶段用带准确 G-buffer 的合成视频学 G-buffer 条件，建立几何信号到画面的对应。
    - 第二阶段换真实视频与估计出来的 G-buffer 适配外观，此时冻结 projector 与第一阶段 LoRA，只训新增的第二个 LoRA，以减少估计噪声对条件通路的干扰。
    - 发布 GenReal 数据集，含合成与真实驾驶视频及对应 G-buffer，并用下游感知模型在翻译后视频上的表现来验证。
    formulas: []
    train: 两阶段，先在有准确 G-buffer 的合成视频上学条件，再在真实视频上用估计 G-buffer 适配外观，第二阶段冻结 projector 与第一段 LoRA。参数增量 1.45%，24GB 显存可训。
    diff: 与一次性端到端训 G-buffer 条件的方法相比，它把学几何条件与学真实外观拆开，并在第二阶段冻结条件通路，专门对付估计 G-buffer 的噪声。与纯外观风格迁移相比，它要求与源场景几何一致。
    limits: 面向自动驾驶 sim-to-real，不是长时序世界模型，摘要未涉及记忆或 KV 预算；评价用下游感知指标 AP50 与 mIoU，不是长程一致性；底座模型与视频长度未给。
    has_abstract: true
  concepts:
  - 结构条件渲染
- id: dasa
  title: DASA
  arxiv: '2610.26262'
  date: '2026-10-19'
  precision: day
  venue: NeurIPS 2026
  lane: 位置时间寻址
  branch: ''
  parent: deep-forcing
  link_strength: 同为历史KV压缩
  training: 需训
  status: 速读
  one_liner: 只留动的，静态历史压掉
  mechanism: 按视频编解码思路把内容拆成动态区与静态区，压缩历史 KV 时只保留生成块内的动态特征，再按局部运动量做区域级算力分配，另加运动引导蒸馏补性能。
  key_numbers:
  - 2.16× 加速（VBench）
  self_measured: []
  media: []
  links:
  - https://arxiv.org/abs/2610.26262
  - https://yuanyu0.github.io/DASA/
  note: 雷达自动入库 2026-10-24，字段据摘要，待人工核。摘要只报 VBench 加速比，未给长程回访一致性指标；动态与静态的判定阈值摘要未给；底座模型与 KV 预算规模待核。
  tags:
  - 动静分离
  - KV选择性压缩
  - 稀疏注意力
  explain: 视频里大部分像素其实是不动的，但自回归生成时历史 KV 一视同仁地全存下来，算力和显存都烧在没有变化的地方。这篇借了视频编解码的思路，先把画面分成动态区和静态区，压历史的时候只留生成块里动的部分，静态的就不进记忆了，然后算的时候也按运动量给区域分配资源，动的地方多算。代价是它动了记忆的内容而不是地址，所以静态区被丢掉之后过很久再回看会不会丢细节，摘要没说，这个得自己测。
  detail:
    position: DASA 针对自回归扩散 Transformer 生成长视频时算力与显存都吃紧的问题，稠密计算把资源平均分给所有时空区域，而视频里真正在动的只有少数区域。它按运动量重排记什么和算哪里。
    io: 输入是自回归视频生成的历史 KV cache 与当前生成块，输出是压缩后的历史 KV 与稀疏计算得到的生成结果。摘要未给具体模型规模。
    steps:
    - 按视频编解码的思路，把内容显式拆成动态区与静态区。
    - 压缩历史 KV cache 时只保留生成块内的动态特征，静态部分不再进入历史，砍掉存储冗余。
    - 按局部运动量做区域级算力分配，动态区多算、静态区少算。
    - 加一个运动引导的蒸馏训练，把稀疏化带来的性能损失补回来。
    formulas: []
    train: 含一个轻量的运动引导蒸馏训练过程，主体是推理期的稀疏化与 KV 压缩。摘要未给训练数据、步数与底座模型。
    diff: 与按 token 重要度或注意力分数淘汰 KV 的做法不同，DASA 的选择信号是运动量，静态区域即使注意力分数不低也不留。与纯稀疏注意力加速相比，它同时动了历史存储与当前块算力两头。
    limits: 摘要只报 VBench 上 2.16× 加速与保持视觉保真，未给长时序回访一致性指标；静态区域被压掉后长时间回看是否丢细节未讨论；动态判据与阈值细节未给。
    has_abstract: true
  concepts:
  - KV压缩或淘汰
  - 流式分块推理
