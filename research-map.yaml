    formulas: []
    has_abstract: true
    io: 输入是长单目视频帧与可选内参，输出是逐帧相机位姿与稠密几何。
    limits: 只报轨迹误差排序与速度显存，未给绝对 ATE 数值；摘要只覆盖三个驾驶与室内协议。
    position: 长单目视频的流式重建要在效率与精度之间取舍，扩大优化窗口或重训对应网络都太贵。
    steps:
    - 用单目度量深度初始化 patch 深度。
    - 优化时把度量深度当软约束，不扩大优化窗口。
    - 用适配器把冻结 DINOv3 表征并入匹配特征与循环上下文。
    - 位姿与深度合成稠密重建。
    train: 需训，对应估计器与适配器在多样短片段上训练，不做长序列训练；深度提供方冻结。
  explain: 这条是 proxy 那一层的地基活。MetricTrail 是 NVIDIA 的流式系统，从长单目视频里估相机运动并做稠密重建。它的做法很省，不重训对应网络，也不把优化窗口开大，而是把单目度量深度塞进 DPVO 的稀疏局部估计器，深度先用来初始化 patch 深度，优化时当软约束挂着。第二个改动是加学习到的适配器，把冻结的 DINOv3 表征并进匹配特征和循环上下文，只在短片段上训，不专门训长序列。模块化的好处是深度提供方能单独换，给了内参或标定立体还能直接用。KITTI、Oxford Spires、VBR 三个协议上平均轨迹误差最低，配单目深度出的稠密重建也稳。KITTI-02 给内参下 12.70 FPS，峰值显存 3.21 GB，这两个数对我的 4090 很关键，说明这条 proxy 路线在单卡上跑得动。它跟我关心的记忆问题隔了一层，但 proxy 的位姿一旦漂，后面的结构条件就全错，所以这条要盯着。
