  training: 需训
  status: 速读
  one_liner: 带 retriever 的几何记忆，走外部库
  mechanism: 报告只在矩阵里标它用 retriever 从外部库取历史，与几何寻址配套，未述细节。
  key_numbers:
  - 0.0013（MEt3R 改善）
  self_measured: []
  media: []
  links:
  - https://arxiv.org/abs/2511.22815
  - https://johnson111788.github.io/open-safari/
  note: CVPR 2026；项目页 open-safari；用位姿对齐的 world token 检索做长程 3D 一致
  tags:
  - retriever检索
  - 几何配套
  explain: 就像出远门不把所有行李全背身上，而是把大件存进储物柜，用时按小票去取。Captain Safari 解决的就是智能体历史记忆负担过重、难以兼顾全局的麻烦。它给几何记忆配了一个检索器，也就是一个根据线索从外部资料库调取历史的提取工具。这个工具与几何寻址——即按照空间几何位置定位记忆的方式——相互配套。它管用在把历史经验外包给外部库，既轻量又能精准召回，使
    MEt3R 指标改善了 0.0013。原报告只在矩阵中标注了该设计，具体实现细节并未展开。
  detail:
    position: Captain Safari 面向给定相机轨迹生成长时程、具备 3D 一致性且可交互探索的视频，重点应对激进 6-DoF 运动和复杂户外场景下的几何失稳与轨迹偏离。论文还构建
      OpenSafari，用于评测高动态无人机视频中的相机控制生成。
    io: 输入是用户控制的相机轨迹，方法还使用持久化世界记忆中的信息作为条件信号。输出是沿目标轨迹生成的视频。
    steps:
    - 维护动态局部世界记忆，以保留生成过程中可供后续访问的场景信息，从而支持长程几何一致性。
    - 根据当前相机位姿从世界记忆中检索位姿对齐的 world tokens，以取得与当前观察位置相关的信息。
    - 将检索到的 tokens 用于条件化视频生成，使生成内容与相机轨迹及已有场景结构相协调。
    - 沿给定轨迹持续执行检索与生成，以支持具有挑战性的相机运动并减少轨迹偏离。
    formulas:
    - tex: q_t=f_{\mathrm{pose}}(\xi_t),\qquad \alpha_{t,i}=\operatorname{softmax}_i\!\left(\frac{q_t^{\top}k_i}{\sqrt{d}}\right),\qquad
        r_t=\sum_{i\in\mathcal{M}_t}\alpha_{t,i}v_i
      caption: 标准写法，非原文：根据当前相机位姿对动态世界记忆中的 world tokens 进行检索并加权聚合。
    - tex: \hat{x}_{t+1}=G(x_t,\xi_t,r_t),\qquad \mathcal{M}_{t+1}=\operatorname{Update}\!\left(\mathcal{M}_t,\hat{x}_{t+1},\xi_t\right)
      caption: 标准写法，非原文：利用检索到的位姿对齐记忆条件化视频生成，并将新生成的场景信息递归写回动态局部世界记忆。
    train: 摘要未给出训练流程、模型训练设置或优化细节。推理时根据相机轨迹维护动态局部记忆，检索位姿对齐的 world tokens，并以其条件化视频生成。
    diff: 与缺少持久场景记忆或难以执行激进相机运动的相机控制生成方法相比，Captain Safari 使用 retriever 从持久化世界记忆中检索位姿对齐的
      tokens，再用于条件化生成。摘要报告其在视频质量、3D 一致性和轨迹跟随方面优于相机控制基线。
    limits: 未见明确说明
    has_abstract: true
  citations: 0
  cpm: 0.0
  repro: paper_only
  inherited: 0
  inherited_by: []
  inherited_chain: 0
