  - 潜在记忆库
- id: mosaichunk
  title: MosaiChunk
  date: '2026-10-01'
  precision: month
  arxiv: '2610.02153'
  venue: ''
  lane: 内容学习寻址
  branch: 学习路由
  parent: longlive-rag
  link_strength: dotted
  training: 免训
  status: 精读
  one_liner: 学习路由器挑时空块 KV 拼成马赛克上下文
  mechanism: 历史切成时空小块各留 KV，生成时由轻量路由器判断需要哪几块并拼接；推理主干完全冻结。
  key_numbers: []
  self_measured: []
  media: []
  links:
  - https://arxiv.org/abs/2610.02153
  note: training=免训指主干冻结、仅训路由器；矩阵将其放在『几何/位姿』行并标『学习路由』，寻址实际由学习路由器决定，lane 存疑；自带 RememBench
    未单列；只给到月份 2026-10。
  tags:
  - 时空块KV
  - 学习路由器
  explain: 就像看监控抓小偷，我们不用把几十个小时的录像全倒进脑子，只要挑出关键的几个画面拼在一起看。这篇论文解决的具体麻烦，正是大模型处理长视频时，保留所有历史会让显存直接撑爆。它用的招数是把历史切成许多时空小块，各自保留KV，也就是模型算好的记忆缓存；生成回答时，由一个轻量路由器，即专门负责筛选的小网络，判断需要哪几块并拼成马赛克上下文。这招管用在于推理主干完全冻结，既不用重新训练也不破坏原有能力，只把最核心的信息精准拼接起来，大幅减轻了显存负担。
  detail:
    position: MosaiChunk 解决长时程自回归视频生成中，历史内容超出有限上下文后，物体或场景再次出现时细节难以保持的问题。它通过检索历史视觉信息提升重访内容的一致性。
    io: 输入包括当前生成所需的文本提示或相机条件，以及历史时空块保存的 KV；输出是延续生成的视频。生成器利用路由器选出的历史 KV，且推理时生成器保持冻结。
    steps:
    - 将历史视频划分为空间与时间上的小块并保存各块的 KV，以便后续访问细粒度历史视觉信息。
    - 轻量路由器根据当前生成需求，从历史块中选择要保留的 KV，并遵守固定的活动记忆预算，以控制可用上下文规模。
    - 将选中的非连续历史 KV 拼接成时空马赛克上下文，并与当前生成条件一起输入冻结的视频生成器，以延续视频并恢复相关细节。
    formulas:
    - tex: \mathcal{S}_t=\operatorname{TopK}_{\mathcal{I}\subseteq\{1,\ldots,N\},\,\sum_{i\in\mathcal{I}}c_i\le
        B}\sum_{i\in\mathcal{I}}s(q_t,h_i)
      caption: 在固定活动记忆预算下选择历史块；标准写法，非原文
    - tex: (K_t^{\mathrm{mos}},V_t^{\mathrm{mos}})=\operatorname{Concat}_{i\in\mathcal{S}_t}(K_i,V_i)
      caption: 将选中的历史块 KV 拼接为时空马赛克上下文；标准写法，非原文
    train: 训练时保持视频生成器冻结，仅学习轻量路由器来决定固定活动记忆预算下纳入马赛克的历史区块。推理时选择历史 KV 并拼接后交给冻结生成器；具体训练目标、优化细节及预算数值摘要未给。
    diff: 不同于滑动窗口只保留近期上下文，也不同于整块检索，MosaiChunk 可从不连续的历史时空区块中选择 KV 并组合成马赛克。它不微调生成器，而是学习轻量路由器，并在匹配记忆预算下评估重访一致性。
    limits: 需要保存历史区块的 KV，并进行路由选择与拼接；其具体存储和计算代价、路由器局限及其他限制未见明确说明。
    has_abstract: true
