  one_liner: 恒定上下文按帧重要性打包，越旧压得越狠
  mechanism: 喂给模型的上下文体积恒定，历史按帧重要性打包压缩；另配反漂移采样抑制误差累积。
  key_numbers:
  - 13B
  - 6GB 显存
  self_measured: []
  media: []
  links:
  - https://arxiv.org/abs/2504.12626
  note: 报告只给到月份 2025-04；lane 依矩阵『重要性打包』归内容/学习，报告未述具体检索键。
  tags:
  - 重要性打包
  - 反漂移采样
  explain: 长视频生成就像用一本页数固定的笔记本去记长途旅行，画面越堆越多，显存随时会爆。这篇论文解决的就是长视频生成中历史帧越积越多、显存吃不消的麻烦。它的做法是把上下文，也就是模型每次能参考的历史信息总量锁死，按照重要性把旧帧打包压缩，时间越久远压得越狠；同时搭配反漂移采样，即一种抑制误差累积、防止画面越来越变形的纠偏方法。这招管用是因为远景历史只要保留粗略轮廓就能稳住连贯性，省下算力留给近处细节，最终实现了把
    13B 模型塞进 6GB 显存里流畅运行。
  detail:
    position: FramePack 针对视频生成中固定上下文长度限制了可利用历史帧数，以及长序列预测容易累积误差的问题。它按帧重要性压缩历史上下文，并配合反漂移方法支持更长的视频生成。
    io: 输入是历史视频帧及其重要性排序，输出是下一帧或下一段视频。上下文作为条件信号；摘要提到的帧重要性依据包括时间接近性、特征相似度或混合指标。
    steps:
    - 计算历史帧的重要性，以确定哪些帧应保留较长上下文。
    - 在恒定上下文长度内按重要性打包历史帧，让重要帧占用较长上下文、较不重要的帧压缩得更多，从而容纳更多历史信息。
    - 将打包后的上下文输入 next-frame 或 next-frame-section 预测模型，生成后续视频内容。
    - 通过预先确立端点、调整采样顺序和离散历史表示等反漂移方法，抑制观察偏差导致的误差累积。
    formulas:
    - tex: \sum_{i=1}^{T} b_i=B,\qquad b_i=B\frac{s_i}{\sum_{j=1}^{T}s_j}
      caption: 标准写法，非原文：在固定上下文预算 B 下，按帧重要性分配各历史帧的 token 预算 b_i。
    - tex: \tilde{z}_{1:T}=\operatorname{Concat}_{i=1}^{T}\!\left(\mathcal{C}_{b_i}(z_i)\right)
      caption: 标准写法，非原文：将每帧历史表示 z_i 压缩到分配的预算 b_i，再拼接为固定长度上下文。
    train: 摘要称可用 FramePack 微调已有视频 diffusion 模型，并通过消融实验验证反漂移方法在单向视频流式生成和双向视频生成中的效果。训练与推理可利用更大的批量或数千帧上下文；具体训练配置和推理参数摘要未给。
    diff: 与不区分帧重要性地处理历史上下文的做法不同，FramePack 在固定上下文长度内按重要性分配压缩程度。它还加入多种反漂移方法，以缓解长序列生成中的误差累积。
    limits: 未见明确说明
    has_abstract: true
