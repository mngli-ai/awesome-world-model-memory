  link_strength: 都把规则执行与画面渲染拆开，它把引擎结算的结果编译成时空对齐的交互 proxy 当条件，而不是把事件写成文本指令喂给渲染器
  training: 需训
  status: 速读
  one_liner: 引擎结算规则，编译成 proxy 再渲染
  mechanism: 可执行引擎维护战斗状态并结算交互，确定性编译器把结算结果与玩家已发动作编码成时空对齐的交互 proxy，按拳手身份对齐出招窗口、受击窗口与持久血量，几条线索可分别控制；渲染器在 FightWorld Corpus 上训练，改规则时只换引擎输出不重训渲染器，身份绑定参考保角色外观在换边后不变。
  key_numbers:
  - 52 种技能效果
  - 187 种外观变体
  - 15 个场景
  self_measured: []
  media:
  - https://fight-world-model.github.io/media/hero.mp4
  links:
  - https://arxiv.org/abs/2610.40607
  - https://fight-world-model.github.io
  note: 雷达自动入库 2026-11-01，字段据摘要，待人工核。四项对比只给了超越既有游戏世界模型的定性结论，具体分数、基线名单与评测协议待核。proxy 用的是什么坐标系、是否显式三维，摘要没写。改规则后渲染器的退化幅度未给。项目页 hero 视频已校验 200 且 Content-Type 为 video/mp4，1.6MB。
  tags:
  - 引擎结算
  - 交互代理
  - 身份绑定
  explain: 这篇几乎是我这条 line 的同构实现，所以值得逐条对。它不问模型记不记得住战斗，直接让一个可执行引擎管状态与规则，谁打中谁、掉多少血、技能在哪个窗口生效，全在引擎里算清楚。算完之后不写提示词，而是由确定性编译器把这些结果编成一张与画面在空间和时间上都对齐的 proxy，出招窗口、受击窗口、血量条按拳手身份排好，然后渲染器只看这张 proxy 出画面。这个接口设计解决了我一直在想的问题，代码层算出来的东西怎么无损地变成渲染条件。文本提示词会丢精度，一张 RGB 预览片会引入重建误差，它选的是结构化的对齐张量。第二件值得抄的是改规则不重训，绕过渲染器只改引擎与编译器的输出，就能支持伤害缩放、限次免疫、吸血、多段技能，这说明渲染器学到的是把 proxy 映射成画面，而不是记住某套规则。第三条是身份绑定，换边之后角色外观不变，这对应我关心的回访一致性里最弱的一环，同一个实体在画面上的身份能不能跨视角锁住。缺点也明确，只有定性对比，proxy 的坐标定义没写，语料限于格斗体裁。
  detail:
    position: 可玩可编程的游戏世界要维持持久状态、执行规则、支持扩展机制。现有视频世界模型能生成像样的战斗，却对不上受击反应与血量更新，因为它把规则结算和画面生成混在同一个网络里。
    io: 输入是玩家动作与当前战斗状态，输出是按规则结算后的交互 proxy 与对应战斗视频，proxy 里的动作窗口、受击窗口与血量按拳手身份和时间对齐。
    steps:
    - 由可执行引擎维护战斗状态，解析玩家动作并按规则结算命中、伤害与技能效果。
    - 确定性编译器把结算结果与已发动作编码成时空对齐的交互代理，按拳手身份排布出招窗口、受击窗口与持久血量。
    - 把交互代理当条件喂给视频渲染器，各条线索可分别调节，以支持改规则后的表现。
    - 用身份绑定参考保持角色外观在换边与多段技能下不变。
    - 在 FightWorld Corpus 上训练渲染器，改规则时只换引擎输出，不重训渲染器。
    formulas: []
    train: 渲染器在 FightWorld Corpus 上训练，语料含 52 种技能效果、187 种外观变体与 15 个场景。推理期引擎与编译器是确定性的，换规则只改这两段，渲染器冻结。具体训练目标、步数与底座摘要未给。
    diff: 与端到端游戏世界模型相比，它把规则结算交给可执行引擎，不指望网络自己学会血量与受击；与用文本提示词驱动渲染的导演式做法相比，它的条件是时空对齐的交互代理而非自然语言，精度不丢在提示词里。
    limits: 只有定性对比，没有分数与基线名单。交互代理的坐标系与维度未写。跨体裁迁移未测，语料限于格斗。改规则后渲染质量的退化幅度未给。
    has_abstract: true
  concepts:
  - 代码定状态
  - 结构条件渲染
  - 动作条件控制
