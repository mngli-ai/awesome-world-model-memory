  date: '2026-11-08'
  detail:
    concepts:
    - 代码定状态
    - 结构条件渲染
    - 位姿对齐检索
    diff: 与模型内部想象的路线相比，它把变换交给引擎，正确性从模型能力变成计算；与只给静态几何表示的增强相比，它的状态可执行、可改参数、可渲染。
    formulas: []
    has_abstract: true
    io: 输入问题与单视角或多视角观测，输出答案；中间产物是写到同一坐标系的可执行世界状态与引擎渲染的视图。
    limits: 只做问答，没有生成与长程外推；状态由单次估计后固定，动态场景未处理；主要增益来自位姿可靠性，位姿估计错了整体会崩。
    position: 视觉语言模型做空间推理时，先在内部把局部视角拼成一个隐式场景，再靠想象做视角变换，读错场景就直接答错，读对了也不保证变换满足空间约束。
    steps:
    - 从问题里抽场景约束，与专门的视觉估计合成到同一坐标系。
    - 把物体与相机状态实例化进物理引擎，形成可执行世界状态。
    - 由推理器执行视角变换，取引擎算出的测量值与渲染视图。
    - 在 MindCube、SAT、MMSI-Bench、SpatialRGPT-Bench 上比开闭源模型。
    train: 免训，VLM 权重不改，只在推理期外挂状态构造与引擎执行。
  explain: 这条跟我想要的东西在结构上最像。它不靠模型在内部想象视角变化，而是把场景写成一份可执行的世界状态，物体与相机都放在同一坐标系里，然后丢进物理引擎跑，视角变换由引擎执行，回答时用的是引擎算出来的测量值和渲染出来的视图。数字很硬，MindCube 上 Qwen3.5-27B 从 52.70 涨到 71.14，给同一组标注位姿时到 98.25，模型内部推理只有 71.81。也就是说，一旦状态是显式可执行的，空间正确性就不再依赖模型能力。它做的是问答不是生成，渲染器是物理引擎的光栅化而不是视频模型，但这正是我那条 code 到 proxy 到 video 链路的中间段，它证明了 proxy 这一段可以完全确定。
  id: spatial-harness
  key_numbers:
  - MindCube 上 Qwen3.5-27B 从 52.70% 到 71.14%
  - 比 pySpatial 高 7.52 分
