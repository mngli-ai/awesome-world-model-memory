  tags:
  - 实体挂载
  - 记忆位置重写
  explain: 就像看长篇小说时随手夹的书签被风吹乱，导致翻到后面完全搞不清前因后果一样，模型在处理长上下文时很容易遗忘前面的内容，还会把先后次序搞混。这篇工作解决的就是上下文丢失和位置混乱的麻烦。它采用组内经典的记忆加位置重写路线，所谓位置重写，通俗讲就是给保留下来的历史记忆重新编排准确的顺序编号。这招之所以管用，是因为它一边把过去的信息妥善留存，一边理顺了它们与当前输入的相对位置，让模型既看得见旧记忆，又不会被错乱的顺序带偏。
  detail:
    position: Echo-Forcing 面向交互式长视频生成，解决提示词切换时旧场景污染新场景、响应延迟，以及历史场景难以召回的问题。它将历史 KV
      状态按功能拆分，并支持在有限缓存预算下处理场景切换与回忆。
    io: 输入为视频生成提示词及生成过程中积累的历史 KV 状态，提示词可发生切换；输出为支持平滑过渡、硬切和长程场景召回的长视频。
    steps:
    - 将历史 KV 状态划分为稳定锚点、压缩历史和近期窗口，并在 relative RoPE 下管理它们，以区分长期场景信息与近期动态。
    - 把历史场景压缩为具有空间结构的 Scene Recall Frames，并表示为 KV，以便后续提示词需要时召回旧场景。
    - 根据新旧场景的差异自适应衰减冲突 token，以减少过时背景对新提示词的干扰。
    - 在有界缓存预算下组合稳定锚点、压缩历史、近期窗口与召回信息，生成视频并支持不同类型的场景切换。
    formulas:
    - tex: \operatorname{Attn}(Q,K,V)=\operatorname{softmax}\!\left(\frac{(R(p_Q)Q)(R(p_K)K)^\top}{\sqrt{d}}\right)V,\qquad
        (K,V)=\operatorname{Concat}\bigl((K,V)_{\mathrm{anchor}},(K,V)_{\mathrm{compressed}},(K,V)_{\mathrm{recent}},(K,V)_{\mathrm{recall}}\bigr)
      caption: 标准写法，非原文：对不同功能的历史 KV 记忆拼接，并在注意力中施加 RoPE 位置编码。
    train: 方法为 training-free，无需训练；推理时通过分层管理历史 KV、构造 Scene Recall Frames，并依据场景差异衰减冲突
      token。摘要未给出具体推理参数或实现设置。
    diff: 既有 training-free 长视频优化主要针对单一提示词下的稳定延展，并用同一缓存策略处理稳定锚点和近期动态。Echo-Forcing 将历史记忆分层、支持空间结构化的场景召回，并依据新旧场景差异调整遗忘。
    limits: 未见明确说明
    has_abstract: true
