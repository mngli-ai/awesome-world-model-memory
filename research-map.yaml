- id: state-world-models
  title: 'State World Models: Execute the Rules, Generate the Pixels'
  date: '2026-10-19'
  lane: 框架层
  branch: 符号状态
  training: 免训
  status: 速读
  one_liner: 状态机执行规则，视频模型只管渲染
  mechanism: 玩家动作先被编译成事件写入隐藏状态机，再由可编辑3D场景的预览片提供空间与相机引导，冻结的视频模型只负责渲染；配WorldState-Bench的50对反事实孪生。
  tags:
  - 状态机外置
  - 反事实孪生
  - 规则遵循
  key_numbers:
  - 32%→64%→92%
  - 50对孪生
  - 11个视频后端
  media: []
  links:
  - https://arxiv.org/abs/2610.26811
  note: 同一冻结 MiniMax-H3 只靠 harness 把"该结局命中率"从32%提到92%，是"规则-渲染分离"最硬的因果证据；harness 本身免训。
  arxiv: '2610.26811'
  explain: 想象玩家推开一扇门，门后本该是走廊，视频却可能把它变成窗外，还让角色忽然瞬移。视频世界模型的麻烦正在于：画面好看，却常记不住规则和状态。论文把玩家动作先编译成事件，写进隐藏状态机——一种记录世界当前状态并按规则更新的系统；再用可编辑三维场景的预览片提示空间布局和镜头，最后让冻结的视频模型只负责生成画面。规则由状态机掌管，模型便不必一边猜逻辑、一边画像素，因此更稳定。作者用含50对反事实孪生场景的WorldState-Bench检验：孪生场景只改一个条件，用来查模型是否按规则改变结果。报告数字从32%升至64%、再到92%，方案也接入11个视频后端，显示这套分工并不依赖单一模型。
  detail:
    position: 这篇工作解决视频模型在当前画面看不到隐藏状态时，难以持续遵守规则并生成正确动作结果的问题。它将世界状态演化与视频渲染分开，让状态机执行规则，视频模型负责呈现结果。
    io: 输入包括用户动作、当前隐藏世界状态及规则，以及可编辑 3D 场景提供的预览片段。输出是符合规则的事件状态和对应生成视频，并将生成片段用于更新下一轮世界状态。
    steps:
    - 接收玩家动作并结合当前状态与规则解析动作，因为动作结果可能取决于画面中不可见的信息。
    - 将动作编译为事件并写入隐藏状态机，以显式执行规则并得到演化后的世界状态。
    - 从可编辑 3D 场景生成预览片段，提供空间布局与相机运动引导，约束视频生成的呈现。
    - 把事件编译成指令交给冻结的视频模型渲染，使视频模型专注生成画面而非推断规则。
    - 利用生成片段更新下一轮世界状态，以支持后续连续交互。
    formulas: []
    train: 摘要未给训练流程。推理时，Stateful Harness 根据用户动作和隐藏状态执行规则，将结果事件编译为指令，并结合可编辑 3D 场景的预览片段引导冻结的视频模型渲染；生成片段随后用于更新世界状态。评测使用包含
      50 对反事实孪生的 WorldState-Bench；摘要报告规则提示下最佳视频后端的成对正确率为 32%，MiniMax-H3 在指定结局后为 64%，完整
      harness 使用同一冻结模型达到 92%。
    diff: 已有方法通常让视频模型从单张图像生成动作条件视频，侧重场景导航，但未必能处理依赖隐藏状态的规则。本文将规则执行与像素渲染拆开，由状态机决定事件结果，再由冻结视频模型生成画面。
    limits: 未见明确说明
    has_abstract: true
