  venue: ''
  lane: 几何位姿寻址
  branch: 容量管理
  parent: decmem
  link_strength: 都撞在容量墙上：decmem 用稀疏全局加锚定局部压着存，它不压，把 int4 KV 分三级摆到 NVMe 并按位姿预取
  training: 推理期技巧
  status: 速读
  one_liner: int4 KV 分三级存，按位姿预取不停顿
  mechanism: 因果世界模型把过去分块的 KV 留着当检索记忆，单卡上先撞容量墙：Matrix-Game 2.0 的 KV 在 bf16 下 45 秒耗尽 32 GiB 主机内存，int4 下 2.8
    分钟耗尽，模型自身位置外推上限只有 4.3 分钟。作者论证这份记忆是容量受限而不是带宽受限，并且访问集在算之前就已知，因为相机位姿是输入。据此把 int4 KV 放进 GPU/DRAM/NVMe 三层而不是重算，每块按外推位姿提前取，miss
    不阻塞，回写放后台，再配训练无关的位置处理。
