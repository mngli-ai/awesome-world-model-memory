  date: '2026-11-05'
  detail:
    diff: 与 State World Models 同为状态渲染分离，区别在状态载体是可查询的三维占用与实体状态而不是事件状态机加可编辑场景，且明确禁止生成图像回流状态。
    formulas: []
    has_abstract: true
    io: 输入是玩家动作与上一帧状态，输出是更新后的持久世界记忆与渲染出的第一人称画面。
    limits: 只在 Doom 一个测试台上验证，几何与实体类型受游戏资产限制；160 毫秒是 M4 Pro 后端延迟，未给分辨率与模型规模；真实场景泛化未知。
    position: 用生成帧当唯一循环表示，会把空间一致性与交互性绑死在视角相关的外观合成上，长程的空间与时间一致性都不稳。
    steps:
    - 世界状态模型在固定大小局部区域内预测动作条件下的实体动力学。
    - 同一次前向里做几何补全与实体发现。
    - 增量写回持久世界记忆，占用栅格加按身份编号的 3D 状态。
    - 神经渲染器按深度与语义投影渲染当前视角，不回灌生成图像。
    train: 需训，世界状态模型与神经渲染器分别训练；摘要未给数据规模与训练步数。
  explain: 这篇是我这条路线上最直接的对照实现，因为它把状态用什么载体和渲染怎么做彻底分开，载体还是可查询的三维结构而不是代码。PlayGen2 的持久记忆有两层，静态几何用体积占用栅格存，动态实体用带身份编号的 3D 状态存，世界状态模型只在玩家周围一个固定大小的局部区域里算，同时学三件事，动作条件下实体怎么动、没看见的几何怎么补、新实体什么时候出现，算完把增量写回记忆。渲染走另一条路，把状态投影成深度图和语义图，神经渲染器照这两张图出第一人称画面。关键是它明确不让生成的画面回灌到状态预测，这一点跟我 proxy 那层要守的边界完全一致，一旦回灌外观误差就会污染状态。延迟 160 毫秒，M4 Pro 单机，交互类里算能玩的水平。它还演示了未见地图零样本、多人靠组合单人模型、以及用规则直接改状态做可编程玩法，最后一条说明状态是显式可读写的，代码介入有落点。
  id: playgen2
  key_numbers:
  - 160 ms 端到端延迟
  - M4 Pro 单机
  lane: 框架层
  link_strength: 与 State World Models 都把状态和渲染拆开，State World Models 用可编辑场景加事件状态机，它用体积占用栅格加按实体编号的 3D 状态并由世界状态模型自己演化
  links:
  - https://arxiv.org/abs/2611.07867
  - https://github.com/MajorDavidZhang/PlayGen-2
  mechanism: 持久世界记忆由体积占用栅格（静态几何）与按实体编号的 3D 状态（玩家与其他实体）组成，世界状态模型在固定大小局部区域内联合学习动作条件实体动力学、几何补全与实体发现并把更新写回记忆，神经渲染器只按深度与语义投影出第一人称画面，生成图像不回灌状态预测。
  media: []
