    position: 长程自回归解码里可见过去通常由固定近端窗口、压缩缓存或外部记忆隐式决定，选错了就丢全局状态或反复看重样的内容。
    steps:
    - 用解码器内部表示给每个候选历史单元打分，衡量与全局 rollout 状态的一致性。
    - 对近端续写加冗余惩罚，同时约束时间边界覆盖与空间布局多样性。
    - 按综合分数挑出一组单元，组成当前步的可见上下文。
    - 把选中的单元映射到一条紧凑的因果轴上，再解码下一块。
    - 在多个长程文生视频基准与多个自回归骨干上，于相同可见 token 预算下对比。
    train: 免训，不改任何权重，只在推理期替换可见上下文的构造方式。
  explain: 这篇问的问题很直接：自回归解码时到底给模型看哪几段过去，能不能当成一个可以现场判断的决定。现在的做法要么固定近端窗口，要么压成缓存，要么挂个外部记忆库，选谁看谁都是流水线里写死的。ReCR 把它翻出来，用解码器自己的内部表示给候选片段打分，偏好四种性质：跟整个 rollout 的全局状态对得上、别跟刚生成的尾巴重复、时间上要覆盖到边界、空间布局尽量不重样。挑完再把这些片段排到一条紧凑的因果轴上，然后解下一块。全程不改权重。对我那六块窗口来说，它换掉的正是窗口里放哪六块这件事，而四步 LoRA 那套完全不用动。
