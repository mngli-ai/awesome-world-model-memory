    steps:
    - 把视角、角色动作、相机三类控制各自编码成显式 token，与视频 token 拼在同一条序列上。
    - 这些控制 token 与视频 token 共享同一个 self-attention，不再走独立的条件注入通路。
    - 时间维度用 IT-RoPE，把累计的控制切换量写进时间注意力的旋转，跨执行区间的连续性交给位置编码。
    - 文本交互走 chunk 级 cross-attention，每个视频块只看共享环境提示与自己的局部提示，未来指令不泄漏给当前块。
