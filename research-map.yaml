- id: mist
  title: 'Execution Before Memory: Diagnosing Memory Failures in Video World Models
    (MIST)'
  date: '2026-10-16'
  lane: 评测基准
  branch: ''
  training: 不适用
  status: 速读
  one_liner: 把"没执行改变"与"忘了"分开诊断
  mechanism: 先让模型在改变被隐藏时布景，之后再要求显形，并卡住提前泄漏；这样低分能定位成"没执行指令"而非"遗忘"，再用M3-Agent递归改写指令做对照实验。
  tags:
  - 执行与记忆解耦
  - 泄漏控制
  - 诊断型基准
  key_numbers:
  - MIST显形分×3以上
  - WRBench T +26.1%
  - MBench-T U +52.7%
  media: []
  links:
  - https://arxiv.org/abs/2610.23542
  note: 它同时提出基准与 M3-Agent 方法，引用时要分开；最大贡献是指出很多"记忆差"其实是"指令没执行"，旧基准的单一分数会误诊。
  arxiv: '2610.23542'
  explain: 想象让模型拍一段房间视频：先把红球换成蓝球，最后再让蓝球出现。若结果里没有蓝球，模型可能是忘了，也可能压根没照做；只看成片，难以分清。MIST是一套诊断测试：先要求模型布置场景，却暂时隐藏改变，之后再要求它让改变显形，并阻止它提前露出变化。这样，失败就能更明确地归因于没执行指令，而非遗忘。研究还用M3-Agent——会递归改写指令的智能体——做对照，检验模型是否真能完成改变。结果显示，MIST显形分数提升三倍以上，WRBench
    T提升26.1%，MBench-T U提升52.7%。
  detail:
    position: MIST 旨在区分视频世界模型的记忆失败与指令执行失败，因为模型没有执行场景变化时，后续状态中就没有可供记忆的变化。它通过分离场景设置、变化执行和结果显形来定位瓶颈，并提出
      M3-Agent 改善指令执行。
    io: 输入是要求模型生成视频场景及其后续变化的指令，变化在初始布景阶段保持隐藏，并在之后要求模型显形。输出是对变化是否执行以及最后一帧是否呈现结果的评估；过程中控制提前泄漏，作为条件约束。
    steps:
    - 先让模型根据指令设置场景，同时隐藏待执行的变化，以便建立变化发生前的场景状态。
    - 控制变化信息在显形阶段前不泄漏，以免模型提前表现出变化、混淆对记忆能力的判断。
    - 之后要求模型执行并显现变化，检查它是否实际完成了指令要求的状态转移。
    - 分别评估变化执行与最后一帧结果，避免把未执行变化造成的低分误判为遗忘。
    - 使用 M3-Agent 递归改写输入指令，观察改写后模型能否执行变化，从执行侧提供对照。
    formulas: []
    train: 摘要未给出模型训练流程或 M3-Agent 的具体递归改写算法。推理评估按先布景、后要求显形的顺序进行，并控制提前泄漏；M3-Agent 通过递归修改指令细节来促使模型执行请求的变化。
    diff: 已有测试常将场景设置、变化执行和末帧结果合并为一个分数，难以判断低分是否来自遗忘。MIST 将变化执行与其应留下的记忆分开诊断，并用 M3-Agent
      检验改进指令表述后模型能否完成变化。
    limits: 摘要未见明确说明评估成本、适用范围或 M3-Agent 递归改写的具体限制。
    has_abstract: true
