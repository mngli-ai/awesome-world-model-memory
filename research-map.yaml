    RoPE 说明它仍需位置侧兜底。
  arxiv: '2610.03510'
  explain: 想象你在拍一段可互动的长镜头：同一只猫穿过厨房、花园和雨夜街道，观众随时改一句提示词，猫不能变脸，场景也不能串台。长视频生成的麻烦正是如此：模型要从很长的历史记忆里同时维持角色和背景，容易拿错信息，导致主体漂移、环境混乱或画质下降。Weave
    Forcing先让大语言模型（LLM，负责理解文字的模型）把提示词拆成“角色、背景”等语义槽，再为每个槽选择对应参考记忆。接着用对比注意力图定位真正相关的记忆区域，生成掩码，把无关的键值（KV，即注意力读取的记忆内容）挡住，只编织需要的信息；自适应旋转位置编码（RoPE，让模型感知时空位置）再随镜头变化调整位置关系。这样不同内容各走各的记忆通道，减少互相污染，既保持跨镜头的角色与环境连续性，也不牺牲画质。
  detail:
    position: Weave Forcing 解决交互式长视频生成中跨镜头复用角色与背景记忆的问题，尤其针对新镜头需要组合不同历史镜头元素的情况。它旨在避免整段提示词检索遗漏组件需求，以及混合全部历史记忆引入无关内容。
    io: 输入是当前用户提示词与历史镜头压缩后的 KV 记忆，输出是具有跨镜头角色和背景一致性的当前视频镜头。条件信号包括 LLM 提取的角色与背景语义槽、为各槽选出的历史参考、语义掩码，以及参考覆盖程度。
    steps:
    - 用 LLM 将当前提示词拆成角色和背景语义槽，并分别选择匹配的历史参考，以满足不同组件各自的记忆需求。
    - 根据语义槽构造对比注意力图并生成精细语义掩码，以定位历史记忆中与当前组件相关的内容。
    - 通过 masked memory weaving 从压缩历史 KV 记忆中选择性开放相关 token，以引导当前镜头生成并抑制无关视觉内容。
    - 根据参考对当前内容的覆盖程度调整 temporal offsets 和记忆保留，以减轻不完整参考靠近当前生成时产生的视觉伪影。
    formulas:
    - tex: \mathbf{Y}=\operatorname{softmax}\!\left(\frac{\mathbf{Q}\mathbf{K}_{\mathrm{mem}}^{\top}}{\sqrt{d}}+\log(\mathbf{M}+\varepsilon)\right)\mathbf{V}_{\mathrm{mem}},\qquad
        \mathbf{M}=\mathbb{1}\!\left[\mathbf{A}_{\mathrm{cmp}}\geq\tau\right]
      caption: 标准写法，非原文：基于语义槽对比注意力图构造掩码，并对压缩历史 KV 进行 masked memory weaving，只聚合与当前角色或背景组件相关的记忆
        token。
    - tex: \widetilde{\mathbf{K}}_{t}=\operatorname{RoPE}\!\left(\mathbf{K}_{t},\,t+\Delta_{t}\right),\qquad
        \Delta_{t}=\Delta_{\max}(1-c_{t}),\qquad g_{t}=\sigma\!\left(\alpha(c_{t}-\tau_{c})\right)
      caption: 标准写法，非原文：根据历史参考对当前内容的覆盖度 c_t 自适应调整 temporal offset，并通过门控 g_t 调节记忆保留强度。
    train: 该框架为 training-free。推理时依次进行语义槽路由、历史参考选择、掩码记忆编织和 coverage adaptive RoPE 调整，再生成当前镜头；具体模型设置与参数摘要未给。
    diff: 不同于整段提示词检索，Weave Forcing 按角色和背景语义槽分别选择历史参考。它还通过掩码选择性访问压缩 KV 记忆，并按参考覆盖程度调整
      RoPE 与记忆保留，而不是直接合并全部历史记忆。
    limits: 未见明确说明
    has_abstract: true
