  explain: 这篇把「固定大小状态该花多少位宽」变成了两个可分开的决定。第一步是给每个头单独定位宽，判据不是量化误差本身，而是量化残差对后面预测损失的梯度敏感度，同样大小的残差，落在敏感的头上升失更大，所以预算该往那里倾。第二步更贴我这边的麻烦，它承认近期写进来的东西和压了很久的历史不是一回事，于是把窗口内的写先留成 FP8 的纯写入，让它完整走一遍状态转移，等它离开窗口才并进低位的历史状态。这等于把「近期窗口」和「长期状态」当成两块存储，各自用不同精度，合并只发生在窗口退出那一刻。我现在的 6 块窗口是硬砍，出窗即丢，它给的是出窗即降精度并入，路径不同但代价可控，而且它报了一个我没想过的现象，单纯把累积状态提位宽不如把容量拿去维护近期写，前者分数更低、输出还更长。短板是纯语言模型的长推理任务，视频扩散的 KV 侧完全没有验证，位宽组合也只给了两档。
