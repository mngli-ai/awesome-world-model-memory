  date: '2026-11-03'
  detail:
    diff: 与 Self Gradient Forcing 比，同一目标同一遍历下只多一个 writer 适配就拿到提升；与 PackForcing 这类改写入集合的免训方法比，它把写入表示学出来，不是挑哪些块进缓存。
    formulas: []
    has_abstract: true
    io: 输入是片段序列与条件，输出是写入缓存的记忆 KV 与生成用的 KV 两套表示。
    limits: rollout dropout 只定性说保留大部分增益；只在 1.3B 级生成器上验；分页缓存与局部重算要改训练框架。
    position: 因果生成器把去噪与写缓存混在一个 KV 里，写入的表示没人专门训，后续片段只能读到生成侧表示。
    steps:
    - 观察预训练生成器里生成 KV 与写入 KV 的差异，并测互换后的续写退化。
    - 在主干上加 writer 专属低秩残差，只影响写入的 KV。
    - 用未来片段对该 KV 的读取作监督，反传梯度穿过缓存。
    - 把训练期可变缓存换成分页持久缓存，配局部重算，一次遍历算全记忆梯度。
    - 与 detached-write 和两遍重建对比开销，在 VBench-Long 上测 60 秒与 240 秒。
    train: 需训，梯度要穿过缓存；单次遍历的额外更新开销 7%，常驻显存少 28%。
  explain: 这篇从工程上确认了一件我怀疑过的事，生成时用的 KV 和写给未来用的 KV 不是一回事。作者先做观察，预训练生成器里每个片段其实有两套 KV，去噪时自己用的那套，和写进缓存给后面读的那套，两者本来就差别很大，后面的片段对它们注意力方式也不同，把写入的 KV 换成生成 KV 会让续写变差。于是他们给写入侧单独挂一个低秩残差，用未来的读取来监督这个写手，让记忆表示从它被使用的后果里学出来。难点是梯度要穿过可变缓存，他们换成分页可持久缓存加局部重算，一次遍历算出和两遍重建一样的梯度，更新开销只多 7%，常驻显存少 28%，训练周期短 20.8%。在 SGF 上 60 秒美学 +6.6，240 秒 +8.5。对六块窗口这个设定，它给出的方向是把窗口里的 KV 当成被写出来的东西去训，而不是当成副产物。
  id: dkv-forcing
  key_numbers:
  - 60 秒 VBench-Long 美学 +6.6，240 秒 +8.5
  - 生成器更新开销 +7%
  - 常驻显存 -28%
  - 训练周期 -20.8%
