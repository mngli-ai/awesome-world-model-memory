  note: 测画质、设定遵循、交互遵循、一致性、物理合规五维，关键设计是多轮——单轮分数高不代表第二三轮还听话。
  arxiv: '2605.25874'
  explain: 想象你在一座虚拟城市里连续问路、转弯、开门：模型不只要生成眼前画面，还得记住此前发生了什么，并对新动作作出合理反应。许多旧评测只看单次生成，难以判断互动是否连贯，也不便比较不同操控方式。WBench设计了289个带世界设定的案例，共1058轮交互，用来评测20个模型；导航统一支持文字、六自由度位姿（位置与朝向）和离散动作三种输入。它用22项自动子指标，从五个方面评价结果，由专用视觉模型和多模态大模型合成评分，并与人类判断对齐。多轮情境能暴露前后矛盾，统一接口让比较更公平，细分指标则把模糊的“表现好”变成可检验的能力。
  detail:
    position: WBench 旨在解决交互式视频世界模型缺少统一、全面评测标准的问题。它评估模型在多轮交互中的视频质量、设定遵循、交互遵循、一致性和物理合规性。
    io: 输入是每个测试案例的世界设定与多轮交互序列，导航交互可通过文本、6-DoF 位姿或离散动作输入。输出是模型响应交互生成的视频，以及由自动指标计算的五维评测结果。
    steps:
    - 构建包含多样场景、风格、主体和视角的案例，并为每例设定世界背景与多轮交互序列，以检验模型跨轮次生成能力。
    - 纳入导航、主体动作、事件编辑和视角切换四类交互，并统一导航的文本、6-DoF 位姿和离散动作接口，以支持不同原生输入形式的模型评测。
    - 对模型生成的视频按视频质量、设定遵循、交互遵循、一致性和物理合规性五个维度评估，以覆盖交互式世界模型的关键能力。
    - 组合专用视觉模型与大型多模态模型构成 22 个自动子指标，并以人类判断验证指标，以评估输出并提供模型诊断依据。
    - 在 20 个先进模型上运行基准并比较结果，以分析不同模型的优势、弱点与开放挑战。
    formulas: []
    train: 摘要未给训练流程与关键训练设置。推理时模型根据案例设定和逐轮交互生成视频，再由 22 个自动子指标进行评估；具体推理设置摘要未给。
    diff: 相较于只覆盖部分能力或单轮生成的评测，WBench统一考察五个维度，并以多轮交互案例覆盖四类交互。它还统一导航的三种输入接口，并用经人类判断验证的自动指标评测不同模型。
    limits: 未见明确说明
