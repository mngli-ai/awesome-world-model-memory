  inherited_by: []
  inherited_chain: 0
  concepts:
  - 测试时训练
- id: rad
  title: Recurrent Autoregressive Diffusion (RAD)
  date: '2025-11-17'
  lane: 参数化记忆
  branch: 递归状态
