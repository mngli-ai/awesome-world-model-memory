  mechanism: 把视角、角色动作、相机三类控制各自写成显式 token，直接和视频 token 放进同一个 self-attention 空间，不再走各自独立的条件分支；时间维度改用 Interaction-Transport RoPE，把累计的控制切换量参数化进时间注意力的旋转，使相邻执行区间的连续性由位置编码承担而不是额外状态缓存。
  key_numbers:
