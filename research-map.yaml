  date: '2026-11-04'
  detail:
    diff: 与 FadeMem 都在 KV 上建层级，区别是它按树结构做对数级检索并对每层候选重编位置，而不是按时间距离合并相邻条目。
    formulas: []
    has_abstract: true
    io: 输入是长上下文 token 序列，输出是下一 token 分布；内部把 KV 缓存组织成带摘要节点的树。
    limits: 只在语言模型上验证，没有视频侧实验；树节点摘要的存储开销与建树时机摘要未细说，数字全部来自 24 页技术报告。
    position: 百万 token 上下文下稠密注意力在 prefill 与解码都太贵，训练又要长文档；现有稀疏方法每次查询仍要 O(L) 打分，分层方法一旦超出训练长度精度就掉。
    steps:
    - 在 KV 缓存上按层建树，节点用一个 key 与均值池化 value 概括子树。
    - 每层查询最多保留 k 个候选，未选中者的摘要与精确 token 共享 softmax。
    - 每条的位置编码取它在所在层候选里的序号。
    - 每层一个 pooler，从稠密注意力蒸馏。
    train: 需训，从 Qwen3-4B 初始化，0.62B token，沿用 32K 训练长度。
  explain: 这篇解决的是用什么地址去取历史里最硬的一档，长度到一百万 token 时稠密注意力算不动，而按块打分的稀疏方法每次查询还要把前面的块全扫一遍，选择成本是 O(L)。RecSA 的做法是把 KV 缓存组织成一棵树，每个节点拿一个 key 加一个均值池化的 value 概括自己那棵子树，查询从根往下走，每层最多留 k 个候选，所以选择和读取都是 O(log L)。第二个设计更值得抄，每条记录的位置编码不是序列里的绝对位置，而是它在所在层候选里的序号，这样一来不管上下文多长，任意两条之间的相对距离都还落在训练时见过的范围里，长度外推就不会因为位置编码超范围而崩。它从 Qwen3-4B 初始化，只在原模型 32K 训练长度上喂 0.62B token，RULER 从 131K 到 2M 全长度都超过基线，1M 上 60.5 对最佳基线 40.0；524K 单张 H200 上 prefill 3.2 倍、decode 3.8 倍，64K 到 2M 全程比稠密快。对六块窗口的启发是窗口不必等长，可以做成有层级的，位置也不必连续编号。
