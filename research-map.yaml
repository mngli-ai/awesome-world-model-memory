  links:
  - https://arxiv.org/abs/2611.07551
  mechanism: 用去噪轨迹上早期的干净估计当在线信号，同时标出跨帧静态冗余与跨步提前收敛的 token，合成一张逐 token 冗余掩码，被判冗余的 token 跳过后续计算并按末次计算值回填。
