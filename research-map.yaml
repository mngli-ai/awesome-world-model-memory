    formulas: []
    train: 需训，含代理更新模块与注意力匹配损失，底座为自回归扩散模型；摘要与正文未在摘要中给出底座型号、训练数据量与更新步数。
    diff: 与只压缩或挑选 KV 的做法不同，它不保留任何具体历史 token，而是学一个能复现历史注意力响应的代理，并用注意力级监督直接约束这个代理，这是既有选择性注意力与压缩方法缺的。与靠加长 KV 换画质的路线相反，它把历史规模固定住。
    limits: 数字全是 VBench-Long 自动指标，未见回访一致性与可控性评测；代理是学出来的，代理与真实注意力响应的偏差在分布外场景如何未讨论；训练依赖全上下文监督，成本高；未开源。
