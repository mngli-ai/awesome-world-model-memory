  explain: 想象一个游戏场景：小球撞墙后反弹，树木不会因镜头切换就换位置。普通视频模型常把世界当连续画面，难以长期记住物体、规则和因果。Code World
    Model 让编码智能体充当世界大脑：它用可执行代码维护实体位置、状态与运动规则；编译器再把这些状态渲染成336×192的代理视频，其中附带深度和语义ID，表示物体远近及身份。微调后的MiniMax-H3视频模型像画师，根据代理视频生成1344×768、24帧每秒的真实画面。训练采用124帧窗口、34帧重叠，在8张H800上跑3534步，LoRA只更新5.96亿参数。这样，逻辑由代码精确记忆，外观由模型自由生成，既减少时空漂移，也能保持可控的世界演化。
  detail:
    position: 这篇工作试图解决主要从视觉结果学习环境变化的视频 world models 难以掌握底层规则、维持持久状态并支持连贯开放演化的问题。它将世界演化交给
      coding agent，将视觉呈现交给 video model。
    io: 输入包括当前世界状态与事件，coding agent 据此生成可执行代码来更新实体状态并应用规则。输出是由 proxy video 条件化生成的高保真视频画面，proxy
      video 编码逐帧的时空约束。
    steps:
    - coding agent 根据事件和已有状态推理后果并生成可执行代码，以便按规则持续更新世界状态。
    - 将更新后的实体状态编译为 336×192 的深度与语义 ID 代理视频，以显式表达逐帧时空约束。
    - 将代理视频作为条件输入微调过的 MiniMax-H3，使其把结构化约束转化为视觉观测。
    - 通过 gameplay 与真实世界视频的数据管线构造对齐的 proxy-observation pairs，为代理条件下的视觉生成提供训练数据。
