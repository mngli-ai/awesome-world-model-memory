  mechanism: 复现 frame sink 的机制，发现初始帧稳定长程一致性靠的是一小撮注意力头，多数头只在做局部时序动态，于是所有头都暴露给钉住初始帧就成了过条件，蒸馏时运动塌向教师的低动态模态；提出解耦上下文路由加运动解耦正则，在蒸馏时把这种头分工拆开并强化。
