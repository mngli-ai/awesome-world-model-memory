  explain: 这篇的实验设计值得抄。它把记忆本体固定住，也就是说明怎么生成、存多少都不动，只动检索这一层：检索单元切多细、查询怎么写、给推理器多少上下文、要不要重排。这样得出的结论不会被记忆本身的好坏糊住。最优配置叫
