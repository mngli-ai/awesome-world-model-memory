  date: '2026-11-03'
  detail:
    diff: 与 Self Forcing 比，Self Forcing 只用学生自生成历史对齐教师，它把历史对预测的贡献显式抽成残差；与 Context Forcing 比，Context Forcing 让教师也看全程历史以消掉监督错配，它是控制变量式地扣掉历史，只留历史那一份。
    formulas: []
    has_abstract: true
    io: 输入是文本或图像条件加历史块，输出是修正后的 score 或速度目标，用于蒸馏学生模型。
    limits: 教师双跑让训练算力翻倍的成本没有讨论；固定视角教师要求场景在镜头外仍可见，真实交互场景未必拿得到；残差加权系数的取法未给。
    position: 少步自回归扩散的蒸馏通常只对齐学生与教师的当前预测，历史只作为输入条件出现，历史上哪些内容在约束当前帧没有被显式监督。
    steps:
    - 用同一个教师跑两次，一次带信息量高的历史上下文，一次不带。
    - 取两次预测的残差，作为这段历史的监督分量。
    - 对残差加权后加到学生的 score 或速度预测上，得到修正目标。
    - 历史上下文两种来源，早期生成块或者固定视角教师的 rollout。
    - 在 1.3B 模型上按 on-policy 蒸馏训练，测 15 秒与 60 秒生成以及回访场景。
    train: 需训，on-policy 蒸馏，教师取同一模型的少步或双向版本；训练数据规模摘要未给。
  explain: 这篇的问题意识跟我复现 SolarRenderer 时的痛点完全对上。少步自回归视频扩散把步数压下来之后，长 rollout 的一致性靠的就是历史，但现有蒸馏只是让学生看自己的历史，历史里哪一部分真正约束了当前预测没有被单独拎出来。History Forcing 让同一个教师在两种条件下各预测一次，一次带关键历史，一次不带，两次的差就是这段历史带来的那部分监督，加权后加到学生目标上。关键历史有两种取法，取漂移更小的早期块，或者取一个固定视角教师在自己视角外的 rollout，后者专门治主体出画再回访。1.3B 上 15 秒 VBench 85.07，60 秒 VBench-Long 79.82，PlayWorld 的演化质量从 2.35 到 2.70，MemoBench 的物体一致性从 58.43 到 62.18。对我来说这是四步 LoRA 之后最该试的一层，它把历史监督做成了训练时插拔的一项，不用改推理结构。
  id: history-forcing
