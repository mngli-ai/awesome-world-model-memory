  explain: 这个基准测的不是画面好不好看，而是请求来得对不对时候。它准备了三百个十几秒到五分钟的脚本用例，中途不断有新请求进来，每个用例提前写清楚哪些内容必须跟着变、哪些必须原样保住。然后按执行、状态一致、视觉保真、视听协调四个维度十项指标打分。结论挺狠，画质和身份保持好的模型，请求执行并不一定靠谱，执行类指标最高也就三十几分。它给的正是可控制性这个判据的现成尺子。
  detail:
    position: StreamEval 把交互式流式视频生成当成一个可统一打分的任务来测，请求随时到达，模型既要在正确时刻执行，又不能把已有内容改坏。它要回答的是画质高是否等于听话。
    io: 输入是 300 个脚本化测试用例，每个用例给定初始素材、增量到达的多模态请求，以及对状态改变与内容保持的显式要求，输出是四个维度的 0 到 100 分评分。
    steps:
    - 构造五个任务的用例，分别是头像对话、头像表演、世界生成、指令编辑、参考编辑。
    - 每个用例写清初始素材、按时间增量到达的请求，以及哪些状态必须变、哪些内容必须保持。
    - 用任务执行、状态一致性、视觉保真、视听协调四个维度共十项任务相关指标打 0 到 100 分。
    - 在 300 个用例上评 37 个模型，公开榜单。
    formulas: []
    train: 不适用，本身是评测基准，不训练模型。
    diff: 与只测画质或身份保持的基准不同，StreamEval 的用例带时间轴，请求什么时候到、什么时候必须生效都写进用例，因此能测出延迟执行与执行时破坏已有内容这两类失败。它的结论也正指向这点，画质与身份保持好并不等于请求执行可靠。
    limits: 五个任务里世界生成只覆盖文本条件一种；十项指标任务相关，跨任务不可直接比；最高分普遍偏低，请求执行最高 36.90，参考编辑成功最高 15.00，难度高但也可能压住区分度；未测长程回访一致性。
