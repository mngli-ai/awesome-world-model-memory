  mechanism: 指出 KV 淘汰不只是排序问题，用来生成淘汰查询的工作区一旦有误就会污染后续查询并固化错误决策；用未来解码位点的提议初始化可反馈工作区，再用早期解码产生的查询在剩余前瞻步之前把工作区修回来，只多一次张量重打分。
