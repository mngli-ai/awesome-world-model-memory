  - 少步蒸馏
  - 流式分块推理
  - 分块因果缓存
  date: '2026-11-03'
  detail:
    diff: 与 Rolling Forcing 比，质量相当但动态程度更高；与 Ulysses/Ring 这类上下文并行比，它的并行切在时间与流水上而不是序列维。
    formulas: []
    has_abstract: true
    io: 输入是文本条件，输出是连续流式视频；内部维护跨块因果 KV 缓存。
    limits: 只报 1.3B 模型的吞吐与质量对比，更大模型未测；读未去噪完的块对一致性的长期影响没有单独指标；需要多卡与定制 kernel。
    position: 分块自回归的串行去噪加缓存刷新要两次前向，长 rollout 掉质量与相机漂移。
    steps:
    - 用分块因果注意力让当前块读更早但未去噪完的块。
    - 把去噪与缓存刷新错峰分布到整机副本，做到每轮一前向出一块。
    - 三段训练依次引入混合噪声、运动监督与自生成历史的因果适配。
    - 运行时提前送 K/V，重叠通信与计算，优化 kernel 与 VAE 解码流水。
    - 在 Wan2.1-T2V-1.3B 上测质量与吞吐，与 Rolling Forcing 及上下文并行基线比。
    train: 需训，三段训练；具体数据与步数摘要未给。
  explain: 这篇把长视频生成的瓶颈从模型挪到了流水线。现有分块自回归就算一步去噪也要两次前向，一次去噪一次刷缓存，串起来吞吐上不去，rollout 变长还会掉质量掉相机漂移。Wave Forcing 的取巧点是让当前块读更早但还没去噪完的块，于是去噪与刷缓存可以错峰，流水填满后每轮并发前向就出一个块。模型要适应这种读半成品的历史，所以配了三段训练，先混合噪声，再运动监督，最后用自生成历史做因果适配。八张 H200 上四步版本 DiT 147.6 FPS，端到端 134.8 FPS，是单卡的 7.07 倍。我关心的不是这个倍数，是它把缓存的写入时刻从去噪结束提前到了去噪中间，这跟我六块窗口里块与块严格串行的假设不一样。
  id: wave-forcing
  key_numbers:
