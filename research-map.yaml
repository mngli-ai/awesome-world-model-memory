- arxiv: '2611.07551'
  branch: ''
  concepts:
  - 训练无关
  - KV压缩或淘汰
  - 流式分块推理
  date: '2026-11-05'
  detail:
    diff: 与 TeaCache、FlowCache 这类按步复用的缓存都在省重复计算，区别是它把判据下沉到 token 级并同时吃跨帧与跨步两种冗余，一步采样下仍然有效。
    formulas: []
    has_abstract: true
    io: 输入是当前块的 token 与其去噪轨迹，输出是一张逐 token 冗余掩码与被跳过计算的 token 序列。
    limits: 摘要只给加速倍数与 VBench-Long 的方向，绝对指标与 30 秒协议的基线配置待核；它省的是计算，不解决窗口外历史怎么存。
    position: 少步蒸馏后的自回归视频模型每一步都要重算整块 token，跨步冗余被蒸馏抹平，按步复用的缓存失效，实时生成仍卡在算力上。
    steps:
    - 沿模型自身去噪轨迹取早期干净估计，作为在线冗余信号。
    - 用跨帧相似度与跨步收敛度合成一张统一掩码。
    - 掩码命中的 token 跳过后续计算，按末次计算值回填。
    - 用内容自适应掩码复用减少密集探测开销。
    train: 免训，不改权重、不加预测器，只改每步算哪些 token。
  explain: 这篇的出发点正好卡在我这套配置的痛点上。少步蒸馏把步数压到四步之后，相邻步之间几乎没有冗余可捡，TeaCache、FlowCache 那类按步复用的缓存全失效，因为它们假设相邻步的输出差不多。PreSTP 换了冗余的定义：一是跨帧，静态内容在相邻帧里一模一样；二是跨步，有些 token 在去噪早期就收敛，后面几步再算还是同一个值。真正有意思的是找这两种冗余用的信号，模型自己去噪轨迹上的早期干净估计，不要额外预测器、不要参考视频、也不要重训。拿到信号后合成一张逐 token 的掩码，命中的 token 后面直接不算，用末次计算值回填，另外加一个掩码复用策略省掉反复探测。五秒生成 1.52 到 3.20 倍，三十秒 1.96 倍并且 VBench-Long 反而涨、长程漂移被压下去，一步采样那种跨步冗余为零的极端情形它还能降开销。对六块窗口来说它不给窗口换位置，只在窗口内部决定哪块 token 值得再算一遍。
  id: prestp
  key_numbers:
  - 5 秒 1.52 至 3.20 倍加速
  - 30 秒 1.96 倍加速
  lane: 位置时间寻址
