- id: uniworld
  title: UniWorld
  arxiv: '2610.32381'
  date: '2026-10-23'
  precision: day
  venue: ''
  lane: 位置时间寻址
  branch: ''
  parent: recam
  link_strength: 都把已提交的 latent 历史当下一段的底
  training: 免训
  status: 速读
  one_liner: 历史与几何共用时间线，只提交新潜帧
  mechanism: 把已生成的 latent 按当前采样噪声级重新投影回窗口，投影幂等、只提交新后缀；深度条件做成滚动潜状态，只增量读新到的几何且在窗口内固定，活跃状态被窗口大小卡住而不随轨迹变长。
  key_numbers:
  - 14.472 FPS @ 960×544（论文的实时线是 14）
  - 21.361 FPS @ 672×384
  - 深度活跃状态上界 19.050 MiB，与轨迹长度无关
  - 潜窗口 102 帧，重叠 12 帧，步长 90
  - 30 秒请求 217 潜帧，解码后裁到 720 像素帧
  - 100 段 30 秒片段，96 个源组
  - 120 秒 13 段，PSNR 14.4277
  - 约束历史最大绝对误差 0，缓存与在线路径逐位相等
  - DMD8 的 VBench Quality 80.54
  self_measured: []
  media: []
  links:
  - https://arxiv.org/abs/2610.32381
  note: 雷达自动入库 2026-10-26，字段据摘要，待人工核。10-23 首发、10-26 进 cs.CV 公告；未给项目页与代码；实时吞吐测在 8×80GB H100 上，与消费卡无关；30 秒 PSNR 13.3973 dB 是逐帧重建口径，不能当生成画质分看；窗口三元组 (345,39,306) 与潜空间 (102,12,90) 的对应关系待核。
  tags:
  - 提交式历史
  - 滚动几何态
  - 噪声级对齐
  explain: 这套东西要解决的是连续出片时历史被反复重编码的问题。常见做法是每进一个新窗口就把旧帧再压一遍再喂回去，压几次原型就飘了。UniWorld 不重压，把已经生成好的 latent 按当前这一步的噪声级重新投影回去，投影是幂等的，同一步投两次等于投一次，旧的那部分逐元素被钉死，模型只能改新露出来的后缀。几何走同一套账本逻辑，深度条件做成一条滚动状态，每次只增量读新到的那几帧，并且在同一窗口内保持不变，于是活跃的深度状态只跟窗口长度有关，跟已经走了多久无关。它没有新增训练，用的是现成的 H3 加一个八步蒸馏模型和一个控制分支。
  detail:
    position: 处理连续视觉世界模拟里历史与几何怎么共用一条时间线的问题，既有做法每进一个窗口就把旧 latent 重新编码一遍，误差累积，几何控制的开销也随长度线性涨。
    io: 输入是深度轨迹（估计的、原生的或仿真器给的三种都支持）加一张参考外观图，输出是连续生成的一段视频，以及逐窗口提交、可精确复现的 latent 历史。
    steps:
    - 把每个窗口的已生成 latent 按当前噪声级 t 投影回流约定，让它在去噪轨迹上落在应有的位置，投影只替换被遮罩的部分。
    - 每步用速度场积分后立刻再投影一次，保证终端 t=1 时前缀精确恢复成已提交的历史，不产生重编码漂移。
    - 只把窗口内新生成的后缀拼进历史，前面已提交的部分不重写，控制分支改的也只是新后缀。
    - 深度条件按滚动方式增量读取，在一个窗口内固定不变，活跃深度状态的上界由此被窗口长度限定。
    formulas:
    - tex: z_t=t\,z_{\mathrm{clean}}+(1-t)\,\varepsilon,\qquad v=z_{\mathrm{clean}}-\varepsilon
      caption: 流约定：latent 由干净值和噪声按 t 线性混合，速度场定义为两者的差。（依原文式 3）
    - tex: \mathcal{P}_{i,t}(z)=M_i\odot\left[t\,H_i+(1-t)\,\varepsilon_i\right]+(1-M_i)\odot z
      caption: 历史投影：遮罩内换成按当前 t 混合的历史 H_i 与同一份噪声，遮罩外保持不动，投影幂等。（依原文式 4）
    - tex: z_i^{(k+1)}=\mathcal{P}_{i,t_{k+1}}\!\left(z_i^{(k)}+(t_{k+1}-t_k)\,v_\theta(z_i^{(k)},t_k;\mathcal{C}_i)\right)
      caption: 每步先积分再投影，条件集合 C_i 是深度、边界图与全局外观。（依原文式 5 与式 6）
    - tex: \hat{Z}_{\le i}=\mathrm{concat}\!\left(\hat{Z}_{<i},\;z_i^{(K)}[h_i:L_i]\right)
      caption: 只提交新后缀，已提交部分不进拼接。（依原文式 9）
    - tex: M_{\mathrm{depth}}\le 4\,L_{\max}\,S\cdot 96\ \text{bytes}
      caption: 活跃深度状态上界，L_max 是窗口潜帧数，S 是每帧空间 token 数，96 是通道维；默认配置下 960×544 为 19.050 MiB。（依原文式 13）
    train: 免训。生成器由已发布的 MiniMax-H3 与 DMD 八步蒸馏模型 VDN-H3 组成，再加 VideoX-Fun 的 Union 控制分支，控制分支接在 50 个 H3 block 中的 5 个上；本地联合训练更新数为零，推理侧 8×80GB H100 加 FSDP 与 Ulysses。
    diff: 与窗口外历史整段丢弃、只靠 sink 撑的做法相比，它把每帧已提交的 latent 都留在账本上且能精确复现；与 Recam 这类全上下文记忆相比，它的活跃几何状态有上界，与轨迹长度无关；与 ReCamMaster 一类单段重拍相机控制相比，它管的是连续时间上的状态继承。
    limits: 30 秒片段 PSNR 只有 13.3973 dB，逐帧重建口径，说明画质与参考视频没对齐的问题还在，解决的只是历史不漂；实时吞吐是 8 卡 H100 的数，消费卡上拿不到；深度条件依赖外部深度估计器（VDA ViT-L FP32，832×480），估错了它不纠；原生深度与估计深度对比里估计深度反而高 0.7086 dB，什么条件下该用哪个没讲清；无代码与项目页。
    has_abstract: true
  concepts:
  - 流式分块推理
  - 显式3D缓存
  - 结构条件渲染
- id: video-memcomp
  title: Video-MemComp
  arxiv: '2610.32784'
  date: '2026-10-23'
  precision: day
  venue: ACM MM 2026
  lane: 位置时间寻址
  branch: ''
  parent: calm
  link_strength: 都把 KV 预算按层分配而不是全局统一
  training: 免训
  status: 速读
  one_liner: 把压缩误差拆两块，按层分 KV 预算
  mechanism: 一阶泰勒把压缩误差拆成逐层敏感度与局部近似误差两项的求和，局部误差靠在注入 RoPE 之前做相似 token 聚合加守恒 logit 偏置来压，敏感度靠离线梯度先验加在线熵动态分配每层预算来管。
  key_numbers:
  - Qwen2.5-VL-3B 整体 62.3% 提升到 64.1%
  - 每层等效 6,000 tokens，省 90% 以上 KV 内存
  - Qwen2-VL-7B 平均 64.9% 提升到 65.5%
  - 峰值显存 22.95 GB 降到 16.74 GB，较 ReKV 降 27%
  - TTFT 0.0302 s，ReKV 是 0.0846 s
  - θ_inter=0.8，θ_intra=0.85
  self_measured: []
  media: []
  links:
  - https://arxiv.org/abs/2610.32784
  - https://hhnk666.github.io/Video-MemComp.github.io
  note: 雷达自动入库 2026-10-26，字段据摘要，待人工核。理解侧 MLLM，不产出视频，进图谱是因为误差分解与预算分配两个机制可迁移；预算口径是每层 6,000 tokens 的等效值，与生成侧 KV 窗口不可直接换算；流式基准 RVS 上平均分项 Score 只有 3.2，低于几个基线，说明精度涨了但主观分不涨；代码是否开源待核。
  tags:
  - 误差分解
  - 层间预算
  - 前置聚合
  explain: 流式看视频时 KV 缓存迟早撑爆，压缩又必然带误差，问题是误差从哪来、该压哪层。这篇先用一阶泰勒把总误差写成一个逐层求和，每层是敏感度乘局部误差，敏感度高说明这层的小扰动会被后面放大，局部误差大说明这层被压狠了。于是两件事分开做，局部误差靠在注入旋转位置编码之前做相似 token 聚合来压，因为一旦转完位置，相似度就不代表内容相似了，聚合完再给注意力 logit 加一个对数计数的偏置，把注意力质量补回去；敏感度靠按层分预算来管，浅层多留深层狠压。整套不改权重，只在推理时管缓存。
  detail:
    position: 处理流式视频理解里 KV 缓存无限增长的问题，既有压缩方法把误差当成单一来源，忽略了它会按层被结构敏感度放大。
    io: 输入是连续进来的视频帧与一个固定的 KV 预算，输出是在该预算下的回答、以及逐层分配好的缓存。
    steps:
    - 用一阶泰勒把输出误差写成逐层求和，拆成结构敏感度 S_l 与局部近似误差 E_l 两项。
    - 帧间先用时间相似度滤掉静态冗余 token，只留变化的部分。
    - 在注入 RoPE 之前的阶段做相似 token 聚合，并给每个存活 token 记融合计数，向 logit 注入 log(f) 的偏置保证注意力守恒。
    - 离线用校准集梯度范数算每层的静态先验，线上再用上下文熵做动态项，按三项加权把预算分到各层。
    formulas:
    - tex: \|\Delta O\|\le\sum_{l=0}^{L-1}\left\|\frac{\partial G}{\partial A^{(l)}}\right\|\cdot\left\|\Delta A^{(l)}\right\|=\sum_{l=0}^{L-1}S_l\,E_l
      caption: 压缩误差上界，S_l 是逐层结构敏感度，E_l 是局部近似误差。（依原文式 2）
    - tex: \rho(l)=\lambda_u\,\rho_{\mathrm{unif}}+\lambda_s\,\rho_{\mathrm{static}}(l)+\lambda_e\,\rho_{\mathrm{dyn}}(l)
      caption: 逐层预算分配的线性组合，均匀项保底，静态项来自离线梯度先验，动态项来自在线信息密度。（依原文式 6）
    - tex: s'=s+\log N
      caption: 注意力守恒偏置，聚合掉 N 个 token 后把 logit 抬 log N，使注意力质量近似不变。（依原文式 12）
    train: 免训。只有一次离线校准（在 LLaVA-Pretrain 上取梯度范数建层风险图），不改任何权重。
    diff: 与 CALM 用注意力输出误差当风险代理不同，它把误差显式拆成局部项与结构项并各配一个机制；与均匀 token 合并相比，它给浅层留更多预算，实测是前重后轻的分配形状；与只按注意力分数淘汰的做法相比，它多了一步前置聚合，避免 RoPE 旋转后相似度失真。
    limits: 只在理解侧 MLLM 上验证，不产出视频，长程回访与可控性没测；预算是每层 6,000 tokens 等效值，与生成侧按窗口计的 KV 不是一套单位；动态项权重要压到 0.025 才最好，说明在线熵这路信号方差大不好用；激进的时间剪枝（θ_inter 小于 0.5）会不可逆地崩；RVS 流式基准上平均分项得分反而低于基线。
