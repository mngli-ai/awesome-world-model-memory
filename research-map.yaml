  date: '2026-10-31'
  detail:
    concepts:
    - KV压缩或淘汰
    - 分块因果缓存
    - 流式分块推理
    diff: 与只做单块压缩的方案不同，它把跨块的共享与分支关系显式建成树；与按帧淘汰的 KV 压缩相比，它不做丢弃，而是把块状态压成可还原的形式。
    formulas: []
    has_abstract: true
    io: 输入多轮生成的块序列与分支请求，输出压缩后的块状态树与生成结果，支持从任一分支还原。
    limits: 面向多轮分块生成，单次连续长片未测；树维护与还原的调度开销没报；压缩率与 VBench 掉点在五个模型上取范围，最差情形未单列。
    position: 多轮长视频生成要保留全部 KV 才不重复计算，显存放不下，丢掉再建又要重跑，中间还夹着多条候选分支要各自保留历史。
    steps:
    - 块内做跨通道低秩分解，对系数再做一次视频编码压缩。
    - 逐层在线预测分解秩，使保留能量达到目标。
    - 块间共享基方向，减少跨块冗余。
    - 把块状态组织成树，支持分支共享历史与续写、回退、分叉的还原。
    - 在五个视频生成模型上比 KV 存储、下一块延迟与六项 VBench 指标。
    train: 免训，作为推理系统外挂，不改生成模型权重。
  explain: 这条是系统层的做法，但结构值得抄。多轮长视频生成里 KV 会一直涨，全留放不下，丢了再算又慢。ReelCache 块内做通道低秩分解，再把系数当视频那样编码，逐层在线预测秩来卡保留能量；块间让相邻块共享基方向，并把块状态组织成一棵树，于是多条生成分支能共享同一段历史，续写、回退、分叉都能把状态还原回来。五个模型上 KV 存储降 14 到 21 倍，下一块生成快 1.25 到 3.36 倍，六项 VBench 指标掉不到 1%。它把历史当成一张可按分支寻址的树，这一点比单纯压缩更有意思，我的场景状态是代码写的，天然支持分叉，但历史帧的 KV 没有对应的树。
  id: reelcache
  key_numbers:
  - KV 存储降 14.46 到 21.13 倍
  - 下一块生成加速 1.25 到 3.36 倍
  - 六项 VBench 指标下降不到 1%
  - 五个视频生成模型上验
  lane: 位置时间寻址
  link_strength: 与 TetherCache 都在稳住自回归长视频的缓存，TetherCache 靠锚定与重取，ReelCache 把块状态组织成树，让多条生成分支共享同一段历史并支持回退与分叉
  links:
  - https://arxiv.org/abs/2611.09973
  - https://github.com/Tianyu9748/ReelCache
  mechanism: 块内做通道低秩分解，再把系数按视频编码压一遍，逐层在线预测秩以满足保留能量目标；块间让相邻块共享基方向，并把块状态组织成树，使多条生成分支共享历史状态，同时支持续写、回退与分叉时的状态还原。
  media: []
  note: 雷达自动入库 2026-11-11，字段据摘要与仓库页，待人工核。提交日 10-31 而编号为 2611，编号月份与提交月份不一致，日期按惯例取提交日；只在多轮分块生成设定下验，单次长片未测；树结构带来的调度开销未报；无官方演示素材。
