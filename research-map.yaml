- id: lyra2
  title: Lyra 2.0 - Explorable Generative 3D Worlds
  date: '2026-04-14'
  lane: 几何位姿寻址
  branch: 位姿视锥
  training: 训练
  status: 速读
  one_liner: 逐帧几何仅做信息路由，治空间遗忘
  mechanism: 维护逐帧 3D 几何只用于检索相关历史帧并与目标视角建稠密对应，外观交给生成先验；另用自增强劣质历史训练纠时间漂移，再微调前馈重建出 3D。
  tags:
  - 信息路由
  - 漂移纠正
  - 大场景重访
  key_numbers:
  - 长轨迹+位置重访
  - 摘要未给具体数值
  media: []
  links:
  - https://arxiv.org/abs/2604.13036
  - https://research.nvidia.com/labs/sil/projects/lyra2/
  note: 与 GEAR 同期且思路同构（几何只管 routing、外观交给生成先验），是工业侧独立验证；区别在 Lyra 2.0 用自增强历史专治 temporal
    drifting，GEAR 用 octree 治遮挡伪对应。
  arxiv: '2604.13036'
  explain: 想象你让模型在一座房子里边走边拍：走远再回到厨房，它可能把门窗位置记错，画面接不上，这就是长视频生成中的空间遗忘。Lyra 2.0不让几何负责画得逼真，而把每帧的三维结构当作地图索引：按当前视角找回相关旧帧，再建立稠密对应，也就是逐处匹配新旧画面的位置；外观则交给生成先验补全。它还用自增强得到的劣质历史片段训练模型纠正时间漂移，并微调前馈重建模块恢复三维。这样，几何帮模型找对看过哪里，生成模型专心画好细节，因此更能在长轨迹中重访地点并保持空间一致。论文摘要未给出具体指标。
  detail:
    position: 本文要解决长视角轨迹下生成式 3D 场景构建中的空间遗忘与时间漂移问题，使生成视频在大范围探索和地点重访时仍保持 3D 一致性。目标是进一步从长程生成视频中恢复可实时渲染和仿真的
      3D 场景。
    io: 输入为场景探索过程中的目标相机视角序列及生成历史，目标相机视角作为条件信号。输出为长程、具 3D 一致性的生成视频，并通过前馈重建模型恢复 3D 场景。
    steps:
    - 为生成历史中的各帧维护 3D 几何，以便在目标视角到来时定位相关历史信息。
    - 依据几何检索相关历史帧，并建立历史帧与目标视角之间的稠密对应，以缓解重访区域时因空间遗忘造成的结构幻觉。
    - 将检索和对应结果用于信息路由，而由生成先验合成目标视角的外观，避免把几何表示当作外观生成来源。
    - 使用模型自身生成且带有退化的历史进行自增强训练，使模型学会纠正累积误差而非延续时间漂移。
    - 用长程生成视频微调前馈 3D 重建模型，以恢复适用于实时渲染和仿真的场景几何与表示。
    formulas:
    - tex: s_i(q)=\frac{1}{|\mathcal{P}_i|}\sum_{\mathbf{X}\in\mathcal{P}_i}\mathbf{1}\!\left[\pi_q(\mathbf{X})\in\Omega_q\right]
      caption: 依据历史帧几何与目标视锥的投影重叠度进行检索的标准写法，非原文
    - tex: \mathcal{L}_{\mathrm{self}}=-\mathbb{E}_{(H,V),\,\widetilde{H}\sim\mathcal{D}(H)}\left[\log
        p_\theta(V\mid\widetilde{H},q)\right]
      caption: 用退化历史训练模型生成目标视角、以纠正时间漂移的标准写法，非原文
    train: 训练时使用自增强历史，让模型接触自身退化输出并学习纠正时间漂移；再用长程生成视频微调前馈重建模型。推理时按目标相机视角检索相关历史帧并建立稠密对应，由生成先验合成外观；具体网络结构、损失函数和训练设置摘要未给。
    diff: 不同于仅依赖有限时间上下文的长视频生成方法，Lyra 2.0 用逐帧 3D 几何检索历史信息并建立稠密对应，但不以几何直接决定外观。它还通过自增强历史训练模型纠正自身输出中的漂移，并将长程视频用于微调前馈
      3D 重建。
    limits: 未见明确说明
    has_abstract: true
