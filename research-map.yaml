  date: '2026-11-06'
  detail:
    concepts:
    - 显式3D缓存
    - 位姿对齐检索
    diff: 与 MemVLN、检索增强类做法都在外挂记忆，它们存的是文本或帧，这条存的是度规 BEV 记录并按查询参考系取用；与端到端三维问答模型比，它把几何那一路变成确定性计算。
    formulas: []
    has_abstract: true
    io: 输入是 RGB-D 视频与相机参数，输出是答案；中间产物是带物体记录的度规 BEV 场景记忆。
    limits: 只做问答，没有生成与渲染；BEV 是二维投影，高度与细粒度遮挡信息有限；提升只有定性说法，没有具体数值；16 帧是输入预算，不是可扩展的历史长度。
    position: 视频给 VLM 的是顺序的、视角局部的观测，缺少一张持续存在的度规场景记录，于是问到没拍过的视角或被遮挡的物体就只能靠猜。
    steps:
    - 把视频观测按相机参数投到度规 BEV 上，建带物体记录的场景记忆。
    - 把每个查询形式化成参考系、空间约束、目标与证据要求。
    - 按证据要求分路，几何证据交给确定性几何求解器，直接在 BEV 记录上算。
    - 视觉证据交给对齐器，用 BEV 索引找回物体一致的支撑视角帧。
    - 在 16 帧预算下跨多个 VLM 骨干与多个三维场景 QA 基准对比。
    train: 免训，不改骨干权重，只在推理期建 BEV 记忆并编排求解路径。
  explain: 这条的关键动作是把历史从一串视角局部的帧换成一张度规鸟瞰图，然后所有提问都在这张图上按指定参考系查。它先把查询形式化，写清参考系、空间约束、目标与要什么证据，再按证据类型分两路，几何类的用 BEV 记录确定性地算，视觉类的用 BEV 索引找到相关物体记录与支撑视角，把与物体一致的帧取回来给 VLM 用。这个路数跟我想要的按状态取渲染是同一件事的弱化版，它取的是帧给理解模型，我要取的是状态给渲染器。它免训、与骨干无关、16 帧预算下就能涨，说明显式空间索引本身可以替代一部分模型能力。局限也明显，BEV 是二维度规表示，高度与细粒度遮挡有限，而且没有生成侧。
  id: bev3sr
