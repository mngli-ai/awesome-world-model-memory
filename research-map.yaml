  explain: 就像我们逛公园绕了一大圈，发现半路掉了钥匙得回头去找，以前的研究却没有基准能测出模型能不能顺着原路找回东西。LoopNav 补上了这个缺口，提出首个回溯基准，也就是专门测验模型折返回去定位物体的测试集。它不涉及修改记忆机制，而是在《我的世界》中采集了
    250 小时、2000 万帧环线轨迹，在闭合环线上测试物体级回溯，并用 SGCS 也就是目标完成度指标来打分。环形路线让起点终点相连，排除了直行碰运气的侥幸，能真实检验模型是否认得旧地标并精准回头。
