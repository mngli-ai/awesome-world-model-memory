- arxiv: '2611.13704'
  branch: ''
  concepts:
  - 潜在记忆库
  - 长上下文扩展
  date: '2026-11-10'
  detail:
    concepts:
    - 潜在记忆库
    - 长上下文扩展
    diff: 与整条隐状态时间线相比，它只保留可寻址的码；与 KV 压缩相比，它压的是导出态而不是生成时的缓存，地址是时间戳而不是槽位。
    formulas: []
    has_abstract: true
    io: 输入是用户行为序列，输出是按目标时间戳对齐的紧凑离散码；中间产物是融合递推的隐状态与只在查询点落地的状态。
    limits: 推荐系统用户行为序列，零视觉；私有数据不可复现；存储降三个数量级的同时下游性能有损，幅度未逐项给。
    position: 我的历史是六块 KV，取用靠块在窗口里的位置。这条把地址换成时间戳：递推一直在更新，物化只在查询点发生，于是存储降三个数量级，代价是表达精度。
    steps:
    - 冻结长历史骨干，取它的多层状态。
    - 做多通道融合与逐通道时间衰减，压成紧凑表示。
    - 走无查表量化成离散码，由任务专用解码器映回各下游嵌入空间。
    - 用融合的流式实现做到每个动作更新递推、只在目标时间戳物化。
    train: 需训。骨干冻结，训的是融合、衰减与量化的导出接口。
  explain: 推荐系统里要复用长历史骨干，通常得把整条隐状态时间线留着，下游只用到某个时间点的状态。SeqFold 换了个问法：历史不必整条留，只要能在需要的时间戳上物化出一份够用的状态，并且这份状态有地址。它把冻结骨干的多层状态做多通道融合、逐通道时间衰减，再量化成离散码，融合递推每个动作都更新，物化只在目标时间戳发生，于是每状态存储降到三千四百分之一，下游排序性能基本保持。对我的用处是它把写入频率和物化频率分开：递推一直在跑，落地只在取用的点上。我的六块窗口正好相反，写和取是同一个动作。领域是推荐系统，零视觉，数据也没公开，只能借机制不能借数字。
  id: seqfold
  key_numbers:
  - 单状态表示存储降到 1/3400
  - 下游排序性能基本保持
  - 大规模私有数据上验，数据未公开
  lane: 位置时间寻址
  link_strength: 与 NanoKV 都在压历史状态的存储，NanoKV 压的是 KV 的分辨率，SeqFold 压的是导出态的寻址面，只在对齐目标时间戳处物化，取用靠戳不靠槽位
  links:
  - https://arxiv.org/abs/2611.13704
  mechanism: 把冻结长历史骨干的多层状态导出成按时间戳可寻址的紧凑表示：多通道融合加逐通道时间衰减，再走无查表量化成离散码；融合递推每个动作都更新，但只在目标时间戳处物化状态。
  media: []
  note: 雷达自动入库 2026-11-12，字段据摘要，待人工核。领域是推荐系统用户行为序列，零视觉；数据与代码未公开，不可复现；1/3400 指每状态存储，代价是下游排序性能有损；training 记需训指的是导出接口要训，骨干冻结。
  one_liner: 状态按目标时间戳落地成可寻址码
