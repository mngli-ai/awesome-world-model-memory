- id: memory-forcing-train
  title: 'Memory Forcing: Attendable Mid-Horizon History for Streaming Video Generation'
  arxiv: '2610.11756'
  date: '2026-10-08'
  lane: 训练侧
  branch: 恒定上下文
  one_liner: 固定缓存里塞进中程历史银行
  mechanism: 把定长KV切成sink/archive/working三段，归档区专门留多样中程事件；绝对时间索引越界后用Bank-aware RoPE在注意力时重编索引，使各bank可区分，缓存不加。
  tags:
  - 分段KV银行
  - Bank-aware RoPE
  - 中程遗忘
  training: 需训
  status: 速读
  key_numbers:
  - 1.3B 与 Wan2.2-5B
  - 5s→60s 掉点最小
  - leave-and-return 可复现
  links:
  - https://arxiv.org/abs/2610.11756
  note: 明确命名并量化"mid-horizon forgetting"，把"只留开头+最近"这一默认假设的失效点钉死；跨1.3B/5B两规模验证。
  explain: 想象镜头一路跟着人穿过街巷，几分钟后又回到最初的咖啡馆：人物和场景都该认得出来。可流式视频模型的缓存容量固定，旧画面不断被挤掉，隔久了再回来就容易忘记中程发生过什么。Memory
    Forcing把缓存分成三段：保留开头的“水槽区”、保存多样旧事件的“归档区”，以及存放眼前画面的“工作区”。绝对时间索引超出范围时，它用Bank-aware
    RoPE（一种按缓存区重新编码时间位置的方法）让模型分清各段记忆，无须增加缓存。这样，模型既能看当前画面，也能按需取回关键往事。实验中，1.3B模型和Wan2.2-5B都受益；从5秒延长到60秒时性能下降最小，也能复现离开后再返回的场景。
  media: []
  detail:
    position: 本文解决流式视频生成中的 mid-horizon forgetting：固定大小的 KV cache 通常只保留开头帧和最近帧，导致较早但仍重要的中程事件无法被后续帧访问。Memory
      Forcing 在不增大缓存的前提下保留这类历史。
    io: 输入为流式视频生成过程及其固定大小的 KV cache，输出为持续生成的视频帧。摘要未说明具体条件信号。
    steps:
    - 将定长 KV cache 划分为 sink、archive 和 working 三个区域，以在固定容量内同时容纳不同时间跨度的信息。
    - 在 archive 区保留多样的中程事件，并在 working 区保留近期运动，以免重要历史随缓存滑动而丢失。
    - 当绝对时间索引超出训练范围时，在注意力计算时使用 Bank-aware RoPE 重新分配索引，使不同 bank 可区分。
    - 生成新帧时让注意力访问这些 bank，使后续帧能够利用归档的中程历史，同时维持固定缓存大小。
    formulas:
    - tex: \operatorname{Attn}(q_t,K_t,V_t)=\operatorname{softmax}\!\left(\frac{\bigl(R(\tilde
        p_q)q_t\bigr)\bigl(R(\tilde{\mathbf p}_K)K_t\bigr)^{\top}}{\sqrt d}\right)V_t,\qquad
        \tilde p_i=p_i+\Delta_{b(i)},\quad b(i)\in\{\mathrm{sink},\mathrm{archive},\mathrm{working}\}
      caption: Bank-aware RoPE：在注意力计算时为不同 KV bank 重新分配可区分的位置索引；标准写法，非原文
    - tex: \mathcal C_t=\mathcal S_t\cup\mathcal A_t\cup\mathcal W_t,\qquad |\mathcal
        C_t|=M,\qquad \mathbf h_t=\sum_{b\in\{\mathrm{sink},\mathrm{archive},\mathrm{working}\}}\operatorname{softmax}\!\left(\frac{q_tK_{t,b}^{\top}}{\sqrt
        d}\right)V_{t,b}
      caption: 固定容量 KV cache 的 sink/archive/working 分区及跨 bank 注意力聚合；标准写法，非原文
    train: 摘要未给训练数据、训练目标和具体训练设置。推理时采用流式生成，在固定大小的 KV cache 中维护 sink、archive 和 working
      三个区域，并在注意力时使用 Bank-aware RoPE；摘要未给更具体的推理参数。
    diff: 已有 few-step 系统通常只保留开头帧与最近帧，Memory Forcing 则在相同固定缓存容量内增加专门保存多样中程事件的 archive
      区。它还通过 Bank-aware RoPE 处理绝对时间索引越出训练范围的问题。
    limits: 未见明确说明
    has_abstract: true
  citations: 0
  cpm: 0.0
  repro: paper_only
  inherited: 0
  inherited_by: []
  inherited_chain: 0
  concepts:
  - 旋转位置编码
  - 全局锚点KV
  - KV压缩或淘汰
- id: solarrenderer
  title: 'SolarRenderer: Few-Step Generative Reference Rendering'
  arxiv: '2610.28630'
  date: '2026-10-20'
  precision: day
  venue: Technical Report (Show Lab)
  lane: 代码世界模型
  branch: 神经渲染器
  parent: streamrender-h3
  link_strength: 同底座与同分工
  training: 需训
  status: 速读
  one_liner: 任意结构输进来，四步渲成实拍
  mechanism: control LoRA 教冻结的 MiniMax-H3 跟结构视频；少步 LoRA 带结构引导后训压到四步；block-causal 版按块出流
  tags:
  - 结构条件渲染
  - 四步LoRA
  - 未见结构泛化
  key_numbers:
  - 4 步（对比 50 步 12.3×）
  - 16 种结构，11 种训练未见
  - 208 例泛化基准
  - 53 段同分布测试
  - 136,289 训练片段
  - 4 个 LoRA（控制/四步 × 全片/流式）
  - 流式窗口 6 块 × 5 latent（约 20 帧/块）
  explain: 想象把摄像机轨迹、深度图或边缘骨架交给模型，它要四次“落笔”就生成连贯的实拍画面。SolarRenderer解决的是结构难跟、生成要反复采样、视频难实时流出的麻烦。它先训练控制LoRA（只增加少量参数的适配器），让冻结的MiniMax-H3跟随结构视频；再用结构引导训练少步LoRA，把50步压到4步，快12.3倍。先学会对齐“骨架—画面”，再压缩采样，所以控制和质量都能保住。流式版本采用block-causal机制（按块生成，只依赖当前及过去块）。模型用136,289段片段训练，覆盖16种结构，含11种未见结构，并在208例泛化基准、53段同分布测试上验证；四个LoRA覆盖控制/四步与全片/流式。
  detail:
    position: 把游戏引擎或 agent 产出的结构（点云、骨架、线框、深度、法线、体素、遮挡掩码等）直接渲成写实视频，让「谁定布局」和「谁定外观」彻底分开。
    io: 输入是一段结构视频（逐帧的几何/骨架/掩码信号）加一张参考图和一句文本；输出是同布局、同运动、同机位的写实视频。结构只编码布局与相机，纹理光照全部交给渲染器。
    steps:
    - 在冻结的 MiniMax-H3 上加 control LoRA，训练它把结构视频当条件通道读进去，参考图决定这一条片子的世界长什么样。
    - 用结构引导对少步 LoRA 做后训练，把采样步数从 50 压到 4，同时要求结构一致性不退化。
    - 同一套 LoRA 再训一个 block-causal 变体：按块生成、只看向过去，用于流式出画面。
    - 推理时结构从引擎/agent 来，参考图取第一帧，四步出片；流式版本按块推进。
    formulas:
    - tex: \mathcal{L}_{\mathrm{ctrl}}=\mathbb{E}_{t,\epsilon}\left\|\epsilon-\epsilon_{\theta+\Delta
        W_{\mathrm{ctrl}}}\left(z_t,t,c_{\mathrm{ref}},c_{\mathrm{struct}}\right)\right\|^{2}
      caption: 控制 LoRA 的训练目标：冻结主干 θ，只学增量 ΔW，让去噪网络同时吃参考图和结构条件。（标准写法，非原文逐字）
    - tex: \mathcal{L}_{\mathrm{few}}=\mathbb{E}_{t}\left\|v_{\theta+\Delta W_{\mathrm{few}}}(z_t,t)-v_{\mathrm{teacher}}^{\mathrm{sg}}(z_t,t)\right\|^{2}
      caption: 少步 LoRA 的蒸馏目标：以 50 步教师的速度场为目标（sg 表示不回传梯度），把 4 步学生的轨迹拉到教师轨迹上。（标准写法，非原文逐字）
    train: 136,289 条训练片段（公开 57,738 条带视频）；共 4 个 LoRA：控制与四步各一套，全片与因果流式各一套。
    diff: 和 StreamRender-H3 同底座同分工，但把「什么结构都能吃」做成主目标：16 种结构里 11 种训练时没见过，仍能渲染；HelixWorld/AlayaRenderer
      类工作通常只针对 G-buffer 或语义图一种条件。
    limits: 仍是 MiniMax-H3 这个量级的主干，四步也只是采样步数压缩，不是换小模型；结构视频本身要有正确的布局和相机，结构错了它不会纠正。原生脚本按
      bf16 装 135GB 且对全部帧做注意力，只有大卡能跑；ComfyUI 走 pruned INT8 加主机内存换页时 4090 能跑，但主机内存要 64GB 起，采样阶段常驻显存约
      6.6GB，实测 832×480 15 秒 8 步要 25 到 30 分钟，实时那套卖点在消费卡上兑现不了。
