    io: 输入是任务执行中的情节记录，输出是压实后的语义记忆加保留的情节条目，供策略在长程执行与跨任务时取用。
    limits: 只有机器人操作任务，零视频生成与渲染证据；98.20% 是 LIBERO 上的成功率，长任务与真机未报；剪枝阈值怎么定、误剪的代价没给。
    position: 长任务里被改过的物体离开视野后不再可见，VLA 要靠记忆维持状态；直接存情节会堆大量重复细节，容量被噪声吃掉，可迁移原则反而取不出来。
    steps:
    - 把大量情节记忆合成为一小组语义记忆，提炼可迁移的操作原则。
    - 找出内容已被语义记忆覆盖的情节条目并剪掉，腾出有效容量。
    - 在复杂任务上把多条情节与语义记忆组合成一次取用。
    - 在 LIBERO 与 LIBERO-Plus 上跨多个 VLA 骨干验证。
