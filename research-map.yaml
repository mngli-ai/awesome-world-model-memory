  date: '2026-11-06'
  detail:
    concepts:
    - 代码定状态
    - 结构条件渲染
    diff: 与 VideoCoCo 都把代码当结构与物理的载体，VideoCoCo 出的是一段程序，这条出的是可执行的 3D 场景渲染结果，并把执行反馈接进 RL 回路；与 SolarRenderer 同底座，区别是代码由模型现场写，不是外部给定的状态。
    formulas: []
    has_abstract: true
    io: 输入是文本提示，输出是 agent 写出的代码、代码执行渲出的草稿视频，以及下游生成器在草稿条件上出的最终视频。
    limits: 只报相对 MiniMax-H3 的差值，没有绝对分数；没有长视频与回访证据，草稿只在单段内成立；agent 写代码的失败率、执行耗时与渲染开销摘要未给。
    position: 文本或参考图当条件的生成器要自己猜场景几何，结构和运动容易飘；另一条路是用代码搭显式 3D 场景再渲成引导信号，但代码一直是人写的，模型没参与。这条问的是代码这一步能不能交给 agent，并且让它从执行反馈里学。
    steps:
    - 把提示交给 agent，它写代码并执行，搭出动态 3D 场景，渲成草稿视频。
    - 草稿同时给出空间结构与运动信号，作为下游视频生成器的条件。
    - 先在 6k 条带参考视频的数据上做 SFT，学会写能跑通的代码。
    - 再进 harness 做 agentic RL，执行奖励判代码是否跑通，视频奖励判成片质量。
    - 训练后期退火压执行奖励，让策略更多依赖视频奖励。
    train: 需训，SFT 6k 加 RL 2k，底座 MiniMax-H3；摘要未给模型规模、训练算力与 RL 步数，待核。
  explain: 这条跟我的管线是同一个骨架，只是代码那一段也交给模型了。它让 agent 自己写代码、自己执行，搭出一个动态 3D 场景渲成草稿视频，草稿给出结构与运动信号，下游生成器只负责把草稿变真，末端还留着一个 harness 把代码执行、3D 渲染、执行反馈串成可交互环境。训练分两段，先 6k 数据 SFT，再在 harness 里做 agentic RL，奖励两路，一路看代码跑不跑得通，一路看出来的视频好不好，并且把执行奖励随训练逐步退火，让后期主要听视频的。底座是 MiniMax-H3，跟我复现 SolarRenderer 用的是同一个，报的是相对它的差值，PhyGenBench 高约 7 分，VBench-2.0 高 24 分。对我有用的是两点，一是它证明代码生成这一环可以由模型现场做，不必人写规则；二是它把草稿视频当中间产物显式暴露出来，这正是我想要的 proxy，可以单独检查、单独打分，而不是埋在生成器内部。数字只有差值没有绝对值，长视频也没测，所以它给的是可行性而不是上限。
  id: video-coder
  key_numbers:
  - 比 MiniMax-H3 高约 7 分（PhyGenBench）
  - 比 MiniMax-H3 高 24 分（VBench-2.0）
  - SFT 数据 6k
  - RL 数据 2k
  lane: 代码世界模型
  link_strength: 与 SolarRenderer 同用 MiniMax-H3 底座，SolarRenderer 把外部代码状态渲成参考帧再交给少步 LoRA，这条让 agent 自己写代码搭场景出草稿视频，把代码生成这一步也交给模型
  links:
  - https://arxiv.org/abs/2611.09894
  - https://cywang735.github.io/Video-Coder/
  - https://github.com/CYWang735/Video-Coder
  mechanism: agent 自己写代码并执行，搭出一个动态 3D 场景渲成草稿视频，草稿给出结构与运动信号，下游视频生成器只负责把草稿变真；训练上先 SFT 再进 harness 做 agentic RL，奖励分执行与视频两路，后期把执行奖励退火压下去。
