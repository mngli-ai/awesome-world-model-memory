  note: 评测基准；造题成本高，师哥口径 300 条约 1200 美元
  venue: ''
  self_measured: []
  media: []
  parent: null
  link_strength: ''
  precision: day
  explain: 想象你写下一段代码：房间里有门、按钮和小车，按下按钮后门应打开，小车还要沿轨道前进。普通视频模型可能只画出像真的画面，却未必能让这些物体按规则运行。ExeWorldBench要解决的正是这个麻烦：代码生成的三维世界，不仅要好看，还要可执行、可交互、符合任务意图。它设计了三个递进任务，从实现单一机制，到组合多种机制，再到根据自然语言意图合成完整世界；并从视觉结构、机械运动、因果机制和目标满足四个维度评分。因果机制指一个动作能否按规则引发后续结果。这样评测能区分“会画场景”和“会造世界”。结果显示，面对13阶段任务，执行一致性指标ECM会降到短序列的五分之一，说明长链条规划仍是主要瓶颈。
  detail:
    position: ExeWorldBench 研究如何评估模型能否从世界信息中理解结构、机械与因果原理，并将其转化为可运行的代码式 3D 世界。它针对既有基准对物理推理、视觉保真度和行为正确性分散评估的问题，考察理解与实现能力的整合。
    io: 输入包括视觉观察，以及在意图驱动任务中给出的高层目标和物理要求。输出是代码构造的 3D 世界，其执行行为用于评估视觉结构、机械运动、可执行因果机制和目标满足。
    steps:
    - 从视觉观察中提取对象、空间关系与可能的运行机制，为构造可执行世界提供结构和物理依据。
    - 按任务难度要求生成代码式 3D 世界，从单个机制扩展到具有空间、机械和因果依赖的多阶段系统。
    - 在意图驱动任务中依据高层目标与物理要求合成世界，并通过运行结果检查目标是否实现。
    - 从视觉结构、机械运动、可执行因果机制和目标满足四个维度评估构造结果，以覆盖理解与执行能力。
    formulas: []
    train: 这是评测基准。摘要未给训练流程、推理流程及关键设置。
    diff: 相较于只评估物理推理、视觉保真度或行为正确性的既有基准，ExeWorldBench 将世界理解与代码式可执行实现纳入统一评估。任务从单机制逐步扩展到多机制组合和意图驱动的世界合成。
    limits: 摘要未明确说明评测代价与局限。
    has_abstract: true
