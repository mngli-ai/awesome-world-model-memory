  explain: 现在让 coding agent 现场做个小游戏，出来的画面基本是灰块加彩色几何体，能玩但难看。这篇的做法是把这种画面直接当输入，渲成有角色、有动作、有特效的样子，布局、相机、每个实体在哪一帧出现都不动。关键在于它不吃引擎 G-buffer，也不吃逐物体标签和低模代理，灰块、语义图、线框都能塞进去，这就等于把结构条件的门槛从三维中间产物降到了普通视频。它还顺手做了个实体级基准，专门数人群数量对不对、实体有没有在该消失的那帧消失，这比只看画面好不好看要实在。
  detail:
    position: AnyGameRenderer 解决 coding agent 现做的游戏画面过于简陋的问题，灰块、彩色图元和语义色斑没法直接用，它把这类低质画面转成有角色、有动作细节、有特效的高质量画面，同时保持布局、相机与每个实体的位置和出现时机。它把结构条件从引擎 G-buffer 降级为普通视频，因此不需要低模代理。
