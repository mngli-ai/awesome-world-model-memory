- id: anchor-forcing
  title: 'Anchor Forcing: Anchor Memory and Tri-Region RoPE for Interactive Streaming
    Video Diffusion'
  date: '2026-03-12'
  lane: 位置时间寻址
  branch: 重排位置
  training: 需训
  status: 速读
  one_liner: 三区RoPE加锚缓存，治换prompt掉画质
  mechanism: KV存进anchor cache，换prompt时热启动re-cache；三区RoPE各给参考原点，再蒸馏回预训练有界区间。
  tags:
  - 锚缓存
  - 三区RoPE
  - 换prompt交互
  key_numbers:
  - 摘要未给具体数值，仅称感知质量与运动指标优于流式基线
  - 需要 RoPE 重对齐蒸馏
  media: []
  links:
  - https://arxiv.org/abs/2603.13405
  - https://github.com/vivoCameraResearch/Anchor-Forcing
  note: 同时踩「锚」与「重排位置」两条，但主矛盾是无界时间索引 vs 预训练有界 RoPE → 判重排位置；与 grounded-forcing 的双参考
    RoPE 注入是同期同族，区别是它把分区与 prompt 切换绑定。
  arxiv: '2603.13405'
  explain: 想象你正看着一段直播生成的视频：女孩原本在海边奔跑，你把提示词改成雨夜街头，场景虽立刻变化，画面却突然变糊，动作也抖起来。麻烦在于，流式视频扩散模型只保留短暂上下文，换提示词后旧画面的视觉记忆难以接上。Anchor
    Forcing把历史注意力中的键值信息存进锚缓存，改词时用它热启动并重新缓存，让新内容接着旧记忆生成。它再用三区旋转位置编码（RoPE，一种让模型感知时空顺序的坐标方式），给参考、当前生成和过渡区域分别设原点；通过蒸馏把新位置关系压回预训练模型熟悉的范围。这样既减少位置错乱，又保持运动连贯，感知质量和运动指标都优于流式基线。
  detail:
    position: 这篇工作研究交互式长视频生成中切换 prompt 后画质下降，以及长时间生成时运动逐渐减弱的问题。它提出 Anchor Forcing，通过改进缓存维护和
      RoPE 位置编码来保留语义线索、近期视觉线索与运动先验。
    io: 输入是用于流式视频扩散生成的 prompt，以及按时间推进的视频生成状态；交互过程中可以切换 prompt。输出是响应 prompt 切换并持续生成的长视频，条件信号包括当前
      prompt、anchor cache 中的 KV 状态和近期 latent 线索。
    steps:
    - 生成过程中将 KV states 存入 anchor caches，以保留可供后续生成使用的语义上下文。
    - 发生 prompt 切换时，从 anchor caches 热启动 re-cache，减少切换边界处语义上下文与近期 latent 线索的丢失。
    - 对流式时间位置采用 tri-region RoPE，并为不同区域设置参考原点，以协调持续增长的时间索引与预训练模型的有界 RoPE 区间。
    - 通过 RoPE re-alignment distillation 对齐位置编码分布，以更好保留预训练运动先验和长程运动表现。
    - 继续进行流式视频生成，并在交互设置下评估感知质量与运动指标。
    formulas:
    - tex: \mathbf{H}_t=\operatorname{softmax}\!\left(\frac{\mathbf{Q}_t[\mathbf{K}_t;\mathbf{K}_{A}]^{\top}}{\sqrt{d}}\right)[\mathbf{V}_t;\mathbf{V}_{A}],\qquad
        (\mathbf{K}_{A},\mathbf{V}_{A})\leftarrow\operatorname{ReCache}(\mathbf{K}_{A},\mathbf{V}_{A};\,\text{prompt
        switch})
      caption: 利用 anchor cache 参与注意力聚合，并在 prompt 切换时热启动缓存重构；标准写法，非原文
    - tex: \tilde{p}(p)=o_r+\frac{p-b_r}{s_r},\quad p\in\mathcal{R}_r,\ r\in\{1,2,3\},\qquad
        \mathcal{L}_{\mathrm{RoPE}}=\sum_{p}\left\|\operatorname{RoPE}(\mathbf{x}_p,\tilde{p}(p))-\operatorname{RoPE}(\mathbf{x}_p,\operatorname{clip}(p,0,M))\right\|_2^2
      caption: 将三类时间区域分别映射到带参考原点的有界位置区间，并通过蒸馏对齐预训练 RoPE 分布；标准写法，非原文
    train: 训练阶段使用 RoPE re-alignment distillation，使流式时间位置与预训练 backbone 的有界 RoPE 区间相协调。推理阶段在生成中维护
      anchor caches，并在 prompt 切换时以其 KV states 热启动 re-cache。蒸馏配置、缓存大小及其他关键设置摘要未给。
    diff: 已有流式方法通常在每次 prompt 切换时重新维护 rolling KV cache，难以同时保留语义上下文与近期 latent 线索；Anchor
      Forcing 改用 anchor-guided re-cache。它还以 tri-region RoPE 和 RoPE re-alignment distillation
      应对无界时间索引造成的位置分布偏移。
    limits: 摘要未见明确说明具体计算与存储开销、适用范围或失败情形。
    has_abstract: true
