  detail:
    diff: 与 VPM 都锚在三维点运动上，区别是它完全不出像素、只在粒子空间生成，并且用一套权重覆盖多种材质。
    formulas: []
    has_abstract: true
    io: 输入是场景初始粒子状态与可选动作，输出是未来若干步的粒子与刚体运动轨迹。
    limits: 只在仿真里验证，无真实拍摄视频；粒子数上限与推理成本摘要未给；不含外观，无法直接当渲染条件。
    position: 视频世界模型生成的是外观，物理演化藏在像素里；物理仿真又按材质分域建模，一套权重覆盖不了多种材质。
    steps:
    - 把场景表示成物体感知的多分辨率粒子集合。
    - 用流匹配加 diffusion forcing 生成轨迹，跨训练时长保持连贯。
    - 统一一套权重覆盖刚体、形变、布料、颗粒。
    - 规划时在隐噪声里搜索能达成目标物体状态的交互。
    train: 需训，在自建 ParticleWorlds（2550 万帧）上训练。
  explain: 这篇走的是 proxy 那条路的极端版本，干脆不生成画面，世界状态就是粒子怎么动。GPWM 在三维物理空间里直接生成粒子与刚体的轨迹，用一个物体感知的多分辨率 transformer，把流匹配和 diffusion forcing 混着用，于是能滚到训练时长之外还不散。一个表示一套权重覆盖刚体、形变、布料、颗粒，被动物理和机器人交互都在内，这在以前是一类材质一个模型。数据是自己建的 ParticleWorlds，2550 万帧。六个物理域上平均误差降 31%，统一模型在两个域上还超过了自己的专家模型。最有意思的用法是规划，不去搜动作，而是在模型自己的隐噪声里搜，找那种能达成目标物体状态的交互，推和抓这两类接触密集的任务上明显好过动作空间搜索。对我而言它的意义是证明 proxy 可以完全脱离渲染独立存在，代价是这种 proxy 不含外观，要出画面还得再挂一个渲染器，而这正好是我那条管线缺的那一环。
