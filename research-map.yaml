    diff: 与定长切段的记忆 agent 比，它把边界交给输入结构并显式写结构路径，还多一层跨段直连；与 se-mem 比，那条按语义与情景两层存、按可见性取，这条不重写记忆内容，只重写段与段的连接方式。
    formulas: []
    has_abstract: true
    io: 输入是超过上下文的结构化长文档与查询，输出答案；中间产物是按子树切出的段、段上的结构路径，以及子段到父段的残余链接。
    limits: 只在文本类结构化输入上验证，无视觉无视频；3.61% 是八个任务的平均，单项幅度未给；理论只覆盖段数上界；未报检索延迟与存储开销；正文未读。
    position: 我的切段是定长六块，地址是块号，取用只看最近。这条说切段要跟着结构走，地址要写清在结构里的位置，并且要有绕开顺序更新的直连。搬到我这套上，段的边界该跟着场景实体走，每段记下它在实体树里的路径，再给关键实体一条直连到它首次出现的块。
    steps:
    - 按输入层级用完整子树与相邻兄弟子树成段，避免把同一记录的字段切开。
    - 给每段附结构路径，让 agent 能定位祖先与层级位置。
    - 加残余记忆链接，从低层子段直连高层父段，越过逐段更新。
    - 用段数上界指导 token 预算，使其与定长切段的段数可比。
    - 在四个记忆 agent、八个检索与聚合任务上比，输入 8K 到 1M token。
    train: 免训。不改模型权重，只换分段方式与取用路径，四个既有记忆 agent 直接套用。
  explain: 超过上下文的长文档要分段处理，常规做法是按定长切，一段一段往后压进有界记忆。这种切法有两个后果，同一条记录的字段可能被切到两段，段与段之间也看不出谁是谁的父节点；更要紧的是记忆是逐段累加的，早先的兄弟段在后来的更新里被压掉，后面要推理时已经取不到了。这条的改法是把切段的边界交给输入本身的结构，用完整子树和相邻兄弟子树成段，段上写一条结构路径当地址，agent 据此知道自己的祖先是谁、在树里什么位置，再补一层残余链接让低层子段直接连到高层父段，绕开逐段更新这条路。四个既有记忆
    agent 直接套用，八个任务上平均涨 3.61%。对我的意义在地址：我的六块窗口是按块号数的定长段，取的是最近六块，和它要修的那个毛病是同一个。
  id: treeagent
  key_numbers:
