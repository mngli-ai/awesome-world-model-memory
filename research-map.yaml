    train: 训练数据约为 213K 个带 metric-scale 位姿监督的公开视频片段；训练耗时 15 天，使用 64 张 H100。推理时生成 60
      秒视频可在单张 GPU 上完成；蒸馏版本经 NVFP4 量化后可部署于单张 RTX 5090，并以 34 秒对 60 秒 720p 视频去噪。摘要未给出优化器、损失函数和训练阶段的具体设置。
    diff: 相较于摘要提及的既有开源基线，SANA-WM 将 frame-wise Gated DeltaNet 与 softmax attention 结合，并采用双分支相机控制、长视频细化和
