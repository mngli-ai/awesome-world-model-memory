  detail:
    diff: 与 dKV Forcing 都在动 KV，区别是它把历史真的压进低位存储而不是挑维度重算；与 VAR-Q 都做低位，区别在它按簇中心加残差编码且对 K/V 用不同目标。
    formulas: []
    has_abstract: true
    io: 输入是历史 KV 缓存，输出是簇中心加低位系数组成的压缩表示，解码后近似还原 KV 供注意力使用。
    limits: 只在三个自回归视频骨架上测，最好倍数是 HY-WorldPlay 的 26.09 倍；拟合编解码器的训练开销未报。
    position: 自回归视频模型的 KV 缓存随 rollout 线性增长，存不下也算不动；激进压缩掉质量，只压不重建又省不到注意力计算。
    steps:
    - 按 token 与头聚簇，把共享内容存成簇中心。
    - 把联合的头通道残差编码成低位系数。
    - Key 侧以保住下游块输出为目标训解码器。
    - Value 侧沿部署的量化路径做重建拟合。
    - 可选 Fast 变体复用系数做混合维度注意力，不改主干。
    train: 主干冻结，但编解码器要离线拟合，属需训外挂。
  explain: 自回归视频的历史全在 KV 缓存里，rollout 越长缓存越存不下，注意力还越算越慢。压狠了画质崩，只压不重建又省不到计算。NanoKV 的分解是两份：跨 token 跨头重复的那部分存成簇中心，剩下的头通道残差编成低位系数。真正有意思的是它给 K 和 V 用了不同的拟合目标，K 的解码器只要保住下游块的输出就行，V 的编解码器要求沿部署时的量化路径忠实重建，因为两者在注意力里的角色本来就不一样。这样在 HY-WorldPlay 上做到 26.09 倍有效压缩，PSNR 还比 KVTC 高 1 dB。对我关心的是它把六块窗口的存储成本直接降了一个量级，代价是多一套离线拟合。
