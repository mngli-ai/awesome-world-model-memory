- arxiv: '2611.14033'
  branch: 因果蒸馏
  concepts:
  - 少步蒸馏
  - 流式分块推理
  - 自回放训练
  date: '2026-11-10'
  detail:
    concepts:
    - 少步蒸馏
    - 流式分块推理
    - 自回放训练
    diff: 与 DMD 比省掉独立假分数网络；与 S2-Avatar 比只改蒸馏项的来源不改生成结构；与 SolarRenderer 比不动块窗口，只动步数与蒸馏形式。
    formulas: []
    has_abstract: true
    io: 输入是文本条件与流式块的历史状态，输出 180 秒连续音视频；中间产物是每块的速度场，生成与假估两次前向共用同一套参数。
    limits: 只在音视频数字人上验证，180 秒、每块三次骨干评估；运动质量低于基线，音画同步打平；显存与迭代时间只给相对值；摘要未给代码与项目页。
    position: 我在 4090 上跑四步 LoRA 加 INT8，显存最紧的地方不是骨干而是蒸馏时那份假分数网络，它还要跟着生成器一起更新。APEX 把这份网络省掉，用同一套参数在移位条件下自估，正好对上我这条链上步数已经降了但训练成本没降的缺口。
    steps:
    - 在 S2-Avatar 的流式设定上保留冻结参考教师、Self-Replay Forcing 与感知正则。
    - 把分布匹配蒸馏的假分数网络去掉，用生成器自身参数在移位条件下估生成分布的速度场。
    - 每块跑三次骨干评估，配一步空间 Refiner，在 180 秒视频上评。
    - 用 70 例人类评测与 320 例 StreamAV-Bench 比，另量同训练设定下的显存与迭代时间。
    train: 需训。在 S2-Avatar 上做少步蒸馏，教师冻结，生成器与假估共用参数。
  explain: 少步蒸馏一般要另训一个假分数网络给生成器当裁判，代价是显存和它得跟着生成器一起漂。APEX 把这一步换成同一套参数换条件自己估：原条件负责生成，移位条件负责估假分布的速度场，裁判和选手共用权重。它在 180 秒的音视频流上做，保留 S2-Avatar 的冻结参考教师和 Self-Replay Forcing，再配一步空间 Refiner。数字上指令遵循 3.856 对 3.831、美学 0.641898 对 0.632606、人类评测指令遵循净偏好 +30.0%，代价是运动质量不如基线、音画同步打平，同训练设定下峰值显存低 4.4%、单次迭代短 9.2%。对我的意义在训练账上：四步 LoRA 之外再挂一个假分数网络是我现在的显存大头，这条给的是一条省掉它的路。
  id: apex-stream
  key_numbers:
  - 180 秒视频，每块三次骨干评估加一步空间 Refiner
  - 指令遵循 3.856 对 3.831
  - 美学 0.641898 对 0.632606
  - 人类评测指令遵循净偏好 +30.0%，一致性与视频质量各 +4.3%
  - 同训练设定下峰值显存低 4.4%，单次迭代短 9.2%
  lane: 训练侧
  link_strength: 与 SolarRenderer 都在把多步扩散压成少步流式生成，SolarRenderer 动的是四步 LoRA 加固定块窗口，APEX 不动块结构，动的是少步蒸馏里假分数网络的来源，用同一套参数换条件自己估
  links:
  - https://arxiv.org/abs/2611.14033
  mechanism: 把分布匹配蒸馏里独立的假分数网络去掉，用生成器自身的同一套参数在移位条件下估生成分布的速度场；原条件选生成，移位条件选假估，同时保留冻结参考教师、Self-Replay Forcing 与感知正则。
