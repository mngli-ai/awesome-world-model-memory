  date: '2026-11-03'
  detail:
    diff: 与 Any Forcing 比，同为免训改历史访问，它不改位置也不挑内容，只限提交时可读范围；与 FadeMem 比，FadeMem 按时间距离把旧 KV 合并压缩，它保留原条目但串成链。
    formulas: []
    has_abstract: true
    io: 输入是预训练自回归视频生成器与流式块序列；输出是与原生成器接口一致的长视频，提交时的 KV 读取集合被限制在前一块。
    limits: 没有提交链长度对画质上限的分析；只在 1.3B 级生成器上验，更大模型与更强几何条件未测；链式提交是否让长程信息衰减过快没有单独消融。
    position: 主流做法把历史既当去噪条件又当写入输入，滑窗丢早期帧或者钉住 sink 帧，KV 的读取集合与写入集合不区分，提交阶段读到多少历史没人管。
    steps:
    - 把生成拆成去噪与提交两相，提交指把去噪后的干净块编码成后续块要读的 KV。
    - 在固定上下文尺寸与固定时间位置下扫提交相读到多少历史，测主体一致性随上下文扩张的变化。
    - 观察到曲线先升后降，证明存在有益去噪却有害提交的旧历史。
    - 提出 Commit Forcing，提交时每块只读前一块的 KV，更早历史沿链间接传递。
    - 在 6 个预训练生成器上免训套用，测 60 秒与 240 秒 VBench，并在 120 秒 LongLive 上做盲测。
    train: 免训，直接在预训练生成器上加规则，不改权重。
  explain: 这篇把此前混在一起的两件事拆开了。自回归长视频里每个干净块要被编码成 KV 给后面的块读，这一步叫提交，而同一个干净块在不同历史条件下会编出不同的 KV。作者把历史的用途分成两种，去噪时当条件看，提交时当输入看，然后指出一件反直觉的事，支持去噪的旧历史在提交阶段反而有害，在上下文尺寸和时间位置都固定的情况下，旧历史越多，clip 到 clip 的主体一致性越低。解法很轻，提交时只让当前块读前一块存下的 KV，更早历史只能沿这条链一站站传，旧内容不会直接污染新写进去的条目。六个预训练生成器上免训直接加，60 秒 VBench 的 Quality 与 Total 全部提升，240 秒仍有效。对我这条线这是很直接的证据，我那六块窗口是硬截断的写入集合，它说明问题可能不在窗口多大，而在写入时读了谁，把提交相单独限流可能比换更大的 cache 更划算。
  id: commit-forcing
  key_numbers:
  - 60 秒 VBench 上 6 个预训练生成器 Quality 最高 +1.27、Total 最高 +1.10
  - 一致性增益延伸到 240 秒视频
  - 120 秒 LongLive 盲测胜率 83.5% 主体与场景一致性、82.9% 整体偏好
  lane: 位置时间寻址
  link_strength: 与 Any Forcing 同为免训改历史访问，但 Any Forcing 挑内容再重写时间位置，它不改位置只限提交时可读范围；与 FadeMem 相反，不按距离合并而是把写入串成链
  links:
  - https://arxiv.org/abs/2611.00937
  mechanism: 把干净块编码进 KV 的提交过程串成链，提交时只允许读前一块已存的 KV，更早的历史只能沿链间接传过来，使去噪时的条件历史与提交时的写入输入分开，上下文尺寸与时间位置均保持不变。
  media: []
