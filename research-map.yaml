    diff: 相较于各模型使用不同控制接口的既有做法，WorldMark 以 WASD 共享词表和模型适配器统一动作语义。相较于将动作跟随压缩为轨迹或方向误差的评估方式，它逐轴评估方向准确率、方向纯度、响应延迟和运动稳定性，并结合世界记忆与视觉质量套件。
    limits: 每个新模型需要新增一个适配器。摘要未见明确说明其他代价与局限。
