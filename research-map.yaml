    position: 线性注意力把历史压进固定大小的递归状态，降精度能省每次请求的存储，但量化写入的误差会进入后续每一次递推，在长推理任务上既掉分又容易伴随重复生成与超长输出。已有的训练后量化方法给所有头同一个位宽，也不区分刚写进来的与压了很久的。
