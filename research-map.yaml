  - 多阶段课程
  explain: 这篇是完整系统，8B 主干，能做多轮交互，能连续控相机。真正值得记的是它对上下文的分层处理：视频说明这种描述性上下文允许跨段一直看得见，因为它描述的是场景是什么样，不会过期；动作指令只允许它在自己的时间窗里被看见，因为旧指令一旦跨段还活着，模型会把上一步的动作重复施加到当前状态上。这两类内容都躺在同一份缓存历史里，靠注意力掩码区分可见性，等于用掩码给内容分地址。这个思路比一味延长上下文便宜得多，也比我见过的按时间衰减更可控，因为衰减是软约束，掩码是硬约束。训练上用多阶段课程把因果生成、文本交互、相机控制、自生成历史一个个加进去，最后蒸馏到少步。摘要里没有数字，只有人评更好这一句，所以它的收益幅度只能回正文看。另外它放出了权重、代码和基准，这一点比很多只给项目页的工作实在。
  detail:
    position: 交互式世界生成要求模型连续跟随指令并保住相关历史与动作后果，而单段生成的模型没有跨段记忆，历史一长要么丢上下文要么被旧指令污染。
    io: 输入自由文本指令、连续相机控制与多模态交互历史，输出可变长的视频片段。
    steps:
    - 把结构化视频说明与动作感知的因果注意力对齐，描述性上下文跨段可见，动作指令只在其时间窗内可见。
    - 视觉语言 Prompt Enhancer 把用户请求与交互历史翻成下一段的结构化条件。
    - 生成时以当前输入加缓存历史为条件，产出变长片段。
    - 多阶段课程依次引入因果生成、文本交互、相机控制、自生成历史训练。
    - 最后做扩散蒸馏压缩采样步数。
    formulas: []
    train: 需训练 8B 扩散主干，多阶段课程加扩散蒸馏，自生成历史那段相当于自回放。发布权重、代码与基准。
    diff: 与每段独立生成再拼接相比，它让描述性上下文跨段可达而动作指令被锁在自己时间窗内，等于给不同内容不同地址规则；与把历史一视同仁塞进上下文相比，旧指令不会越权影响后面的段。
    limits: 摘要只有人评优于现有世界模型，没有分数与自动指标。缓存窗口长度与淘汰规则未述。8B 主干的实际推理成本摘要未讨论。演示与项目页未见。
    has_abstract: true
  concepts:
  - 分块因果缓存
  - 结构条件渲染
  - 动作条件控制
