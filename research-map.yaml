    diff: 与按位姿查视图的记忆库比，它把检索方向反过来，文字当查询键；与渲染再比对的视觉定位比，它查询期不做在线渲染也不调大模型，延迟压到查表级。
    formulas: []
    has_abstract: true
    io: 输入是文本查询或一张查询图像，输出是该高斯资产坐标系下的相机位姿与对应视图，附检索成功与否的判断。
    limits: 只在九个开发场景上评，未见独立测试集；描述生成的成本与质量依赖未讨论；无时序，多个时刻的同一地点怎么区分没写；不生成视频，回访一致性不在评测范围。
    position: 已有大量重建好的高斯场景资产，要从中找回某个地方通常靠视觉检索加位姿回归，或者在线渲染再比对，路径长、要调大模型、还要场景专属网络；语言是自然的查询方式，但文字与场景坐标之间缺一个可查的绑定。
    steps:
    - 把高斯场景渲成视图，给每条视图绑结构化描述、已知相机位姿与地点标识，构成可语言检索的索引。
    - 文本路线走语义与词法两路检索选视图，查询期不渲染、不调 VLM。
    - 图像路线用 LoGS 几何估计，按内点查询关键点过滤，跳过光度精修。
    - 命中视图后直接返回其位姿坐标，接受即用。
    - 在九个开发场景上评 Top-1、Top-5 的联合相关性与有效性，以及与对照实现的差距。
    - 另做缓存复算与匹配对照，检查位姿接受的假接受与假拒绝率。
    train: 不适用，不在场景上训练位姿网络，检索器与外挂描述都是离线的。
  explain: 它做的是把「用什么地址去取」这件事翻了个方向。常规做法是给定位姿去查历史视图，它反过来，先给高斯场景渲出的每张视图绑上结构化文字描述、相机位姿和地点标识，做成一本文本可检索的索引，查询时用语义加词法两路找视图，命中就直接返回那张视图在资产坐标系里的位姿。关键在查询期不渲染、不调 VLM、不要场景专属的位姿回归网络，所以延迟是 0.020 秒这个量级，等于查表。它还留了一条图像路线，用户给一张图，用 LoGS 的几何估计加内点关键点过滤去筛，跳过光度精修，只要位姿坐标被接受就直接用。数字上，九个开发场景上文字路线 Top-1 58.3%、Top-5 78.3%，它自己的 CityLoC 复现加精修只有 26.1% 和 34.6%，图像路线 97.3% 位姿成功率在 1 米 2 度阈值下，假接受 0.707%、假拒绝 1.142%。对我这条线，这是把语言当成地址的一种实现，proxy 是结构化张量，如果我把视图和它对应的代码状态标识、位姿一起编进索引，那么回到上次看过的那个墙角这一步就能走文字查表而不是检索潜变量，代价是索引要离线建，而且它只在高斯资产上验证过，没有跨时间的状态变化。
