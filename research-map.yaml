  note: 仅摘要级【摘】；报告只在 §1.3、§1.2 失效机制、§8.4 三处提及名字。
  tags:
  - 深度反投影
  - 几何缓存
  explain: 就像在房间里给家具画速写，如果每次眨眼都要重新用尺子量一遍每个柜子的距离，效率会特别低。这篇论文想解决模型重复推算三维空间深度的开销问题。它提出的招数是显式几何缓存，也就是直接在物理空间里建一个带坐标的记忆本，把估计出来的物体形状与距离存进去。这招管用是因为后续观察同一位置时，模型可以直接翻看之前存好的空间坐标，省掉了重复推测几何的时间。不过它强依赖深度测量的准确度，在动态物体移动的场景下这套缓存容易失效。
  detail:
    position: SPMEM 针对自回归视频 world models 的有限时间上下文导致重访场景时遗忘既有环境、难以保持长期一致性的问题。它引入几何支撑的长期空间记忆，以帮助模型在重访时恢复先前生成的场景信息。
    io: 输入包括视频生成上下文以及动作等控制信号，例如 camera movements、text prompts；模型输出后续视频帧。框架还使用长期空间记忆存储和检索场景信息，具体信号格式摘要未给。
    steps:
    - 根据生成过程构建显式的几何空间记忆，以便将场景信息保存在有限时间上下文之外。
    - 在场景需要重访时从长期空间记忆中检索相关信息，以缓解模型对先前环境的遗忘。
