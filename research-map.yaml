  date: '2026-11-01'
  detail:
    diff: 与在 KV 或潜变量里存历史的做法不同，它的历史不是被检索的帧或 token，而是可重新渲染的显式几何；与 L3G-World 一类潜空间高斯记忆相比，它把重建与生成统一在一条流式因果链路里，不靠记忆更新器与生成交替跑。
    formulas: []
    has_abstract: true
    io: 输入为 1 到 7 路相机视角、相机位姿、动作与布局等异构条件，输出多视角一致的长时程未来视频，并可接闭环仿真与策略学习。
    limits: 产业技术报告口径，摘要没有回访一致性与记忆失效的定量指标，也没说高斯记忆的容量上限与淘汰规则；主体是驾驶与机器人场景。
    position: 长程多视角生成里几何与外观会随时间漂，靠隐式上下文记不住整个场景。它把静态与动态三维高斯当持久场景上下文，每次生成都从这份显式几何渲出条件，同时用门控线性注意力压住流式推演的 KV 开销。
    steps:
    - 单次前向从多视角多时相观测重建静态与动态三维高斯，作为跨时间跨视角共用的持久场景。
    - 把这些高斯的渲染结果当显式场景上下文拼进条件，长程生成中的几何与外观由此锚住。
    - 视角-时间注意力加多视角旋转位置编码，统一编码跨视角与跨时间的位姿关系。
    - 时序层换成门控线性注意力，降低多视角滚动推演的计算量与 KV cache 占用。
    train: 需训，三阶段。预训练用单视角 480p 学动态先验，中训练加入多视角与相机、世界控制条件，后训练做蒸馏；语料 12.6M 训练片段，含通用视频、驾驶与机器人数据以及稀有物理事件。
  explain: 这条跟我 proxy 那一层几乎是同一个分工，只是它做在驾驶上。它不靠隐式上下文记场景，而是每步从多视角多时相的观测里单次前向重建一批静态加动态的三维高斯，把这些高斯渲出来的结果当显式场景上下文喂给生成，几何与外观因此能在长时程里锚住，这就是我的 proxy 想干的事。第二件事更对我的痛点，它在时序层塞了门控线性注意力，把多视角滚动推演的计算和 KV cache 一起压下去，等于承认纯靠
    KV 记不住分钟级的驾驶场景。视角和时间的位置关系用多视角 RoPE 编，视角之间的信息交换走视角-时间注意力。项目页给的规模是 12.6M 训练片段、1 到 7 路视角、七视角约 45 秒连续推演，三阶段预训练中训练后训练。要注意它是产业报告口径，回访一致性和记忆容量上限都没给数字，能搬的是分工和压 KV 的手段，不是它的具体指标。
  id: xiaomi-auto-wm-2
  key_numbers:
  - 12.6M 训练片段
  - 1-7 路视角
  - 约 45 秒七视角推演
  - 480p 与 540p 两档
