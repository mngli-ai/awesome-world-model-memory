  training: 需训
  status: 速读
  one_liner: 组内 Echo 系列：记忆加位置重写路线
  mechanism: 报告只在 L2『压缩 KV / 摘要槽』一级把它与 WorldTrace-Field 并列，未述具体读写。
  key_numbers: []
  self_measured: []
  media: []
  links:
  - https://arxiv.org/abs/2603.12513
  note: 同上，来自 §3.6 合并提及 + §12 历史文献；L2 级归属来自 §1.3 表格。
  tags:
  - 摘要槽压缩
  - 位置重写
  explain: 就像把上百页旧笔记浓缩成几张便签夹在书前，翻阅时页码却全乱了套。大模型也面临这种麻烦：为了省显存，它需要用摘要槽把冗长历史压缩进键值缓存——也就是模型暂存上文信息的记事本，但压缩后原本标明词语先后顺序的位置编码就会失真。MemRoPE
    走的是记忆结合位置重写路线，直接对压缩后的记忆重新分配位置坐标。这招管用在于，它既把庞大历史打包进紧凑的记忆槽节省了空间，又靠重写位置帮模型捋顺了时间线，在查阅压缩记忆时依然能分清先后因果。
  detail:
    position: MemRoPE 解决自回归视频扩散长时生成中滑动窗口丢弃历史上下文，导致画面保真度下降、身份漂移和运动停滞的问题。它通过固定大小缓存保留历史信息，并适配随视频演进的内容。
    io: 输入是自回归视频扩散过程中的当前生成上下文及历史注意力键，输出是用于后续帧生成的注意力信息和视频帧。摘要未说明具体条件信号。
    steps:
    - 缓存未施加 RoPE 的历史键，避免不同时间位置的旋转相位干扰后续聚合。
    - 用指数移动平均将过去的键持续压缩为长期和短期两路 Memory Tokens，分别保留全局身份信息与近期动态。
    - 在注意力计算时动态施加 RoPE 位置编码，使压缩后的键能够按当前注意力位置参与计算。
    - 在固定大小缓存中使用记忆信息支持后续帧生成，从而避免生成时长增长导致缓存不断扩张。
    formulas:
    - tex: m_t^{(L)}=\beta_L m_{t-1}^{(L)}+(1-\beta_L)k_t,\qquad m_t^{(S)}=\beta_S
        m_{t-1}^{(S)}+(1-\beta_S)k_t
      caption: 标准写法，非原文：用不同平滑系数的指数移动平均形成长期与短期记忆键。
    - tex: \operatorname{Attn}(q_t,M)=\operatorname{softmax}\!\left(\frac{(R_tq_t)(R_tM)^\top}{\sqrt{d_k}}\right)M
      caption: 标准写法，非原文：对未施加 RoPE 的记忆键在注意力计算时动态施加位置旋转，并进行注意力聚合。
    train: 该方法是 training-free 框架，无需训练。推理时通过长期与短期 Memory Tokens 压缩历史键，并在注意力计算时动态应用
      RoPE；具体更新公式、超参数和实现设置摘要未给。
    diff: 已有方法通常将固定的一组早期 token 作为 attention sinks，但静态锚点无法反映不断增长的视频内容。MemRoPE 联合使用双路记忆压缩与在线
      RoPE 索引，使历史聚合和固定大小缓存相互配合。
    limits: 未见明确说明
    has_abstract: true
