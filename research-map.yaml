  lane: 代码世界模型
  branch: 可执行评测
  one_liner: 测代码能不能造出可执行的 3D 世界
  mechanism: 三个递进任务：单机制可执行、多机制组合可执行、意图驱动的世界合成；四维打分=视觉结构、机械运动、可执行因果机制、目标满足
  tags:
