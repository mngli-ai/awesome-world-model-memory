  detail:
    concepts:
    - 记忆评测基准
    diff: 常规做法只看准确率，模型可以绕开图记忆从文本里抄答案，准确率照样高；换图测试把记忆被使用与答对分开，还能反过来定位是编码器丢信息还是融合层丢信息。
    formulas: []
    has_abstract: true
    io: 输入是一集路线观测构成的场景图与问题，输出是答案；测试时把图换成另一集的图，看答案变不变。
    limits: 只有 2 到 7 个房间、静态场景图，不测时间轴上的遗忘与更新；结论绑定在被测的那个微调 VLM 上，不能直接外推到视频世界模型；摘要未给绝对准确率与题量，待核。
    position: 具身问答需要一份看到过什么的记忆，场景图是自然的载体，但答对率高不能证明图里真装着这一集的事实，也不能证明模型真的用了它。这条把有没有用单独拿出来测。
    steps:
    - 用 2 到 7 个房间的路线搭具身问答基准。
    - 图记忆分别以文本、图编码器、每节点单独 token 三种方式送给同一个微调过的 VLM。
    - 换图测试，把另一集的图塞进去，统计答案翻转比例，翻转多才算真用了。
    - 用这套指标反查送达方式，指出池化与后融合把信息丢了。
    train: 需训，被测 VLM 在本基准上微调；换图测试本身免训。
  explain: 这条是评测方法，但它问的问题正是我关心的第三个，记忆到底有没有被取到。做法很干脆，把这一集的场景图换成另一集的，如果答案不变，那说明模型压根没用这份图，可能是从别的地方抄的。它用这个测法比较了三种送达方式，文本直接给最强，路线问题上加 30 点，图编码器给进去反而没用，因为池化与后融合把信息丢了，改成每个节点单独一个输入 token 能捞回 8.3 点，而且换图测试确认这 8.3 点确实来自图。它还揭了一个准确率看不出来的捷径，同样的信息写在文本里时，模型会忽略图。对我有用的是这个测法的形式，我评回访一致性时也可以做类似的替换，把关键历史证据换掉，看画面变不变，而不是只看画面像不像。
  id: graph-swap
  key_numbers:
  - 文本送达路线题加 30 点
  - 每节点单独 token 加 8.3 点
  - 2 到 7 个房间的路线
  lane: 评测基准
  link_strength: 与 MIST 都把记忆出问题拆成可分辨的几种，MIST 分开没执行改变与忘了，它用换图测试直接问模型到底有没有用上这份图记忆
