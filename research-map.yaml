  links:
  - https://arxiv.org/abs/2610.20693
  note: 测两个不同信号：模型自己造出来的内容回头还在不在（content persistence），以及多视角是否描述同一场景（3D self-consistency），长分钟级探索才算过关。
  arxiv: '2610.20693'
  explain: 想象你在一段生成视频里走进房间，转身离开，再回来：桌上的杯子还在原处吗？许多视频看起来连贯，却可能在镜头转开后悄悄改写场景，难以判断它们是否真的维持同一个三维世界。Orbia用720个带有位置标记的场景实例，测试27个模型，并设计六种“探索后重访”的过程，让模型生成离开前后的画面。它比较重访区域与第一次生成的内容，也检查不同视角下的深度和图像特征是否对得上、区域大小是否稳定；最后把未参与测试的三维高斯场景重新渲染，检验能否还原画面。三维高斯是一种用许多带颜色与形状的空间点表示场景的方法。这些检查分别追问物体有没有变、空间关系是否一致、场景能否重建，因此比只看单段视频是否逼真，更能揭示生成内容能否持久且自洽。
  detail:
    position: Orbia 研究视频生成模型在探索与重访过程中，生成画面是否持续对应同一个 3D 世界。它提供系统化基准，评估输入场景是否被保留、模型新生成的内容是否持久，以及不同视角是否符合
      3D 自一致性。
    io: 输入是场景与交互探索和重访过程，模型可由文本、动作或相机条件驱动。输出是针对外观、几何、空间稳定性、生成内容持久性和 3D 自一致性的评估结果。
    steps:
    - 汇集公开数据集、自采场景和仿真场景，构建带有注册 RGB-D 参考与标注锚点的数据实例，以便对生成结果进行参照评估。
    - 按六种探索与重访协议控制场景交互，并记录模型在探索和返回场景时生成的视图，以测试短期及长期一致性。
    - 将重访时输入图像中未出现区域的生成结果与其首次观测比较，以衡量模型是否保留自己创建的内容。
    - 利用跨视角深度与特征对应、区域尺度一致性及留出 Gaussian 渲染，检查不同视图能否描述同一个 3D 场景。
    - 结合参考图像与标注锚点评估外观、几何和空间稳定性，并在多种模型上运行基准以诊断一致性问题。
    formulas: []
    train: 摘要未说明训练流程；评测覆盖 27 个文本、动作和相机条件模型，并通过 native-interface adapters 接入。摘要未给出推理时的关键参数设置。
