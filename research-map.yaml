- id: spatial-ttt
  title: Spatial-TTT
  date: '2026-03-12'
  lane: 参数化记忆
  branch: 测试时训练
  training: 训练+测试时训练
  status: 速读
  one_liner: fast weights 组织空间证据
  mechanism: 用 TTT 更新部分参数承载长程空间证据；大块更新并行+滑窗注意力；3D 时空卷积做空间预测，稠密 3D 描述数据引导写入。
  tags:
  - 快权记忆
  - 大块更新
  - 空间预测
  key_numbers:
  - 视频空间基准SOTA
  - 摘要未给具体数值
  media: []
  links:
  - https://arxiv.org/abs/2603.12255
  - https://liuff19.github.io/Spatial-TTT
  note: 参数化记忆泳道里最贴"空间结构化写入"的一篇；关键问题是条目间的空间组织方式（3D 卷积 + 稠密描述监督）。
  arxiv: '2603.12255'
  explain: 想象机器人看着一段长视频：杯子被人拿起、移到桌角，模型得记住它的位置，才能判断接下来会怎样。普通方法难以留住远处画面的空间线索，若反复处理全部历史，计算又很费。Spatial-TTT用“快速权重”存证据：一部分模型参数会随视频输入更新，像一本可改写的记事本。它把大块更新并行处理，再用滑动窗口注意力聚焦近期画面；三维时空卷积从连续画面中预测空间变化，稠密三维描述数据则帮助挑选该写入的线索。这样既能保留长程空间信息，也能控制计算量，在视频空间基准上达到当前最佳表现；摘要未给出具体分数。
  detail:
    position: Spatial-TTT 解决长视频流中如何持续选择、组织并保留 3D 空间证据的问题，目标是提升长时程视频空间理解能力。其重点不是单纯扩大上下文窗口，而是让模型通过
      test-time training 持续更新部分参数。
    io: 输入是连续的视频帧；模型输出用于空间理解的空间证据或预测，具体任务输出形式摘要未说明。稠密 3D 空间描述用于引导空间信息写入，摘要未说明推理时是否需要额外条件信号。
    steps:
    - 将视频帧送入混合架构，并通过滑动窗口注意力处理局部时序信息，以控制长视频处理开销。
    - 按大块并行更新 TTT 层中的 fast weights，使其逐步承载和组织跨较长时间范围的空间证据。
    - 在 TTT 层加入基于 3D 时空卷积的空间预测机制，促使模型学习帧间几何对应关系与时间连续性。
    - 利用稠密 3D 空间描述数据引导 fast weights 的更新，使全局 3D 空间信号得到结构化记忆。
    formulas:
    - tex: W_{t+1}^{\mathrm{fast}}=W_t^{\mathrm{fast}}-\eta\nabla_{W_t^{\mathrm{fast}}}\mathcal{L}_{\mathrm{3D}}\!\left(\operatorname{Conv3D}(X_{t-k:t};W_t^{\mathrm{fast}}),\,Y_{t-k:t}^{\mathrm{3D}}\right)
      caption: 标准写法，非原文：通过 3D 时空预测损失在测试时递归更新 fast weights，使其持续写入长程空间证据。
    - tex: \mathcal{L}_{\mathrm{3D}}=\frac{1}{|\Omega|}\sum_{(x,y,z)\in\Omega}\left\|\hat{S}_{t}(x,y,z)-S_{t}^{\mathrm{3D}}(x,y,z)\right\|_{2}^{2}
      caption: 标准写法，非原文：利用稠密 3D 空间描述监督时空卷积预测结果，约束帧间几何对应关系与时间连续性。
    train: 摘要说明构建了稠密 3D 空间描述数据，用于引导模型更新 fast weights；未给出训练目标、优化细节或关键超参数。推理时面向视频流处理，采用滑动窗口注意力与大块并行
      TTT 更新；具体更新频率和推理设置摘要未给。
    diff: 相较于仅依赖更长上下文窗口的做法，Spatial-TTT 通过 test-time training 更新部分参数来保留长程空间证据。它还结合大块并行更新、滑动窗口注意力、3D
      时空空间预测机制及稠密 3D 描述数据来组织空间信息。
    limits: 摘要未见明确说明计算与显存代价、长时间运行时 fast weights 的管理方式，以及稠密 3D 描述数据的构建成本。
    has_abstract: true
