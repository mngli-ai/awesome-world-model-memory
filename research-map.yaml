  date: '2026-11-08'
  detail:
    concepts:
    - 显式3D缓存
    - 位姿对齐检索
    - 记忆写入淘汰
    diff: 与 CUT3R、Mamba3R 这类在模型内部攒递归状态的做法相反，它让模型只当观测器，状态外置；与经典 SLAM 比，它不要手工特征与后端优化库，靠基础模型的联合推理做重观测。
    formulas: []
    has_abstract: true
    io: 输入单目视频帧流，输出在线轨迹与稠密几何，中间产物是外部持久状态，含关键帧集合与对应几何。
    limits: 只在三个室外数据集上验，室内与生成侧没有；重跑时机是调度启发式，没有可迁移的触发判据；40% 只与未标定基线比，标定条件下的增益未报。
    position: 流式三维基础模型的预测一次吐出就不再改，误差累积没有回环去纠，做不了长程；要能做，就得把它的输出降级成观测，另立一份可改写的状态。
    steps:
    - 冻结流式三维基础模型，只用它的推理接口，把每次预测当成一次观测。
    - 前端逐帧跟踪，判断该帧是否写进持久状态并作为关键帧。
    - 后端异步决定何时、对哪些历史帧重跑联合推理，用新上下文重算。
    - 校验通过的回环观测在线修正轨迹，段级观测在序列结束后细化稠密几何。
    - 在 KITTI、VBR、Oxford Spires 上比 mean ATE 与重建质量。
    train: 骨干全程冻结，只训一个轻量回环检索头；摘要未给检索头规模与训练数据量，待核。
  explain: 这条讲的是把模型的输出降级成观测。流式三维基础模型跑得再准，它吐出来的位姿与几何都是一次性的，错了也改不了，长序列上误差只能一直累积。Map2SLAM 把这份输出当成对一张外部状态的观测，前端决定哪些帧有资格写进状态，后端异步决定什么时候把哪一段旧帧重新跑一遍，用新上下文重算，再拿校验过的回环观测去改轨迹。全部调用共用同一帧的编码结果，所以回看几乎不加编码开销。对我来说这是写得最完整的一份写侧答案，它把历史存在哪、用什么地址写、什么时候回头改三件事分给了三个模块，而我的六块窗口是把这三件事全塞进一个硬截断。它只在室外驾驶与街景上验，40% 的降幅也是跟未标定基线比，但调度结构可以整体搬到 proxy 的维护上。
  id: map2slam
  key_numbers:
  - mean ATE 比最强未标定基线降 40% 以上
  - 每次调用共用一帧编码，回看不再付编码开销
  lane: 几何位姿寻址
  link_strength: 与 Mamba3R 都在把三维重建压成可增量维护的状态，Mamba3R 换的是递归状态算子，Map2SLAM 不动骨干，改的是把模型输出写成对一张外部持久状态的观测，再决定何时回看哪些帧
  links:
  - https://arxiv.org/abs/2611.11169
  - https://robbyant-research.github.io/Map2SLAM/
  mechanism: 把冻结的流式三维基础模型的预测当成对一张外部持久 SLAM 状态的观测，前端逐帧决定哪些帧有资格写进状态并当关键帧，后端异步决定何时、把过去哪几帧重新跑一遍，用新上下文重算，校验过的回环观测在线改轨迹，所有调用共用同一帧的编码缓存。
