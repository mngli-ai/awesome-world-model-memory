  date: '2026-11-12'
  detail:
    diff: 与 prowbench、code2video-compass 这类只看渲染结果是否照程序走的评测比，它把草稿的粗细与外观线索的对齐单独做成轴，因此能回答草稿该给多细这个工程问题；与只报总分的世界模型基准比，它把世界保持与视觉实现分开报，避免两项互相抵消。
    formulas: []
    has_abstract: true
    io: 输入是可执行 4D 世界族产出的草稿（抽象 proxy 到 previs 的不同粒度）加文本指定的目标属性；输出是模型渲出的视频，以及世界保持与视觉实现两项打分。
    limits: 只在可执行 4D 世界的合成谱系上评测，真实拍摄素材与开放域场景未覆盖；432 例的规模对 12 个模型的排序够用，但对细分能力差异的置信度未给；草稿粒度与外观对齐两轴之外的因素（分辨率、步数、底座规模）未控制，摘要未说明如何消除这些混杂；源泄漏 64% 是冲突条件下的上界，正常条件下的分布未报。
    position: 为 code 建世界、视频只渲染这一分工提供专门的配对考卷，把世界保持与视觉实现拆成两个可分别读的量。
    steps:
    - 从六个动态挑战类别里构造 48 个可执行 4D 世界族，保证同一族内运动与相机轨迹可精确复现。
    - 对每个世界渲染不同粒度的草稿，从抽象 proxy 到 previs，形成草稿粒度轴。
    - 在同一动力学下改变外观线索的对齐程度，从中性到与草稿冲突，形成第二轴。
    - 把两轴交叉成 3×3，配出 432 个严格配对用例，逐一评测世界保持与视觉实现。
    - 给出 WorldDraft-Primer，用免训的视觉提示在不改冻结渲染器的前提下同时抬这两项。
    train: 不适用，考卷本身不训练；随附的 WorldDraft-Primer 是插在冻结渲染器前的视觉提示，免训。
  explain: 这条把我一直在说的分工做成了考卷：代码或编码代理先建出一个可执行的 4D 世界，视频模型只负责把它渲成画面。考卷的两个判据分得很干净，世界保持看生成结果有没有守住规定的 4D 运动与相机轨迹，视觉实现看文本指定的属性有没有从头到尾绑在同一个主体上。设计上是 3×3 因子，一轴是草稿粒度，从抽象 proxy 到 previs，另一轴是外观对齐，从中性到故意冲突。结论有三条，世界保持与视觉实现互相拉扯；草稿越丰富，结构锚得越牢，但外观保真反而变差；源线索冲突时源泄漏最高到 64%，跨模态解耦比想象的脆。对我最有用的是第二条，我原来默认 proxy 越细越好，这份数据说不是。
  id: worlddraft
  key_numbers:
  - 432 个严格配对测试用例
  - 48 个可执行 4D 世界族、六个动态挑战类别
  - 3×3 因子设计：草稿粒度（抽象 proxy 到 previs）× 外观对齐（中性到冲突）
  - 12 个代表模型参与评测
  - 源线索冲突时源泄漏最高 64%
  lane: 评测基准
  link_strength: 都拿程序或草稿当参照去问渲染器照不照做，prowbench 查渲染器有没有照程序说的画，这条把草稿粒度与外观线索做成两轴，量化草稿越细反而越跑偏
  links:
