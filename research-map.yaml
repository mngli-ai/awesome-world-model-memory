    NVMe 型号与 PCIe 带宽，作者给了按它自己的配置拟合的解析模型，预测溢出点误差在一块以内，但没有跨机器验证。37.5 分钟里位置外推怎么处理只有一句训练无关，细节待正文。质量只有两条：int4
    存储在一个封存测试集上无可测损失，长间隔回访掉约 1 个 MUSIQ 点；没有和别的量化或淘汰方案比。
  tags:
  - 存储分层
  - 位姿预取
  - 零停顿
  explain: 这篇把「历史存在哪里」这个问题答得最物理。它的设定跟我很像：单卡 4090，32 GiB 主机内存，把过去每一块的 KV 留着，回访时取出来用。它先量了墙在哪，bf16 只撑 45 秒，int4
    撑 2.8 分钟，而模型自己的位置编码只外推到 4.3 分钟，也就是说容量比位置先到极限。然后它指出一件很关键的事：这份记忆的访问集在算之前就知道，因为相机往哪走是输入，不是猜的。所以它把 int4
    KV 摆成 GPU、主机内存、NVMe 三层，每块提前按外推位姿去取，取不到也不等。37.5 分钟连续生成，零停顿，主机内存恒定，约 9.5 fps。质量代价是长间隔回访掉约一个 MUSIQ 点。对做
    code → proxy → video 的人来说，它的价值不在那个三级存储，而在它把「什么时候取」变成「位姿已知所以可以提前取」，这条在我这里天然成立，因为代理和位姿都是代码层算出来的。
  detail:
    position: 交互世界模型的 KV 记忆在单张消费级卡上先撞容量墙，既有做法靠重算或压缩，重算代价随会话长度线性涨，压缩会丢细节；而这类记忆的访问集因为相机位姿是输入，天然可以提前知道。
    io: 输入是一段连续的相机位姿轨迹与已生成的分块历史 KV，输出是不断流的视频帧，内存占用保持恒定。
    steps:
    - 测量容量墙：Matrix-Game 2.0 的 KV 在 bf16 下 45 秒耗尽 32 GiB 主机内存，int4 下 2.8 分钟；模型位置外推上限 4.3 分钟。
    - 论证这份记忆是容量受限而不是带宽受限，列出访问集在计算前已知的依据。
    - 用这些观察建解析模型，预测溢出点误差在一块以内，并在留出配置上判零停顿与非零停顿。
    - 把 int4 KV 放进 GPU、DRAM、NVMe 三层，不重算。
    - 每块按外推位姿提前取，miss 不阻塞，回写放后台。
    - 加训练无关的位置处理把可生成时长推过位置外推上限。
    formulas: []
    train: 无需训练，纯推理期与存储调度；位置处理是训练无关的。
    diff: 与同样做容量管理的 DecMem、Infinite-World 相比，它不动压缩也不动注意力结构，只动存储层级与取数时机；与重算式流式推理相比，它把代价从算力挪到存储带宽。
    limits: 容量数字绑定 Matrix-Game 2.0 与那台机器的配置，换模型或换 NVMe 要重新拟合。零停顿靠的是位姿可外推，相机急转或用户瞬移时预取会落空，摘要没给这种情况的退化解法。37.5
      分钟之后怎么办没写。质量只有 int4 与回访掉一个 MUSIQ 点两条，缺和其他量化、淘汰方案的横向对比。
