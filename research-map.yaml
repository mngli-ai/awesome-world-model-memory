    io: 输入连续观测与目标描述，输出导航动作；中间产物是分层场景图，稳定实体层加台面假设层。
    limits: 摘要零数字，提升幅度待核；只在仿真基准上验，真机与真实挪动未报；作废判据与假设层的容量策略没给。
    position: 辅助机器人在家里反复找东西，家具不会动而台面物件常被挪，把两类东西用同一种方式实例化，小物件不稳，旧记录又不会自己失效。
    steps:
    - 把三维家具实体与台面小物体假设分开表示，假设只留视觉证据不要独立几何。
    - 允许对假设层做局部修订，不重建稳定实体拓扑。
    - 取用时按目标尺度选择查实体还是查假设，需要时补采台面观测。
    - 用验证确认目标存在，或把被推翻的假设记录作废。
    - 在 GOAT-Bench 与自建 FAROS-Bench 上比中途挪动物件与多尺度查找。
    train: 摘要未提训练方式，未披露；推测沿用现成导航策略与感知模块，待核。
  explain: 这条讲的是记忆过期。家里东西会被挪，机器人要反复找，如果所有检测都统一实例化成三维物体，台面上的小物件很脆，而且场景一变旧条目还留着，取到的就是错的。HSGNav 把持久的三维家具实体与可修订的台面小物体假设分开，假设只保留视觉证据不要独立几何，允许局部改写而不重建稳定的实体拓扑。取用时按目标尺度选是查实体还是查假设，验证负责确认目标在不在，或者把被推翻的假设记录作废。它还专门建了 FAROS-Bench 测中途挪动物件与多尺度查找，因为 GOAT-Bench 根本不要求中途失效。这套稳定层加可改层的分层，比我现在的单一状态表更接近房子的真实情况。
