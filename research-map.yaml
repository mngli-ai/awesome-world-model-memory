    concepts:
    - 结构条件渲染
    diff: 与 State World Models 都把状态和像素分开，State World Models 的规则是可执行符号，这条的动力学是学出来的潜空间求解器；与 Holo4D 都把几何当控制信号，这条的控制来自动力学预测而不是重建。
    formulas: []
    has_abstract: true
    io: 输入是观测到的运动，输出是物体级物理状态序列，以及据此生成的空间对齐潜控制与最终视频。
    limits: 摘要零数字，只有变好与相当这类定性说法，物理一致性与轨迹服从的具体提升待读 PDF；只做刚体运动，没有长程外推与回访证据；潜状态不可读，改世界要改潜变量而不是改一行代码。
    position: 视频生成模型能画出很真的画面，物体运动却常违反物理，说明纯视觉建模学不到可迁移的动力学；把动力学单独拿出来预测、让生成器只负责外观，是一条把状态与渲染拆开的路。
    steps:
    - 用可学 PDE 求解器在潜空间预测物体级物理状态的演化。
    - 把状态预测转成空间对齐的潜控制。
    - 潜控制喂给可控视频扩散模型，生成器只提供外观与场景细节。
    - 训练时把扩散匹配目标与低容量可解码约束合起来，要求身份与位置能从结果中解回。
    - 在学习动力学与解析先验之间做对照消融，并在带已知轨迹的配对数据上验轨迹服从。
    train: 需训，扩散匹配加低容量可解码约束联合训练；摘要未给模型规模、数据集规模与训练算力，待核。
  explain: 这条把我的分层搬到了学习侧。它不要代码，改用一个可学的 PDE 求解器在潜空间里推物体级物理状态，推完把状态转成空间对齐的潜控制，喂给可控视频扩散模型，生成器在这里被明确说成视觉接口，只提供外观和场景细节，物理轨迹由动力学模型指定。难点在轨迹穿过生成器这一段会被改写，所以训练时除了扩散匹配，还加了一个低容量可解码约束，要求从生成结果里能把物体身份和位置解回来。实验在公开的物理一致性基准和带已知轨迹的配对数据上做，结论是物理一致性和轨迹服从性变好，画质相当，还做了学习动力学对解析先验的对照消融。它一个数字都没给，这一点要注意。对我而言这是 proxy 该长什么样的另一种答案，我的 proxy 是代码写的显式状态，它的是学出来的潜状态，共同点是状态必须与渲染分离并可单独检查，差别在可控性，代码那条改一个变量就能改世界，它这条得改潜变量。
