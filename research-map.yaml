  one_liner: G-buffer 当条件，两段 LoRA 换外观
  mechanism: 预训练视频 DiT 上加轻量 projector 注入 G-buffer 的几何与材质先验，LoRA 做参数高效适配；两阶段训练，第二阶段冻结条件通路只训新 LoRA，抵御估计 G-buffer 的噪声。
  key_numbers:
  - 1.45% 参数增量
