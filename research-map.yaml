  one_liner: 因果蒸馏，Self-Forcing 的早期版本
  mechanism: 报告只有一句：与 Self-Forcing 同一思路的早期版本，属因果蒸馏路线。
  key_numbers:
  - 2024-12
  self_measured: []
  media:
  - https://causvid.github.io/images/methods.jpg
  - https://causvid.github.io/images/preference.jpg
  - https://causvid.github.io/images/radar.jpg
  links:
  - https://arxiv.org/abs/2412.07772
  note: 报告只给到月份 2024-12。
  tags:
  - DMD蒸馏
  - 因果注意力
  explain: 以往生成视频就像冲洗胶卷，必须等整卷拍完统一洗出来，根本没法像直播那样边拍边看。CausVid在2024年12月要解决的就是这种生成延迟过高、无法实时流式输出的麻烦。它用了一招叫因果蒸馏，也就是让只能看前文的单向模型去临摹通览全片的大模型。这招之所以管用，是因为大模型掌握着全局连贯的规律，把经验传授过去后，单向模型顺着时间逐帧推演时就不会越走越崩，既做到了开水龙头般的即时出帧，又稳住了画面质感。
  detail:
    position: CausVid 解决视频扩散模型依赖双向注意力、难以逐帧交互生成的问题，并通过蒸馏降低生成延迟。它属于因果蒸馏路线，也是 Self-Forcing
      的早期版本。
    io: 输入可包含文本提示，以及用于 video-to-video 或 image-to-video 的视频或图像条件；摘要未说明具体输入格式。输出为可流式生成的视频帧，并支持动态提示。
    steps:
    - 将预训练的双向 diffusion transformer 适配为 autoregressive transformer，使生成当前帧时无需处理未来帧。
    - 用教师模型的 ODE trajectories 初始化学生模型，以支持稳定的蒸馏训练。
    - 将 50-step diffusion teacher 蒸馏为 4-step generator，以减少每次生成所需的推理步数。
    - 采用 asymmetric distillation，由双向 teacher 监督因果 student，以缓解自回归生成中的误差累积。
    - 推理时通过 KV caching 流式生成视频，并将模型用于 video-to-video、image-to-video 和动态提示。
    formulas:
    - tex: \operatorname{Attn}(Q,K,V)_i=\sum_{j\le i}\operatorname{softmax}_{j}\!\left(\frac{Q_iK_j^{\top}}{\sqrt{d}}\right)V_j
      caption: 因果注意力：生成第 i 帧时只聚合当前及此前帧的信息；标准写法，非原文
    - tex: \mathcal{L}_{\mathrm{distill}}=\mathbb{E}_{z,t}\left[\left\|f_{\theta}^{\mathrm{causal}}(z_t,t)-f_{\mathrm{teacher}}^{\mathrm{bidirectional}}(z_t,t)\right\|_2^2\right]
      caption: 双向教师监督因果学生的蒸馏目标示意；标准写法，非原文
    train: 训练时将预训练双向模型适配为因果自回归模型，再以教师 ODE trajectories 初始化学生，并用双向 teacher 对因果 student
      进行 asymmetric distillation，将 50 步教师蒸馏为 4 步生成器。推理时采用 KV caching 逐帧流式生成；摘要报告单
      GPU 上达到 9.4 FPS。
    diff: 不同于需要双向处理整段序列的视频扩散模型，CausVid 采用因果自回归生成，可在生成过程中逐帧输出。其关键训练设计是用双向 teacher 蒸馏因果
      student，并结合 ODE 轨迹初始化来支持稳定训练和缓解误差累积。
    limits: 摘要未明确说明训练和推理的资源代价、适用分辨率或具体画质局限；自回归生成中的误差累积是其需要处理的问题。
    has_abstract: true
  citations: 47
  cpm: 2.14
  repro: paper_only
  inherited: 1
  inherited_by:
  - self-forcing
  inherited_chain: 1
  concepts:
  - 少步蒸馏
