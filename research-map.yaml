- id: zo3t
  title: Zo3T
  date: '2025-09-08'
  lane: 参数化记忆
  branch: 测试时训练
  training: 免训
  status: 速读
  one_liner: 测试时LoRA让视频贴合相机轨迹
  mechanism: 3D 感知运动投影用推断深度推透视正确仿射，去噪中动态注入并优化临时 LoRA 适配被操纵 latent，区域特征一致性损失约束，配 guidance
    场校正。
  tags:
  - 临时LoRA
  - 轨迹控制
  - 零样本
  key_numbers:
  - 零样本
  - 摘要未给指标
  media: []
  links:
  - https://arxiv.org/abs/2509.06723
  note: 单段轨迹控制的 I2V，无长程历史回溯；收进来只因它是"位姿条件 × 测试时训练"最早的一批样本，可作方法拼装参考。
  arxiv: '2509.06723'
  explain: 想象让一段视频里的镜头沿着弯曲轨迹绕过桌上的茶杯：普通视频生成模型可能让镜头动了，杯子却变形、漂移，或前后画面接不上。Zo3T要解决的正是相机运动与场景运动难以协调的问题。它先根据模型推断的深度，把相机轨迹投影成符合透视的画面变换；再在逐步去噪生成视频时，把变换动态施加到潜在表示，也就是压缩后的画面特征上。与此同时，它临时优化低秩适配器（LoRA，一种轻量的模型参数补丁），让生成内容贴合变换后的表示，并用区域特征一致性损失约束同一物体别在镜头运动中走样。最后，指导场会修正生成方向。这样既能跟随指定镜头运动，也尽量保住场景结构；方法无需额外训练，但摘要未给出量化指标。
  detail:
    position: Zo3T 解决图像到视频生成中，生成视频难以准确遵循用户指定运动轨迹的问题。它针对忽略 3D 透视和操纵 latent 与网络噪声预测不匹配所导致的不真实运动及生成失真。
    io: 输入是待生成视频的图像和用户指定的运动轨迹，输出是遵循该轨迹的视频。条件信号包括从场景推断的深度以及轨迹约束。
    steps:
    - 推断场景深度，并据此为目标区域计算考虑透视的仿射变换，使轨迹运动更符合 3D 几何。
    - 在去噪过程中按轨迹操纵 latent，并动态注入临时 LoRA 适配器，使网络表示能够适应操纵后的 latent。
    - 使用区域特征一致性损失联合约束 latent 与 LoRA 更新，以推动目标区域遵循运动轨迹并保持生成保真度。
    - 通过一步前瞻优化条件 guidance field，校正去噪演化路径，使生成过程更有效地朝目标轨迹推进。
    formulas:
    - tex: \mathbf{p}'=\pi\!\left(\mathbf{K}\left(\mathbf{K}^{-1}\tilde{\mathbf{p}}+\frac{\Delta\mathbf{X}}{D(\mathbf{p})}\right)\right)
      caption: 标准写法，非原文：利用估计深度将图像点反投影到 3D、施加运动并重新投影，以体现透视的运动映射。
    - tex: \min_{\{\mathbf{z}_t\},\{\Delta\theta_t\}}\sum_t\left\|\phi_R\!\left(\mathcal{D}(\mathbf{z}_t;\theta+\Delta\theta_t)\right)-\mathcal{W}_{A_t}\!\left[\phi_R\!\left(\mathcal{D}(\mathbf{z}_t;\theta+\Delta\theta_t)\right)\right]\right\|_2^2
      caption: 标准写法，非原文：区域特征一致性目标，联合优化去噪 latent 与临时 LoRA 参数，使目标区域特征符合轨迹对应的变换。
    train: 这是 zero-shot test-time-training 框架，不依赖针对稀缺标注数据进行预先微调；推理时在去噪过程中与 latent
      状态共同优化临时 LoRA。区域特征一致性损失和 guidance 场的一步前瞻校正用于约束生成；具体优化器、步数及其他关键设置摘要未给。
    diff: 相比依赖稀缺标注数据进行计算密集型微调的方法，Zo3T 在测试时动态优化临时 LoRA。相比仅在 latent 空间控制轨迹的零样本方法，它结合深度感知的透视投影、网络适配和
      guidance 场校正，以缓解运动不真实及 latent 与噪声预测失配。
    limits: 摘要未见明确说明。
    has_abstract: true
