  branch: ''
  training: 不适用
  status: 速读
  one_liner: 回头再看：生成的视频是否同一个3D世界
  mechanism: 用带标注锚点的720个实例与六种探索-重访协议，比重访未见区域与首次生成、跨视角深度与特征对应、区域尺度一致、留出高斯重渲染，判3D自一致与内容持久。
  tags:
