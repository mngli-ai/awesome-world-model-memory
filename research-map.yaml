  links:
  - https://arxiv.org/abs/2611.06685
  - https://github.com/zenastangbi/Sekai
  mechanism: 流式视频按 8 帧一块推进，冻结的写入器把与查询相关的事件增量写进一份可编辑文本记忆，每个物体条目存稳定局部 ID、外观短语、最后可见位置与帧、事件列表，事件状态取 active/ended/unknown 并记首末证据帧，渲染后上限 128 token；记忆接地解码器按这份状态判当前哪些物体仍满足查询，再在当前帧定位。
  media: []
