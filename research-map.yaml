  detail:
    diff: 与 dKV Forcing 都在推理期决定历史去留，区别是它把误差来源定位在淘汰查询的工作区而不是选择准则；与 LAQ 比只多一次重打分。
    formulas: []
    has_abstract: true
    io: 输入是长上下文与缓存预算，输出是保留的 KV 子集；工作区前向次数与 LAQ 相同。
    limits: 只在语言模型上验证，视频 KV 的块结构与文本不同，搬到视频侧要重新定义工作区；提升集中在证据密集型任务。
    position: 长上下文里证据分散时，淘汰查询的工作区误差会顺查询链放大，最终淘汰掉本该留的 token。
    steps:
    - 用未来解码位点的提议初始化一个可反馈的 bootstrap 工作区。
    - 用早期解码产生的查询检测工作区偏差。
    - 在剩余前瞻步之前把工作区修回来，并加一次张量重打分。
    - 在 LongBench 十六个任务上按不同预算与底座对比 LAQ。
    train: 免训，只改推理期的淘汰流程。
  explain: 这篇讲的是取错的来源在什么地方，很贴我的第三个问题。KV 淘汰一般被当成排序问题，谁重要谁留下。EchoKV 说还有一层：算重要性用的那些查询，是在一个临时工作区里跑出来的，工作区一旦偏，后面的查询看的东西就偏，最后淘汰决策跟着错，而且会自我强化。它的修法是用未来解码位点的提议先搭一个可反馈的工作区，再用早期解码真跑出来的查询在剩余前瞻步之前把工作区修回来，代价只是多一次张量重打分，前向次数跟 LAQ 一样。语言模型上在 LongBench 十六个任务里对证据分散的任务有效。搬到视频上要重新定义工作区，但错在查询而不是准则这个判断可以直接借。
  id: echokv
  key_numbers:
  - LongBench 16 个任务
  - Mistral-7B 与 Qwen2.5-7B 两个底座
  - 工作区前向次数与 LAQ 相同
