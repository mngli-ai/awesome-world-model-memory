    position: 流式视频理解在现有榜上分数很高，但分数不说明模型用了视觉历史；既有基准里相当一部分历史题近期帧就够，还有些题靠问题与选项就能答对，模型到底有没有取历史、取对没取对分不开。
    steps:
    - 复查 OVO-Bench 与 StreamingBench，统计近期帧就够答题的比例与光看选项就能答对的比例。
    - 构造 350 对视频，每对固定近期上下文、问题、选项顺序，只改关键历史证据与正确答案。
    - 覆盖五个历史任务，每段视频独立作答。
    - 用 PairAcc 计分，两边都对才算通过。
    - 在 34 种模型与输入配置上评测，观察加入历史输入后的排序变化。
    - 做案例分析，定位取错时刻与事件顺序颠倒两类失败。
    train: 不适用，纯评测。
  explain: 它测的是我这三个问题里的第三个，什么时候会取错，而且给了一个能隔离变量的做法。做法很直接，一对视频里近期上下文、问题、选项顺序全部固定，只换关键的那段历史证据，正确答案也跟着换，两段必须各自答对才算这一对通过。这样答对就只能靠真的用了那段历史，因为选项先验和近期帧在两段视频里完全一样，蒙对一边另一边必然错。它顺带查了两件旧事，OVO-Bench 和 StreamingBench 里 32% 的历史题其实近期帧就够，还有不少题光看问题和选项就能选对，所以那些榜上的高分不能说明模型用了历史。结果也确实是这个形状，加进历史输入之后通用模型反而超过流式系统，最强流式系统配对正确率 49.14%，通用模型 66.57% 到 91.43%，五个任务上都有这个落差。案例里还看到两种典型失败，取到了错误时刻的状态，以及记着证据却把事件顺序说反，这正好是我关心的取错时刻和取错顺序。对我这条线，它的配对设计可以直接搬，我把同一段代码状态配两条相反的历史分支，只改关键事件，就能测渲染器到底是按历史画还是按当前提示画。它是理解侧的，生成侧不回访，也不给机制。
