  date: '2026-11-03'
  detail:
    diff: 已有少步自回归视频系统多只保留最近窗口或固定 sink 加窗口，PrimeSim 把历史按时间尺度分层成一份单独的慢记忆，并把这份记忆写进后训练目标，跨块的长程状态因此不随窗口滑走；多视角一致性另用带显式相机身份的交错注意力单独处理，不和记忆混在一起。
    formulas: []
    has_abstract: true
    io: 输入为每路视角的首帧、语言提示与一条统一跨本体动作序列，覆盖头、躯干、腰、末端、夹爪、底盘；输出为三路同步视角的未来视频。
    limits: 摘要自认细粒度局部校准仍落后同类；只在机器人操纵任务上验证，没有自然场景长视频，显存占用与失败案例摘要未给，待核。
    position: 机器人世界模型当仿真器用时不能只生成看着合理的视频，还必须忠实跟随动作、跨视角一致、长程连贯，难点在自回归推演时用自己的历史会累积误差。PrimeSim 用中训练加后训练两段，把预训练的双向视频生成器改造成带分层时序记忆的自回归模拟器。
    steps:
    - 在 30,110 小时、22 个机器人平台的演示数据上中训练，覆盖人形、双臂、单臂与手持 UMI。
    - 用统一跨本体动作表示加帧对齐双路径条件，加强动作与帧之间的对应。
    - 用带显式相机身份的视角感知交错注意力，让各视角交换信息又保留各自的表示。
    - 后训练把双向生成器改成自回归，靠快速因果生成、自滚动训练与分层时序记忆三者合起来压误差累积。
    train: 需训，两段。中训练语料 30,110 小时、22 个平台、2.38B 帧、1.52M 回合，真实与仿真比 84 比 16；后训练含自滚动训练与少步化，推理为 4 步去噪，单张 A100 上三视角 288x384、约 10 Hz。
  explain: 这条正面撞上我现在两个设定，四步去噪和固定几块窗口，所以值得先读。它的分工叫快视频慢记忆，快的是因果生成，慢的是一份按时间尺度分层的时序记忆，后者专门管跨块的长程状态。做法上没有推翻基座，先拿 30,110 小时、22 个平台的机器人演示做中训练，把预训练视频生成器改造成动作条件模型，动作用统一的跨本体表示喂进去，配帧对齐双路径条件，多视角一致靠带相机身份的交错注意力。真正关键的是后训练，它把双向生成器改成自回归，一边自滚动用自己的历史训练，一边让分层时序记忆替它记住窗口外的东西，自生成历史的误差因此不会一层层滚下去。项目页给的数是
    4 步去噪、单张 A100 三视角 288x384、10 Hz、连续推演 105 秒，新本体 100 到 200 个梯度步就能适配。对我最有用的不是机器人任务本身，而是它证明四步加分层记忆可以同时成立，我那个六块窗口不必靠加长来救，可以靠另开一层慢记忆。
  id: primesim
  key_numbers:
  - 30,110 小时
  - 22 个机器人平台
  - 10.1 FPS
  - 105 秒连续推演
  - 4 步去噪
