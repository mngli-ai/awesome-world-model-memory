    里真实环境只有 3 个，规模小。
  tags:
  - 变化区更新
  - 持久地图
  - 时空问答
  explain: 这篇关心的是半静态场景：大部分东西不变，少数东西过一阵会变。它的做法是先一次性重建一套三维高斯地图，之后不再整张重建，只在检测到变化的区域更新，把改动单独存一份，其余保持原样，于是历史的时间维度就留在了「哪些区域什么时候被改过」这件事上。查询走的是一套代理流程，需要哪个视角就渲染哪个视角，证据一点点累积。对记忆研究来说，它的点在于写入策略：写哪些、写多少，由变化检测决定，而不是由位置或相似度决定。这跟我关心的第三个问题直接相关，如果代理里某块区域事实上没变，那么把它的
    KV 或高斯反复重写就是浪费并且引入漂移，反过来如果它变了却按旧地址取，就是典型的取错。它给的评测是问答，不是画面，所以只能借机制不能借指标。
  detail:
    position: 真实环境会持续半静态地变，机器人需要的记忆既要空间结构又要时间演化；结构化表示只记得建库时枚举过的实体与属性，图像式记忆又被已有视角绑死。
    io: 输入一次建图与后续观测，输出可渲染的持久地图与时空问答答案。
    steps:
    - 一次性重建持久的三维高斯地图。
    - 之后只在场景变化的区域更新，改动单独存储，视觉细节按时间保留。
    - 代理按需渲染新视角，逐步累积证据。
    - 把自然语言查询落到地图里的物体上作答。
    - 用 GEMS-Bench 的 473 个问答对评测。
    formulas: []
    train: 不训练新的生成模型，建图与更新走三维高斯重建流程；成本在建图与变化区域更新上。
    diff: 与整图重建的记忆相比，它只写变化区域，存储随时间线性增长得慢；与图像式记忆相比，它能渲染没拍过的视角；与只用结构化实体表的记忆相比，它不会漏掉建库时没枚举过的东西。
    limits: 变化检测的判据与阈值摘要未述，误检会让地图越改越脏。只做问答与物体定位，不产视频，不测生成时序一致性。真实环境只有 3 个。存储效率只有定性描述。依赖三维高斯重建质量，动态物体与反光面仍是弱项。
    has_abstract: true
  concepts:
  - 显式3D缓存
  - 位姿对齐检索
  - 记忆写入淘汰
