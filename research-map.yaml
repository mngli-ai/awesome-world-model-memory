  detail:
    diff: 与 Lyra 2.0 比，它把重建后端做成闭环；与 RecallGS 比，它让生成结果反向改写世界状态而不是只当先验。
    formulas: []
    has_abstract: true
    io: 输入是单图或初始场景、相机轨迹与文本；输出是逐块生成的视频与持续更新的三维高斯世界状态。
    limits: 单步延迟与算力未报；回访一致性没有与基线对比的指标数字；训练数据是自造退化渲染，真实场景迁移未验。
    position: 交互世界生成的历史通常以 KV 或帧库保存，重复更新让不一致累积，目标视角的引导在长 rollout 里逐渐不完整。
    steps:
    - 用当前 3DGS 场景渲染出多模态条件，喂给条件驱动视频生成器。
    - 相机几何走 Relative Ray Encoding 分支注入。
    - 把生成的视频回灌 SLAM 重建后端。
    - 不一致性过滤挡住冲突内容，跨块 bundle adjustment 对齐空间。
    - 构造 293K 退化渲染与真实目标视频对训练生成器，在 WorldScore 与 481 帧回访 rollout 上评测。
    train: 需训，含 293K 训练对的数据构造管线。
  explain: 这篇的结构跟我想要的 code 到 proxy 到 video 是一路，只是它的 proxy 是三维高斯而不是代码。它把世界状态做成一份持久的 3DGS 场景，每生成一步先用它渲染出多模态条件给视频生成器，相机几何不塞进文本而是走单独的相对射线编码分支。生成出来的视频不回丢掉，而是回灌给一个 SLAM 重建后端，后端用不一致性过滤挡住与已有场景冲突的内容，再跨块做 bundle adjustment 把空间对齐，场景状态是被持续修正的而不是一路累积误差。为了训练它造了 293K 对退化渲染与真值视频。WorldScore 单步和三步都是总体最优，单步外推的相机控制 99.07，481 帧离开再回访也展示了较好的回访一致性。对我来说它证明了 render 与 reconstruct 闭环比单纯加大 cache 更能撑住长程，代价是重建后端带来的延迟。
