  - 训练无关
  date: '2026-11-09'
  detail:
    concepts:
    - 显式3D缓存
    - 记忆写入淘汰
    - 训练无关
    diff: 与只调幅度的免训技巧相比多了方向纠正；与 Mamba3R 这类换状态算子的路线相比，它认下现有算子，只改写入这一步，代价更小但上限受算子限制。
    formulas: []
    has_abstract: true
    io: 输入连续帧，输出逐帧相机位姿、重建几何与深度；中间产物是一个被反复改写的紧凑场景记忆。
    limits: 只在 CUT3R 上验，抽象到别的递归重建器未证；摘要零数字，提升幅度待核；纠正用的历史窗口长度、阈值与计算开销都没给。
    position: 流式重建把长视频压成一个状态，每帧更新都写一次，不可靠的更新会覆盖历史并累积成长程漂移；现有免训扩展只能减弱这次写入，改不了它写向哪里。
    steps:
    - 把 CUT3R 的递归更新做方向与幅度的分解，统一解释其变体。
    - 指出免训扩展都只做幅度控制，无法纠正不可靠更新的方向。
    - 用局部一致的历史状态纠正更新方向，用当前观测与历史的视觉差异调节写入增益。
    - 在相机位姿估计、三维重建、视频深度三项上验长程漂移是否被压住。
    train: 免训，不改 CUT3R 权重，只在推理期改更新规则。
  explain: 这条讲的是流式状态被写坏。递归式重建每来一帧就往一个紧凑场景记忆里写一次，写错了不是丢一帧，是把历史覆盖掉，然后误差顺着状态一路漂。作者把 CUT3R 的更新拆成方向与幅度两个量，幅度是写入增益，方向是几何意图，他们发现现有的免训技巧全在调幅度，能减弱一次不可靠的写入，却纠不了方向。HIST3R 用局部一致的历史状态去纠方向，用当前观测与历史的视觉差异去调幅度，冗余的写入被压掉，互补的证据留下来。这个分解对我现成可用，我的因果版把 KV 固定成六块窗口，本质上也只调幅度，什么时候该纠方向我完全没有机制。局限是它只给三项任务的定性提升，一个数字都没有，而且必须在 CUT3R 上。
  id: hist3r
  key_numbers: []
  lane: 几何位姿寻址
  link_strength: 与 Mamba3R 都在处理流式重建的状态演化，Mamba3R 换状态算子，HIST3R 不动结构，把递归更新拆成方向与幅度并用历史分别纠正
  links:
  - https://arxiv.org/abs/2611.12011
  - https://kennethyangg.github.io/HIST3R/
  mechanism: 把 CUT3R 式递归更新拆成方向与幅度，幅度是写入增益，决定这次观测多有力地写进状态，方向是几何意图，决定状态被推向哪里；用局部一致的历史状态纠方向，用当前观测与历史的视觉差异调幅度，压掉冗余写入、保留互补证据。
