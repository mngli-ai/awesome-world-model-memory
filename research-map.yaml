- arxiv: '2611.09625'
  branch: 测试时训练
  concepts:
  - 测试时训练
  - 记忆写入淘汰
  date: '2026-11-06'
  detail:
    concepts:
    - 测试时训练
    - 记忆写入淘汰
    diff: 与 MIT^3、Spatial-TTT 同属测试时把历史写进参数，它们落在视频与空间重建，这条落在模型基 RL 的世界模型；与只靠上下文记忆的做法相比，它把读取成本从随长度增长变成常数。
    formulas: []
    has_abstract: true
    io: 输入是一个回合内的观测与动作序列，输出是更新后的世界模型参数与该回合的决策。
    limits: 只报新最好结果与一致提升，没有具体数字；任务都是导航式记忆迷宫，零视频生成证据；每回合要重训一次，回合短时摊销不下来，这部分开销摘要未给。
    position: 模型基 RL 的世界模型通常是回合内固定、靠上下文塞历史，长程记忆任务因此打不过人；把历史写进参数是另一条路，代价是每个新回合都要付一次写权重的成本。
    steps:
    - 回合开始时先有一个通用世界模型。
    - 回合内对世界模型参数做测试时梯度下降，把观测写进权重。
    - 用更新后的世界模型做规划与决策，记忆读取就是一次前向。
    - 在 Memory Maze 二维简化版上先验证，再上三维版与 DeepMind Control、Atari 100k。
    train: 需训，先训世界模型，再在测试时按回合做梯度更新；摘要未给更新步数、学习率与单回合额外耗时，待核。
  explain: 这条直接回答历史存在哪。现在模型基 RL 里记忆基本靠上下文，把过去观测塞进输入序列，长度一涨就贵，长程记忆任务上也一直赢不了人。TT-MBRL 换了个存法，在测试时对这个回合的世界模型参数做梯度下降，把观测写进权重，于是每个回合都得到一个只属于它的世界模型。这个思路跟测试时训练那条线是同一个机制，只是落在 RL 的世界模型上。它先在 Memory Maze 的二维简化版上验证，跨不同世界模型结构都涨，再到三维上拿到 Memory Maze 的新最好结果，同时在 DeepMind Control 与 Atari 100k 这类不吃记忆的基准上没掉。要注意它报的全是相对结论，一个新最好结果，没有具体数字。对我有用的是它把三种记忆位置摆在一起比了，上下文、权重、检索，权重这条在回合内读取是常数成本，代价写在回合边界上，换个回合就得重训一遍。
  id: tt-mbrl
  key_numbers: []
  lane: 参数化记忆
  link_strength: 与 MIT^3 都把历史写进权重而不是塞进上下文，MIT^3 落在视频记忆内化，这条落在模型基 RL 的世界模型，按回合重建一次
  links:
  - https://arxiv.org/abs/2611.09625
  mechanism: 不再只靠上下文记忆，测试时对世界模型参数做梯度下降，把这个回合的观测写进权重，于是每个回合得到一个属于自己的世界模型，读完的历史存在参数里，取用就是一次前向。
