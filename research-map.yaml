- id: worldoracle
  title: 'WorldOracle: Benchmarking Action-Conditioned World Models against Real-World
    Executions'
  date: '2026-10-13'
  lane: 评测基准
  branch: ''
  training: 不适用
  status: 速读
  one_liner: 同动作配对真机执行，考动作条件模型
  mechanism: 给同一初始观测与同一低层动作序列，比对预测rollout与真机记录，从物理状态正确性、交互空间对齐、关键交互区保真、多视角动作一致性四维评。
  tags:
  - 真机配对
  - 动作条件
  - 操作任务
  key_numbers:
  - 7个ACWM
  - 4个评测维度
  - 含失败执行段
  media: []
  links:
  - https://arxiv.org/abs/2610.18826
  note: 信号是"同一动作在真机上会发生什么"，是少数用真机配对而非仿真当参照的基准；数据集与榜单已放。
  arxiv: '2610.18826'
  explain: 想象机器人把杯子推向桌边：模型说杯子会滑落，真机却停住了。单看生成视频，很难判断预测是否可信。世界预言机要解决的，正是动作条件世界模型——输入动作、预测后续画面的模型——缺少可靠实测标准的问题。研究者让模型和机器人从同一初始观测出发，执行相同的低层动作序列，再把预测过程与真机录像对照。测试覆盖七个模型，也保留失败执行片段；评估看四件事：物理状态是否正确、交互位置是否对齐、关键接触区域是否保真，以及不同视角下动作是否一致。起点和动作相同，能减少比较中的干扰，让结果更能反映模型预测能力；纳入失败片段，也能检验模型是否呈现真实意外，而不只是生成好看的成功画面。
  detail:
    position: 这篇工作提出 WorldOracle，用于评估 action-conditioned world models 是否能在给定动作后复现真实世界中的物理变化与任务状态转移。核心问题是让模型预测
      rollout 与配对的真机执行结果进行系统比较。
    io: 输入是相同的初始观测和低层动作序列，条件信号包括初始观测与动作。输出是模型生成的预测 rollout，并与对应的真机记录进行多维度评估。
    steps:
    - 整理覆盖不同交互动态与具身形态的真实世界训练和评估数据，为模型评测提供真实执行依据。
    - 构建包含多个长时段片段的评估 episode，并纳入成功与失败执行，以覆盖多样的动作结果和行为分布。
    - 对每个评测样本向模型提供初始观测与低层动作序列，生成预测 rollout，以便和同条件下的真机执行配对比较。
    - 从物理状态正确性、交互空间对齐、关键交互区保真和多视角动作一致性四个维度评估预测结果，以刻画模型的不同能力与失效模式。
    - 在七个代表性 action-conditioned world models 上开展实验，并提供数据集、评估代码与 leaderboard，支持后续比较。
    formulas: []
    train: 工作重点是构建基准与评估 action-conditioned world models，而非提出新的模型训练方法。摘要提到整理真实世界训练与评估数据，并在七个代表性模型上进行评测；具体训练流程、模型设置与推理细节摘要未给。
    diff: 与缺少配对真机结果或只考察单一指标的评估方式不同，WorldOracle 对相同初始观测和动作序列下的预测 rollout 与真实执行进行对照，并从四个互补维度评估。评估数据还覆盖长时段、多片段以及成功和失败结果。
    limits: 摘要未明确说明基准的计算与数据采集成本、评估指标的具体计算方式，也未说明其适用范围限制。
    has_abstract: true
