  - https://www.archon.tech/research/compass1
  mechanism: 不改骨干，把稀疏视觉关键帧与一张显式历史表示图拼成长期时空上下文，再用三类结构化视觉问答监督，分别是任务阶段定位、探索一致性、时空目标检索，让模型按图取历史，实现近两分钟的回溯。
  media:
