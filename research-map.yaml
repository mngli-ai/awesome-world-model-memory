  date: '2026-10-30'
  detail:
    diff: 与 Transformer 比，读的地址从时间步换成记忆单元，缓存不随长度涨；与 Mamba 等比，编码保留了多个并行单元而不是单一状态，解码端可以按内容在单元间选择，因此长度外推更好，但纯语言建模仍不如 Mamba。
    formulas: []
    has_abstract: true
    io: 输入是 token 序列，输出是各记忆单元在每步的状态以及解码器读出的表示，进下游任务头。
    limits: 只做认知任务与语言建模，没有视频、没有世界模型、没有回访一致性；语言建模落后 Mamba；单元数量与状态维度对可寻址性的影响没做消融报告；复对角递归的数值稳定性未讨论。
    position: Transformer 保留完整历史，注意力可以直接取任意过去的表示，代价是 KV 缓存与单 token 成本随上下文线性增长；状态空间模型把过去压进定长递归状态，成本固定但可寻址性下降。两边各缺一半，缺的是把编码与读取分开的结构。
    steps:
    - 用多个记忆单元做编码，每个单元是一个带复对角递归矩阵的动力系统。
    - 单元更新由输入相关的泄漏率控制，实现可控的遗忘速度。
    - 递归形式化到可结合扫描，总工作量 O(T)、并行深度 O(log T)。
    - 解码器用注意力读取并组合各单元输出，不回到 token 历史。
    - 在认知任务与语言建模任务上与 Mamba、Transformer 对比，并在选择性拷贝上测长度外推。
    train: 需训，与基线同配置训练；训练步数、数据规模与单元个数摘要未给。
  explain: 它把记忆这件事拆成两半，写进去和读出来，而且两边用不同的结构。注意力的问题在于历史全留着，地址清楚但缓存随长度线性涨；状态空间模型把历史压进一个定长状态，成本固定但可寻址性差，因为读的时候只能顺着状态走，不能按内容去点。DMT 的折中是编码器里放多个记忆单元，每个单元是一个带复对角递归矩阵的动力系统，更新快慢由输入相关的泄漏率控制，等于给每个单元一个可控的遗忘速度；解码器不再回看 token 历史，只用注意力在这些单元的输出之间读和组合。这样写是并行的，递归能做结合扫描，总工作量 O(T)、并行深度 O(log T)，读的地址是单元索引而不是时间步，推理时状态尺寸不涨。结果是有取舍的，认知任务上它最好，选择性拷贝上长度外推强于 Mamba 和 Transformer，但语言建模只是接近 Transformer，仍落后 Mamba。对我这条线，这篇的价值是给出一个判断框架，我现在的六块窗口是地址清楚但容量固定，如果换成固定尺寸递归状态，容量能撑住但取地址的能力要另找办法补，它证明了这两件事确实可以分开放。它没有任何视频验证。
  id: dmt
