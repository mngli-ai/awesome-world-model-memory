  date: '2026-11-02'
  detail:
    diff: 与 EvoWorld 都用语言当状态载体，区别是它把记忆更新绑到事件检测上并分两级频率，且验证在操作任务而不是视频生成。
    formulas: []
    has_abstract: true
    io: 输入是观测流与任务指令，输出是动作；内部维护一份事件触发更新的显式语言记忆。
    limits: 十个真机任务加 56 个变体，没有视频世界模型实验；记忆容量上限与事件检测的漏检率摘要未给。
    position: 多数 VLA 按马尔可夫假设只把当前观测映射成动作，需要工作记忆的任务直接失败。
    steps:
    - 高层策略对当前观测做因子化事件检测。
    - 事件成立才把任务相关历史写进语言记忆。
    - 低层策略按记忆执行动作，高层每 10 个低层步跑一次。
    - 跨 episode 任务上把记忆带过任务边界。
    train: 需训，高层用 Qwen2.5-VL-7B 加 QLoRA（rank 16）在约 13 万帧上微调；低层沿用现成 VLA。
  explain: 这篇的关键不是用语言记历史，那是 EvoWorld 已经做过的，而是它把写入时机做成了显式决策。多数 VLA 是马尔可夫的，只看当前观测就出动作，遇到需要工作记忆的任务就崩。HeLM 借人的内心独白，让高层策略维护一份语言形式的任务相关历史，但这份历史不是每帧都写，而是先做因子化的事件检测，判断某个阶段完成事件有没有发生，只有事件成立才触发更新，于是记忆的增长跟事件数而不是帧数成正比。它还把频率分开了，高层每 10 个低层步跑一次，低层只管照记忆执行。实现上高层是 Qwen2.5-VL-7B 用 QLoRA 微调，rank 16，约 13 万帧数据。数字说单集成功率比最强基线高 12.8 个点，组合泛化子任务 78%，长程下内存少 4.5 倍、快 2.5 倍，还专门做了五个跨 episode 任务来测跨任务边界的持久上下文。对我有用的是事件触发写这个思路，proxy 如果只在场景状态真的变了才更新，就不必每帧重算。
  id: helm
  key_numbers:
