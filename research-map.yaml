  one_liner: 记忆一致性与动作控制的双轴评测
  mechanism: 不涉及记忆机制；报告只写『双轴』：记忆一致性与动作控制，指标细节未给。
  key_numbers:
  - 双轴
  self_measured: []
  media: []
  links:
  - https://arxiv.org/abs/2602.08025
  note: 只有表格一行，指标名称与数值都缺；无日期。
  tags:
  - 双轴评测
  - 动作可控
  explain: 比如你叮嘱助手自己对花生过敏，他嘴上答应得好好的，做饭时却把花生酱端上了桌。现在评估智能体常面临这种麻烦：光看它能不能背出记忆，根本不知道它会不会据此做出对的举动。这篇论文提出了一套叫MIND的评测方案，它设立了双轴，也就是从记忆一致性和动作控制两个维度一起考核。记忆一致性指模型前后说法不冲突、记准事实，动作控制指模型能否把记住的信息落实为具体操作。这招管用在于两手抓，避免了模型像鹦鹉学舌一样只背答案却无法执行，全面测出了记忆到底有没有真正指导行动。
  detail:
    position: MIND 旨在弥补缺少统一基准来评估 world models 基础能力的问题，重点评测记忆一致性与动作控制。它还考察模型在不同视角和动作空间下的表现。
    io: 输入为视频场景及交互动作条件，包含第一人称和第三人称视角，以及共享或变化的动作空间。输出为 world model 在记忆一致性和动作控制两个维度上的评测结果；具体指标细节摘要未给。
    steps:
    - 收集并整理多场景视频片段，形成基准数据，以覆盖不同环境和观察视角。
    - 为场景设置共享或变化的动作空间，包括角色移动速度和相机旋转角度，以测试动作泛化能力。
    - 在闭环交互评测中输入场景与动作条件，观察模型生成或响应的视觉结果，以评估动作控制。
    - 跨时间和视角检查模型结果的稳定性与上下文连贯性，以评估记忆一致性。
    - 提供 MIND-World 作为交互式 Video-to-World 基线，供后续模型进行基准比较。
    formulas: []
    train: 摘要未给训练数据处理、训练流程、优化方法或推理设置的具体细节；摘要仅说明提出了交互式 Video-to-World 基线 MIND-World。
    diff: MIND 被介绍为首个开放域、闭环且可重访的 world model 评测基准，并同时评测记忆一致性与动作控制。相比只在单一视角或动作设置下评测，它还覆盖跨视角表现及不同动作空间下的泛化。
    limits: 摘要指出当前 world models 难以维持长期记忆一致性并泛化到不同动作空间；评测成本及其他局限未见明确说明。
    has_abstract: true
