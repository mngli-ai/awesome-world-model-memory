- id: slotmemory
  title: 'SlotMemory: Object-Centric KV Memory for Streaming Long-Video Generation'
  date: '2026-05-29'
  lane: 内容学习寻址
  branch: 学习路由
  training: 需训
  status: 速读
  one_liner: 按是什么而非何时组织KV槽
  mechanism: 把KV流形拆成离散可复用语义槽，用槽作路由地址存取KV token，实现实体级持久与prompt感知检索。
  tags:
  - 语义槽
  - 实体持久
  - KV寻址
  key_numbers:
  - 60 秒交互叙事质量分 81.61
  - 动态一致性相对提升 22.8%
  - Wan2.1-T2V-1.3B 骨干
  media:
  - https://tj12323.github.io/SlotMemory/static/videos/60s-1.mp4
  - https://tj12323.github.io/SlotMemory/static/videos/60s-2.mp4
  links:
  - https://arxiv.org/abs/2605.31033
  - https://tj12323.github.io/SlotMemory/
  note: 摘要自述把记忆抽象从「何时」转到「是什么」，即显式反对时间坐标寻址 → 落内容学习寻址；但「槽位作为地址」也可读成实体挂载，若你按实现归位置时间寻址亦说得通，故
    confidence 降为 medium。同月还有一篇 SlotMem（2607.15772，角色可寻址内部记忆），机制更偏角色 slot 写入/读取，我未重复收录以免同类堆叠。
  arxiv: '2605.31033'
  explain: 想象镜头连续拍一只红伞：走过几条街、隔了很久再出现，它仍该是同一把伞。长视频生成却常把记忆按时间堆进缓存，越拍越难检索，还容易让物体变样、前后动作对不上。SlotMemory把键值记忆（模型用来存取信息的内部缓存）按“是什么”而非“何时发生”整理：把相似内容归入可复用的语义槽，再用槽作地址存取对应片段，并依据提示词检索。这样，物体能跨镜头保留特征，相关记忆也更容易被找回。在Wan2.1-T2V-1.3B上，60秒交互叙事质量得分为81.61，动态一致性相对提升22.8%。
  detail:
    position: 论文针对 streaming video generation 中以原始帧、片段或未聚类 token 组织历史记忆，导致实体离开画面或
      prompt 切换时身份漂移、语义不一致的问题。它提出以语义对象为中心组织 KV memory，支持长时程实体持久性与按 prompt 检索。
    io: 输入是 streaming video generation 的生成上下文、历史 KV token 与 prompt；输出是连续生成的视频内容。prompt
      可在生成过程中切换，历史记忆用于在后续生成中维持实体与语义一致性。
    steps:
    - 从 transformer 的 KV 表示中提取可复用的语义结构，将记忆组织目标从事件发生的时间转向所表示的内容，以减少仅按时间存储带来的实体关联断裂。
    - 把 KV manifold 分解为离散语义槽，使相似或相关的表示能够通过共享槽位进行组织。
    - 将语义槽作为 routing address，索引并存储高保真 KV token，以便实体离开画面后仍可保留其相关记忆。
    - 生成后续视频时依据语义槽检索历史 KV，并结合当前 prompt 选择相关记忆，以支持跨时间和 prompt 转换的语义一致性。
    formulas:
    - tex: a_{ij}=\operatorname{softmax}_{j}\!\left(-\frac{\lVert z_i-c_j\rVert_2^2}{\tau}\right)
      caption: 将 KV 表示 z_i 按与语义槽中心 c_j 的距离分配到槽位；标准写法，非原文
    - tex: r_j=\operatorname{softmax}_{j}\!\left(\frac{q(p)^{\mathsf T}e_j}{\sqrt{d}}\right),\qquad
        \hat{v}=\sum_j r_j\,\operatorname{Attn}\!\left(q,\mathcal{M}_j\right)
      caption: 依据当前 prompt p 对语义槽打分，并聚合对应槽中存储的 KV 记忆；标准写法，非原文
    train: 摘要未给训练目标、训练数据与具体训练流程。推理时采用 streaming video generation，并通过语义槽索引和检索历史 KV；摘要报告在
      Wan2.1-T2V-1.3B backbone 上评估 60 秒 interactive narratives，质量分数为 81.61，dynamic
      consistency 相对最强既有 streaming baseline 提升 22.8%。
    diff: 既有方法通常按时间组织历史内容，例如存储原始帧、片段或未聚类 token；SlotMemory 改为按语义对象组织 KV，并以离散槽位作为检索地址。其核心区别是强调语义结构与实体级记忆，而非单纯增加原始时间上下文容量。
    limits: 摘要未明确说明计算与存储开销、槽位构造细节、适用场景边界或局限。
    has_abstract: true
