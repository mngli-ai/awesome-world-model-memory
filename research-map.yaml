  explain: 这篇把我说不清的一件事说清了，固定大小的状态里，地址到底是什么。它指出 d_k 乘 d_v 的状态可以读成一排 d_k 个地址，每个地址存一个 d_v 维的值，于是取用有两个方向。键侧读用当前键去问这个键存在哪，拿到的是与键绑定的值；值侧读反过来，用值的某些特征当选择子，把存着相似值的地址聚起来。单向的 delta 规则只做前者，用当前键纠它对应的值，从来没管过相关的值特征在状态里是怎么分布的，所以同类信息可能散在互不相关的地址上，读出时互相干扰。它的补法是加一条值侧 delta 规则，用值特征去重排这条值占用的地址，让同类值的地址聚拢。对我这条线，这套视角可以直接搬，我的因果 KV cache 是按时间顺序排的地址，地址与内容的关联是位置决定的，值侧那条通路等于给了我一个按内容重排地址的算子，这正好对上我关心里什么时候会取错，就是地址与内容脱钩的时候。它的短板是纯语言模型评测，迁到视频扩散的 KV 侧没有任何验证，而且没有数字。
