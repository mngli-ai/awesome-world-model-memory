- id: packforcing
  title: 'PackForcing: Short Video Training Suffices for Long Video Sampling and Long
    Context Inference'
  date: '2026-03-26'
  lane: 位置时间寻址
  branch: 锚 sink
  training: 需训
  status: 速读
  one_liner: 三段KV缓存，丢块后补RoPE相位
  mechanism: KV分sink全分辨率、mid走3D卷积+低分辨率VAE重编码32x并top-k选、recent全分辨率；补位置缺口。
  tags:
  - 三段KV
  - 时空压缩
  - 位置缺口补齐
  key_numbers:
  - 24x 外推（5s→120s）
  - KV 仅 4GB
  - 2 分钟 832x480 @16FPS 单卡 H200
  - 时间一致性 26.07 / 动态度 56.25
  media: []
  links:
  - https://arxiv.org/abs/2603.25730
  - https://github.com/ShandaAI/PackForcing
  note: 结构上是 sink+recent 的扩容版（多了会丢块的 mid 区），所以落锚 sink；真正的位置手术是丢块后的 RoPE 相位补洞，这点和 rolling-sink
    的滑动索引互补。
  arxiv: '2603.25730'
  explain: 想象摄像机连续拍两分钟：若每帧记忆都留下，显存很快塞满；若删掉旧记忆，画面又容易忘事、跳变。PackForcing解决短视频训练难以支持长视频生成和长上下文推理的问题。它把注意力缓存（保存过往画面特征的记忆）分三段：开头帧与最近帧保留高清；中间帧经三维卷积和低分辨率变分自编码器压缩32倍，再挑重要片段留下。删帧造成的位置空缺，则补上旋转位置编码的相位，避免时间错乱。这样既保住开头与眼前细节，又用关键中段维持连贯。实验可将5秒训练外推到120秒，缓存仅4GB；单张H200能生成两分钟、832×480、每秒16帧视频，时间一致性26.07、动态度56.25。
  detail:
    position: 针对自回归视频扩散模型生成长视频时 KV-cache 随时间线性增长、内容重复和误差累积的问题，PackForcing 通过分层压缩与筛选历史上下文来控制缓存规模并维持长程一致性。
    io: 输入为自回归视频生成过程中的历史帧及当前生成上下文，输出为持续生成的视频帧。具体条件信号摘要未给。
    steps:
    - 将历史上下文划分为 sink、mid 和 recent 三类，以分别保留全局锚点、压缩中段历史和维护近期连贯性。
    - 对 sink 和 recent 保留全分辨率 token，以维持全局语义锚点与局部时间连贯性。
    - 对 mid token 使用融合 progressive 3D convolutions 与低分辨率 VAE 重编码的双分支网络压缩，以减少时空 token
      数量。
    - 对压缩后的 mid token 动态执行 top-k 选择，以在缓存规模受限时保留重要历史信息。
    - 对丢弃 token 后产生的位置间隔使用 continuous Temporal RoPE Adjustment 重新对齐，以减少位置错位对时间建模的影响。
    formulas:
    - tex: \mathcal{K}_t=\mathcal{K}_{\mathrm{sink}}\cup\operatorname{TopK}_k\!\left(\mathcal{C}_{32}(\mathcal{K}_{\mathrm{mid}});s\right)\cup\mathcal{K}_{\mathrm{recent}},\quad
        \mathcal{V}_t=\mathcal{V}_{\mathrm{sink}}\cup\operatorname{TopK}_k\!\left(\mathcal{C}_{32}(\mathcal{V}_{\mathrm{mid}});s\right)\cup\mathcal{V}_{\mathrm{recent}}
      caption: 标准写法，非原文：对 mid 历史进行 32 倍压缩并按重要性分数 s 选取 top-k，同时保留 sink 与 recent 的全分辨率
        KV。
    train: 摘要称模型可零样本运行，也可仅用 5 秒视频片段训练；未给出训练目标、优化器或其他训练设置。推理时采用三段 KV-cache 与动态 mid-token
      选择，摘要报告可在单张 H200 GPU 上生成 2 分钟、832×480、16 FPS 视频，KV-cache 为 4 GB。
    diff: 相较于不区分历史重要性或仅做统一缓存压缩的做法，PackForcing 将上下文分为 sink、mid、recent，并针对中段历史压缩与筛选，同时通过
      Temporal RoPE Adjustment 处理丢块带来的位置缺口。该设计使短视频监督也能支持长视频采样与长上下文推理。
    limits: 摘要未见明确说明方法在不同视频内容、分辨率或硬件条件下的局限，也未提供压缩质量与计算开销的详细分析。
    has_abstract: true
