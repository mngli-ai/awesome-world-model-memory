  date: '2026-11-03'
  detail:
    diff: 与 CALM 比，CALM 也保留过时记忆但按时效判断，时效用的是时间新旧，它把时效换成内容有效的时刻；与删记忆的做法比，它证明在移动过的 token 权重很小时重打时间戳优于删除。
    formulas: []
    has_abstract: true
    io: 输入是冻结的交互视频生成器、历史帧库与 agent 动作日志；输出是按有效时间重标后的 token 地址与生成视频。
    limits: 有效时间怎么从连续动作映射到帧级 token 摘要没细说；只在两个生成器上验；动作不可逆的场景没法用有效时间区分。
    position: 交互世界模型的记忆按采集时间排序，取用时假设最新即真实；状态可回退时这个假设失效，现有记忆要么删掉旧视图要么把过去当现在。
    steps:
    - 构造一对只有时间戳顺序相反的同内容视图，验证两族生成器都以最新时间戳为准。
    - 证明信最新时间戳等价于所有当前视图都晚于过时视图这个条件。
    - 证明没有回退后的视图时只有动作日志能区分回退区域与最新区域。
    - 保留全部帧，用动作日志给取回 token 标有效时间，冻结生成器直接读。
    - 在 FAR 与 HY-WorldPlay 上测撤销后当前状态出现比例，并提出校准的状态指标。
    train: 免训，冻结生成器，只改取回 token 的时间标注。
  explain: 这篇问的是我一直关心的第三个问题，什么时候会取错。现在的交互世界模型给每帧打采集时间，取记忆时默认最新的就是真的。作者反过来证明这个默认只在状态从不返回时成立，一旦 agent 撤销了一个动作，某个区域最新的那张视图其实是过时的，当下唯一有效的视图反而更旧，按采集时间取就等于把过去递给生成器。解法借数据库里的有效时间概念，帧全留着，但按动作日志给每个取回的 token 重标有效时间，冻结的生成器就会把回退过的区域读成刚进入的新状态。撤销之后 FAR 里显示当前状态的步数比例从 0.36 升到 0.62，HY-WorldPlay 从 0.003 升到 0.19。这条对我特别有用，我的 code 层本来就有动作与状态变更的记录，等于有效时间戳是免费的，proxy 与渲染器只需要按它重排地址。
  id: redate
  key_numbers:
  - FAR 撤销后显示当前状态的步数比例 0.36→0.62
  - HY-WorldPlay 0.003→0.19
  - 证明信最新时间戳当且仅当所有当前视图都晚于过时视图时成立
  lane: 位置时间寻址
  link_strength: 与 CALM 都保留过时记忆并推迟到取用时判断，CALM 判的是时效新旧，它把时效换成内容真正有效的时刻，来源是 agent 的动作日志
  links:
  - https://arxiv.org/abs/2611.00758
  mechanism: 交互世界模型从带采集时间的记忆库取帧，ReDate 保留全部帧，用 agent 的动作日志给每个取回的 token 重新标注有效时间，冻结的生成器于是把已经回退的区域读成刚刚到达的新状态，全程不训练。
