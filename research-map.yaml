  note: 全图其余节点全是纯视觉，这条补上"声场随视角变化"这一被忽略的一致性维度，配套 HelixBench 也一并提出。
  arxiv: '2609.38123'
  explain: 想象你戴着耳机走进一间虚拟房间：转动视角时，画面变了，脚步声也该从新的方向传来。许多世界模型只能生成视频，或让声音与画面各自变化，难以实时回应动作、保持空间一致。HelixWorld要解决的正是这道断层：它先用真实立体声和带米制位姿的数据训练教师模型；位姿就是相机的位置与朝向，六自由度还包括三维移动和转动。教师学习按动作双向生成，再通过在线轨迹蒸馏，把生成过程压缩成少步流式学生。这样既保留复杂的视听变化，又能边交互边输出；相机位置锚定空间声场，让声音方向随画面同步改变。论文报告它可在单张显卡上达到每秒24帧，并用HelixBench评测交互能力。
  detail:
    position: 这篇工作要解决交互式世界模型只生成视觉、缺少同步声音的问题。它提出实时视听世界模型，使画面与相机锚定的空间立体声随用户交互共同演化。
    io: 输入包括用户动作和 6-DoF 相机轨迹，训练数据还包含真实立体声与米制相机位姿。输出是实时生成的视觉场景与相机视角对应的空间立体声。
    steps:
    - 构建包含真实立体声和米制相机位姿的高保真视听数据集，为视觉与空间声学的联合学习提供对齐数据。
    - 用 6-DoF 相机轨迹和用户动作条件预训练双向 teacher，以学习视听场景随视点和交互变化的动态。
    - 通过在线轨迹蒸馏将 teacher 转为少步流式 student，以降低因果交互的推理延迟。
    - 在交互推理时同步生成画面和相机锚定的空间声场，以支持实时视听联合演化。
    formulas:
    - tex: \mathcal{L}_{\mathrm{distill}}=\mathbb{E}_{t,\mathbf{z}_t,\mathbf{c}}\left[\left\|\mathbf{v}_{\mathrm{student}}(\mathbf{z}_t,t,\mathbf{c})-\mathbf{v}_{\mathrm{teacher}}(\mathbf{z}_t,t,\mathbf{c})\right\|_2^2\right]
      caption: 以教师预测监督学生的视听联合去噪/流场；标准写法，非原文
    train: 先在真实立体声和米制相机位姿数据上预训练由 6-DoF 相机轨迹与用户动作条件化的双向 teacher，再用在线轨迹蒸馏训练少步流式 student。推理采用因果流式生成，摘要报告单
      GPU 上达到 24 FPS；其他训练超参数和推理设置摘要未给。
    diff: 已有交互式世界模型主要生成视觉内容，忽略声音；HelixWorld 将真实立体声与视觉场景联合生成，并要求声场随相机运动保持空间一致。它通过在线轨迹蒸馏实现低延迟因果交互，并提出
      HelixBench 评估动态视点下的空间声学一致性。
    limits: 摘要未见明确说明计算与数据构建代价、适用场景边界或失败模式。
