  detail:
    diff: 与直接端到端出机器人视频的方法比，它的控制变量是显式且可编辑的；与只做一次场景搭建的做法比，它把写场景程序的经验沉淀成库，跨任务复用；与 fight-world-model 这类引擎结算比，它的世界由 Blender 程序定义，物理规则来自渲染器而非自建引擎。
    formulas: []
    has_abstract: true
    io: 输入是初始图像、带运动数据的图像或人类演示视频，加一段任务描述与机器人资产；输出是 proxy 视频与最终渲染视频，中间产物是可编辑的 Blender 场景程序。
    limits: 自标技术报告，未同行评审；15 个任务 5 种机器人，规模仍小；摘要只给方向不给数值，且动态程度一项输给基线；场景程序的质量取决于编码代理能不能写对 Blender，失败模式未报；经验库的检索命中率与跨任务迁移幅度未给。
    position: 把机器人视频生成的可控变量收进可执行场景程序，让几何、运动与机位可编辑、可复用，视频模型只补外观。
    steps:
    - 编码代理读任务与输入，写出规定物体、机器人运动与相机的 Blender 场景程序。
    - 渲染场景程序得到 proxy 视频，作为结构与运动参照。
    - 视频生成模型在 proxy 条件下补视觉细节，出最终视频。
    - 多代理编排负责输入处理、场景构建、审阅与渲染，自动评测与用户反馈驱动迭代。
    - 把可复用的建模与渲染规则写进经验库，下次同类任务检索复用。
    train: 不训练生成模型，proxy 与最终视频都由现成模型产出；编码代理与经验库的更新方式摘要未给。
  explain: 端到端生成拿不到场景几何、机器人运动与机位这三个变量的直接控制权，想改一处就得整段重画，也没法跨任务复用。这条把控制权交回代码：给定机器人资产与任务描述，编码代理写出可编辑的 Blender 场景程序，把物体、运动与相机都显式写死，渲出来的 proxy 视频只提供结构与运动参照，视觉细节由视频模型补。外层还有一层多代理编排，负责输入处理、场景构建、审阅与渲染，自动评测加人工反馈做迭代；最值得看的是经验库，它把可复用的建模与渲染规则存下来供检索。它的卖点不是一条片子的画质，而是同一份场景程序能换机位、换机器人、换外观，还能把上一轮学到的写法带到下一轮。这跟我主线里的 code 到 proxy 到 video 是同一套骨架，只是我用自己写的状态机，它用 Blender。
  id: bwm-forge
  key_numbers:
