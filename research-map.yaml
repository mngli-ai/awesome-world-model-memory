  explain: 长程操作里有一类歧义，观测完全一样，但任务进度和此前尝试的结果不同，该做的动作就不同，这条把它叫决策别名。解它必须有执行历史的记忆，可是把整段观测历史都留着太贵，近期做法是用感知、语义或运动学线索压成事件记忆，问题是这些线索挑出来的事件未必跟任务成败有关。这条换了个判据，只记那些显著改变最终成功概率的事件，用 critic 估这个改变量，正向的记成进展，负向的记成失败，失败记录在对应子任务完成后就丢掉。数字很硬，十个子任务的诊断环境里 88.0%，同一个环境里 36 步观测窗口和运动学事件记忆都是 0.0%，去掉失败记录掉到 1.7%，说明有用的是失败记录。对我最直接的是写入判据：我的状态机现在按变化写，它按对结果的影响写，两者差别在于后者自带一个该不该留的阈值。
