  explain: 这篇正面处理一个我一直绕着的副作用，往流式缓存里写新东西会挤掉已经建立好的上下文。它的解法是临时注入加还原，先把参考 latent 摆进最新场景
    latent 的目标位置，让参考特征带着当前场景的上下文被提出来，用这批特征条件这一块生成，生成完把被覆盖的全局缓存条目原样恢复，只留这次真正生成出来的历史。等于把这次写入当成一次事务，用完回滚。免训这点对我很直接，我的
    causal 版把 KV 固定成 6 块窗口，任何新条件注入都会挤掉一块历史，按它的办法做临时注入加回滚，理论上能在不扩窗口的前提下支持中途换主体或换条件。要抄的是那个还原时机，它证明缓存写坏了可以退回。缺点是没有数字，基准也是自己建的。
