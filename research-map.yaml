- id: deep-forcing
  title: 'Deep Forcing: Training-Free Long Video Generation with Deep Sink and Participative
    Compression'
  date: '2025-12-04'
  lane: 位置时间寻址
  branch: 锚 sink
  training: 免训
  status: 速读
  one_liner: 窗口一半给sink，并把sink相位对齐当下
  mechanism: 滑窗一半配额留给持久sink token并把其时间RoPE相位重对齐当下；另一半按近期注意力重要性剪KV。
  tags:
  - 深sink
  - RoPE相位对齐
  - 免训KV管理
  key_numbers:
  - 12x 外推（5s 训练 → 60s+ 生成）
  - 保持实时生成速度
  - 动态度显著优于 RollingForcing
  media: []
  links:
  - https://arxiv.org/abs/2512.05081
  note: 明确说「照搬 StreamingLLM 式 sink 会导致保真度下降与运动停滞」，正是锚 sink 分支的自我修正节点；同时做 sink 数量（Deep）与
    sink 相位（RoPE 重对齐）两件事，所以和 anchor-forcing 有重叠但更早、更纯粹地讲 sink 配额。
  arxiv: '2512.05081'
  explain: 想象摄像机沿着小路持续拍摄：模型只学过5秒，却要稳定生成60秒以上；若不断滚动新画面，旧信息被挤出，人物身份、镜头运动和场景布局就会漂移，这正是长视频生成的麻烦。Deep
    Forcing把窗口一分为二：一半名额长期保留持久性“汇聚 token”，它们像记忆锚点，负责吸收注意力、维持生成稳定；同时把这些 token 的时间旋转位置编码（用时间相位表示位置）重新对齐到当前时刻，避免记忆因时间错位失效。另一半名额则根据近期注意力的重要性剪掉不关键的键值缓存，也就是模型保存的历史信息。这样既保住全局连续性，又把计算集中在眼前最有用的内容上，不增加训练，仍保持实时速度，实现约12倍外推，动态稳定性明显优于RollingForcing。
  detail:
    position: 该方法针对自回归视频扩散在长时生成中出现的时间重复、漂移和运动减速，以及直接使用 attention sink 导致的画质下降与运动停滞。它通过免训练的
      KV cache 管理，稳定长程上下文并减少历史误差累积。
    io: 输入为自回归视频扩散过程中的当前生成状态与滑动窗口内的 KV cache，输出为持续生成的视频帧及更新后的 cache。条件信号包括视频生成过程原有的条件；摘要未说明其具体形式。
    steps:
    - 将滑动窗口的一半配额分配给持久 sink token，为长时生成保留稳定的全局上下文。
    - 把 sink token 的 temporal RoPE 相位重对齐到当前时间线，避免其位置编码与持续推进的生成时间脱节。
    - 对窗口另一半中的历史 KV 按近期注意力参与重要性进行筛选，保留仍参与近期注意力的 token。
    - 丢弃冗余或已退化的历史 KV，减少误差累积，并继续自回归生成后续视频帧。
    formulas:
    - tex: K_{s}^{\mathrm{aligned}}=R(\tau_{\mathrm{now}})R(\tau_s)^{-1}K_s
      caption: 将持久 sink token 的时间 RoPE 相位重对齐到当前时间；标准写法，非原文
    - tex: I_i=\sum_{q\in\mathcal{Q}_{\mathrm{recent}}}\sum_h A_{q,i}^{(h)},\qquad
        \mathcal{K}_{\mathrm{keep}}=\operatorname{TopK}_{i\in\mathcal{K}_{\mathrm{hist}}}(I_i)
      caption: 按近期注意力参与度给历史 KV 打分并筛选保留项；标准写法，非原文
    train: 无需 fine-tuning，属于 training-free 方法；推理时在自回归视频生成过程中实施 Deep Sink 与 Participative
      Compression 管理 KV cache，并保持实时生成。其他训练流程和关键设置摘要未给。
    diff: 不同于直接套用 StreamingLLM-style attention sinks，Deep Sink 将半个滑窗配额留给持久 sink，并将其
      temporal RoPE 相位重对齐到当前时间线。Participative Compression 则按近期注意力参与情况剪除 KV，而非仅依赖固定窗口截断；全程无需微调。
    limits: 摘要未见明确说明计算与显存代价、适用模型范围及失败情形。
    has_abstract: true
