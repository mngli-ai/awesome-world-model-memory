  mechanism: 编码器由多个记忆单元组成，每个是一个带复对角递归矩阵的动力系统，更新由输入相关的泄漏率控制；解码器用注意力读并组合这些单元的输出，不回到 token 历史。递归形式支持结合扫描，总工作量 O(T)、并行深度 O(log T)、维度固定，自回归推理时递归状态与卷积缓存尺寸都不随上下文增长。
