    - tex: Y_p=\mathcal{R}_{\mathrm{GS}}\!\left(\mathcal{G}(t),\Pi_t^{\mathrm{tar}}\right)=\sum_{i=1}^{N}w_{p,i}\,z_i
      caption: 把绑了噪声的原语按目标相机光栅化，得到该机位的噪声混合。（依原文式 8）
    - tex: \mathrm{Cov}(Y_p,Y_q)=\left(\sum_i w_{p,i}w_{q,i}\right)I_H
      caption: 两个视角共享原语，协方差由此不为零，这是跨视角一致的来源。（依原文式 9）
    - tex: \varepsilon_p^{3D}=Q_p^{\top}\tilde{Y}_p,\qquad \mathrm{Cov}(\varepsilon_p^{3D},\varepsilon_q^{3D})=\rho_{pq}\,Q_p^{\top}Q_q
      caption: 投影后边际回到标准高斯，跨视角相关被分成原语重叠项与投影基夹角项。（依原文式 16 与式 18）
    train: 需训。主干 DiT 冻结，只训 LoRA，rank 256；训练数据是 MCV 的 36K 同步视频对与 DL3DV 的 2K 视频经时间折叠扩出的约 13.5K 对。
    diff: 与加相机嵌入、跨视角注意力这类架构手段相比，它不动网络，把一致性放到噪声先验这一层；与 Go-with-the-Flow、ReCamMaster 这类在 2D 平面抽噪声再对齐的做法相比，噪声从一开始就在 3D 里定身份，跨视角对应是几何给的而不是学出来的。
    limits: 相机精度不是最优，RotErr 与 TransErr 都输给 ArtiFixer，说明几何先验的收益集中在动态细节一致性上而不是位姿精度；只做 5 秒 15fps 片段，没有长程与回访；依赖一个外部 4D 高斯模型（NoPo4D），它提错了后面全错；遮挡边界混合锚点是白化假设的真实失效场景；没报吞吐与训练成本。
    has_abstract: true
  concepts:
  - 几何对应编码
  - 结构条件渲染
