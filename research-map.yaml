- arxiv: '2611.13378'
  branch: ''
  concepts:
  - 分块因果缓存
  - 全局锚点KV
  date: '2026-11-09'
  detail:
    concepts:
    - 分块因果缓存
    - 全局锚点KV
    diff: 与循环 Transformer 比，它把循环挪到编码器并让轮间共享 KV，内存不随轮数增长；与 dKV Forcing 比，那条把记忆 KV 与生成 KV 分开训，这条让两者在轮间直接复用。
    formulas: []
    has_abstract: true
    io: 输入是长提示，输出续写；中间产物是编码器每轮精化出来的那一份全局 KV，跨层跨轮共享。
    limits: 语言侧，视觉与长视频未验；吞吐与驻留数字是 serving 口径；循环轮数与质量的关系只报了 8 轮。
    position: 我的六块窗口是硬砍，砍掉的就永久取不到。这条给的是另一条路：不砍，让多轮计算共用同一份缓存，加深靠反复读同一份 KV 而不是每轮再写一份。
    steps:
    - 把全局 KV 的产生收敛到稀疏的编码器层。
    - 把循环放在编码器里，反复精化全局 KV，而不是重读解码器投影。
    - 用随机循环深度训练，把每轮的 KV 压到共享上一轮的不动点。
    - 在 552B 模型上循环 8 轮，量 KV 占用、可容纳请求数与吞吐。
    train: 需训。随机循环深度训练是拿到不动点的前提。
  explain: 循环加深能在不加参数的前提下多算几轮，但每轮每层都存一份 KV，批大小立刻被压死。Looped CED 的做法是只让稀疏的编码器层产生全局 KV，把循环放在编码器里反复精化这一份全局 KV，而不是让解码器一遍遍重读静态投影。再往下一层，它用随机循环深度训练，得到一个不动点：每一轮都可以无损共享上一轮的缓存。两层共享叠起来，内存足迹和不循环的版本持平，回收了循环 Transformer 增益的 86 到 93%，全局 KV 只用 1/6。生产侧它把 552B 的 DeepSeek-V4.1-Flash 循环 8 轮，每 token 的 KV 少 36.8 倍，一个节点能塞 38 个 128K 请求。对我的意义是第三条路：既不像我的六块窗口那样硬砍，也不是把历史全留着，而是让多轮计算共用同一份缓存。
