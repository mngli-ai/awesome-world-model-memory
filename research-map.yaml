- arxiv: '2611.09795'
  branch: ''
  concepts:
  - 训练无关
  - KV压缩或淘汰
  date: '2026-11-06'
  detail:
    concepts:
    - 训练无关
    - KV压缩或淘汰
    diff: 与 dKV Forcing、Compression Forcing 都在动 KV，它们动键与位置来让远期记忆落在分布内，这条只动值并且承认键不必动；与需要反演的编辑方法比，它把反演换成一次前向缓存。
    formulas: []
    has_abstract: true
    io: 输入是源视频与编辑目标，输出是流式生成中的编辑后帧；缓存是源视频若干层在 value 上的特征。
    limits: 任务是编辑而不是长程生成，没有回访一致性指标；只在自回归蒸馏模型上验证，双向模型是否同样成立未测；缓存与注入的开销只写很小，没有数字。
    position: 训练无关的视频编辑默认能拿到整段视频，流式场景下拿不到未来帧，已有办法要么额外训练要么只支持特定编辑类型；反演之所以必要，是因为要找回源的身份，而身份藏在哪一层一直没被拆开看。
    steps:
    - 对 DMD 蒸馏的自回归视频模型逐层看去噪各步的 query、key、value 与源的关系。
    - 得到不对称结论，query 与 key 稳定对齐，value 漂移且承载内容，高噪段最强。
    - 做一次前向，把源的值特征缓存下来。
    - 从纯高斯噪声起步，在去噪过程中选择性注入缓存的值。
    - 在多个自回归骨架上与反演类方法比保真与色调。
    train: 免训，只在推理期做一次前向缓存并注入，不改权重。
  explain: 这条虽然是编辑，但它给出的观察直接关系到我在流式因果模型里该缓存什么。作者去看 DMD 蒸馏后的自回归视频模型，比较去噪各步的注意力，发现 query 和 key 在各步之间稳定，并且与源视频的对应物对齐，value 则会变，承载的是正在生成的内容，这个不对称在高噪段最强，而少步流式模型恰好就在高噪段工作。结论很省，一次前向就足以把源的身份信息抓进 value 里，后面整段生成复用这批值即可，反演这一步于是被整个删掉，从纯高斯噪声起步，只注入源的值就能重建输入，保真度追平甚至超过反演类方法。对我的意义是把键和值分开看，键管的是位置和地址，值管的是内容，地址在因果流式里可以固定成六块窗口，内容却必须随时可取，这两件事的开销应该分开算。它自己的定位是实时流式编辑，免训、零反演，开销小，但没有长程记忆与回访的指标。
