  lane: 训练侧
  link_strength: 与 Memory Forcing 都在固定缓存之外另留一份长程历史，Memory Forcing 在定长 KV 里划出归档区，它把记忆按时间尺度分层并写进后训练目标，记忆与自滚动训练绑在同一条链上
  links:
