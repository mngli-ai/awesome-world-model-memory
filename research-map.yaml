  date: '2026-11-11'
  detail:
    diff: 与只报问答准确率的流式视频基准比，它先剔除不需要记忆就能答对的题；与 twinpast 靠替换关键证据做对照比，它用证据区间加三重排除来保证每题都必须回溯。
    formulas: []
    has_abstract: true
    io: 输入是流式到达的视频与问题；输出是答案；中间产物是每题绑定的证据区间，以及通过可解性与必要性校验的题集。
    limits: 摘要零数字，题量、视频长度分布与参与模型数都未给；必要性校验依赖标注的证据区间，标注噪声会直接变成假阳性；只覆盖理解侧问答，生成侧的时间一致性与空间一致性不在其中；四类之间的难度是否可比未说明。
    position: 把流式视频问答里的记忆能力从理解能力与语言捷径中分离出来，只保留必须依赖历史才能答对的题。
    steps:
    - 给每题标注时间上定位的证据区间。
    - 校验可解性，模型只看这段证据要能答对。
    - 校验必要性，模型不能靠近期观测、证据之后的观测或纯文本答对。
    - 按情景检索、状态跟踪与更新、多证据整合、语境记忆四类组织评测。
    train: 不适用，是评测基准。
  explain: 流式视频理解里，问答准确率并不能当记忆能力的度量，答错可能只是没看懂，答对也可能靠语言先验或最近几帧就蒙对，两种都不需要历史。这条的办法是先给每题绑一段时间上定位的证据区间，再做一次可解性与必要性校验：模型必须能从这段证据答对，同时不能靠近期观测、证据之后的观测、或者纯文本输入答对，留下来的题才算真考记忆。四类覆盖情景检索、状态跟踪与更新、多证据整合、语境记忆。这条对我的用处不在指标本身，在协议形式：我在生成侧要说某块历史被取错过，也需要先证明这一块是必需的，也就是去掉它答不对、给它才答对，这套三步校验可以直接照搬成生成侧的探针设计。
