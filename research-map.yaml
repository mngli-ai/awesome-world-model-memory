- id: worldplay
  title: WorldPlay (HY-World 1.5)
  date: '2025-12-01'
  precision: month
  arxiv: '2512.14614'
  venue: ICML 2026
  lane: 位置时间寻址
  branch: 重排位置
  parent: rolling-forcing
  link_strength: dotted
  training: 需训
  status: 精读
  one_liner: 重排上下文位置，把旧帧拉回熟悉的注意力距离
  mechanism: 时间记忆取最近 L 个 chunk，空间记忆按 FOV 重叠与相机距离挑非相邻历史；读取时丢掉绝对时间编号、重分配较近位置。
  key_numbers:
  - 5B/8B
  - 720p 24FPS
  - 10s 4K
  - 360°
  - 4 段轨迹漫游
  self_measured:
  - 6.7s 1600×900
  media:
  - demos/WorldPlay/traj_10.mp4
  - demos/WorldPlay/show02_demo.mp4
  links:
  - https://arxiv.org/abs/2512.14614
  note: 报告只给到月份 2025-12；§3.1 网页实测的两条失败记录（转满 360° 后遗忘、人物变枕头）没有 demos 相对路径。
  tags:
  - FOV重叠召回
  - 位置重分配
  explain: 就像你在大宅子里转悠一圈回到玄关，模型早把一开始的客厅陈设忘光了，漫游生成极易穿帮。WorldPlay专治这种长时程遗忘问题。它的做法是双管齐下：既保留刚过去的近期画面，又依据视场角——也就是镜头能看到的视野范围重叠度与距离，把走过的关键旧画面挑出来。关键一招是丢掉这些旧帧原先遥远的时间编号，强行给它们安插一个紧挨当前的近处位置。这招管用在于，模型的注意力机制（即分配关注权重的计算方式）天生擅长捕捉近处线索，把旧记忆拉回眼前，便能低成本稳住前后一致性。
  key: true
  detail:
    position: WorldPlay 旨在解决实时交互式视频生成中速度、记忆与长时几何一致性难以兼顾的问题。它通过改造历史上下文的选择与位置安排，减少长程记忆衰减和生成误差漂移。
    io: 输入包括历史视频帧以及用户的键盘和鼠标操作，动作信号由 Dual Action Representation 表示。输出是可交互的流式视频，摘要报告其可生成
      720p、24 FPS 视频。
    steps:
    - 用 Dual Action Representation 编码键盘与鼠标输入，使生成过程能稳健响应用户控制。
    - 构建 Reconstituted Context Memory，保留最近的时间记忆，并依据视野重叠和相机距离挑选非相邻历史帧，以兼顾近期动态与重要旧场景。
    - 读取历史上下文时移除绝对时间编号，并将选中的旧帧重分配到较近的位置，使其保持在模型熟悉的注意力距离内。
    - 训练时使用 Context Forcing 对齐教师与学生的记忆上下文，使学生能利用长程信息并减少误差漂移。
    - 推理时结合动作控制与重构后的上下文进行流式生成，以支持实时交互和长时几何一致性。
    formulas:
    - tex: s_i=\operatorname{IoU}(\mathcal{F}_i,\mathcal{F}_t)-\lambda\lVert\mathbf{c}_i-\mathbf{c}_t\rVert_2,\qquad
        \mathcal{M}_{\mathrm{space}}=\operatorname{TopK}_{i\notin\mathcal{M}_{\mathrm{recent}}}(s_i)
      caption: 标准写法，非原文：按视野重叠与相机距离为非相邻历史帧打分并选取空间记忆。
    - tex: p'_i=L+\operatorname{rank}(i),\qquad i\in\mathcal{M}_{\mathrm{space}}
      caption: 标准写法，非原文：丢弃空间记忆的绝对时间编号，并将其重映射到近期位置范围；具体位置分配规则以论文实现为准。
    train: 训练采用 Context Forcing，通过对齐教师与学生的记忆上下文进行蒸馏，目标是保留学生利用长程信息的能力并抑制误差漂移。推理时使用
      Dual Action Representation 接收用户控制，并通过 Reconstituted Context Memory 选择和重排历史上下文。摘要未给出更具体的训练设置。
    diff: 不同于仅依赖连续近期帧或直接保留历史时间位置的做法，WorldPlay 会按时间与空间线索重建记忆，并把选中的旧帧重排到较近的注意力位置。其 Context
      Forcing 还专门对齐教师与学生的记忆上下文，以适配记忆感知模型的蒸馏。
    limits: 未见明确说明
    has_abstract: true
  citations: 0
  cpm: 0.0
  repro: paper_only
  inherited: 2
  inherited_by:
  - hy-world-2
  - worldtrace
  inherited_chain: 0
  concepts:
  - 视野重叠检索
  - 动作条件控制
