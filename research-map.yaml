  date: '2026-11-08'
  detail:
    concepts:
    - KV压缩或淘汰
    - 动作条件控制
    - 训练无关
    diff: 与按注意力权重淘汰的 KV 压缩相比，保留依据从生成器内部显著性换成规划器的语义约束；与需要重训或多次采样的压缩相比，它对每个候选独立生效，不改键值与位置。
    formulas: []
    has_abstract: true
    io: 输入是规划器的语义约束与各候选的 KV 缓存，输出是压缩后仍保留键值与原位置的缓存，供下一块生成。
    limits: 增益极小，总分只比最强压缩基线高 0.05，主要价值在省显存；只在自回归视频骨干上验，少步蒸馏版本未测；约束提取依赖文本交叉注意力，纯视觉约束场景未讨论。
    position: agentic 自回归视频生成里，多轮候选 rollout 让视觉历史不断变长，KV 显存与注意力开销跟着涨，而现有压缩只看生成器自己的注意力，不看规划器提出的语义要求，被要求出现的属性或动作反而可能先被淘汰。
    steps:
    - 用文本交叉注意力找出与约束相关的视频位置。
    - 把这些位置的自注意力 query 按约束分组，组内平均、组间取最大，给缓存条目打分。
    - 在内存预算下做一次 top-k 保留，键值与原位置保持不变。
    - 在四个自回归骨干、三个基准、三档时长上比 VBench 与显存占用。
    - 给出去掉语义分组的消融，确认约束引导带来的差异。
    train: 免训，不重训骨干也不额外生成视频，只在推理期改保留准则。
  explain: 这条是视频自回归生成的 KV 压缩，但换了个依据。以往按注意力权重淘汰，谁被用得多留谁，问题是规划器要求出现的属性或动作，其对应状态可能权重不高，一压就丢。SemanticKV 先用文本交叉注意力找出与这些约束相关的视频位置，把它们的 query 分组，组内平均、组间取最大，于是只要某个缓存条目被任一约束强烈用到，它就能拿高分，再在预算下做一次 top-k，键值与原位置都不动。它是免训的，对每个候选独立生效，不用重跑视频。数字上压缩比 0.7 时 VBench 总分 84.10，比最强压缩基线 84.05 略高，也比全 KV 的 83.99 高，显存从 6.04G 降到 1.81G。这说明保留准则可以外挂一个语义来源，我的窗口如果能接上代码侧的结构约束，就不必只按注意力分数砍。
  id: semantickv
  key_numbers:
  - 压缩比 0.7 时 VBench 总分 84.10，最强压缩基线 84.05，全 KV 83.99
  - KV 显存 6.04 GB 降到 1.81 GB，3.35 倍
  - 比全 KV 快 1.22 倍
  - 四个自回归骨干，三个基准，5、30、60 秒三档
  lane: 位置时间寻址
  link_strength: 与 dKV Forcing、EchoKV 都在做视频生成的 KV 淘汰，那两条按注意力或动态重要性留，这条把规划器给的属性与动作约束当保留依据，谁的语义被强用到就留谁
  links:
  - https://arxiv.org/abs/2611.11452
  mechanism: 用文本交叉注意力定位与规划器约束相关的视频位置，把这些位置的 query 分组，组内取平均、组间取最大，使每个缓存条目只要被任一约束强烈用到就得高分，再在预算下做一次 top-k 保留，键值与原位置都不动。
  media: []
  note: 雷达自动入库 2026-11-11，字段据摘要，待人工核。增益本身很小，84.10 对 84.05 与 83.99 都在一个点内，主要卖点是省显存与免训；只在自回归视频骨干上验，非自回归与少步蒸馏版本未测；分组数怎么定未给。
  one_liner: 按规划器的语义约束决定留谁
