  date: '2026-11-10'
  detail:
    diff: 与只把布局当输入的驾驶世界模型比，它的布局是被预测的输出之一，因此能在遮挡与外观纠缠的情况下把运动单独解出来；与靠动作条件分支控自车的做法比，它把控制折进几何变换，省掉一个条件通道。
    formulas: []
    has_abstract: true
    io: 输入是单张相机图像与一条自车轨迹；输出是透视视频与 BEV 视频两路，其中 BEV 按固定度量尺度绘制。
    limits: 限定驾驶域，BEV 由标注渲染，标注覆盖不到的类别不会出现在 BEV 里；软条件是沿轨迹平移旋转最新一帧，长时程与大幅转向下累积误差如何未报；摘要只给相对结论无绝对数值；两路联合生成使推理成本翻倍，摘要未报延迟。
    position: 把俯视 BEV 从输入布局提升为与透视视频同步预测的一路未来，并用它当自车轨迹的几何控制接口。
    steps:
    - 训练时从场景标注渲染 BEV 视频，画出道路与车辆的简化形状。
    - 两路视频扩散变压器分别生成透视与 BEV，两路之间做联合注意力。
    - 推理时把 BEV 最新一帧沿输入轨迹平移旋转，生成一串软条件帧。
    - 以软条件帧约束生成，使场景变化与自车运动一致，不需要显式动作条件或 HD 地图。
    train: 两路扩散变压器需训练，BEV 监督来自场景标注渲染；数据规模与训练成本摘要未给。
  explain: 让周围车辆动得合理，同时让自车严格跟轨迹，是驾驶世界模型的两件难事，前者要靠布局约束，后者往往要靠额外的动作条件。这条的做法是让场景布局本身成为预测的一部分：一路生成透视视频，另一路生成按固定度量尺度画的 BEV 视频，路和车都是简化形状，遮挡少，位置与运动一眼可读，两路用联合注意力互相看。关键在 BEV 这一路的第二个用途，推理时把 BEV 最新一帧沿输入的自车轨迹平移旋转，得到的帧当作软条件，等于告诉模型只动自车时场景看上去该怎么变。这样不需要动作条件分支，也不需要 HD 地图和车辆状态输入，单张相机图就能出两路视频。它的价值在于给我一个提醒：proxy 不一定是给渲染器看的中间产物，它可以是与画面同等地位的被预测对象，反过来当控制接口。
