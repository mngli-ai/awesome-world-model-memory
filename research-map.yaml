- id: agentgarten
  title: 'AgentGarten: Code Worlds for Evolving Agents'
  arxiv: '2610.12374'
  date: '2026-10-14'
  lane: 代码世界模型
  branch: Agent 环境
  one_liner: 代码世界加共享渲染器，当 agent 训练场
  mechanism: 模拟器维护持久状态并执行代码规则，只把 depth 或 surface normal 交给共享神经渲染器；Adversarial Forcing
    让 history prefilling 可微，渲染误差不回灌状态
  tags:
  - 共享渲染器
  - 对抗蒸馏
  training: 需训
  status: 速读
  key_numbers:
  - 480×832 >30FPS 单 H100
  - 4 轮≈2500 万 episode
  - 10 轮≈1 亿
  links:
  - https://arxiv.org/abs/2610.12374
  - https://mirros-lab.github.io/agent-garten/
  note: 把 CodeWM 从 demo 推进成 agent 训练环境
  venue: ''
  self_measured: []
  media: []
  parent: null
  link_strength: ''
  precision: day
  explain: 想象一个不断变化的游戏沙盘：小人走过、门被打开，世界都会记住。训练视频智能体时，真实视频难交互、生成成本高，普通模拟又不够逼真。AgentGarten把世界拆成两层：代码模拟器保存持续状态、按规则执行动作，只输出深度图或表面法线，也就是距离和朝向信息；共享神经渲染器再把它们画成视频。这样，规则和画面生成分开，改世界不必重训渲染器。它还用对抗式强制，让历史预填充——补出此前画面以接续当前状态——过程可微；渲染误差却不回写模拟器，避免画面瑕疵污染世界逻辑。单张H100上，它以480×832分辨率跑超30帧/秒，4轮约生成2500万段经历，10轮约1亿段。
  detail:
    position: AgentGarten 要解决的是如何构建既有一致状态与规则、又有真实视觉观测的多样交互环境。它将代码定义的模拟世界与共享神经渲染器结合，作为
      agent 可持续探索和学习的训练场。
    io: 模拟器接收程序定义的世界规则和 agent 动作，维护持久世界状态，并导出结构化条件信号；已知条件信号包括 depth 或 surface normal。共享神经渲染器根据这些条件生成视觉观测，供
      agent 感知并交互。
    steps:
    - 用代码和模拟器或游戏引擎定义世界及交互规则，使环境状态持久且规则一致。
    - 将世界状态整理为结构化条件并通过通用接口导出，使不同环境能够接入同一渲染器。
    - 把预训练 video model 适配为条件渲染器，并用 Adversarial Forcing 训练，使其根据几何条件生成视觉观测。
    - 通过精确 replay 让 history prefilling 可微，并加入真实数据的 adversarial supervision，使后续预测损失能够更新历史观测的编码并改善视觉质量。
    - 让 agent 在实时环境中观察和行动，再将每轮经验蒸馏为 playbooks，供后续 agent 继承和改进。
    formulas: []
    train: 训练时将预训练 video model 适配到几何条件，以 Adversarial Forcing 进行蒸馏；该方法通过精确 replay 使
      history prefilling 可微，并使用真实数据的 adversarial supervision。推理时优化渲染速度以支持实时交互。agent
      将每轮经验蒸馏为后续 agent 使用的 playbooks。更具体的训练设置摘要未给。
    diff: 不同于仅依靠单一模拟环境或分别为各环境构建视觉系统的做法，AgentGarten 以模拟器维护状态和规则，并通过共享神经渲染器生成视觉观测。Adversarial
      Forcing 使后续预测误差能够回传到历史观测编码，同时模拟状态仍由后端维护。
    limits: 摘要未明确说明训练和推理的计算代价、渲染质量边界或环境规则编写成本；只报告 agent 相比传统 reinforcement learning
      对照可在 4 轮而非数百万轮中学习。
    has_abstract: true
