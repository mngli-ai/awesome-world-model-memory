    参考文献对应关系。
  tags:
  - r_sink复用
  - 实体记忆
  explain: 就像读一本无限长的书，如果书签用光了页码，前面的内容又塞爆了脑袋，模型就会彻底乱套。这篇要解决的正是大模型处理超长文本时前文装不下且位置编号失效的麻烦。它走的是咱们组典型的记忆加位置重写路线，也就是把前面的重要信息压缩成额外记忆，再把新输入内容的位置编号重写拉回合理区间。这招之所以管用，是因为记忆结构帮模型保住了远距离的关键信息，而位置重写抹掉了过大页码带来的混乱，让模型在不爆显存也不迷失相对顺序的情况下一直读下去。
  detail:
    position: Echo-Infinity 面向自回归视频生成中历史长度不断增长、有限缓存难以保留长期信息的问题，目标是在计算成本恒定的条件下支持任意长度的视频生成。它通过可学习的演化记忆和相对时间位置重写，降低长期生成中的信息损失与误差累积。
    io: 输入为自回归生成所需的局部视频帧、历史记忆状态及生成条件；具体条件信号未说明。输出为逐帧生成的视频，以及随历史更新的记忆状态。
    steps:
    - 模型在局部窗口内自回归生成视频帧，以局部上下文维持当前生成的连贯性。
    - 当旧帧从局部窗口中移出时，使用 Memory Query 通过注意力读取这些历史信息，并通过门控机制更新记忆，以抽象和压缩被移出的内容。
    - 将更新后的记忆作为后续生成的历史信息，使记忆随生成过程演化，并以恒定计算成本支持任意长度历史。
    - 使用 Unified Relative RoPE Recipe 重设时间位置：sink 帧从位置 0 开始，最新帧的位置不超过模型预训练的最大时间 RoPE
      位置，以缓解有限位置范围及训练推理位置差异。
    - 将 Memory Query 与视频 DiT 端到端优化，使其形成可泛化的生成先验；仅使用优化后的初始记忆状态时也可改善生成质量。
    formulas:
    - tex: r_t=\operatorname{softmax}\!\left(\frac{Q_tK_{\mathrm{old}}^{\top}}{\sqrt{d}}\right)V_{\mathrm{old}}
      caption: 标准写法，非原文；Memory Query 对移出局部窗口的历史信息进行注意力检索
    - tex: M_t=g_t\odot\widetilde{M}_t+(1-g_t)\odot M_{t-1},\qquad g_t=\sigma\!\left(W_g[\widetilde{M}_t;M_{t-1}]\right)
      caption: 标准写法，非原文；通过门控融合新压缩的历史信息与既有记忆
    train: Memory Query 与视频 DiT 端到端联合优化。训练和推理均采用 Unified Relative RoPE Recipe，使 sink
      帧从位置 0 开始，并限制最新帧位置不超过 DiT 预训练的最大时间 RoPE 位置。其余训练数据、损失函数及具体推理设置摘要未给。
    diff: 相较于预设 KV-cache 调度、固定比例启发式压缩和推理时 RoPE 调整，Echo-Infinity 使用可学习的 Memory Query，并在历史帧移出局部窗口时通过注意力和门控更新记忆。它还统一重设相对
      RoPE 位置，避免依赖有限缓存窗口，并减小训练与推理的位置外推差异。
    limits: 摘要未见明确说明方法的额外代价与局限；其记忆压缩仍可能涉及历史信息取舍，但摘要未提供相关误差或成本分析。
    has_abstract: true
