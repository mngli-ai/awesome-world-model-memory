  date: '2026-11-12'
  detail:
    diff: 与 spatial-ttt 一类把空间证据写进快权重的工作比，它不追求替代注意力，而是把已训好的注意力蒸馏进 MLP；与纯 KV cache 方案比，取用成本从随上下文长度增长变成一次定长前向。
    formulas: []
    has_abstract: true
    io: 输入是上下文视图与目标相机参数；输出是新视角图像；中间产物是一层按场景测试时学出来的轻量 MLP。
    limits: 静态场景固定相机与材质，时间维演化未涉及；每个场景都要测试时训练，切换场景的成本摘要未报；23× 只针对渲染阶段，烤 MLP 本身的耗时未计入端到端；质量持平是与当前最优比，绝对差距未给。
    position: 把 decoder-only 视角合成模型里的跨视角信息，从 KV cache 搬到测试时学出来的一层快权重 MLP 上，用参数当场景记忆的载体。
    steps:
    - 复用 TTT 的快权重 MLP，但目标从替代注意力改成拟合跨视角注意力的映射。
    - 把上下文令牌拆成只含相机参数的渲染令牌与含图像内容的目标令牌。
    - 以渲染令牌为输入、目标令牌为监督，测试时学出这层 MLP。
    - 渲染新视角时只跑这层 MLP，不再对全部上下文做注意力。
    train: 测试时按场景训练一层轻量 MLP，主干冻结；具体迭代步数与每场景耗时摘要未给。
  explain: 带 KV cache 的 decoder-only 视角合成模型质量已经很好，代价是每个新视角都要把上下文重新过一遍注意力；TTT 层能省算力但掉质量，因为它用快权重整个替代了注意力。这条的改法是只借用快权重那一层 MLP，让它显式学跨视角注意力的输入输出映射，算力跟 TTT 一样省，质量却接近原注意力。第二个关键处理的是一个容易被忽略的错位：预填充上下文与渲染新视角是两种模态，直接拿上下文令牌当目标去拟合，MLP 就得同时学会跨模态；它把上下文令牌拆成只带相机参数的渲染令牌当输入，把带图像内容的目标令牌当监督，烤出来的 MLP 就只管相机到像素这一件事。这条对我有意义的地方在记忆的载体：历史从 KV cache 挪进一层参数，取用从查表变成一次前向。
