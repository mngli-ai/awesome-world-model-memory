    position: 长片多镜头编辑要在场景、视角、主体外观都突变的情况下让一次编辑意图保持一致，还要处理远比单镜头长得多的视觉上下文。MoviEdit 把问题拆成先全局后局部两段，先用一版双向的全局草稿定下跨镜头的编辑意图，再自回归铺满全片。
    steps:
    - 造数据，同步多视角素材、真实多镜头视频与生成的多镜头内容三条管线凑出 87K 对编辑视频，不用人工标注。
    - 双向阶段在时空压缩表示上建一版全局一致的编辑草稿，这一版就是跨镜头的记忆载体。
    - 自回归阶段把草稿逐段传播并细化到全片分辨率。
    - 另建 MoviEdit-Bench，把长片多镜头编辑单独当一项能力来测。
    train: 需训，端到端；摘要未给参数量、训练算力与推理步数，待核。
  explain: 这条对我有用的地方是它把跨镜头一致做成了一个显式的中间产物。长片编辑的老问题是镜头一切，上下文就断，单镜头编辑器要么扩窗口要么靠首尾帧硬接。MoviEdit 的做法是先跑一遍双向阶段，在时空压缩的表示上定一版全局编辑草稿，这一版草稿就是它的记忆，然后在自回归阶段拿着草稿逐段铺到全片分辨率。这个分工跟我的 code 到 proxy 到 video 有同构之处，草稿占了 proxy 的位置，只不过它是 latent 不是符号状态，可控性来自编辑指令而不是场景代码。数据上也值得记一笔，它用三条自动管线凑了 87K 对多镜头编辑视频，还专门建了 MoviEdit-Bench。要提醒的是它双向那一遍要看全片，不是流式，跟我要的因果外推不是一回事。
