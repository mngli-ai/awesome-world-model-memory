- id: anchorweave
  title: AnchorWeave
  date: '2026-02-16'
  lane: 几何位姿寻址
  branch: 显式几何库
  training: 训练
  status: 速读
  one_liner: 弃全局融合，改检索多块局部几何
  mechanism: 单块全局记忆必然把位姿/深度误差融成噪声几何；改为按目标轨迹做覆盖率驱动的局部记忆检索，再用多锚编织控制器在生成中调和对齐误差。
  tags:
  - 局部记忆
  - 覆盖率检索
  - 多锚融合
  key_numbers:
  - ECCV 2026
  media:
  - https://zhangyuejoslin.github.io/images/anchorweaver_teaser.mp4
  - https://zunwang1.github.io/AnchorWeave/long_videos/alley.mp4
  links:
  - https://arxiv.org/abs/2602.14941
  - https://zunwang1.github.io/AnchorWeave
  note: 直接给"全局 3D 融合会累积跨视角不对齐"的反证，可作为我们放弃持久全局表示的依据之一。
  arxiv: '2602.14941'
  explain: 想象摄像机沿着街道前进：若把所有旧画面硬压进一张地图，位置和远近估错一点，街景就会糊成彼此打架的几何。AnchorWeave要解决的，正是视频生成时记忆越多、场景结构反而越不可靠的问题。它不再做一份包打天下的全局记忆，而是沿着目标镜头轨迹，挑出能覆盖当前视野的局部记忆块；“覆盖率驱动”就是优先取能补足眼前区域的信息。生成时，多锚编织控制器再把这些记忆块当作多个参照点，逐步调和它们的位置对齐误差。这样既不必让一处错误污染整张场景，也能让不同画面共享的结构彼此衔接。论文发表于ECCV
    2026。
  detail:
    position: AnchorWeave 解决 camera-controllable video generation 在长时间跨度下难以保持空间世界一致性的问题。它避免将多视角几何融合成可能含噪的全局记忆，转而使用多个局部几何记忆并在生成时协调它们。
    io: 输入包括历史视频形成的局部几何记忆和目标相机轨迹，输出为受相机控制的视频。生成时的条件信号包括按目标轨迹检索的局部记忆，以及多锚编织控制器对这些记忆的整合结果。
    steps:
    - 从历史多视角信息构建多个局部几何记忆，而不将它们融合为单一全局场景，以避免位姿和深度误差累积成噪声几何。
    - 根据目标相机轨迹进行覆盖率驱动的局部记忆检索，以选出与生成路径相关的记忆。
    - 将检索到的多个局部记忆交给多锚编织控制器，以在生成过程中调和不同视角间的几何不一致。
    - 依据这些局部几何条件生成受相机控制的视频，以改善长时段场景一致性并维持视觉质量。
    formulas:
    - tex: C(M_i,\tau)=\frac{1}{T}\sum_{t=1}^{T}\mathbf{1}\left[\mathrm{vis}(M_i,t)\right],\qquad
        \mathcal{R}(\tau)=\operatorname{TopK}_{M_i} C(M_i,\tau)
      caption: 按目标相机轨迹计算局部记忆覆盖率并检索 Top-K；标准写法，非原文
    - tex: \alpha_{t,i}=\operatorname{softmax}_{i}\!\left(\frac{q_t^{\top}k_i}{\sqrt{d}}+\lambda
        C(M_i,\tau)\right),\qquad z_t=\sum_{M_i\in\mathcal{R}(\tau)}\alpha_{t,i}v_i
      caption: 生成时按内容相关性与轨迹覆盖率加权协调多个局部锚点；标准写法，非原文
    train: 摘要未给训练流程、推理细节或关键设置。
    diff: 已有 memory-based 方法通常从融合后的全局 3D 场景渲染 anchor videos，再以其条件化生成；AnchorWeave 改为检索多个局部几何记忆，并通过多锚控制器在生成时协调它们。
    limits: 未见明确说明
    has_abstract: true
