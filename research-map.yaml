    diff: 与直接把经验写进记忆的自改进相比，它多一道临时态与证伪；与 Map2SLAM 的写入门槛比，它判的是这条知识该不该留，不是这一帧该不该进地图。
    formulas: []
    has_abstract: true
    io: 输入是当轮经验与验证器，输出是被提交、修正或驳回的更新；中间产物是临时状态里的假设与三类探针结果。
    limits: web、app、工具与长期记忆基准，零视觉；探针开销未报；假设的前置条件与验证器要人工给；只在有验证器的环境成立。
    position: 我的代码状态每块无条件写，写错了只能等后面自己纠。这条把写入门槛做成先试后提交：临时状态跑探针，过了才落进持久状态。
    steps:
    - 把每条候选经验写成带前置条件、行为改变、预期效果与验证器的结构化假设。
    - 只在临时状态里应用这条假设。
    - 跑目标迁移、证伪与存档回归三类探针，得到增益与风险。
    - 按测得的增益与风险决定提交、修正还是驳回。
    train: 推理期技巧。摘要未提训练，按外挂框架处理，待核。
  explain: 自我改进的 agent 常把当轮学到的经验直接写进记忆，问题是局部成功不等于可复用。FGSE 把每次更新写成一条结构化假设：前置条件、要改的行为、预期效果、用哪个验证器判。写之前先在临时状态里应用，跑目标迁移、证伪、存档回归三类探针，再按测出来的增益与风险决定提交、修正还是驳回。数字上 WebArena 39.8、AppWorld 78.8、tau-Retail 与 tau-Airline 的 Pass^1 是 0.724 与 0.487，同时把证伪失败压到 5.0%、回归损伤 1.3%、有害提交 3.6%。对我的用处是写入门槛可以做成可回滚的：我的代码状态每块无条件写，写错了只能等后面自己纠回来。
