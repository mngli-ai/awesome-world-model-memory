  - 45 秒（bf16 下 KV 耗尽 32 GiB 主机内存）
  - 2.8 分钟（int4 下耗尽）
  - 4.3 分钟模型自身位置外推上限
  - 37.5 分钟连续生成，零停顿，主机内存恒定
  - 约 9.5 fps
  - 单卡 RTX 4090 + 32 GiB 主机内存 + 一块 NVMe
  - 长间隔回访掉约 1 个 MUSIQ 点
  self_measured: []
  media: []
  links:
