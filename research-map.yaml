  explain: 想象你在玩游戏，绕着街区走一圈再转头原路返回，刚才路过的房子却凭空变了样。以往视频世界模型——也就是能模拟真实物理环境的AI系统——要么算力要求太高单卡带不动，要么漫游久了回头看就穿帮。SANA-WM把模型做到了只有2.6B参数，单张5090显卡就能运行，并引入6自由度相机控制，也就是让视角能在三维空间里自由位移和转头。这招管用在于它大幅压低了计算门槛，通过严格的相机位姿引导和专门的回访评测，让单卡也能在60秒高清长视频里稳住空间一致性。
  detail:
    position: SANA-WM 旨在以较低的模型规模和推理成本生成长时、高保真视频，并让生成内容遵循精确的相机运动。它面向分钟级世界建模，重点处理长上下文建模、6-DoF
