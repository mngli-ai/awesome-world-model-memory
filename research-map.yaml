  detail:
    diff: 与 NanoKV 都压 KV 存储，区别在它不做学习式编解码而靠结构分组做免校准量化；与语言模型侧的 KV 量化比，它把块边界当成免费信号用。
    formulas: []
    has_abstract: true
    io: 输入是逐块解码产生的 KV 缓存，输出是低位量化后的缓存与配套的 bit-packing 核。
    limits: 只在九种视觉自回归模型上测，最长视频与最大分辨率未说明；78.5% 是最好情况的数字。
    position: 视觉自回归按块解码，KV 统计与语言模型差别很大，规模上去显存超过权重，成为部署瓶颈。
    steps:
    - 定位 massive 值通道，验证消融这些通道会崩、消融同规模内点通道无损。
    - 分析异常值沿特征与块两轴的组织方式。
    - 把成因归到投影偏置与 RoPE 散射两个独立机制。
    - 沿两轴分组做免校准量化，配 bit-packing 核。
    - 在九种模型两种范式上测显存与质量。
    train: 免训，不标定也不微调。
  explain: 视觉自回归按块解码，不按 token，所以 KV 的统计跟语言模型完全不是一回事，显存一旦上规模就超过权重。这篇先把结构讲清楚：少数 massive 值通道扛着功能负荷，拿掉这些通道生成就崩，拿掉同样多的普通通道却没事；这些异常值沿特征和块两个轴组织，成因拆成投影偏置和 RoPE 散射两个独立机制。既然结构这么规整，量化就照着这两轴分组做，标定和异常检测都省了，块边界由生成循环白给。九种模型两个范式上 KV 显存最多降 78.5%，批大小能做到 6 倍。我在 4090 上做 INT8 那套正好缺这种免标定的口径。
  id: var-q
  key_numbers:
