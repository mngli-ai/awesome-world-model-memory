  key_numbers:
  - 31.54 FPS / 16.2GB
  - H200
  - SSIM 0.308→0.430
  - FVD 384.1
  links:
  - https://arxiv.org/abs/2607.18703
  - https://alaya-renderer-flash.alayalab.ai/
  note: 条件来自既有引擎，coding agent 不参与；解决渲染器跟不上帧率
  venue: ''
  self_measured: []
  media: []
  parent: null
  link_strength: ''
  precision: day
  explain: 想象游戏角色刚转过街角：物理引擎知道墙的颜色、远近、材质和朝向，却只能吐出“施工图”，不能直接变成照片。AlayaRenderer-Flash要解决的，就是把逐帧生成逼真画面太慢、画面还容易闪烁的问题。它接收引擎导出的五通道
    G-buffer，即记录颜色、深度、金属度、法线和粗糙度的渲染信息，再用 Wan 2.1 蒸馏成只需四步的生成器，并按小片段自回归流式生成。过去画面压成三级历史特征，首帧潜变量常驻，作为稳定的外观锚点，所以既少算重复信息，又能保持连续帧的身份和风格。H200
    单卡达到 31.54 FPS、占用 16.2GB，SSIM 从 0.308 提升到 0.430，FVD 为 384.1。
  detail:
    position: AlayaRenderer 原版能将物理引擎状态渲染为 RGB 帧，但计算开销过高，难以实时运行。AlayaRenderer-Flash
      将其改造为面向流式输入的快速生成式世界渲染器，实现接近游戏速度的连续渲染。
    io: 输入是物理引擎逐帧导出的 G-buffer，包含 albedo、depth、metallic、normal 和 roughness 五个通道；输出是
      RGB 视频帧。模型保留 G-buffer 与 text prompt 接口，并利用首帧 latent 作为外观锚点。
    steps:
    - 从物理引擎接收逐帧 G-buffer 和可选的 text prompt，以结构化场景信息约束生成，避免改变底层世界动态。
    - 使用轻量蒸馏 codec 将输入编码为 latent，并以首帧 latent 作为外观锚点，帮助后续帧保持场景外观一致。
    - 将 Wan 2.1 蒸馏为 4 步生成过程，并按 chunk 自回归处理帧流，以降低每帧生成成本并支持连续渲染。
    - 对历史信息进行三级压缩后用于后续 chunk 生成，以控制长序列推理开销并维持跨窗口稳定性。
    - 通过轻量 codec 将生成 latent 重建为 RGB 帧，供物理引擎驱动的可玩世界实时显示。
    formulas:
    - tex: \hat{Z}_{k}=\operatorname{Gen}_{4}\!\left(G_{k},Z_{0},\mathcal{C}(H_{<k})\right),\qquad
        \hat{X}_{k}=\operatorname{Dec}(\hat{Z}_{k})
      caption: 标准写法，非原文：以当前 chunk 的引擎 G-buffer、首帧外观锚点及压缩历史为条件，经 4 步生成 latent 并解码为
        RGB 帧。
    train: 训练与推理流程：将 Wan 2.1 蒸馏为 4 步生成模型，并引入轻量蒸馏 codec 以加速 latent 编码与帧重建；推理时以 chunk
      级自回归方式处理输入流，压缩历史信息，并将首帧 latent 常驻作为外观锚点。摘要报告速度由 0.56 FPS 提升至 31.54 FPS，并称与物理引擎集成后可在
      30 FPS 运行；其余训练细节摘要未给。
    diff: 不同于从 text 或 control-hints 生成并可能改变场景动态的方案，它直接使用物理引擎导出的 G-buffer，保留结构化世界状态。相较原版
      AlayaRenderer，它改为少步自回归流式生成，并通过蒸馏 codec 与历史压缩降低推理成本。
    limits: 未见明确说明
    has_abstract: true
