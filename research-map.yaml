- arxiv: '2611.09096'
  branch: 恒定上下文
  concepts:
  - 长上下文扩展
  - 自回放训练
  date: '2026-11-06'
  detail:
    concepts:
    - 长上下文扩展
    - 自回放训练
    diff: 与 Context Forcing、Memory Forcing 都往条件里塞更多历史，它们塞的是更长的帧或块，这条塞的是块内的去噪轨迹；与 Self Forcing 同属学生自 rollout，区别是条件从终态换成过程。
    formulas: []
    has_abstract: true
    io: 输入是提示与前若干块的去噪轨迹，输出是下一块视频；轨迹在训练时来自高斯插值或学生自己的 rollout。
    limits: 只报 VBench 分数，没有回访一致性专项指标；30 秒只写整体质量最高，未给数值；轨迹上下文让每步注意力变长，开销与显存摘要未给。
    position: 自回归扩散把定长模型推到长视频，靠的是把上一块的产物当条件，可这个产物只是去噪链的终点，块内的中间预测被当成废料丢掉；条件的信息量因此比真实生成历史少一个量级。
    steps:
    - 记录每块去噪链上的中间预测，组成该块的轨迹。
    - 第一段用真值视频做高斯插值造伪轨迹，让模型在这些轨迹上重预测。
    - 第二段换教师模型，取学生自己 rollout 出的真实轨迹当条件。
    - 第一段的结果作为第二段的初始化。
    - 在 VBench 5 秒与 30 秒上对比 Self Forcing 与 Causal Forcing。
    train: 需训，两段式，先伪轨迹后教师轨迹；摘要未给模型规模、轨迹长度与缓存开销，待核。
  explain: 这条的观察很干净，自回归扩散每步只把上一块的最终预测交给下一块，块内那几十步去噪的中间预测全扔了，可那些中间预测恰恰是这一块怎么生成出来的历史，LLM 的自回归是拿整段令牌历史做条件的，视频这边只拿一个终态。TraF 就把轨迹补回去，先用真值视频做高斯插值造出伪轨迹，让模型在这些伪轨迹上重预测，学会读轨迹；再用教师模型，把学生自己 rollout 得到的真实轨迹当条件，前者给后者当初始化。VBench 5 秒上总分 85.15，比 Self Forcing 高 0.84，比 Causal Forcing 高 1.11，质量和语义两项同时涨，30 秒也就是六倍训练时长上整体质量最高。对我那六块固定窗口来说，它说明窗口里放的东西可以不是六张终态帧，而是每块的一条轨迹，信息密度不一样。代价也清楚，上下文从一块变成一组轨迹，注意力开销和缓存都要重算，摘要没给这部分数字。
