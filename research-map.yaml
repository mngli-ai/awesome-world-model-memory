    train: 免训，只有一次离线校准，不改模型权重；摘要未给校准所用提示数量、底座与数据集。
    diff: 与均匀 token 合并相比，它把预算分配当成可离线求解的优化问题；与按注意力分数在线淘汰 KV 的做法相比，风险图离线一次算好，线上只做一次动态规划，不引入额外前向。
