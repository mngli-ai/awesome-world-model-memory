- arxiv: '2611.05593'
  branch: ''
  date: '2026-11-03'
  detail:
    concepts:
    - 结构条件渲染
    - 几何对应编码
    diff: 已有做法把高斯当渲染原语，渲染器是光栅化这条固定管线；它把渲染器本身换成可学的注意力，于是渲染可以接受梯度、可以按内容自适应算力，代价是精度还没追平光栅化。
    formulas: []
    has_abstract: true
    io: 输入是一组高斯与相机射线，输出是像素；视图无关的编码器处理高斯，视图相关的解码器把小块射线变成像素。
    limits: 38.08 dB 对光栅化同输入的 44.02 dB，差 6 dB；作者自己的诊断指向视图解码器是瓶颈，补上投影足迹能再加 1.4 dB，欠训未被排除；只有静态物体级重建，没有时间维，也没有场景级长视频。
    position: 高斯泼溅靠光栅化出图，光栅化器是固定算法，与生成模型分开；这条问的是渲染这一步能不能整个交给网络，让高斯集合与相机直接进 transformer 出像素。
    steps:
    - 每个高斯变成一个令牌，用视图无关的编码器编码。
    - 视图相关的解码器把相机射线切成小块，逐块 attend 到高斯令牌上出像素。
    - 在 26,820 个 Objaverse 物体上训练，每个裁到 20,000 个高斯。
    - 拿 300 个未见物体测，并与同输入的光栅化结果对照。
    train: 需训，26,820 个 Objaverse 物体、每个 20,000 高斯；摘要未给模型规模与训练算力，待核。
  explain: 这条正好是我管线最后一段的另一种做法。我现在是结构条件渲染器，proxy 进去、画面出来，渲染这一环还是靠既有的解码器。GaussianRenderFormer 把渲染器整个换成注意力，每个高斯一个令牌，视图无关的编码器先编码，视图相关的解码器把相机射线切成小块去 attend，输出像素，全程没有光栅化器。它承认没赢，300 个未见物体上 38.08 dB，同输入走光栅化是 44.02 dB，差 6 dB，而且诊断说瓶颈在视图解码器，把高斯的投影足迹直接告诉它能补 1.4 dB，欠训也没排除掉。对我有价值的是这个方向的可行性边界，渲染可以做成可学的注意力，意味着结构条件不必只当输入条件，还能当被查询的键值，这跟我想要的用代码维护状态、按状态查渲染是同一条路，只是它还停在静态物体上。
  id: gaussianrenderformer
  key_numbers:
  - 38.08 dB（300 个未见物体）
  - 同输入光栅化 44.02 dB
  - 26,820 个 Objaverse 物体
  - 每个裁到 20,000 个高斯
  - 补投影足迹再加 1.4 dB
  lane: 框架层
  link_strength: 与 L3G-World 都把高斯当状态、从高斯出画面，L3G-World 把高斯渲进 latent 再交给生成器，它干脆不要光栅化器，用 transformer 直接从高斯令牌与相机射线出像素
  links:
  - https://arxiv.org/abs/2611.05593
  - https://svlwoof.github.io/gaussianrenderformer/
  mechanism: 每个高斯变成一个令牌，视图无关的编码器先编码，视图相关的解码器把相机射线切成小块，逐块 attend 到高斯令牌上直接出像素，整条渲染链路里没有光栅化器。
  media:
  - https://svlwoof.github.io/gaussianrenderformer/static/videos/camera_path_0007.mp4
