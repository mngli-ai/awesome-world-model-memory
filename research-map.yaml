    diff: 与 GIM-World 都把记忆做成可被位姿查询的令牌，区别是它按写权限把记忆分成只读、一次写入与可更新三类，并用在线强化学习而不是纯监督来稳住长程。
    formulas: []
    has_abstract: true
    io: 输入是历史帧、位姿与场景条件，输出是下一段驾驶视频；内部维护三级持久记忆令牌。
    limits: 只在驾驶一个域验证，nuScenes 与自采数据；三级记忆的容量上限与令牌数量未给；VLM 物理裁判的开销未报。
    position: 自回归驾驶世界模型用瞬时条件信号，缺少持久状态，长 rollout 出现结构漂移、身份漂移与画质衰减。
    steps:
    - 按位姿把道路拓扑编码成结构令牌。
    - 挂上带地理位置信息的只读场景令牌。
    - 为每个交通参与者建一次写入的实例令牌。
    - 在线流匹配强化学习用分层视觉奖励与 VLM 物理裁判优化 rollout。
    train: 需训，含在线流匹配强化学习后训练；摘要未给奖励权重与训练时长。
  explain: 自回归驾驶世界模型的长 rollout 会漂三样东西，结构漂、身份漂、画质衰减。作者的诊断是条件信号是瞬时的，没有持久状态。WAM-Sim 的解法是把持久上下文按尺度切成三类，并且给每一类定不同的写权限，这一手比单纯堆记忆容量有意思：位姿对齐的结构令牌是道路拓扑，跟着位姿走，可以更新；场景令牌是带地理位置的背景外观，只读；实例令牌是每个交通参与者的身份，写一次就不改，专门在遮挡和分块边界之后把人认回来。写权限一分，身份漂就少了物理来源。第二块是在线流匹配强化学习，拿自生成的 rollout 做后训练，奖励分两层，一层是对齐记忆层级的视觉奖励，一层是 VLM 当物理裁判，作者说锚定的记忆把策略优化限制在上下文里，顺带压住了语义崩塌和奖励作弊。数字给得比较实，nuScenes 上 FID 3.47、FVD 25.72，下游感知 24.16 mAP、道路 mIoU 71.23，自采数据上分钟级 rollout 的结构与身份漂移明显减轻。对我有用的是它把写权限当成记忆设计的一等公民。
