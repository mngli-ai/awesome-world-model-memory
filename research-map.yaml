  date: '2026-11-04'
  detail:
    diff: 与 Context Forcing 都把长历史塞进有限上下文，区别是它改的是历史怎么被切成 token 并按显著性排序，而不是在长上下文上做训练约束。
    formulas: []
    has_abstract: true
    io: 输入是历史观测序列与动作条件，输出是预测的下一段观测，内部把历史压成按显著性排序的 token 序列。
    limits: 摘要未给压缩率与任何具体数字，37 页细节未核；各环境的动作条件形式与骨干规模待核。
    position: 现有世界模型沿用视频生成的 tokenization 与条件机制，优化目标是感知真实而不是预测有用，背景与视觉噪声占满上下文。
    steps:
    - 用 Dynamics-Aware Tokenization 压历史，token 按动态显著性递减排列。
    - 在扩散骨干上把该序列作为历史条件接入。
    - 推理时用 Hierarchical History Guidance 分层放大动态显著的部分。
    - 在多个环境上比预测保真、物理合理性与下游决策表现。
    train: 需训，tokenizer 与扩散骨干都要重训；摘要未给数据规模与步数。
  explain: 它挑的是一个容易被忽略的错位：世界模型要压缩历史，但压缩的规矩是从视频生成那边继承来的，那边只在乎画出来像不像，不在乎压完还能不能预测下一步。背景、纹理、跟任务无关的东西照样占满上下文。Compression Forcing 的做法是先把历史压成 token 序列，但排列顺序按动态显著性从高到低，等于把动作引起的变化顶到前面，静态布景沉到后面；再在扩散骨干上用分层历史引导把高显著性的部分选择性放大。存哪里这个问题的答案从缓存槽位变成了一个按显著性排过序的 token 序列，取的时候靠排序位置，不靠时间戳。
