  note: 雷达自动入库 2026-10-24，字段据摘要，待人工核。摘要未给任何量化指标，key_numbers 留空；项目页演示直链未逐条验证，media 留空；干预效果的跨 rollout 保持只有定性证据。
  tags:
  - 状态统一
  - 干预即写入
  - 位姿分离
  explain: 想象你在一间屋里，既想走到另一个角度看，又想顺手把桌上的杯子挪个位置。多数世界模型会把这两件事混在一个控制信号里，模型分不清是世界变了还是你换视角了。UniState 的办法是只留一份世界状态，空间记忆和你的干预都写在这一份上，于是物体怎么动写在记忆里，相机从哪看是另一个独立输入。它还留了余地，你只指定杯子往哪走，杯子旁边的东西怎么被碰开由模型自己补。它关心的是干预写进记忆后能不能一直留着，这对长程 rollout 是关键。
  detail:
    position: UniState 处理一边观察一边改世界的问题，用户可以自由选视角看，同时在场景里改动物体。它把空间记忆和用户干预合并成同一份世界状态表示，让世界改了和换了视角在控制信号里不再混淆。
    io: 输入是空间记忆即世界状态、用户对物体运动的干预，以及单独指定的相机轨迹，输出是遵循该物体运动与相机轨迹、同时自行补出合理附加运动的视频。摘要未列具体输入模态与分辨率。
    steps:
    - 建立统一的世界状态表示，空间记忆与用户干预共用同一份结构。
    - 用户在空间记忆里直接指定物体运动，相机轨迹独立于该干预另行选择，从表示上分离物体怎么动与从哪里看。
    - 视频模型在受控物体上自行补出未指定的附加运动，以及物体与周围环境的合理交互，不要求干预写全每一步。
    - 配套训练与采样策略，使生成视频既跟随指定的物体运动与相机轨迹，又保留超出指定变换的生成能力。
    formulas: []
    train: 摘要称为此设计了训练与采样策略，未给数据规模、训练步数与底座模型，按此判断为需训。
    diff: 与把相机控制和记忆分成两套模块的做法不同，UniState 让干预直接作用在与记忆同一份空间状态上，控制信号里不需要再区分物体动了还是相机动了。与只做相机导航的世界模型相比，它允许干预引起的场景改变在多次 rollout 之间保持。
    limits: 摘要未给任何量化指标，只有比现有方法更准的定性说法；场景改变持久性只有定性证据，缺长程量化；空间记忆的容量与更新规则未说明。
    has_abstract: true
  concepts:
  - 动作条件控制
  - 位姿对齐检索
