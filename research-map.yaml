    diff: 与 Mem3R 都在流式重建里挂显存外记忆，区别是它把记忆做成定容适配器并用选择性状态空间做读写；与 LoGeR 这类测试时训练比，它不更新主干。
    formulas: []
    has_abstract: true
    io: 输入是流式视频帧，输出是逐帧位姿与重建；辅助记忆容量固定。
    limits: 提升写的是单项最高 40%，其余项未逐条给；只在室内外数据集与机器人采集上测，未涉及生成式渲染。
    position: 流式三维重建要在固定显存下维持几何质量，冻结主干等于冻结了状态与观测的交互方式，容量加不上去。
    steps:
    - 冻结主干与任务头，只增加一条定容辅助记忆。
    - 用选择性状态空间混合器联合变换原生状态与辅助记忆。
    - 用显式读写路径跨帧搬运信息，用分解反馈路径控制回写。
    - 在统一周期重置协议下与循环基线比轨迹误差与表面深度精度。
    train: 需训，只训 1.28M 适配器参数，主干与任务头冻结。
  explain: 流式三维重建要在固定显存下一直保持几何质量，用的是带定容状态的循环模型。麻烦在于主干一冻结，状态和观测之间的交互方式就一起冻住了，想加容量没地方加。Mamba3R 在主干外面挂一条定容辅助记忆，用一个选择性状态空间混合器同时变换主干原生状态和这条记忆，读写路径显式跨帧搬信息，还有一条分解出来的反馈路径专门管辅助记忆往主干回写什么。整套只训 1.28M 参数。它给的信号是：记忆容量可以外挂，地址由读写路径显式指定，不必改动主干。吞吐从一千帧到两千帧只动 1.4%，说明辅助记忆本身不随长度涨。
  id: mamba3r
