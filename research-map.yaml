- arxiv: '2611.15260'
  branch: 位姿视锥
  concepts:
  - 动作条件控制
  - 几何对应编码
  - 训练无关
  date: '2026-11-11'
  detail:
    diff: 与把动作编码进 RoPE 或 token 的路线比，它不试图让模型学会读计划，而是把计划变成已经存在的像素与位姿；与靠重采样获得多样性的做法比，它在冻结生成器上对减速与加速计划的响应更强。
    formulas: []
    has_abstract: true
    io: 输入是一段日志驾驶数据（图像、位姿、LiDAR）与一个待评估的计划（速度或横向偏移）；输出是对该计划的预测视频，以及场景响应这一量化指标。
    limits: 只在驾驶这一有强几何先验的域上成立，日志 rollout 的帧必须已覆盖计划机位附近，计划偏离日志轨迹太远时无帧可搬；0.54 m 横向平移是小位移，大位移与旋转计划未给出同等证据；场景响应只衡量真实变化被复现的比例，不衡量新增内容是否合理；作者两人，摘要未报与重训类方法的直接对比。
    position: 诊断计划条件驾驶世界模型的控制通道是否真的改变场景，并用几何化的计划交付方式在不训练的前提下修好它。
    steps:
    - 用重定时从同一段日志造出其它速度下的位姿配对图像与 LiDAR，用立体架造出横向平移的参照。
    - 在这些参照上量模型预测里真场景变化被复现的比例，得到场景响应。
    - 用轨迹分数与场景响应交叉比对，检验既有控制指标能否分辨执行与忽略。
    - 在生成器内部做干预，定位失效发生在计划的通道。
    - 把日志 rollout 的帧按计划机位搬运，冻结模型只补帧覆盖不到的区域，得到 ReTime-Compose。
    train: 免训，全部改动发生在推理期：搬运帧与补全，不改权重。
  explain: 驾驶世界模型被用来比较候选计划，那它的预测就该随计划变，可测控制性的指标只查相机跟没跟指令，不查场景有没有跟着动。这条找到了现成的真值：日志里没开过的速度，可以用重定时造出位姿配对的图像与 LiDAR，立体架还能给出横向平移的视差参照。用它一量，已发布的世界模型都是相机动了、场景几乎没动，场景响应最多只有真实视频的三分之一，轨迹分数甚至分不出执行了速度指令还是忽略了。往生成器内部做干预，问题落在计划的通道上，预测几何跟着上下文帧走，上下文帧一旦带上计划的几何，计划 token 就加不动了。于是它把计划直接当几何交付：把某一速度的日志 rollout 帧搬到计划机位，冻结模型只补没有帧覆盖的部分。这条对我来说是控制侧的判据，我一直假设控制 LoRA 真在起作用，这份数据说 token 条件很容易被上下文几何压过去。
  id: retime-compose
  key_numbers:
  - 场景响应最多约为真实视频的三分之一
  - 轨迹分数分不出已执行与已忽略的速度指令
  - 0.54 m 横向平移下，冻结生成器在 KITTI、nuScenes、Argoverse 2 上接近真实场景的反应
  - 对减速计划在三个生成器上、对加速计划在两个生成器上反应强于重采样
  lane: 几何位姿寻址
  link_strength: 都把动作或计划先换算成世界坐标里的几何再喂给模型，action-rope 换的是回访地址，这条换的是条件通道，让冻结模型按几何而不是按计划 token 动景
  links:
  - https://arxiv.org/abs/2611.15260
  - https://joefeng0571.github.io/retime-compose/
  mechanism: 用同一段日志的重定时与立体平移造出位姿配对的参照，量模型对场景变化的响应；再把日志某一速度的 rollout 帧搬运到计划机位，让冻结模型只补帧覆盖不到的部分。
