  detail:
    concepts:
    - 显式3D缓存
    - 位姿对齐检索
    - 长上下文扩展
    diff: 与只看最近若干帧的导航架构相比，它把历史外化成关键帧加地图并用监督教取用；与纯生成式世界模型相比，它保留语言理解与动作输出，生成只是其中一路。
    formulas: []
    has_abstract: true
    io: 输入单目 RGB 视频流与语言指令，输出动作；中间产物是稀疏关键帧集合与历史表示图。
    limits: 技术报告，模型规模与算力未披露；回溯上限两分钟，更长历史未验；关键帧选择与地图更新策略没给细节；79.4% 是整体口径，分任务未拆。
    position: 具身导航要在开放世界里保持空间感并长程执行，现有架构只看最近几帧就失忆，一旦走过的地方需要回头找就断片。
    steps:
    - 用稀疏视觉关键帧加显式历史表示图构造长期时空上下文，不动骨干结构。
    - 设计三类结构化问答监督，任务阶段定位、探索一致性、时空目标检索。
    - 为单目视频建标注流水线，汇总五百小时真机与两千小时网络视频。
    - 在多种具身形态与场景上验开放世界成功率与回溯能力。
    train: 需训，用三类结构化问答在单目视频数据上训练；摘要未给参数量与训练成本，待核。
  explain: 这条是导航基础模型，但它把记忆做成了显式的两张东西。一张是稀疏的视觉关键帧，一张是历史表示图，两者拼起来当长期时空上下文，骨干一点没改。光有存储没用，作者又加了历史利用的监督，用三类结构化问答教模型按图取历史，分别是任务阶段定位、探索一致性、时空目标检索，于是回溯能力从 0 涨到 58%，整体成功率 79.4% 对最强基线 17.8%。近两分钟的回溯在具身导航里算长的。它验证了一件事，存下来和会用是两件事，必须用任务监督把取用路径训出来，这跟我担心的取错是同一个问题的两面。它要训练，数据量五百小时起，我搬不了训练，但能搬那个三段式监督的设计。
  id: compass1
  key_numbers:
  - 回溯近 2 分钟视觉历史
  - 开放世界整体成功率 79.4%，最强基线 17.8%
  - 持续历史回溯从 0% 到 58%
  - 500 小时真机交互与 2000 小时标注网络视频
  lane: 框架层
  link_strength: 与 ppmem 都在给视频世界模型装显式空间记忆，ppmem 存平面代理供渲染，Compass 1 存稀疏关键帧与一张历史表示图供导航回溯，并用结构化问答监督教模型去用
  links:
