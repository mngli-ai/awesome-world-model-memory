  detail:
    concepts:
    - 记忆写入淘汰
    - 动作条件控制
    diff: 已有做法在扩容量上做文章，循环状态更新、测试时训练、存取过去观测都是让上下文更长；MOST 不扩容量，改的是记忆内容，历史与未来令牌都用物体状态与子任务进度监督，并与一个容量相当的纯视觉历史记忆变体对照，说明差别不在留了多少，而在留的是不是与决策有关。
    formulas: []
    has_abstract: true
    io: 输入是多视角观测与指令，输出是动作；记忆是策略内部的一组时间令牌，同时容纳历史与对未来的预测。
    limits: 只有机器人移动操作，没有画面生成与渲染侧证据；摘要未给记忆长度、令牌数与推理开销；任务进度这类监督信号需要人工或脚本标注，跨任务迁移代价未评估。
    position: 长程操作里被改过的物体离开视野后就不再可见，已完成的子任务却继续约束后续动作；只靠循环状态、测试时训练或存取过去观测延长上下文，策略仍得从又长又冗余、视角还在变的视觉经验里自己推断任务进行到哪一步。MOST 认为记忆该记的不是更多经历，而是与决策有关的状态变化与进度。
    steps:
    - 把多视角观测压成一组时间令牌，历史令牌与预测未来令牌存在同一段上下文里。
    - 用物体状态与子任务进度给这两类令牌加显式监督，让记忆围绕世界变了什么与已经做完了什么来组织。
    - 记忆直接作为条件进动作生成，不再外挂规划器或检索阶段。
    - 同时给出 RoboCasa-Long 这套多分钟、多阶段的移动操作考卷。
    train: 需训，端到端策略内部记忆；摘要未给参数量、训练数据规模与记忆令牌数量，待核。
  explain: 这条的论点我很认，记忆的价值不在多少，在留的是不是与决策有关。它把多视角观测压成一组时间令牌，历史和对未来的预测放在同一段上下文里，然后关键一步，用物体状态和子任务进度去显式监督这些令牌，等于告诉记忆你要记的是世界变了什么、我做到哪了。取用上它不外挂检索也不加规划器，记忆直接当条件进动作生成，这样延迟不会随任务长度涨。数字很硬，RoboCasa365 平均成功率 65.9 到 72.1，长任务的最高进度 20.83 到 42.22，真机 6.66 到 43.33，还专门跟一个容量相当的纯视觉历史记忆比过，赢了，这就把多记不等于记对变成了实验结论。对我而言它是 proxy 该写什么的旁证，我现在用代码维护状态，本质上也是在做这件事，只是它用监督把该记什么学出来，我是手写规则。
