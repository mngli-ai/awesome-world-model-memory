  training: 需训
  status: 速读
  one_liner: 恒定容量槽位＋显式锚点的代表
  mechanism: 报告只在 L3『恒定槽位』与趋势 4『恒定容量+显式锚点』两处点名，未述寻址键与读写细节。
  key_numbers: []
  self_measured: []
  media:
  - https://jackswl.github.io/honeycomb/resources/revisit/living_honeycomb.mp4
  - https://jackswl.github.io/honeycomb/resources/revisit/living_spatia.mp4
  links:
  - https://arxiv.org/abs/2609.37690
  note: 摘要级；lane 无报告依据（L3 表头写『按位置或几何寻址』），存疑；只给到月份 2026-09。
  tags:
  - 恒定槽位
  - 显式锚点
  explain: 这就像把随手乱堆的杂物箱，换成了一排贴着固定门牌的储物柜。模型处理长内容时，记忆往往会随文本变长而无休止膨胀，导致资源吃紧且难以定位。Honeycomb
    的做法是采用恒定容量槽位和显式锚点。这里的恒定容量槽位，指不论输入多长都大小固定的记忆格子；显式锚点则像是在序列里立起清晰可见的参照标桩。这招之所以管用，在于锁死槽位容量能把内存开销控制在确定边界内，而明确的锚点给模型提供了可靠的对照坐标，防止信息在压缩中丢失相对位置。
  detail:
    position: Honeycomb 解决长时视频生成中场景记忆随生成过程不断增长、难以维持固定存储开销的问题。它用固定大小的 HexMemory 保存空间与时空特征，以支持后续生成时对场景的持续记忆和重访一致性。
    io: 输入是当前新生成的视频 chunk 和已有的 HexMemory；输出是更新后的 HexMemory，以及 reader 检索出的 latents，用于条件化后续视频生成。摘要未说明其他条件信号。
    steps:
    - Feed-forward writer 只处理当前新 chunk，将其映射为新的 plane 特征，以避免反复处理完整历史。
    - 当空间覆盖范围或时间范围扩展时，对已有 planes 进行 warp 并保持其维度不变，以在固定容量内对齐记忆。
    - 将 warp 后的旧 planes 与新特征进行 confidence-weighted pooling，并通过 learned residual correction
      融合信息，以更新记忆。
    - Reader 从更新后的 HexMemory 检索 latents，作为条件信号输入后续视频生成，以维持场景一致性。
    formulas:
    - tex: \widetilde{M}_t=\frac{c_o\odot\mathcal{W}(M_{t-1})+c_n\odot F_t}{c_o+c_n+\varepsilon},\qquad
        M_t=\widetilde{M}_t+R_\theta\!\left(\widetilde{M}_t,\mathcal{W}(M_{t-1}),F_t\right)
      caption: 标准写法，非原文：以置信度加权融合 warp 后的旧记忆与当前 chunk 特征，再经 learned residual correction
        更新固定容量记忆。
    train: 摘要未给训练流程与关键设置。推理时，writer 处理新 chunk 并更新 HexMemory，reader 从记忆中检索 latents
      以条件化后续生成。
    diff: 相较于累积 RGB observations 或 latent features 的空间记忆，HexMemory 用固定大小的低秩表示存储特征，由六个空间与时空
      planes 组成，存储量在生成期间保持恒定。它还通过 warp、confidence-weighted pooling 和 learned residual
      correction 融合新旧记忆；摘要未说明寻址键或显式锚点的具体实现。
    limits: 摘要未见明确说明具体代价与局限；记忆更新依赖对已有 planes 的 warp 和融合，但其误差影响与适用边界未给出。
    has_abstract: true
