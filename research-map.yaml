- id: playworld
  title: 'PlayWorld: Benchmarking World Models with Agent Players over Long-Horizon
    Objectives'
  date: '2026-08-13'
  lane: 评测基准
  branch: ''
  training: 不适用
  status: 速读
  one_liner: 让agent玩家带长程目标去考世界模型
  mechanism: 派多模态agent玩家按指定长程目标在世界模型里行动，用任务达成替代固定动作序列；171个场景，四维评几何一致、交互保真、视野外演化、认知演化。
  tags:
  - agent玩家
  - 任务达成率
  - 视野外演化
  key_numbers:
  - 171 场景
  - 9个世界模型
  - 4个核心维度
  media: []
  links:
  - https://arxiv.org/abs/2608.13552
  - https://github.com/kxding/PlayWorld
  note: 信号是"能不能被一个会规划的策略玩到目标"，把固定动作打分的可比性问题绕开了；结论是长程目标下空间一致与状态持续最不可靠。
  arxiv: '2608.13552'
  explain: 想象你让机器人在虚拟小镇里找到钥匙，再用它打开房门。若只检查它能否照着固定动作走，世界模型可能看似合格，却经不起绕路、转身和等待。PlayWorld要解决的正是这种评测失真：它让多模态智能体，也就是能理解图像并采取行动的程序，带着长程目标在模型生成的世界里探索，以任务是否达成取代固定动作序列。基准包含171个场景，评估9个世界模型的几何一致性、交互保真度、视野外演化和认知演化。四个维度分别检查空间是否稳定、动作是否有效、看不见的地方是否合理变化，以及智能体能否据此更新理解。因为玩家会主动探索并追踪目标，这种评测更能检验模型能否支撑持续行动，而非只生成一段好看的画面。
  detail:
    position: PlayWorld 旨在解决不同 video world models 难以公平比较的问题：同一长程目标在不同模型中可能需要不同动作序列，因此固定动作序列评测不适用。它让
      Agent Players 通过交互完成指定目标，并据此评估模型表现。
    io: 输入包括当前观察、指定的长程目标，以及 world model 对玩家动作的响应；Agent Player 根据多模态信息选择动作。输出包括交互生成的视频和任务评测结果，评测涵盖四个核心维度及视频质量、可控性指标。
    steps:
    - 为每个场景指定长程目标，形成 171 个可评测任务，以目标而非固定动作序列定义评测内容。
    - 将场景观察和目标提供给多模态 Agent Player，使其根据当前交互状态决定下一步行动。
    - 把 Agent Player 的动作输入 world model，并将模型生成的后续状态反馈给玩家，以持续推进目标任务。
    - 根据交互过程和生成结果，从几何一致性、交互保真度、视野外演化、认知演化等维度评估模型，并补充视频质量与可控性指标。
    formulas: []
    train: 摘要未给训练流程或关键训练设置。推理时由多模态 Agent Player 在 world model 中围绕指定长程目标进行交互，再对任务表现和基础能力进行评测。
    diff: 区别于依赖固定动作序列的评测，PlayWorld 以长程目标驱动 Agent Player 与模型交互，允许不同模型通过不同动作路径完成同一目标。它还系统评估几何一致性、交互保真度、视野外演化和认知演化。
    limits: 摘要未见明确的评测代价或方法局限说明；实验指出当前模型在长程交互目标上仍不可靠，尤其难以维持空间一致性和持久状态演化。
    has_abstract: true
