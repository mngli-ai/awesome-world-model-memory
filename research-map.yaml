    diff: 与 State World Models 比，那篇的状态由规则执行，它让 agent 在状态里自由规划；与 Mallea 比，Mallea 用 coding agent 搭世界，它把状态更新建在空间记忆上。
    formulas: []
    has_abstract: true
    io: 输入是单图与自由文本指令，输出是分钟级探索视频与持续更新的世界状态。
    limits: 没有定量数字；agent 与生成模型的耦合成本、失败恢复未说；分钟级是定性展示。
    position: 单图交互世界模型靠低层相机与文本提示驱动，高层意图要人自己拆，探索久了世界不持久。
    steps:
    - agent 在世界状态里设计场景与旅程。
    - 视频世界模型按块生成，相机轨迹与结构化提示是两层接口。
    - 每块连同几何写入空间记忆，agent 从记忆更新世界状态。
    - 生成时按表面可见性选历史视图，并按几何可靠性维护记忆。
    - 在回访与探索基准上评测，做分钟级定性展示与消融。
