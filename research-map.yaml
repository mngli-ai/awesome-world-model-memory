- id: rolling-sink
  title: 'Rolling Sink: Bridging Limited-Horizon Training and Open-Ended Testing in
    Autoregressive Video Diffusion'
  date: '2026-02-08'
  lane: 位置时间寻址
  branch: 锚 sink
  training: 免训
  status: 速读
  one_liner: 把推理期缓存拉回训练内的稳定行为
  mechanism: 固定预算内恢复低漂移内容、滑动时间索引与演化语义，加一段近期上下文；以cache-behavior mismatch立论。
  tags:
  - 缓存域偏移
  - 滑动时间索引
  - 推理期策略
  key_numbers:
  - 吞吐变化约 0.56%
  - 1/5 分钟 rollout 上 VBench-Long 平均排名最佳
  - 30 分钟 rollout = 360x 训练时长
  - 显存恒定
  media: []
  links:
  - https://arxiv.org/abs/2602.07775
  - https://rolling-sink.github.io/
  note: 作者自承 sink 与 temporal re-indexing 都是已有机制，其贡献是「不匹配」这一诊断 + 联合有界缓存策略 + Rolling
    Semantics 调度。属于位置时间寻址的原因是把时间索引当可调度对象（滑动而非单调增长）。
  arxiv: '2602.07775'
  explain: 想象一台摄像机边走边拍：它每次只看眼前几秒，却要连续拍上半小时。训练时，模型只学短片段；测试时却要不断把自己生成的内容塞回缓存，越滚越久，画面容易漂移、人物和场景逐渐失真。这篇论文把问题归因于缓存行为不匹配，即训练时见到的缓存状态与推理时真实经历的状态不同。它在固定显存预算内，恢复漂移较小的内容，滑动时间索引，让语义随视频演化，再补入一段近期上下文，使训练主动模拟长时间推理。这样模型学会如何处理不断变旧、变化的缓存，因而更稳定。实验中吞吐仅变化约0.56%；在1分钟和5分钟
    rollout（连续生成过程）上，VBench-Long平均排名最佳；即使测试长度达到训练时长的360倍，也能生成30分钟视频，显存保持恒定。
  detail:
    position: 论文针对 Self Forcing 系列自回归视频扩散模型在超出训练片段长度后质量退化的问题，将其归因于训练与开放式推理时缓存行为不匹配。Rolling
      Sink 在推理时调整缓存策略，使缓存行为更接近训练范围内的稳定状态。
    io: 输入是自回归视频扩散模型及其逐块生成过程，后续块依赖先前生成块形成的缓存；输出是可持续滚动生成的视频块。模型原有条件信号未在摘要中具体说明，已知的上下文信号是此前生成的视频块。
    steps:
    - 在模型固定缓存预算内设计联合缓存策略，以缓解训练内缓存与开放式推理缓存之间的行为偏移。
    - 保留低漂移内容并滑动时间索引，使缓存尽量维持训练范围内稳定的内容与时间行为。
    - 采用 Rolling Semantics schedule 处理随生成推进而变化的语义，避免缓存内容僵化。
    - 在缓存中保留少量近期上下文，使新生成的视频块仍能利用最近的运动与内容信息。
    formulas:
    - tex: \mathcal{C}_t=\operatorname{TopK}_{i\in\mathcal{C}_{t-1}\cup\mathcal{B}_t}\!\left(-\delta_i^{(t)}\right)\;\cup\;\mathcal{B}_t^{\mathrm{recent}},\qquad
        \delta_i^{(t)}=\left\|\mathbf{h}_i^{(t)}-\mathbf{h}_i^{(t-1)}\right\|_2,\qquad
        |\mathcal{C}_t|\le M
      caption: 在固定缓存预算内选择低漂移内容并保留一段近期上下文；标准写法，非原文
    - tex: \operatorname{Attn}_t=\operatorname{softmax}\!\left(\frac{\mathbf{Q}_t[\mathbf{K}_{\mathcal{C}_t}]^{\top}}{\sqrt
        d}+\mathbf{B}(\tilde{\tau}_{\mathcal{C}_t})\right)\mathbf{V}_{\mathcal{C}_t},\qquad
        \tilde{\tau}_i=\tau_i-\Delta_t
      caption: 对滚动缓存执行注意力，并通过滑动时间索引与随生成推进的语义位置保持缓存行为稳定；标准写法，非原文
    train: Rolling Sink 是 training-free 的推理期缓存策略，不改变模型训练流程。实验使用在 5 秒视频上训练的 Self Forcing
      和 Causal Forcing 基础模型；在相同推理设置下评估 1 分钟和 5 分钟生成，并展示 30 分钟定性生成。其余具体缓存参数与设置摘要未给。
    diff: 论文的核心不是提出 attention sink 或 temporal re-indexing 这些已有机制，而是以 cache-behavior
      mismatch 解释长时生成退化，并将相关机制与 Rolling Semantics schedule 组合成固定预算内的联合缓存策略。
    limits: 摘要报告吞吐量变化约为 0.56%，GPU 内存保持恒定。验证覆盖 1 分钟和 5 分钟评测，并展示 30 分钟定性结果；作者明确不声称任意时长都能保证质量。
    has_abstract: true
