  date: '2026-11-10'
  detail:
    concepts:
    - 流式分块推理
    - 自回放训练
    diff: 与按操作切分的方案比，它不把去噪与写上下文拆到不同模块，而让同一角色的适配器两件事都干；与 TaoMate-HD 比，HD 按去噪阶段各存一份历史，它按角色分适配器。
    formulas: []
    has_abstract: true
    io: 输入提示词与一至多个图像或视频参考，输出约两分钟、可换指令的连续流；中间产物是每个块的上下文，以及写它的那个适配器。
    limits: 十段约两分钟，未到分钟级以上；只看边界跳变与时序相似度，没有回访或实体一致性；与 TaoMate-HD 未直接对比。
    position: 我的六块窗口是不管内容一律覆盖着写，写的人只有一个；场景刚建立那几块和后来延续那几块其实该有不同的写法。这条把写历史的权限按时间角色切开，等于给历史加了一层角色标签。
    steps:
    - 在冻结骨干上给场景建立与延续各挂一个低秩适配器。
    - 每个适配器在自己的角色里同时做去噪与上下文写入。
    - 用 Self Gradient Forcing 通过两个角色各自构造的历史联合训练。
    - 在同两适配器预算下与按操作切分的方案对比 32 个多参考案例。
    train: 需训。骨干冻结，只训两个角色适配器。
  explain: 流式多参考生成里，历史是每个块自己往前写的，写坏了后面全跟着坏。TaoMate-R1 把适配参数按时间角色切开：建立场景那几块用一套，延续那几块用另一套，每套同时负责去噪和写上下文，再用 Self Gradient Forcing 让两个角色在自己造出来的历史上联合训练。它对比的是按操作切分的做法，也就是把去噪和写上下文拆开、所有块共用一套参数。十个约两分钟的流上，边界亮度跳变从 1.96 降到 0.613，短交互、长流与公开参考组合上的 CLIP 与 DINO 时序相似度也都更高。对我的用处是把谁写历史当成一个可分配的资源，我现在六块窗口只有一个写者。
