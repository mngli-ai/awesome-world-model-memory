  explain: 这篇跟我做的东西结构最像。它把高层意图交给一个 agent，agent 维护一份世界状态并在里面规划旅程，低层由一个视频世界模型逐块生成，每块连同几何一起进空间记忆，agent 再从空间记忆更新自己的世界状态，两层围绕同一份空间记忆和一套公制的相机轨迹接口闭合。生成侧处理长 rollout 里遮挡与几何误差累积的两个手段值得抄，一个是遮挡感知的历史选择，按表面可见性决定取哪些过去视图，另一个是可靠性维护，偏好几何更可靠与更早的观测。分钟级旅程上它是回访与探索基准的总体最优。它说明持久性不是视频模型单独给的，是它和 agent 闭环给的，这跟我用代码维护状态的想法一致，只是它用 agent 的自由度换掉了我需要的可判定性。
