- id: loger
  title: LoGeR
  date: '2026-03-03'
  lane: 参数化记忆
  branch: 测试时训练
  training: 训练
  status: 速读
  one_liner: 参数化TTT锚全局坐标防漂移
  mechanism: 分块处理，块内用双向先验；跨块靠混合记忆——参数化 TTT 记忆锚定全局坐标系防尺度漂移，滑窗注意力保未压缩上下文做高精对齐。
  tags:
  - TTT记忆
  - 坐标锚定
  - 混合记忆
  key_numbers:
  - 128帧训练→数千帧推理
  - KITTI ATE -74%
  - 19k 帧序列
  media:
  - https://LoGeR-project.github.io/files/loger_teaser_vid.mp4
  - https://LoGeR-project.github.io/files/loger_teaser_vid_lowres.mp4
  links:
  - https://arxiv.org/abs/2603.03269
  note: 3D 重建而非视频生成，但"参数化记忆负责全局锚、滑窗负责局部精度"的分工可直接搬到长视频记忆设计。
  arxiv: '2603.03269'
  explain: 想象一台摄像机沿着很长的走廊前进：每一步位置只差一点，走到尽头却可能把尺度和方向都估偏。长视频模型也有这类麻烦，逐段预测会累积误差，短视频训练又难以支撑数千帧推理。LoGeR把视频切成小块，在每块内部利用前后画面共同判断运动；块与块之间则混合两种记忆：参数化的测试时训练记忆像地图基准，持续锚定全局坐标、抑制尺度漂移；滑动窗口注意力保留最近、未压缩的画面，帮助精细对齐。一个管整体，一个管细节，因此模型可用128帧训练、推理数千帧；在KITTI数据集上，估计轨迹与真实轨迹的误差降低74%，还处理了19,000帧序列。
  detail:
    position: LoGeR 旨在解决 feedforward 几何基础模型处理分钟级长视频时，二次注意力复杂度或循环设计有效记忆有限所造成的扩展瓶颈。目标是在无需后处理优化的情况下，实现长序列稠密
      3D 重建，并保持跨片段的全局一致性。
    io: 输入是按时间顺序的视频流，摘要未说明其他条件信号。输出是视频序列的稠密 3D 重建结果，要求在长时间跨度上保持全局坐标与尺度一致。
    steps:
    - 将视频流切分为多个 chunk，以分块方式处理长序列，避免直接对整段视频进行高开销的全局注意力计算。
    - 在每个 chunk 内利用强双向先验进行重建，以获得高保真的局部几何推理结果。
    - 跨 chunk 使用参数化 Test-Time Training 记忆锚定全局坐标系，以抑制尺度漂移。
    - 同时使用 Sliding Window Attention 保留未压缩的邻近上下文，以提高相邻 chunk 间的对齐精度。
    - 结合局部重建与混合记忆逐块处理后续视频，使模型能将训练于短序列的能力推广到更长推理序列。
    formulas:
    - tex: \theta_t=\theta_{t-1}-\eta\nabla_{\theta}\mathcal{L}_{\mathrm{TTT}}(\theta_{t-1};x_t)
      caption: 参数化测试时记忆的梯度更新；标准写法，非原文
    - tex: \operatorname{Attn}(q_i,K,V)=\operatorname{softmax}\!\left(\frac{q_iK_{\mathcal{N}(i)}^{\top}}{\sqrt{d_k}}\right)V_{\mathcal{N}(i)},\quad
        \mathcal{N}(i)=\{j:|i-j|\le w\}
      caption: 滑动窗口注意力聚合邻近上下文；标准写法，非原文
    train: 模型在长度为 128 帧的序列上训练；推理时可泛化到数千帧。摘要未给出训练损失、优化器、批量大小或具体推理设置。评测包括标准基准和重新利用的
      VBR 数据集，后者包含最长 19k 帧的序列。
    diff: 相较于依赖全局注意力或有限循环记忆的既有方法，LoGeR 以分块处理结合参数化 TTT 记忆和非参数化 Sliding Window Attention，分别维护全局坐标稳定性与局部精细对齐。摘要报告其在
      KITTI 上的 ATE 相较先前 feedforward 方法降低超过 74%。
    limits: 摘要未见明确说明计算、显存或运行时间代价，也未说明在不同场景或数据分布下的局限。
    has_abstract: true
