- id: worldstereo
  title: WorldStereo
  date: '2026-03-02'
  lane: 几何位姿寻址
  branch: 显式几何库
  training: 微调
  status: 速读
  one_liner: 增量点云+空间立体记忆双模块
  mechanism: 全局几何记忆用增量更新点云注入粗结构先验并锁相机；空间立体记忆用 3D 对应约束注意力感受野，从记忆库取细粒度细节，生成结果可直接重建 3D。
  tags:
  - 增量点云
  - 立体记忆
  - 可重建
  key_numbers:
  - 透视/全景图输入
  - 摘要未给帧数
  media: []
  links:
  - https://arxiv.org/abs/2603.02049
  note: 走"生成即可重建"路线，与 GEN3C 同族但记忆拆成粗点云+细立体两级；training=微调为摘要"基于蒸馏 VDM 主干、无需联合训练"的推断。
  arxiv: '2603.02049'
  explain: 想象镜头沿着房间缓缓前进：门的位置不能忽左忽右，墙上的纹理也不能每转一次就变样。视频世界模型常会丢失这种空间连续性，画面看着连贯，重建成三维时却可能对不上。WorldStereo把透视图或全景图输入后，分别维护两种记忆：全局几何记忆用增量点云，也就是逐步累积的三维点，保存场景轮廓并约束相机位置；空间立体记忆则用三维对应关系限制注意力，让模型从记忆库取回细节。前者稳住大结构，后者补足局部纹理，因此生成画面既更一致，也能直接重建为三维场景。
  detail:
    position: WorldStereo 旨在解决 Video Diffusion Models 生成视频难以精确控制相机、且不同视角内容不一致，因而难以重建一致
      3D 场景的问题。它通过几何记忆模块连接相机引导视频生成与 3D 重建。
    io: 输入可从透视图像或全景图像开始，并以相机轨迹作为控制信号。输出是在相机控制下生成的多视角一致视频，可用于高质量 3D 场景重建。
    steps:
    - 根据输入图像和相机轨迹建立全局几何记忆，并增量更新点云，以提供粗结构先验并精确控制相机。
    - 将点云等几何信息用于生成过程，减少视角变化时场景结构与内容的不一致。
    - 通过空间立体记忆中的 3D 对应关系约束注意力感受野，使模型从记忆库检索细粒度细节。
    - 生成受相机轨迹控制且多视角一致的视频，并据此进行 3D 重建。
    formulas:
    - tex: \mathcal{P}_t=\operatorname{Fuse}\!\left(\mathcal{P}_{t-1},\operatorname{BackProj}(I_t,\mathbf{T}_t,D_t)\right)
      caption: 标准写法，非原文：利用当前图像、相机位姿与深度反投影结果增量更新全局几何记忆中的点云。
    - tex: \mathbf{A}_{ij}=\operatorname{softmax}_j\!\left(\frac{\mathbf{q}_i\mathbf{k}_j^{\top}}{\sqrt{d}}+\log\mathbf{1}\!\left[\lVert\mathbf{x}_i-\mathbf{x}_j\rVert<\epsilon\right]\right),\qquad
        \mathbf{y}_i=\sum_j\mathbf{A}_{ij}\mathbf{v}_j
      caption: 标准写法，非原文：利用记忆中三维对应点约束注意力感受野，并从空间立体记忆检索细粒度特征。
    train: 摘要称 WorldStereo 采用 flexible control branch，利用经过 distribution matching distillation
      的 VDM backbone，无需 joint training。具体训练数据、损失函数及推理参数摘要未给。
    diff: 相较于缺少几何记忆、难以保证跨视角一致性的生成方法，WorldStereo 同时使用增量点云进行全局几何控制，并用 3D 对应关系约束空间立体记忆中的注意力。其控制分支可利用蒸馏后的
      VDM backbone，无需联合训练。
    limits: 未见明确说明
    has_abstract: true
