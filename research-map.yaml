  explain: 交互视频世界模型最难的地方是控制不止一种：你想切视角、想让人物做动作、还想转相机。以前的做法是把视角写进文本提示、把动作和相机混成一路输入，再给每种控制单开一条条件分支，结果这三件事在模型里怎么相互影响只能靠猜。这篇的办法很干脆，把视角、动作、相机各写成几个 token，和视频 token 排在一条序列里过同一个注意力，让模型自己学它们的相互作用。它发现把视角显式写成 token 之后，用单视角数据训练也能冒出视角切换的能力，因为视角不再是文本里含糊的一句话，而是一个可以单独拨动的变量。时间上另加了一层 Interaction-Transport RoPE，把累计的控制切换量写进旋转角度，这样跨执行区间接续时不用再靠额外的隐状态缓存来记「刚才控制走到哪了」。
