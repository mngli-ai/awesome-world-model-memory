- id: pvbench
  title: 'PVBench: Quantifying Physical Plausibility in Video Generation with Object-Level
    Measurements'
  date: '2026-10-19'
  lane: 评测基准
  branch: ''
  training: 不适用
  status: 速读
  one_liner: 用物体级6D位姿与守恒残差量化物理
  mechanism: 七个域共46维、600条提示（30%含机械臂/人形/四足/多智能体），可测维度各配专用视觉模型，算出物体6D位姿、米制尺度、法线、运动学与守恒律残差。
  tags:
  - 物体级测量
  - 守恒残差
  - 46维指标
  key_numbers:
  - 600 条提示
  - 30% 含具身智能体
  - 46维 / 7域
  media: []
  links:
  - https://arxiv.org/abs/2610.26711
  note: 明确要摆脱主观打分：能算的维度全部落成可验证数值（6D位姿、米制尺度、法线、守恒残差），并做了自动指标与人工判断的一致性验证。
  arxiv: '2610.26711'
  explain: 想象视频里一个杯子被推下桌：它可能看起来很真实，却在落地后穿过地板，或大小忽然改变。只凭观感打分，很难准确抓出这类物理破绽。PVBench把检查落到物体上：6D位姿就是物体在三维空间的位置和朝向；再测米制尺度、表面法线和运动学，并计算守恒律残差，也就是物理量偏离应有规律的程度。它覆盖七个领域、46个可测维度，配备专用视觉模型，并用600条提示测试，其中30%涉及机械臂、人形、四足或多智能体。逐项测量能把“看着不对”变成可比较的数值，也让评测更容易定位视频生成在哪种物理规律上出错。
  detail:
    position: PVBench 旨在解决视频生成模型的物理可信度缺乏客观、细粒度测量的问题。它通过物体级测量评估生成视频在几何、运动、动力学和守恒规律等方面的表现。
    io: 输入是 600 条用于 text-to-video 或 image-to-video 的提示及其生成视频，条件信号为文本或图像。输出是覆盖七个域、共
      46 个维度的评估结果，其中可测维度包括物体级 6D 位姿、米制尺度、表面法线、运动学量和守恒律残差。
    steps:
    - 构建覆盖七个评估域的 600 条提示，并纳入多种具身主体，以覆盖不同的物理场景。
    - 将提示输入 text-to-video 或 image-to-video 模型生成视频，以评估其生成结果的物理可信度。
    - 对可测维度使用专用视觉模型提取物体级几何与运动信息，以获得可验证的物理测量。
    - 依据提取结果计算各维度的测量指标，包括运动学量和守恒律残差，以量化视频中的物理表现。
    - 通过人类评估检验自动指标与人类判断的一致性，并用于评测主流开源和闭源模型。
    formulas: []
    train: PVBench 是评测基准，摘要未说明相关模型的训练流程或关键设置。推理评测中，专用视觉模型从生成视频提取物体级测量，并据此评估各维度；自动指标与人类判断的一致性通过人类评估验证。具体推理配置摘要未给。
    diff: 已有基准多依赖粗粒度的视觉语言模型判断，或面向具身世界模型，而非直接评测视频生成。PVBench 对可测物理维度使用专用视觉模型和物体级测量，降低对主观评分的单独依赖。
