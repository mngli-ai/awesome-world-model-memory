  link_strength: 都按层级组织记忆再按属性取，se-mem 按语义与情景两层并看可见性取，这条按输入结构把子树切成段、拿结构路径当地址，并加子段到父段的直连，让早先兄弟记录不必等逐段更新才回到上下文
  links:
  - https://arxiv.org/abs/2611.13946
  mechanism: 按输入层级把完整子树与相邻兄弟子树切成段以保住局部结构关系，段上挂结构路径让 agent 认出祖先与层级位置，再补一层从低层子段到高层父段的残余记忆链接，使信息不必经过逐段更新也能直接流到后面。
