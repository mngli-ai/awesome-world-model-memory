- id: worldmark
  title: 'WorldMark: A Unified Benchmark Suite for Interactive Video World Models'
  date: '2026-04-23'
  lane: 评测基准
  branch: ''
  training: 不适用
  status: 速读
  one_liner: 一个WASD适配器统一十个异构模型
  mechanism: 把共享WASD词表翻成各模型原生控制格式，500例同义指令横评；用控制论视角逐轴量方向准确率、方向纯度、响应延迟、运动稳定性，另设记忆与画质套件。
  tags:
  - 动作动力学
  - 逐轴分解
  - 适配器协议
  key_numbers:
  - 10个模型
  - 500 用例
  - 一新模型仅需1个适配器
  media: []
  links:
  - https://arxiv.org/abs/2604.21686
  note: 测的是动作响应曲线本身：最快响应的往往最不稳、画质最好的平移方向准确率垫底、逐轴拆开才看得见"平移几乎完美但几乎不转"。
  arxiv: '2604.21686'
  explain: 想象十台游戏角色各拿着不同手柄：你都喊“向前”，它们却可能走偏、迟钝，彼此成绩也难比较。WorldMark要解决的正是视频世界模型控制接口各异、评测不统一的问题。它用WASD这套上下左右方向词作共同语言，再由适配器把指令翻译成每个模型原生的控制格式；新模型只需接一个适配器。研究者用500条同义指令测试10个模型，并从控制论角度——比较命令与实际运动——逐轴衡量方向准确度、动作是否夹带别的方向、响应快慢和运动稳定性，还单独评测记忆与画质。共同入口和同一套测试让横向比较更公平，也让差异更容易定位。
  detail:
    position: 这篇工作解决交互式视频世界模型难以公平比较的问题：不同模型使用不兼容的动作控制格式，现有动作评估也难以刻画模型对指令变化的响应过程。WorldMark
      建立统一评测协议，并从控制系统角度评估动作响应，同时评测世界记忆与视觉质量。
    io: 输入是共享 WASD 风格动作指令及标准化测试案例，案例覆盖不同风格、视角和难度；各模型经适配器接收语义一致的控制信号。输出是模型生成的视频，以及逐轴的动作动态指标、世界记忆和视觉质量评测结果。
    steps:
    - 构建覆盖不同风格、视角和难度的标准化测试案例，以统一测试条件进行横向比较。
    - 将共享 WASD 词表映射为各模型的原生控制格式，以适配异构模型的动作接口。
    - 向模型发送标准化动作指令并收集生成结果，以观察世界对交互控制的响应。
    - 逐轴计算方向准确率、方向纯度、响应延迟和运动稳定性，以区分不同类型的动作跟随表现。
    - 另行评测世界记忆与视觉质量，以补充动作动态评测并形成综合基准。
    formulas: []
