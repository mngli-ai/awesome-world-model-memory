  detail:
    diff: 与打包序列上的普通 RoPE 相比旋转量取自真实网格坐标而非打包位置；与纯窗口注意力相比多一层可解释的全局上下文，块摘要保留相对位移而不是压成匿名池化。
    formulas: []
    has_abstract: true
    io: 输入是打包后的三维体 token 序列与每个 token 的真实网格坐标，输出是带局部精确注意力与全局块摘要的注意力结果。
    limits: 任务是显微体积分割与受控合成对照，不是视频或世界模型；没有长时序历史与回访一致性评测；块摘要的粒度、压缩比与显存收益未给数。
    position: 把三维体积打包成一条 token 序列本来被当成单纯的长序列建模，但打包之后序列顺序不再编码几何，按序列位置索引的位置机制会去学内存布局而不是物体，这是注意力作用于打包几何数据时的通用失效。
    steps:
    - 近邻范围保留精确注意力，不做压缩。
    - 远处上下文按连续三维块压成摘要。
    - 在块被摘要之前对 query-key 施加轴向网格坐标 RoPE，旋转量取自真实 token 网格坐标。
    - 在合成任务上只改 token 的内存顺序、固定标注规则，检验位置编码是否跟着布局走。
    - 在真实显微数据上与同参数量的 3D U-Net 及匹配的学习式位置基线对比，隔离出坐标系本身的作用。
    train: 需训，合成任务与 Allen WTC-11 hiPSC 显微数据各训一套，训练细节摘要未给；配有融合 Triton 实现，65k token 下与窗口注意力延迟持平。
  explain: 这篇讲的失效对我是直接的。三维体数据要喂进注意力，先得摊平成一条序列，摊平之后序列里的先后只反映打包方式，不反映空间关系，于是按序列位置索引的位置编码学到的其实是内存布局，不是物体结构。它的对照实验做得很干净，训练时一种打包，推理时只换内存顺序、标注规则不动，学出来的位置编码和打包序列上的 RoPE 立刻全崩，换成按真实网格坐标算旋转量就一直是精确的。补法有两层，近邻保留精确注意力不动，远处的上下文压成连续的三维块，而且旋转要在压块之前施加，这样 query 对块的打分仍然是相对位移的加权和，块里装的位置信息不会丢。对我这条线，proxy 是结构化张量，喂进渲染器之前同样要摊平，如果我按摊平后的序号去定位置，就等于把「第几个 token」当成了「哪个空间位置」，历史一长、打包方式一变，取到的就是错的地址。它给的是把地址锚回真实坐标这条最省的做法。代价是它只在显微体积上验证，没有时序也没有回访一致性，长历史的地址漂移它没碰。
  id: pack3d
