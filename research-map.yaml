    - 在生成下一块之前，用当前 latent 与下一个动作预测未来场景状态。
    - 把预测出的未来状态当先验调制下一块的生成。
    - 把 C-NCP 以可插拔方式接进四个底座生成器。
    - 在三个交互长视频与动作条件世界模型基准上评累积误差与长程一致性。
    formulas: []
    train: 需训，C-NCP 是训练出来的模块，底座不动。
    diff: 与只改检索或只改缓存的方法相比，它不纠正也不换历史，而是加一条并行的未来状态参照；与自强制一类靠改训练分布压漂移的方法相比，它不动训练流程，只加一个可插拔模块。
    limits: 摘要无定量增益。预测器本身会不会也漂，摘要没答。四底座三基准是广度，缺长时程极限的刻画。代码与项目页都没给具体演示链接。
    has_abstract: true
  concepts:
  - 动作条件控制
  - 流式分块推理
