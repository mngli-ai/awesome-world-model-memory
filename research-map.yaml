- id: drift-kv-reselect
  title: Rate-Controlled Refresh (RCR)
  arxiv: '2610.31433'
  date: '2026-10-22'
  precision: day
  venue: ''
  lane: 位置时间寻址
  branch: ''
  parent: video-memcomp
  link_strength: 都在决定哪些 KV 留、何时重取，它把重选时机交给注意力漂移速率而不是固定阈值
  training: 免训
  status: 速读
  one_liner: 漂移决定何时重选，预算定重选多少
  mechanism: 先证明在 prefill 一次性选定保留 token 的做法在长文生成里撑不住，连用未压缩答案注意力做的 oracle 也只能到 0.44 到 0.52 的 ROUGE-L 一致；再让注意力漂出已保留集合这件事触发重选，同时用一个逐样本控制器把刷新频率压在预算内，配低秩漂移检测器与候选受限的重选，决策留在 GPU 上做。
  key_numbers:
  - oracle 一次性选择 ROUGE-L 一致度仅 0.44-0.52
  - 比逐步检索的 InfiniGen 高 1.6-3.8 ROUGE-L，六组里五组胜
  - 与逐步精确重选差 1.7 分以内，单步数据搬运量相当
  - 漂移选时机比随机时机高 2.0-5.0 分
  - GPU 常驻检测器显存占用小 4 倍
  self_measured: []
  media: []
  links:
  - https://arxiv.org/abs/2610.31433
  note: 雷达自动入库 2026-10-27，字段据摘要，待人工核。主体是多模态大模型的长文生成，不是视频扩散，进图谱是因为它把「什么时候该重新取历史」写成了一个可调的机制；视频描述这一项上它只与 InfiniGen 打平或略胜，且不再赢过固定阈值，作者自己把这归因于视频样本漂移同质，这个失效条件要紧；数字都是 ROUGE-L 与显存相对值，不是画面指标；未给项目页。
  tags:
  - 漂移触发
  - 预算控制
  - KV 重选
  explain: 压缩 KV 的常见做法是在 prefill 时挑一次保留哪些视觉 token，之后整段生成都认这份名单。这篇先把这个前提打掉：写长描述的时候模型要读的证据是会在生成过程中移动的，就算拿未压缩答案自己的注意力去做 oracle 选择，跟完整输出的 ROUGE-L 一致也只有 0.44 到 0.52，也就是名单在开头就定了，后面一定读错地方。自然的补救是注意力一漂出保留集合就重选，但固定阈值会系统性失效，因为不同样本的漂移量根本不可比，漂移小的样本几乎永远不刷新，而它们恰恰最受益。所以它把问题拆成两个旋钮：漂移决定「什么时候、在哪里」重选，一个逐样本控制器决定「多久刷一次」，加起来就是速率控制。再配低秩漂移检测器和只在候选集里重选，掩码不搬出显存。
  detail:
    position: KV 压缩通常在 prefill 一次性选完保留 token 就复用整段生成，但长文生成里模型要读的证据随文本推进而移动，一次性选择的上限很低。
    io: 输入多模态长文生成任务（细粒度图像描述、视频描述）与 KV 预算，输出是随生成推进动态更新的保留集合，不改模型权重。
    steps:
    - 用低秩漂移检测器每步估计注意力相对已保留集合的漂移量。
    - 漂移超出自适应判据就在候选集内重选保留 token，不做全量逐步检索。
    - 逐样本控制器调刷新频率，把总刷新次数约束在给定预算内，避免低漂移样本被永久跳过。
    - 重选决策在 GPU 上直接完成，掩码不出显存。
    formulas: []
    train: 免训。纯推理期改造，一套超参通用于所有模型与任务，不需要重训底模。
    diff: 与 InfiniGen 这类逐步检索相比，它把重选时机交给漂移速率且只在候选集里选，数据搬运量相当但不必每步做全量检索；与固定漂移阈值相比，多了一个逐样本频率控制器，把阈值可比性问题转成频率问题，低漂移样本不会被跳过。
    limits: 主体是 MLLM 长文生成，不是视频扩散，迁移到视频 KV 窗口需要自己改；视频描述上漂移同质，只与 InfiniGen 打平或略胜，且不再胜过最近邻的固定阈值，作者指出了这个失效条件；对象级 F1 只在三个模型里两个胜出；绝对增益是 ROUGE-L 点数，与画面质量的关系没有测。
    has_abstract: true
  concepts:
  - 记忆写入淘汰
  - KV压缩或淘汰
