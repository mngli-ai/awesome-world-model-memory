  explain: 想象一辆赛车在游戏世界里飞驰：引擎每走一步，不必先画完整画面，只需告诉模型车、道路、树木和碰撞位置。StreamRender-H3要解决的麻烦是，视频模型直接生成1080p画面既慢，又难保持物体连续运动。它让代码游戏引擎每个物理步输出约13类对象的语义图，也就是标明各物体类别和位置的结构化地图；MiniMax-H3再以流式方式，按视频块进行两步去噪渲染。语义条件采用三级引导拟合，提前学会引导效果，因此省掉传统分类器自由引导（CFG）的额外计算。这样，低成本的结构信息负责“世界怎么变”，模型负责“画面长什么样”，既稳又快：8张GB200上每步218毫秒，VAE解码仅23.8毫秒，1080p带声音视频可达71秒，速度提升3.67倍。
  detail:
    position: 该方法试图让代码驱动的游戏世界能够实时生成高分辨率视频，同时保留对象语义与场景动态的一致性。它用语义图流连接游戏引擎与视频生成模型。
    io: 输入是代码游戏引擎按物理步产生的约 13 类对象语义图流，输出是按 chunk 渲染的 1080p 视频。语义图作为条件信号，引导 MiniMax-H3
      生成与游戏对象及状态对应的画面。
    steps:
    - 代码游戏引擎逐个物理步输出对象语义图，以提供实时更新的场景与对象信息。
    - 将语义图流送入 MiniMax-H3，作为视频生成的条件信号，以便生成画面跟随游戏世界变化。
    - MiniMax-H3 采用流式 DMD 两步去噪逐个 chunk 渲染视频，以支持连续生成并控制推理开销。
    - 通过拟合三级 guidance 实现语义条件引导，以省去推理时的 CFG。
    formulas:
    - tex: \nabla_{\theta} L_{\mathrm{DMD}}=\mathbb{E}_{t,\epsilon,c}\left[w(t)\left(s_{\mathrm{fake}}(x_t,t,c)-s_{\mathrm{real}}(x_t,t,c)\right)\frac{\partial
        x_{\theta}}{\partial\theta}\right]
      caption: DMD 分布匹配蒸馏的标准梯度写法，非原文；用于说明生成器如何依据真假分布的 score 差异更新。
    train: 已知机制说明了流式 DMD 两步去噪、按 chunk 渲染，以及通过拟合三级 guidance 省去 CFG；训练数据、损失函数与具体训练设置摘要未给。已知推理性能为
      8 卡每步 218ms。
    diff: 该方法以代码游戏引擎输出的实时语义图流驱动视频生成，而不是仅依赖文本等静态条件。它还通过拟合三级 guidance 来省去 CFG，并采用两步流式
      DMD 按 chunk 渲染。
    limits: 已知推理设置需要 8 卡，且每步耗时 218ms；其他计算代价、适用范围与局限未见明确说明。
