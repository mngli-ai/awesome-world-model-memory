  date: '2026-11-06'
  detail:
    concepts:
    - 显式3D缓存
    - 视野重叠检索
    diff: 与 UniState、WorldCast 都把街景做成可累积的显式表示，它们更新的是几何场，这条更新的是带身份的资产记录并强调身份继承；与只在视野内重建的方法比，它的资产离开视野后仍作为记录存在且可编辑。
    formulas: []
    has_abstract: true
    io: 输入是多视角视频流，输出是持续更新的物体级 3D 资产与世界坐标状态。
    limits: 只在街景多视角数据上验，没有生成侧证据，也没有渲染回访的画面一致性指标；15.4% 是相对下降；在线帧率与显存占用摘要未给。
    position: 在线建街景资产的难点不是重建单帧，而是把运动与遮挡下断续的部分观测累积成一个不碎的身份，既不能把不同物体的证据混到一处，也不能把同一物体拆成两份。
    steps:
    - 把多视角视频转成以占据栅格为中介的表示。
    - 用历史载体引导做实例解码，得到有身份的观测。
    - 身份编码器把实例对齐的三维特征与多视角外观融合。
    - 累积证据关联把当前观测与资产记录里的身份、几何、外观证据比对，决定身份继承。
    - 更新世界坐标状态，从资产库实例化网格，与占据推出的静态背景合成，支持换网格、删物体、改轨迹。
    train: 需训，身份编码器与实例解码要训练；摘要未给模型规模、训练数据量与在线帧率，待核。
  explain: 这条解决的是回访里最难的一段，部分观测、断断续续、还有遮挡，怎么不把同一个物体的证据串到别人身上。它用占据栅格当中介，先把多视角视频变成有身份的观测，再靠一个累积证据关联判断身份继承，当前观测要和资产记录里攒下来的身份、几何、外观三路证据比，比完才更新世界坐标状态，然后从资产库实例化网格，配上占据推出的静态背景，支持换网格、删物体、改轨迹。数字上 nuScenes 配 SGE 时资产碎裂率降 15.4%。对我有用的是它把身份当成一条要维护的记录，而不是一个分类头的一次输出，这跟我用代码维护场景状态是一致的，我的每个实体有 id，它的每个资产有记录，差别在它的证据是学出来的特征，我的证据是代码里的字段。它的资产在屏幕外也继续存在并且可编辑，这一点正是我要的长程可控性。
