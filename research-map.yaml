  tags:
  - 坐标定址
  - 动作接口
  - 噪声调度
  explain: 俯视和等距这类平面相机世界，按下方向键，镜头位移在几何上是确定的。既有做法把动作当特征塞进模型，让模型从数据里学这个动作该把世界移动多少，于是同一个地方第二次出现时地址变了，回访就漂。ActionRoPE 把动作直接换算成世界坐标写进 RoPE，同一块地不管第几次看地址都一样。它还顺手用了初始视野内外的不对称，给几何已知的区和新露出来的区不同噪声调度，让已知区先稳下来当参照。
  detail:
    position: 把动作控制从特征条件改成位置地址，是位置时间寻址里最直接的一种：地址由世界坐标决定，不由帧序号或缓存槽位决定。
    io: 输入是动作序列与初始观测，动作被换算成平面相机在世界坐标下的位移，输出是沿动作轨迹生成的视频帧，位置地址由世界坐标给出。
    steps:
    - 把每个动作映射成平面相机在世界坐标下的位移。
    - 用该位移生成 token 的世界坐标旋转位置，替代按帧序或按槽位编号的位置。
    - 按初始观测覆盖与否，把画面分成几何已知区与待新生成区。
    - 用坐标条件噪声调度给两类 token 分配不同去噪进度，已知区先稳定。
    - 新区域生成时以已稳定的已知区为参照，动作因此跟着几何走而不是跟着特征走。
    formulas: []
    train: 免训。动作接口参数无关，只改位置编码与噪声调度；摘要称同一接口可跨 1.3B 到 33B 的底座迁移并泛化到分布外场景。
    diff: 与把动作当特征注入的四种代表机制相比，它把动作变成坐标而不是条件向量，因此同一世界位置在不同时刻拿到同一地址，回访漂移降 66%；与只重排帧槽位的 RoPE 方案相比，地址由几何决定，不依赖历史帧在缓存里的排布顺序。
    limits: 只适用于玩家运动能换算成平面相机位移的世界，透视相机与自由视角三维场景不直接适用；66% 是单一指标，未报多角度的长程回访指标；已知区与新生成区的划分依赖初始观测，划分错误时的退化未讨论。
    has_abstract: true
  concepts:
  - 旋转位置编码
  - 动作条件控制
