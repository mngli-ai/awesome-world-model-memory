    position: 视频世界模型要合成可长时间探索的持久三维世界，但既有基准要么交互短，要么相机轨迹在生成前固定，长程大范围相机运动下的表现没被系统测过。
    io: 输入是初始场景与目标条件，输出是代理在线决定相机动作后模型生成的视频，以及四个维度的评分。
