  detail:
    diff: 与 longlive-rag 这类外部记忆库比，它不新增存储也不学检索策略，索引来自输入自带的对应；与只靠扩大窗口的做法比，它把窗口外的一致性交给检索，不付二次方注意力。
    formulas: []
    has_abstract: true
    io: 输入是待转换的整段视频（或流式到达的帧）加逐帧的编辑指令，输出是同内容、同运动、但风格或外观改写后的视频；中间产物是输入侧的 patch 级对应图，以及被检索到的历史输出块。
    limits: 摘要只给结论，没给窗口长度、加速比与一致性指标的具体数值；依赖输入视频本身可算可靠对应，输入本身遮挡严重或纹理重复时对应会退化，摘要未讨论；只在 video-to-video 这一形态上验证，别的生成任务无从借用这个索引。
    position: 把定长因果窗口之外的早期输出，按输入视频的显式对应关系重新取回来，让长程一致性不依赖窗口长度本身。
    steps:
    - 在输入视频上算 patch 级跨帧对应，得到区域级的匹配关系。
    - 用这份对应去已生成的输出里检索同区域的历史块，检索的键是输入的位置关系，不是时间戳。
    - 把这些历史块经对应交叉注意力注回当前生成步，作为长程一致的参照。
    - 生成过程仍按因果窗口推进，窗口本身不改。
    train: 摘要未给训练配置。方法被描述为可跨多个近期视频模型直接提升一致性并保住实时，据此记为免训接入，属推断。
  explain: 因果流式的做法是把注意力锁在定长窗口里，窗口一滑走，早先那块历史就不在上下文里了，帧与帧之间本来对得上的区域也对不上。这条的观察很朴素：video-to-video 的输入本身就是一份跨帧参照，输入里能对上的区域，输出里也该对上。于是它在输入上算 patch 级对应，把对应关系当成索引，去已生成的部分里把同一区域的历史块取回来，用对应交叉注意力注回当前这一步。取的是自己已经画过的像素，不是另一份记忆库，所以不用重建几何也不用训练新模块，换一个视频模型照样能接。摘要只说要跨多个近期模型都涨、且保住实时，具体数字一个没给。对我的意义在地址：我的六块窗口按时间距离取，它在按内容对应取，两者恰好是同一个问题的两种地址。
  id: vid2vid-long
  key_numbers: []
