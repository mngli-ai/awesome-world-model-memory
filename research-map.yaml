    - 构造 164 个测试用例，分四个探针族。
    - 在 10 个 SOTA 模型上共跑 1600 多次 rollout，约 800 分钟，单条最长 180 秒。
    - 从四个维度评，观察局部指标退化与长程不一致的出现。
    - 结论：近期模型画面质量撑得更久，长程记忆与演化仍弱。
