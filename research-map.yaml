  date: '2026-11-03'
  detail:
    diff: 与 DECMEM 比，DECMEM 拆两套记忆，它给单套记忆定几何判据；与 WorldPager 比，WorldPager 做存储分层与位姿预取，它做写入时机的几何判据。
    formulas: []
    has_abstract: true
    io: 输入是流式视频帧与预测相机位姿，输出是写入递归状态或 KV 缓存的关键帧集合与重建结果。
    limits: 没有生成侧指标；回访一致性只有定性的子图关闭描述；跨数据集的自适应半径没讨论。
    position: 流式重建的记忆写入靠当前帧的信号做门控，门控预算与写入位置都没跟位姿覆盖挂钩，漂移随写入次数累积。
    steps:
    - 把现有免训写入规则统一成预算与信号两件事，测无信号等间隔写入的上界。
    - 提出按位姿半径的写入规则，位姿离所有关键帧都超过半径才写。
    - 证明关键帧数是位姿集合覆盖数的常数倍，相机回访时不增长。
    - 大场景里解码首帧发现漂移时关闭当前子图。
    - 在 CUT3R 的递归状态与 StreamVGGT 的 KV 缓存上，与已发布免训规则比轨迹误差。
    train: 免训，规则直接作用在已发布模型的写入端。
  explain: 这篇回答的是写多少的问题，答案很干净。流式三维重建把历史帧存在递归状态、测试时训练的 fast weights 或 KV 缓存里，每写一帧都会挪动后续相机的坐标系或者吃掉显存，现有免训规则都在算从当前帧的什么信号决定写不写。作者先给了一个负面结论，把门控的更新预算平均摊到等间隔帧上不给任何信号，就能打平九个已发布门控，说明预算本身比信号更决定漂移。然后提出 SceneBound，只当预测位姿离所有已存关键帧都超过一个固定半径时才写，关键帧数因此跟访问过的位姿覆盖数同阶，相机原地转圈时数量不涨。四个模型三类记忆共用一个半径，九次遍历后关键帧只多 3% 到 6%。这条对我有用，我那六块窗口是按时序等分预算，它说明预算该按位姿覆盖分配。
  id: scenebound
  key_numbers:
  - 一个半径同时用于四个已发布模型与三类记忆
  - 九次遍历场景关键帧只增长 3% 到 6%
  - 在已发布的免训规则中平均轨迹误差最低
  lane: 几何位姿寻址
  link_strength: 与 DECMEM 都在给记忆定预算，DECMEM 拆稀疏全局与锚定局部两套记忆，它给单套记忆定一个几何写入判据；与 WorldPager 比，WorldPager 管 KV 存哪层，它管什么时刻值得写
  links:
  - https://arxiv.org/abs/2611.00756
  mechanism: 训练无关的写入规则，只有当前帧的预测相机位姿与所有已存关键帧的距离都超过固定半径时才写，关键帧数因此与访问位姿的覆盖数同阶，相机回到旧位置时不再增长；大场景里解码首帧暴露漂移时关闭当前子图。
