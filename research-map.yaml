  explain: token 合并压 KV 是老招，但既有做法所有层所有头用同一个合并比例，忽略了不同层头对合并的敏感度差很多，而且这个敏感度模式跨提示是稳定的。于是可以离线测出每个层头的风险图，线上给定预算后用动态规划决定每层每头留多少。它动的不是地址也不是内容筛选规则，而是预算在层之间怎么分。
  detail:
    position: CALM 处理的是自回归视频生成里 KV 缓存的容量分配问题，既有 token 合并方法对所有层头用统一比例，浪费了层头之间的敏感度差异。
    io: 输入是自回归视频模型的历史 KV 与给定缓存预算，输出是按层头差异化合并后的 KV 与生成结果。
    steps:
    - 用注意力输出误差作为端到端画质的轻量代理指标。
    - 离线在层头维度评估不同分配策略，构建固定的层头风险图。
    - 推理时给定缓存预算，用动态规划求各层头合并比例的最优分配。
    - 按分配结果在每层每头做不同比例的 token 合并，压缩历史 KV。
