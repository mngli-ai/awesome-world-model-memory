- arxiv: '2611.06685'
  branch: 学习路由
  concepts:
  - 记忆写入淘汰
  - 检索增强
  date: '2026-11-04'
  detail:
    diff: 与把槽当 KV 路由地址的做法不同，它的记忆是可读写的文本状态，容量由 128 token 硬顶住，条目里带三值状态与证据帧，取用时先判有效性再定位，而不是直接按相似度取 KV。
    formulas:
    - caption: 记忆增量更新与接地解码，原文式 2
      tex: M_k=W_{\theta_W}(X_k,q,M_{k-1}),\qquad P_k=L_{\theta_L}(X_k,q,M_k)
    has_abstract: true
    io: 输入是流式视频块与一条文本查询，输出是当前帧的目标掩码；记忆随块推进增量更新，每块 8 帧。
    limits: 作者自陈写错的条目不会被回看，后续调用看不到已滑出窗口的帧，增量累积的知识也累积错误，陈旧条目会伤到最近与从未两类查询；任务主体是分割，不含画面生成与渲染条件。
    position: 流式视频里满足查询的目标集合会随事件累积而变，只在当前窗口里看或只做跟踪都抓不住已经滑出窗口的证据。Sekai 把查询相关的事件增量写进一份有界文本记忆，让离开窗口的证据仍可读，再由解码器按这份记忆判目标是否仍然有效。
    steps:
    - 按 8 帧一块消费视频流，冻结的写入器读当前块、查询与上一块记忆，产出新记忆。
    - 每个物体条目记稳定局部 ID、外观短语、最后可见位置与帧、事件列表，事件记动作标签、三值状态与首末证据帧，渲染上限 128 token。
    - 写入时执行三条规则，身份绑定不让历史串到别的物体，状态只在看到结束才置 ended，消失本身不算结束。
    - 记忆接地解码器读记忆与当前块，判哪些物体仍满足查询，再用冻结分割器在当前帧出掩码。
    train: 需训，只训定位器。定位器用 LoRA 适配在 MeViS v2 上与 Isekai 不相交的数据上训练，样本含 3,579 条真实与 2,592 条合成记忆；写记忆的 EMR 与分割器都冻结。
  explain: 这条给的是「什么时候会取错」的一个可算说法。它把流式视频按 8 帧一块往后吃，每块让一个冻结的写入器把跟查询有关的事件补进一份文本记忆，物体条目里记的是稳定局部 ID、一句外观、最后出现的位置和帧号，再加一张事件表，每条事件带动作标签、三值状态和首末证据帧，整份记忆渲出来卡在 128 token，所以携带的状态跟流长无关，是常数级的。写入时守三条规矩，身份绑定不让 A 的历史串到
    B，状态只在真看到结束才置 ended，物体从画面消失本身不算事件结束。读的时候解码器先按这份状态判哪些物体此刻还满足查询，再只用当前帧定位。它自己承认的短板正是我最关心的那一条，写错的条目不会被回看，因为后续调用看不到已经滑出窗口的帧，增量攒知识的同时也攒错，陈旧条目会同时伤到最近和从未两类查询。50.33 J&F、比最强基线高 3.2 点，Isekai 六十条视频一百九十七个查询。它对我是理解侧的对照，不是生成侧的工具，但那个消失不等于结束的标注规则和我六块窗口硬砍的毛病是一回事。
  id: sekai
  key_numbers:
  - 50.33 J&F
  - 领先最强基线 3.2 点
