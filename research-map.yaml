  one_liner: 引擎管状态和规则，视频模型只管画
  mechanism: 轻量游戏引擎维护世界状态并执行规则，多模态编程 agent 把玩家想法编译成游戏代码和动态场景描述，自回归视频模型把引擎渲出的低模代理帧翻译成写实画面，四帧一块、一到两步去噪。
