    diff: 与逐帧独立定位相比，它承认有一大部分帧根本不该给绝对约束，宁可只留少数锚点；与直接配准两套 SfM 几何相比，它把不可靠的对应在共识阶段就丢掉，所以变化剧烈的场地优势明显。
    formulas: []
    has_abstract: true
    io: 输入是本次会话的图像序列与之前重建好的参照地图，输出是整条轨迹在参照地图里的位姿。
    limits: 机器人跨会话定位任务，不含生成与渲染；锚点数、共识阈值与预算摘要未给；只在 HILTI26 一个数据集的 15 组实验上验证，待核。
    position: 机器人反复巡检同一场地，跨会话定位会遇到两件麻烦，环境改动把可用的持久视觉内容削掉，重复结构又让跨会话对应错得离谱；变化大时整条轨迹里只有一部分能对上。Sparse Anchors 不追求逐帧都有对应，而是先挑出一组可信的绝对位姿当锚，其余靠会话内部的相对位姿补全。
    steps:
    - 先做视觉位置识别、局部特征匹配与几何验证，得到一批绝对对齐假设。
    - 用序列共识剔除与共同对齐不一致的假设，留下的当作绝对锚点。
    - 锚点再对高斯特征场做特征度量细化。
    - 把锚点与帧间相对位姿约束一起丢进鲁棒位姿图优化，得到完整轨迹。
    train: 免训，几何验证与位姿图优化走传统流程，高斯特征场用现成重建。
  explain: 这条正面回答用什么地址去取、什么时候会取错。它的判断是，跨会话的地址不是每一帧都可信，重复结构和场地改动会让一大堆帧给出看着像对的错对应，所以不追求全轨迹都有绝对约束，而是先用序列共识筛一遍，只有与共同对齐一致的假设才留成锚点，剩下的轨迹靠会话内部的相对位姿推。这个宁可少给地址也不给错地址的取舍跟我的六块窗口正好相反，我是硬砍成固定几块，不管里面装的是不是可信的历史。数字上 1 米内召回 94.4、5 米内 100，逐帧独立定位最高只有 65.3 与 70.7，差距全在错配被挡掉了。它的场景是工地巡检，跟视频生成没关系，但筛选地址的思路能直接搬到回访一致性上。
