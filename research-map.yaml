  title: Video = World + Event Stream (Wan Streamer v0.3)
  arxiv: '2607.15038'
  date: '2026-07-01'
  precision: month
  lane: 框架层
  branch: 闭源产品
  one_liner: 世界设定与事件流拆开学，实时全双工对话
  mechanism: 通用视频预训练把场景角色外观声音当作持久世界、把说话动作镜头环境变化当作事件流；预训练后适配全双工交互，自然语言动作写进括号与说话共用一条流，同步渲染音视频。
  tags:
