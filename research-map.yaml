  link_strength: 与 L3G-World 都把三维高斯当持久场景记忆、记忆规模随场景范围增长，L3G-World 的记忆更新与生成交替自回归，它把重建与生成统一进一条流式因果链路，高斯由多视角多时相观测单次前向重建
  links:
  - https://arxiv.org/abs/2611.01677
  - https://xiaomiautoworldmodel.github.io/CausalWorldModel/
  mechanism: 统一流式因果世界模型：视角-时间注意力加多视角旋转位置编码，联合编码跨视角与跨时间的位姿关系；WorldRec 2.0 单次前向从多视角多时相观测重建静态与动态三维高斯，用其渲染结果当显式场景上下文；时序层引入门控线性注意力，压缩多视角滚动推演时的计算与 KV cache。
