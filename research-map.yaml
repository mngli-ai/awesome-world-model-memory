    - 提出 PairedStateBench，配对式测细粒度交互控制。
    formulas: []
    train: 需训练渲染器，三段式。前两段数据自动标注，第三段用模型自生成的历史做 rollout 蒸馏。规则引擎由编码代理现场生成，不进训练。
    diff: 与端到端世界模型相比，交互规则写在引擎里，可以被用户逐条指定与推理，渲染器不再承担动力学；与只把代码当中介再渲一次的做法相比，它把接口收窄到三个变量，训练目标是追踪状态更新而不是重建像素。
    limits: 摘要没有具体数值，超过端到端与公开基准竞争力的说法待核。规则引擎由编码代理生成，引擎自身错不错没有校验机制。状态变量之外的外观与物理效果不受规则约束。演示能否直链播放未核。
    has_abstract: true
