- arxiv: '2611.15100'
  branch: 重排位置
  concepts:
  - 旋转位置编码
  - 长上下文扩展
  - 训练无关
  date: '2026-11-11'
  detail:
    diff: 与 worldtrace、deep-forcing 这类重写时间位置的路线同族，但对象不同，那两条改的是视频帧的时间轴位置，这条改的是视觉键在图文混合上下文里的相对相位；与重训长上下文模型比，它零训练且直接落在现成缓存上。
    formulas: []
    has_abstract: true
    io: 输入是含图像的长上下文对话与一个针对图像细节的提问；输出是回答；中间操作对象是现有 KV cache 里视觉键的旋转相位。
    limits: 只在图像加文本的多模态理解上验证，视频与生成任务未测；摘要无数字，增益幅度、对极长上下文的收益衰减都未报；只处理视觉键，文本侧位置漂移未涉及；两种调度在不同长度下的切换点未给。
    position: 把长上下文里图像细节取不到的问题定位到视觉键的位置相位上，并用缓存内的相位平移修回来。
    steps:
    - 用改变上下文长度、重排文本、只改位置三种操作，确认图像与提问的相对位置影响视觉访问。
    - 在提问处理前，把缓存中视觉键的旋转相位朝短上下文参照平移。
    - 给出静态与连续两种补偿调度，静态调度按固定量平移，连续调度随长度变化。
    - 在保持标准注意力计算与不增加前向的前提下评测细节访问。
    train: 免训，只改推理期的缓存相位，不更新任何权重。
  explain: 长上下文多模态里，图还在上下文里不等于还能可靠地取到它的细节。这条先把这件事做成对照实验：改上下文长度、把一段固定文本在图像周围重新分配、只改位置不加字，三种操作下，图像与提问之间的位置关系直接决定视觉访问的好坏，说明掉的是地址不是内容。修法很轻，在提问处理之前把缓存里视觉键的旋转相位朝一个短上下文的参照平移，直接作用在已有 KV cache 上，不抽注意力图也不加前向。它给了静态与连续两种补偿调度，静态那条更省。这条与 worldtrace、memrope 是同一族，都是在缓存里改位置而不动内容，区别是它把病灶定在视觉键的相位漂移上，而且处理的是图像与问题之间的相对位置，不是帧与帧之间的时间距离。搬到我这里，六块窗口里的老帧相位离当下太远，这个改法几乎零成本可试。
  id: vpr-reanchor
  key_numbers: []
  lane: 位置时间寻址
  link_strength: 都认定失效出在地址而不在内容，worldtrace 重写时间位置把旧帧拉回熟悉距离，这条重写缓存里视觉键的旋转相位，把它拉回短上下文参照
  links:
  - https://arxiv.org/abs/2611.15100
  mechanism: 先证明图像与提问之间的位置关系本身影响可访问性，再在提问处理前把缓存里视觉键的旋转相位朝短上下文参照平移，直接改现有 KV cache，不动注意力计算。
  media: []
  note: 雷达自动入库 2026-11-14，字段据摘要，待人工核。摘要零数字，提升幅度未报；只在长上下文多模态理解上验证，无视频生成。static 与 continuous 两种补偿调度的取舍摘要只说 static 更省，细节未给。
