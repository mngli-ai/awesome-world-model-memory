    - 按固定空间布局把两路 proxy 视频、外观参照与目标视角拼成一张条件图。
    - 用预训练视频模型在单条生成分支里一次出两路画面，跨视角信息靠底座原生注意力传递。
    - 用 LoRA 学 proxy 服从与跨视角外观对应，训练数据取自双人 GTA V 的同步 RGB 与 proxy 配对。
