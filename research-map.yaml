  tags:
  - 结构化噪声
  - 跨视角白化
  - 几何绑定
  explain: 从一段单目视频生成另一个机位的画面，常见做法是给模型加相机嵌入或者加跨视角注意力，问题在动态内容上，不同视角各抽各的噪声，随机性对不上，画面就在细节上打架。SyncVid 把随机性的位置挪了，先用动态高斯把源视频提成一套与时间无关、与视角无关的原语，给每个原语绑一份固定的随机向量，再按目标相机把这份向量光栅化过去，于是同一个场景点在任何机位、任何时刻拿到的都是同一份噪声。光栅化会把邻近像素搞相关，所以补一步用随机傅里叶特征加 QR 分解做白化，把邻像素推开但保住跨视角对应，最后只训一个 LoRA 就接进现成模型。
  detail:
    position: 处理多视角同步生成里随机性不对齐的问题，既有相机控制把几何写进架构或条件，动态几何的跨视角细节仍然各说各话。
    io: 输入是一段单目参考视频加目标相机轨迹，输出是同一场景其它机位的同步视频；架构不改，只加 LoRA。
    steps:
    - 用现成前馈动态高斯从源视频提 4D 原语，每个原语带一个与时间无关的 canonical 锚点，未观测区域用包围立方体补。
    - 给每个原语分配一份固定的标准正态噪声，噪声绑原语身份，不随时间和视角变。
    - 按目标相机把原语连同噪声一起光栅化，得到逐像素的噪声混合，再按足迹方差归一化。
    - 用 canonical 坐标做随机傅里叶特征、QR 分解得正交投影基，把噪声投影到低维，同时把邻像素去相关、把跨视角对应保住。
    - 把这份结构化噪声当扩散先验，在冻结的主干上只训 LoRA。
