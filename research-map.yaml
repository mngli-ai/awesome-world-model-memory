- id: flex
  title: 'Train Short, Inference Long: Training-free Horizon Extension for Autoregressive
    Video Generation'
  date: '2026-02-15'
  lane: 位置时间寻址
  branch: 重排位置
  training: 免训
  status: 速读
  one_liner: 频域调制RoPE，短训长推
  mechanism: 对欠训低频分量插值、高频外推以保多尺度判别性；配反相噪声采样与仅推理期sink锚定全局结构。
  tags:
  - 频域重参数
  - RoPE插值外推
  - 即插即用
  key_numbers:
  - 6x 外推（30s）超过 SOTA
  - 12x（60s）追平长视频微调基线
  - 把 LongLive 推到 4 分钟
  media: []
  links:
  - https://arxiv.org/abs/2602.14027
  - https://ga-lee.github.io/FLEX_demo
  note: 把「位置外推失败」归因为 3D 位置嵌入的谱偏置，直接改 RoPE 各频段行为，是重排位置分支里唯一走频域解释的；与 infinite-rope 的差异是它不移动参考系，只重加权频段。
  arxiv: '2602.14027'
  explain: 想象一台只练过拍摄 5 秒短片的摄像机，却要连续拍完 1 分钟：画面可能越拍越糊，人物和场景也会漂移。这篇论文解决的正是自回归视频模型“短训长推”的失稳麻烦：不重新微调模型，而是在推理时改造
    RoPE——一种把位置信息注入注意力、让模型知道帧序的编码。作者按频率拆解位置变化，对训练不足的低频部分做插值，让长期结构延续；对高频部分做外推，保留动作和纹理的多尺度辨别力。再配合反相噪声采样，减少逐帧误差累积，并用只在推理期加入的
    sink 锚定全局结构，防止场景越生成越偏。结果是，短训练模型可外推 6 倍生成 30 秒视频，超过现有最佳方法；外推 12 倍生成 60 秒，追平专门训练的长视频基线，还把
    LongLive 推到 4 分钟。
  detail:
    position: 这篇论文针对自回归视频扩散模型在生成长度超过训练视野时误差累积、时间质量显著退化的问题。它提出无需训练的推理期框架 FLEX，以改善长时视频的时间稳定性和动态表现。
    io: 输入是现有自回归视频扩散模型的常规推理输入与条件信号，具体条件形式摘要未给。输出是超出模型训练视野的长视频。
    steps:
    - 在推理时对 3D positional embeddings 中的 RoPE 频率进行 Frequency-aware RoPE Modulation，对欠训练的低频分量插值、对高频分量外推，以适应更长时间范围并保留多尺度时间判别性。
    - 在噪声采样中加入 Antiphase Noise Sampling，注入高频动态先验，以缓解缺少动态先验导致的长视频运动退化。
    - 加入仅推理期的 Inference-only Attention Sink，为生成过程提供全局结构锚点，以帮助长时生成维持整体一致性。
    - 将上述改动作为 plug-and-play 组件接入现有推理流程，生成超出训练时长的视频，无需对模型进行训练或微调。
    formulas:
    - tex: \theta_{t,j}^{\mathrm{FLEX}}=\begin{cases}\theta_{t,j}^{\mathrm{train}}/s_j,&j\in\mathcal{L},\\
        s_j\theta_{t,j}^{\mathrm{train}},&j\in\mathcal{H},\end{cases}
      caption: 频率感知 RoPE 调制：对低频分量插值、对高频分量外推；标准写法，非原文
    - tex: \widetilde{\epsilon}_t=\epsilon_t+\lambda\bigl(\epsilon_t-\epsilon_{t-1}\bigr)
      caption: 反相噪声采样的差分高频动态先验；标准写法，非原文
    train: FLEX 是 training-free 的推理期方法，不需要额外训练。推理时调制 RoPE 频率，并结合 Antiphase Noise Sampling
      与 Inference-only Attention Sink；摘要未给具体参数设置和实现细节。
    diff: 不同于通过长视频微调扩展生成视野，FLEX 在推理阶段直接调整位置频率处理、噪声采样和注意力锚定。其核心是按频率区别处理 RoPE 分量，并与动态先验和全局结构约束配合。
    limits: 未见明确说明
    has_abstract: true
