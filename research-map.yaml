  explain: 想象你推着摄像机拍一镜到底，镜头一直向前推，模型得即时脑补前方的未知画面。过去评测世界模型缺乏统一考卷，很难量化相机移动时画面听不听话。WorldScore做了一套评测基准，在三千个样例上给出明确的相机轨迹，专门考察下一场景生成——也就是按指定镜头走向预测前方新画面的能力。它集中测试生成的可控性、画面质量与动态表现，明确不测回头重访旧地的一致性。这招管用是因为它把考核纯粹锁定在向前看，剔除了记忆机制的干扰，能干净直接地测出模型跟不跟手。
