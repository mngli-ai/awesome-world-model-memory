    的做法是把这件事劈开，规则交给一个编码代理写成可执行的 Box World Engine，引擎不管像素，只输出三样东西，物体在第几号框里、这个物体有哪些持久属性、当前状态变量取什么值，渲染器就拿这三样去画。这层接口薄得有点过分，但也正因为薄，状态是可读可查的，出问题能定位到是规则错了还是画错了。三段训练里我最在意第三段，在自己的输出历史上做
