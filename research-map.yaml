  - 流式分块推理
- id: pod-rope
  title: POD-RoPE
  arxiv: '2610.33745'
  date: '2026-10-24'
  precision: day
  venue: ''
  lane: 位置时间寻址
  branch: 重排位置
  parent: memrope
  link_strength: 都改旋转位置编码的给法，它把相机中心、朝向与时刻写成分布再取期望旋转
  training: 需训
  status: 速读
  one_liner: 相机中心朝向时刻写成分布再取期望旋转
  mechanism: 把每个 token 的观测足迹写成相机中心、视线方向与采样时间上的分布，在独立采样假设下用期望旋转编码两个分布之间的相对关系，分布退化成一个地址时正好回到逐点 RoPE；同一套旋转统计还用于 Q/K 匹配与相干性相关的 V/O 变换，让观测几何同时管选信息与聚合内容，聚合在 token 内预做，不增加序列长度。
  key_numbers:
  - Fast-WAM 成功率 91.83% 到 92.88%，覆盖 RoboTwin 2.0 全部 50 个任务
  - 两个真机任务成功率 32.5% 到 52.5%
  - H20 上前反向中位加速 1.91 倍于 P-RoPE、5.34 倍于 RayRoPE
  - 相对标准 RoPE 的中位延迟开销 17.4%
  self_measured: []
  media: []
  links:
  - https://arxiv.org/abs/2610.33745
  note: 雷达自动入库 2026-10-27，字段据摘要，待人工核。主战场是机器人策略与重建，不是视频世界模型；收益数字是任务成功率与重建消融，没有长视频一致性或回访指标；真机只有两个任务；分布独立采样假设在视野重叠时不一定成立，摘要未讨论；V/O 相干性变换的具体形式要回正文。
  tags:
  - 位姿旋转
  - 分布编码
  - 几何注意力
  explain: 逐点 RoPE 给每个 token 一个地址：它在第几帧、哪个视角。但真实观测不是点，一个 patch 对应一段视锥、一段时间，硬压成一个点，重叠视野的 token 之间就没有「覆盖到同一块地方」这个概念可用。这篇把 token 的观测足迹写成分布，横跨相机中心、视线方向和采样时刻，然后在独立采样假设下取期望旋转，用期望旋转去编码两个分布之间的相对关系；把分布收成一个点，公式就退回普通 RoPE，所以它是推广不是替换。同一套旋转统计还能拿去做 Q/K 匹配，并按相干性对 V/O 做变换，于是几何既决定「看谁」也决定「怎么合」。开销上靠 token 内预聚合控制住，不增加序列长度，也不做两两节点配对。
  detail:
    position: 具身感知的位置编码要同时表达几何与观测的空间时间跨度，逐点 RoPE 只给一个地址，重叠视野与时序跨度都对不齐。
    io: 输入带相机内外参与时间戳的 token，输出带几何相对关系的注意力旋转，可直接替换现有策略或重建骨干里的 RoPE。
    steps:
    - 把每个 token 的观测足迹表示成相机中心、视线方向与采样时间上的分布。
    - 在独立采样假设下取期望旋转编码两个分布之间的相对关系，分布退化时回到逐点 RoPE。
    - 同一套旋转统计用于 Q/K 匹配，并按相干性做 V/O 变换，让几何同时引导选信息与聚合内容。
    - 聚合在 token 内预做，避免增加序列长度与观测节点两两配对的代价。
    formulas: []
    train: 需训。换位置编码要跟着训练，四个策略架构与重建、深度、新视角合成任务都重训过。
    diff: 与 RayRoPE、P-RoPE 直接把射线或点写进旋转相比，它把观测写成分布再取期望，一个 token 能覆盖一段视锥与一段时间；与逐点 RoPE 相比多出相干性相关的 V/O 变换，实测延迟只多 17.4%，前反向反而比 RayRoPE 快 5.34 倍。
    limits: 主战场是机器人策略与重建，没有在视频世界模型上验证，能不能替掉渲染器里按帧号给的位置编码要看实现；收益是任务成功率与重建消融，不是长程一致性；真机只有两个任务；独立采样假设在重叠视野下不成立，摘要没讨论这个退化；V/O 变换的相干性怎么定义摘要未展开。
    has_abstract: true
  concepts:
  - 旋转位置编码
  - 几何对应编码
  - 位姿对齐检索
- id: cvg-sgm
  title: CVG-SGM
  arxiv: '2610.27505'
  date: '2026-10-20'
  precision: day
  venue: ''
  lane: 参数化记忆
  branch: 递归状态
  parent: ''
  link_strength: ''
  training: 需训
  status: 速读
  one_liner: 目标藏进载体状态，跨可见性缺口取回身份
  mechanism: 把跨可见性缺口的身份恢复写成历史节点找回：目标被不透明载体挡住、再出现时是全新检测，外观与目标中心运动都不可用，只能靠关系历史，于是把目标专属证据按几何加权写进载体状态，用逐节点共享的 GRU 在运输期间维持，读取时把存下的载体与身份兼容性和当前检测与载体的几何一起做两级读出。
  key_numbers:
  - 单载体单身份重链接准确率 1.000，无记忆与参数对齐的无写入对照都是 0.570
  - 真实 RGB-D/SAM2 特征上 36/36 重链接，最强固定载体身份对照 28/36
  - 反事实交换载体记忆后预测跟着交换的绑定走
  self_measured: []
  media: []
  links:
  - https://arxiv.org/abs/2610.27505
  note: 雷达自动入库 2026-10-27，字段据摘要，待人工核。受控设定只有单载体单身份，共享载体上的多身份仍有歧义；不做端到端原始视频重识别；真实数据只有 36 个留出检测，规模很小；没接生成式世界模型，也没验证下游渲染；未给项目页。
  tags:
  - 载体绑定
  - 身份重链接
  - 缺口记忆
  explain: 一个物体被不透明的容器挡住，再出来时检测器给的是新 id，外观变了、目标的运动轨迹也断了，剩下的线索只有「它之前跟哪个载体一起动过」。这篇把这个情形写成历史节点找回：目标专属的证据按几何加权写进载体状态，载体状态由一个逐节点共享的 GRU 在运输期间维持，所以东西「在路上」的那段时间记忆不会烂掉；读取时先比存下来的载体与身份的兼容性，再比当前检测与载体的几何，两级合起来才判是不是同一个。它的反事实实验挺关键，把载体记忆换成别人的，预测就跟着换过去的绑定走，说明判断确实读的是存下来的关系，不是从当前帧猜的。
  detail:
    position: 4D 场景图要求对象身份持久，目标钻进不透明载体再出来是新检测，外观与目标中心运动都断了，身份只能靠关系历史恢复。
    io: 输入逐帧检测、载体节点与 SAM2 特征，输出跨可见性缺口重链接后的对象身份与更新过的载体状态。
    steps:
    - 几何加权的跨节点交互把目标专属证据转写进载体状态。
    - 逐节点共享的 GRU 在运输期间维持这份证据，避免随遮挡时长衰减。
    - 两级读出：先看存下的载体与身份兼容性，再看当前检测与载体的几何。
    - 用反事实载体记忆交换检验预测是否真的跟随绑定，并测场景不重叠的更长相隔缺口。
    formulas: []
    train: 需训。先在受控单载体单身份设定上训练，再迁到真实 RGB-D 与 SAM2 特征上评测。
    diff: 与按外观或目标中心运动做重识别相比，它在两者都不可用时改用目标与载体的绑定历史；与无记忆的检测跟踪相比多了一层写入与维持，反事实交换说明这份记忆真的被用于判断。
    limits: 受控设定只有单载体单身份，共享载体上的多身份仍有歧义；不做端到端原始视频重识别；真实数据只有 36 个留出检测，样本很小；只做感知前端的身份重链接，没有接生成式世界模型，也没验证下游渲染是否因此更稳。
    has_abstract: true
  concepts:
  - 记忆写入淘汰
- id: wmeval
  title: WMEval
  arxiv: '2610.33894'
  date: '2026-10-24'
  precision: day
  venue: ''
  lane: 评测基准
  branch: ''
  parent: wbench
  link_strength: 都测交互世界模型的动作可控与一致性，它把参照换成 Unity 仿真的状态而不是人工标注
  training: 不适用
  status: 速读
  one_liner: 拿 Unity 仿真状态当参照测动作可控
  mechanism: 把交互世界模型的评测从感知相似挪到物理因果：用 Unity 仿真当高保真参照，在仿真与世界模型里跑同一段动作序列，拿仿真导出的状态当基准，分感知层与物理因果层两套指标，九个场景覆盖动作可控性、场景与角色一致性、提示遵循、运动学、流体、物理因果与光照。
  key_numbers:
  - 9 个场景
  - 同一动作序列在仿真与待测模型两端各跑一遍
  - 代码 github.com/hao-ai-lab/WMEval
  self_measured: []
  media: []
  links:
  - https://arxiv.org/abs/2610.33894
  - https://github.com/hao-ai-lab/WMEval
  note: 雷达自动入库 2026-10-27，字段据摘要，待人工核。参照是 Unity 物理，仿真本身的简化会带进评测偏差；九个场景覆盖有限；摘要只给定性结论说现有模型在感知指标掩盖的维度上还有很大空间，没给具体分数与排名；场景与提示模板自建，跨 benchmark 可比性要看正文。
  tags:
  - 仿真参照
  - 状态校验
  - 可控性
  explain: 现在评交互世界模型多半比感知相似度，画面像就像，但「动作下对了、物理不对」这种错法被完全掩盖。这篇把参照物换成 Unity：同一段动作序列，一边在仿真里跑，一边喂给待测的世界模型，仿真给出的状态就是标准答案，然后分两层比，一层看画面，一层看你实际执行出来的状态跟仿真差多少。它的指标覆盖动作可控、场景与角色一致、提示遵循、运动学、流体、物理因果和光照，九个场景。对做可控性的人来说这类基准的价值在于它把「可控」拆成了能对账的东西，而不是拿人眼打分。
  detail:
    position: 既有交互世界模型 benchmark 主要比感知相似，物理因果连贯没有客观状态校验，而后者才是机器人、游戏引擎这类下游真正需要的。
    io: 输入一个交互世界模型与九个 Unity 场景，输出配对动作序列下的感知层指标与物理因果层指标。
    steps:
    - 在 Unity 里搭九个场景，作为高保真状态参照。
    - 把同一段动作序列分别执行在仿真与待测世界模型上。
    - 用仿真导出的状态当基准，分感知层与物理因果层对齐比较。
    - 指标覆盖动作可控性、场景与角色一致性、提示遵循、运动学、流体、物理因果、光照。
    formulas: []
    train: 不适用，纯评测基准，代码已放出。
    diff: 与只看感知相似度或人工打分的评测相比，参照换成仿真状态，能判「动作对上了但物理不对」这类被感知指标掩盖的失败；与 WBench 这类多轮交互基准相比，重点是物理因果与状态对账，而不是交互任务的完成度。
    limits: 参照是 Unity 物理，仿真自身的简化会带进偏差，复杂接触与流体尤其可疑；只有九个场景；摘要没给具体模型的分数与排名，结论是定性的；场景与提示模板自建，和其他 benchmark 的横向可比性要回正文核对。
    has_abstract: true
  concepts:
  - 物理因果评测
  - 记忆评测基准
- id: worldpager
