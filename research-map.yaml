  tags:
  - 混合注意力
  - 因果初始化
  - 少步蒸馏
  explain: 把预训练好的双向视频模型改成自回归，最常见的做法是拿教师强制重新微调，问题是双向模型本来能同时看前后文，一强行变成只看过去，视觉先验就被打坏了，生成质量掉得厉害。这篇的想法是别让两种注意力对着干，而是在同一层自注意力里同时保留两条路：因果那条按教师强制学「下一块是什么」，双向那条继续在原数据上学「画面该长什么样」，两条一起训，得到一个既会因果生成又没丢先验的初始化。这一步做完，再上一致性和分布匹配蒸馏压到四步，就有了能实时跑的交互式生成器。文本那路另外做了 chunk 级 cross-attention，每个视频块只看共享环境提示和自己那一段局部提示，未来的指令不会漏给当前块，这样在线改提示才不会穿帮。
  detail:
    position: 交互视频世界模型要自回归生成，但直接把双向扩散模型放到教师强制下微调会打坏视觉先验，自回归质量明显下降。
    io: 输入预训练的双向图生视频模型与交互视频数据，输出一个因果初始化的模型，再蒸馏成四步自回归生成器。
    steps:
    - 在 self-attention 里同时挂双向与因果两条注意力（MoBA），因果那条按教师强制学下一块预测。
    - 双向那条继续在原数据上学，把预训练视觉先验按住，不让因果化把它抹掉。
    - 文本走 chunk 级 cross-attention，每块只看共享环境提示与自己的局部提示，未来指令不泄漏。
    - 因果预训练之后上一致性与分布匹配蒸馏，压到四步自回归采样。
    formulas: []
    train: 需训。14B 图生视频底模先做因果预训练，再做少步蒸馏；训练数据规模与算力摘要未报。
    diff: 与 Causal Forcing 这类事后把双向教师蒸成因果学生的做法相比，它在预训练阶段就让两种注意力共存，因果化是持续约束而不是一次转换；与直接在教师强制下微调相比，双向那一路保住了视觉先验，因果化不再以牺牲画质为代价。
    limits: 因果预训练要动 14B 底模，代价不是免训路线能承担的，与固定 6 块窗口那类纯推理期改造不是同一层；评测混了内部 benchmark，内部集不可复现；一小时 rollout 只有定性描述，没有漂移或回访一致性数值；MoBA 的混合比例、窗口长度、蒸馏步数配置摘要未给。
    has_abstract: true
  concepts:
