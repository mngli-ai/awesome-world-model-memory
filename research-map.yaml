  links:
  - https://arxiv.org/abs/2611.01648
  mechanism: 给因果视频生成器加一个 writer 专属的低秩残差，把写进缓存的记忆表示与去噪用的生成表示分开，并用未来对该记忆的读取来训练这个 writer；训练时把可变缓存换成可持久求导的分页缓存，用局部重算在一次时间遍历里算出与两遍重建相同的梯度。
