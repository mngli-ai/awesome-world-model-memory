  explain: 它的贡献在评测方式而不是指标。以前的基准相机轨迹预先写死，模型照着走就行；它让多模态代理在生成过程中看画面决定下一步往哪看，更接近真实探索，也更容易把记忆短板逼出来。结果形状值得记住，画面与内容质量能撑很久，但长程记忆与演化很弱，模型局部看着稳而世界并不持久，这两件事被以前的基准混在一起了。164
    个用例、10 个模型、1600 多次 rollout、单条最长 180 秒，这个规模可以当参考线。对我这条线，它提供了对外的说法，我的渲染器若只在 6 块窗口内自洽而回访失败，用它四个维度量一下就知道短板在哪一层。缺点是没有各维度具体分数，代码库现在也打不开。
