  detail:
    diff: 与一次写完整段动画的代理比，它多了分镜层，把不可验证的长程任务换成可验证的成对状态；与只生成静态场景的工作比，它补了局部运动编排与跨镜头衔接。
    formulas: []
    has_abstract: true
    io: 输入是用户的动画描述，输出是一段可执行、可验证的四维场景动画，中间产物是静态场景、三维分镜与每对关键姿态之间的局部运动。
    limits: 摘要未给物理违规与偏好的具体数值；画面最终是三维场景渲染，不是视频生成模型的像素输出，与渲染器结合的接口没写；任务规模 24 个，场景复杂度与单条时长未给；不涉及记忆与回访。
    position: 前沿编码代理能生成高质量静态三维场景与可动资产，但做长程动画时常出物理上不成立的结果，物体互相穿透、缺支撑、运动不自然；带通用 harness 的代理倾向于一次写完整段动画，导致结果无法逐段检查，复杂时空约束也拆不开。
    steps:
    - 把用户提示扩成详细计划，并按计划搭出静态三维场景。
    - 生成三维分镜，每个关键姿态落成一帧静态三维场景，可单独搭建与调试。
    - 把长程动画分解为成对的已验证首尾状态。
    - 代理用动作编排工具在这对状态之间补局部运动，逐段验证物理合理性。
    - 在 24 个长程多镜头任务上与原生编码代理及既有代理基线对比，人类评审打分。
    train: 不适用，是代理系统加场景与运动工具，不走权重训练。
  explain: 它的出发点跟我的 code 到 proxy 那一段是一回事，只是目标不是视频像素而是可播的四维场景。裸编码代理让它一次写完长动画必然出事，物体互相穿透、悬空、动作不像，而且它自己没法查自己，因为一次生成的东西没有中间可核对的状态。DyCraft 把它拆成两层，先出计划加静态场景，再出三维分镜，也就是把动画的关键姿态各自做成一个静态三维场景，每个都能独立搭、独立跑、独立看。这一步的效力在于把长程约束变成一串成对的已验证状态，代理只需要在每对首尾之间补局部运动，出了问题能定位到某一帧，改完再往前推。它给动作也配了工具集，所以补的是参数化运动而不是重新生成整段。对我这条线，proxy 是结构条件，结构本身要是错的、物理上不成立的，渲染器再强也只是把错的东西画清楚，这套分镜加验证的做法正好是 proxy 的正确产法。它的评测是 24 个长程多镜头任务，人形机器人、人和动物角色、机械结构三类，人类评审更偏好它的结果，物理违规明显更少，但摘要没给具体数字。它没碰的是像素渲染这一端，也不讲记忆，历史怎么存怎么取它不管。
  id: dycraft
