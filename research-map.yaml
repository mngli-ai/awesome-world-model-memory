  explain: 多人世界模型真正的难点不是各自画得像，而是两个人看到的是同一个世界：同一辆车在两个机位下必须还是那辆车，遮挡关系要互相对得上。显式世界表示能给出空间控制，但逐个游戏精确建模会把场景多样性锁死；只共享几何又管不住外观。这条的办法是把结构控制与视觉合成彻底分开，引擎地图与游戏状态生成程序化 proxy 视频，规定布局、运动与遮挡，RGB 参照图负责角色与场景长什么样；然后把两名玩家的 proxy 视频、外观参照和目标视角按同一个空间布局拼成一张大图，交给预训练视频模型联合生成，跨视角通信直接用底座自己的注意力，不用另建模块，LoRA 只学两件事，服从 proxy 与保持外观对应。它跟我下一个要做的多人 proxy 一致性实验几乎是同一道题，区别是我打算用代码维护状态再出 proxy，它直接用游戏引擎的状态。
