project_shortlist:
  位置时间寻址:
    worldtrace: 优先读：把记忆内容与位置地址分开，借鉴分布内虚拟位置重写；适合先做推理期位置消融。
    worldplay: 借鉴近期时间窗口与位姿检索历史并存，以及检索后重分配位置，作为记忆召回加位置重写的组合基线。
    rolling-forcing: 借鉴固定 sink 相对距离与多帧联合去噪，检查当前流式缓存的相位和窗口边界稳定性。
    echo-infinity: 组内记忆增强主线的直接对照对象；图谱机制信息仍较少，先对齐组内论文与代码再定迁移实现。
    referstream: 借鉴临时插入参考主体、生成后恢复全局缓存，测试多人 proxy 新角色入场是否污染已有身份。
  几何位姿寻址:
    vmem: 借鉴 surfel 投影投票挑选 top-K 历史视图，构造位姿回访检索基线，不必先学习检索器。
    smart: 借鉴观测相机负责写入、渲染相机负责读取的固定槽记忆，把空间归属与生成查询分开。
    keepsake: 借鉴替代视图数量与相似度决定淘汰，在同一缓存预算下比较几何覆盖率而不只按时间留帧。
    wam-sim: 借鉴只写一次的实例身份令牌、场景令牌和结构令牌分工，对照多人遮挡后重新入场的身份保持。
    captain-safari: 借鉴几何检索与外部历史库结合；图谱未展开检索细节，需先读原文，不把摘要当可复现实现。
  内容学习寻址:
    longlive-rag: 借鉴区分同物异貌与异物相似的检索训练目标，专门检查角色变姿态后的身份召回。
    mosaichunk: 借鉴时空小块 KV 的轻量路由与冻结生成主干，评估局部召回是否比整帧拼接节省上下文。
    weave-forcing: 借鉴角色与背景分路检索和注意力掩码，作为多人外观串扰的针对性方案。
    layerrecall: 借鉴只向记忆敏感层注入历史 KV，用逐层消融查清历史信息实际在哪些层起作用。
    l2m: 借鉴重要性路由和 EMA 更新长期记忆，与固定锚帧及简单 FIFO 在同预算下比较。
  参数化记忆:
    rad: 借鉴 DiT 层内递归记忆，作为显式 KV 方案之外的定容量对照；需要训练，非即插即用。
    mamba3r: 借鉴冻结主干外挂小型定容量记忆的适配方式；原任务是重建，需验证能否迁移到视频生成。
    mem3r: 借鉴跟踪 fast-weight 与显式建图状态分工，排查相机漂移和历史压缩遗忘是否应分开处理。
    comoe: 借鉴短期、长期与空间记忆专家组合的功能拆分；先做模块职责对照，不直接照搬整套系统。
  代码世界模型:
    solarrenderer: 当前正在跑的直接基线：结构条件、少步 LoRA 与 block-causal 推理接口，是新增记忆实验的起点。
    alaya-renderer-flash: 借鉴多通道 G-buffer、三级历史压缩和首帧外观锚；对比现有 proxy 条件是否缺少材质与几何信息。
    anygamerenderer: 同为 MiniMax-H3 结构视频渲染，借鉴灰模与语义图条件，以及实体数量和出入帧评测。
    neuralsrender: 借鉴条件 projector 与外观 LoRA 解耦的两阶段训练，检查结构可控性与换外观是否相互干扰。
    streaming-code-wm: 直接对照 17 帧分块、滑动 KV 与 RoPE 重映射实现；社区仓库身份保留，不当正式论文背书。
  训练侧:
    self-forcing: 自生成历史蒸馏的核心基线，验证加入记忆后是否出现训练与 rollout 历史分布错配。
    causal-forcing: 借鉴自回归教师初始化，分离教师学生注意力结构错配与记忆本身的收益。
    context-forcing: 借鉴教师也看完整历史的监督对齐，以及 Slow-Fast 上下文压缩，检查学生是否有可学的长程信号。
    framepack: 借鉴恒定上下文与旧历史压缩，在相同显存预算下作为记忆容量管理对照。
    disen-forcing: 借鉴只让少量长程头看 sink 的思路，设计按头消融，避免所有注意力都被锚帧占用。
  评测基准:
    worldmembench: 借鉴静态保持与离屏动态演化分开评估，以及多次回访轨迹；避免只测静态画面相似。
    r2m-bench: 借鉴同 rollout 校准的回访指标 NMR，给记忆实验加入回头是否还是同一场景的指标。
    mist: 借鉴先隐藏改变再要求显形的对照，区分没执行指令与执行后遗忘。
    vmem-bench: 借鉴检索精度而非只看召回量，检查取回更多历史是否引入干扰和身份混淆。
    twinpast: 借鉴固定近期上下文、只换关键历史的配对实验；原任务偏理解，生成实验需重做任务而非直接套分数。
  框架层:
    playgen2: 借鉴按实体编号维护状态、静态几何持久记忆与只负责投影的渲染器分工，防止生成图像反向污染权威状态。
    state-world-models: 借鉴动作编译到状态机、3D 预览约束冻结渲染器，以及反事实孪生测试，强化状态与视觉一致性。
    motioncore: 借鉴物体级动力学与扩散渲染分离及低容量可解码约束，检查 proxy 中的轨迹能否被生成器忠实执行。
